s no anúncio parecem iguais.”</li><li>“Os hóspedes pedem sugestões de passeio e eu dou de graça.”</li><li>“Já pensei em oferecer um café especial, mas não sei quanto cobrar.”</li></ul></div>'},{kind:"collapse",title:"O problema pode não ser seu preço.",lead:"Pode ser a falta de motivos claros para o hóspede perceber mais valor. Quando tudo parece igual, o preço vira o único critério de escolha.",body:'<div class="za-card"><p><b>Valor percebido</b> é o quanto o hóspede acha que a estadia vale, comparado com o que vai pagar. Ele sobe quando:</p><ul><li>os diferenciais reais ficam visíveis e comprovados;</li><li>a estadia vira uma <b>experiência</b> pensada para o perfil daquele hóspede;</li><li>há <b>pacotes</b> que resolvem a viagem inteira, não só a cama.</li></ul><p>Neste percurso você vai montar experiências com custo, preço e margem calculados, criar um pacote e escrever a sua proposta de valor.</p></div>'},{kind:"start",title:"Vamos construir o seu cardápio de valor",lead:"Em 7 pilares você vai entender o valor percebido, conhecer o perfil do hóspede, listar diferenciais reais, criar e precificar experiências e montar a apresentação comercial.",body:"<p>Pense em até três experiências que você conseguiria oferecer com o que já tem (um café especial, uma decoração, uma trilha guiada, um jantar). Você vai precisar estimar quanto cada uma custa e quanto tempo leva.</p>",fields:[{id:"nome",label:"Seu nome",type:"text",required:!0,placeholder:"Ex.: Luciana"},{id:"propriedade",label:"Nome da hospedagem",type:"text",required:!0,placeholder:"Ex.: Cabana Bosque Encantado"},{id:"tipo",label:"Tipo de hospedagem",type:"select",required:!0,options:[{v:"airbnb",l:"Apartamento ou casa (Airbnb/temporada)"},{v:"cabana",l:"Cabana ou chalé"},{v:"glamping",l:"Glamping"},{v:"pousada",l:"Pequena pousada"},{v:"outro",l:"Outro"}]},{id:"destino",label:"Cidade / destino",type:"text",required:!0,placeholder:"Ex.: Gonçalves (MG)"},{id:"unidades",label:"Quantas unidades você aluga?",type:"nu is e espumante”; o conhecimento da região vira “roteiro de trilhas personalizado”.</p><p>Todo diferencial precisa de <b>prova</b>: uma foto, um trecho de avaliação, um detalhe na descrição.</p>",example:"Exemplo: “Conhecemos a região” é promessa. “Mapa impresso com as 5 cachoeiras mais próximas, tempo de caminhada e nível de dificuldade” é diferencial real e pode até ser vendido como parte de um pacote."},{kind:"compare",title:"Promessa × diferencial comprovado",cols:[{h:"Promessa",type:"bad",items:["“Ambiente aconchegante”","“Ótima localização”","“Atendimento diferenciado”"]},{h:"Comprovado",type:"good",items:["Foto da lareira acesa com mantas no sofá","“A 400 m da praia, 5 minutos a pé”","Trecho de avaliação citando a ajuda do anfitrião"]}]},{kind:"form",title:"Seus diferenciais reais",fields:[{id:"difs",label:"Quais diferenciais você realmente tem?",type:"checks",options:i.map((function(e){return{v:e.v,l:e.l}}))},{id:"difs_prova",label:"Esses diferenciais têm prova no anúncio (foto, detalhe, avaliação)?",type:"radio",required:!0,options:[{v:"todos",l:"Todos"},{v:"alguns",l:"Alguns"},{v:"nenhum",l:"Nenhum"}]},{id:"dif_unico",label:"Algo que só você oferece na região (opcional)",type:"text",required:!1,max:100,placeholder:"Ex.: queijos da fazenda vizinha no café"}]},{kind:"feedback",title:"Sua base de valor",metrics:function(e,a){return[{label:"Diferenciais reais",value:String(a.nDifs),tag:"informado"},{label:"Prova no anúncio",value:{todos:"todos",alguns:"alguns",nenhum:"nenhum"}[e.t("difs_prova")]||"—",tag:"informado"}]},feedback:function(e,o){var r=[];return 0===o.nDifs?r.push({lv:"bad",t:"Nenhum diferencial marcado. As experiências do próximo pilar podem se tornar o seu primeiro diferencial."}):r.push({lv:"info",t:"Diferenciais que podem virar experiência: "+o.difsNomes.map((function(e){return"<b>"+e+"</b>"})).join(", ")+"."}),"nenhum"===e.t("difs_prova")&&o.nDifs>0?r.push({lv:"bad",t:"Diferenciais sem prova não aumentam o valor percebido. Fotografe cada um e c
