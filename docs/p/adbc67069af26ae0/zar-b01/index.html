itle:"Ter um terreno bonito não significa possuir uma oportunidade de investimento estruturada.",lead:"Investidor não compra paisagem: ele avalia risco, clareza e números. Uma área sem documentação organizada, sem conceito e sem contas preliminares é, para ele, uma incerteza.",body:'<div class="za-card"><p>Antes de colocar dinheiro, um investidor costuma fazer quatro perguntas:</p><ol><li><b>O ativo é seguro?</b> Documentação, situação legal, restrições.</li><li><b>Existe demanda?</b> Atrativos, acesso, público, mercado.</li><li><b>Qual é o projeto?</b> Conceito, modelo, quantidade de unidades.</li><li><b>Como entra e como sai?</b> Números preliminares e modelo de parceria.</li></ol><p>O Zion Investor Ready transforma essas perguntas em um <b>índice de prontidão por dimensão</b> e numa lista de <b>lacunas a resolver</b>. Ele não diz que você vai captar: mostra o que falta para uma conversa séria.</p></div>'},{kind:"start",title:"Vamos medir a prontidão da sua terra para investidores",lead:"Em 7 pilares você vai organizar o ativo, o potencial, o conceito, as contas, o modelo de parceria e o material de apresentação.",body:"<p>Tenha por perto, se possível: matrícula do imóvel, comprovantes de ITR/CCIR ou IPTU, fotos da área e qualquer orçamento que já tenha recebido. Se não souber algum dado, marque “não sei”: ele vira uma lacuna no seu dossiê.</p>",fields:[{id:"nome",label:"Seu nome",type:"text",required:!0,placeholder:"Ex.: Maria"},{id:"propriedade",label:"Nome da terra ou do projeto",type:"text",required:!0,placeholder:"Ex.: Sítio Água Clara"},{id:"cidade",label:"Município e estado",type:"text",required:!0,placeholder:"Ex.: Alto Paraíso (GO)"},{id:"area_ha",label:"Área total do terreno",type:"number",required:!0,min:.1,max:1e5,step:"any",unit:"hectares",help:"1 hectare = 10.000 m². Use o valor da matrícula, se tiver."},{id:"objetivo",label:"O que você busca hoje?",type:"radio",required:!0,options:[{v:"socio_capital",l:"Encontrar um investidor ou sócio com capital"},{v:"desenvolver_junto",l:"Desenvolver junto com um parceiro que também opere"},{v:"arrendar",l:"Ceder o uso da área para um operador"},{v:"entender",l:"Entender se a terra tem condições de atrair alguém"}]}]}],pillars:[{title:"Conheça seu ativo",screens:[{kind:"learn",title:"O primeiro filtro do investidor é a segurança do ativo",body:"<p>Antes de olhar a paisagem, quem investe quer saber se a terra pode receber um projeto sem surpresas: <b>de quem ela é</b>, <b>se há ônus ou disputas</b>, <b>o que a lei permite construir ali</b> e <b>se dá para chegar e operar</b> (acesso, energia, água).</p><p>Documentação incompleta não impede uma conversa, mas aumenta o risco percebido. E risco percebido maior costuma significar uma proposta pior para você, ou nenhuma proposta.</p><p>Neste pilar, você faz um inventário honesto. Ele não substitui a análise de um advogado ou de um engenheiro; serve para saber <b>o que levar até eles</b>.</p>",example:"Exemplo: duas áreas parecidas. A primeira tem matrícula atualizada, CAR e consulta de uso do solo. A segunda é posse de família ainda em inventário. Para o investidor, a primeira é um projeto; a segunda é, antes de tudo, um problema jurídico a resolver."},{kind:"compare",title:"Como o investidor enxerga a sua documentação",cols:[{h:"Gera desconfiança",type:"bad",items:["“A escritura está com meu tio, mas a terra é nossa.”","Inventário não concluído ou herdeiros sem acordo","Não saber se há área de preservação no ponto onde se quer construir","ITR ou IPTU atrasados há anos","Estrada que fecha na época de chuva"]},{h:"Gera confiança",type:"good",items:["Matrícula recente, em nome de quem vai negociar","Certidões negativas organizadas numa pasta","Consulta prévia à prefeitura sobre o que é permitido","Topografia que mostra onde é possível implantar","Acesso e energia descritos com clareza"]}]},{kind:"form",title:"Inventário do ativo",intro:"Marque apenas o que você <b>tem em mãos hoje</b>. O que faltar vira lacuna no seu dossiê.",field
