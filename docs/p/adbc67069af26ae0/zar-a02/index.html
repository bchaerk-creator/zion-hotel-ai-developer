nteligente Zion",deliverable:"Plano Personalizado de Precificação",nameField:"nome",propertyField:"propriedade",disclaimer:"Os valores dependem das premissas que você informou. Preço é decisão comercial: teste, meça e ajuste. Não há garantia de ocupação, faturamento ou lucro.",intro:[{kind:"mirror",title:"Você sabe quanto precisa cobrar para sua diária valer a pena?",lead:"Você olhou o anúncio do vizinho, colocou um valor parecido e torceu para dar certo. No fim do mês, a conta não fecha e você não sabe exatamente por quê.",body:'<div class="za-card"><p>Se alguma destas frases parece com você, esta mini mentoria foi feita para o seu caso:</p><ul><li>“Defini minha diária olhando o Airbnb dos outros.”</li><li>“Baixo o preço quando o calendário esvazia, mas não sei até onde posso baixar.”</li><li>“Tenho reservas, mas sobra pouco depois de limpeza, taxas e contas.”</li><li>“Cobro igual no feriado e numa terça-feira de junho.”</li></ul></div>'},{kind:"collapse",title:"Copiar o preço do concorrente não significa que sua hospedagem terá lucro.",lead:"O concorrente tem outros custos, outra ocupação, outra estrutura. O preço dele resolve a conta dele, não a sua.",body:'<div class="za-card"><p>A diária certa nasce de três perguntas, nesta ordem:</p><ol><li><b>Quanto custa manter a hospedagem aberta?</b> (custos fixos e variáveis)</li><li><b>Quantas noites você realmente vende?</b> (ocupação)</li><li><b>Quanto você quer que sobre?</b> (margem)</li></ol><p>Só depois disso o mercado entra como referência de posicionamento. Neste percurso você vai responder às três com os seus números.</p></div>'},{kind:"start",title:"Vamos montar o seu preço com os seus números",lead:"Em 7 pilares, você vai calcular sua diária mínima, sua diária-alvo, os preços por temporada e sair com um plano de precificação.",body:"<p>Tenha à mão, se possível: contas do mês (energia, água, internet), valor pago pela limpeza, extrato de uma plataforma de reservas. Se não tiver um dado, você poderá marcar “não sei” e seguir — o relatório indicará o que ficou como hipótese.</p>",fields:[{id:"nome",label:"Seu nome",type:"text",required:!0,placeholder:"Ex.: Ana"},{id:"propriedade",label:"Nome da hospedagem",type:"text",required:!0,placeholder:"Ex.: Cabana Vale das Araucárias"},{id:"tipo",label:"Tipo de hospedagem",type:"select",required:!0,options:[{v:"airbnb",l:"Apartamento ou casa (Airbnb/temporada)"},{v:"cabana",l:"Cabana ou chalé"},{v:"glamping",l:"Glamping"},{v:"pousada",l:"Pequena pousada"},{v:"outro",l:"Outro"}]},{id:"destino",label:"Cidade / destino",type:"text",required:!0,placeholder:"Ex.: Urubici (SC)"},{id:"unidades",label:"Quantas unidades você aluga?",type:"number",required:!0,min:1,max:200,step:1,unit:"unidade(s)"}]}],pillars:[{title:"Entendendo a precificação",screens:[{kind:"learn",title:"Preço não é um número: é uma conta e uma decisão",body:'<p>Toda diária precisa pagar três coisas: <b>o que você gasta para receber o hóspede</b> (custo variável), <b>uma parte do que você gasta para existir</b> (custo fixo dividido pelas noites vendidas) e <b>o que deve sobrar</b> (margem). Além disso, parte do valor fica com plataformas, impostos e taxas de pagamento.</p><p>Por isso, a fórmula do Precificador é:</p><div class="za-card"><b>Diária = (Custo fixo ÷ Noites vendidas + Custo variável por noite) ÷ (1 − Deduções % − Margem %)</b></div><p>Quando a margem é zero, o resultado é a <b>diária mínima</b>: abaixo dela, cada noite vendida aumenta o prejuízo do mês.</p>',example:"Uma cabana com R$ 3.000 de custo fixo, 15 noites vendidas, R$ 60 de custo variável por noite e 20% de deduções tem diária mínima de (3.000 ÷ 15 + 60) ÷ 0,80 = <b>R$ 325</b>."},{kind:"compare",title:"Três formas de definir a diária",intro:"Compare os métodos mais comuns:",cols:[{h:"Formas arriscadas",type:"bad",items:["Copiar o concorrente sem conhecer seus próprios custos","Definir por intuição (“acho que vale isso”)","Baixar o preço sempre que o calendário esvazia","Usar o mesmo preço o ano inteiro
