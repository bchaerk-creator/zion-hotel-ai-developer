",disclaimer:"O plano por etapas é uma simulação preliminar feita com as premissas que você informou. A geração de caixa de cada fase depende de ocupação, diária e custos reais, que podem ser diferentes: não há garantia de que a primeira etapa financie as seguintes, nem de prazos, reservas ou retorno. Projetos, licenças e a viabilidade de construir em fases devem ser confirmados com arquiteto, engenheiro, prefeitura e órgão ambiental; questões societárias e tributárias, com advogado e contador.",intro:[{kind:"mirror",title:"Você não precisa começar com dez cabanas. Mas precisa saber como começar.",lead:"Você tem a terra e o sonho do projeto completo. Quando soma tudo, o valor assusta e o projeto fica parado esperando um dinheiro que talvez nunca chegue de uma vez.",body:'<div class="za-card"><p>Talvez você pense assim:</p><ul><li>“Só vale a pena começar quando eu tiver o dinheiro para fazer tudo.”</li><li>“Uma cabana só não paga a infraestrutura.”</li><li>“Não sei o que construir primeiro.”</li><li>“Tenho medo de começar pequeno e não conseguir crescer.”</li></ul></div>'},{kind:"collapse",title:"Um projeto menor, planejado corretamente, pode ser uma alternativa a começar uma obra maior sem estrutura financeira.",lead:"A implantação progressiva divide o projeto em fases: uma primeira etapa enxuta, que já pode receber hóspedes, e expansões planejadas, em parte financiadas pelo resultado da operação.",body:'<div class="za-card"><p>Para funcionar, o plano por etapas precisa responder:</p><ol><li>Qual é a <b>visão final</b> do projeto?</li><li>Que <b>infraestrutura essencial</b> precisa existir desde o início?</li><li>Qual é a <b>menor primeira etapa</b> capaz de operar bem?</li><li>Quanto cada fase <b>custa</b> e quanto <b>gera</b> por mês?</li><li>Em que <b>mês</b> cada nova fase pode começar, com o caixa acumulado?</li></ol><p>O Planejador simula isso mês a mês por até 10 anos.</p></div>'},{kind:"start",title:"Vamos planejar a sua implantação por etapas",lead:"Em 7 pi ovar o projeto por etapas"}]}]},{title:"Infraestrutura essencial",screens:[{kind:"learn",title:"O que precisa existir antes da primeira unidade",body:"<p>A primeira fase carrega um peso especial: ela precisa pagar a <b>infraestrutura essencial</b>, que serve ao projeto inteiro. Normalmente: acesso transitável, energia, água, tratamento de esgoto, projetos e licenças. Parte dela pode ser feita em módulos (por exemplo, um sistema de esgoto ampliável), mas alguns itens não podem ser divididos.</p><p>Por isso a primeira fase costuma ter o maior custo por unidade. Nas fases seguintes, entra apenas uma <b>infraestrutura de expansão</b> (extensão de redes e caminhos até as novas unidades).</p>",example:"Exemplo ilustrativo: R$ 65.000 de infraestrutura essencial + 2 cabanas de R$ 90.000 = R$ 245.000 na fase 1, ou R$ 122.500 por unidade. Uma fase 2 com 2 cabanas e R$ 10.000 de extensão de redes custa R$ 190.000, ou R$ 95.000 por unidade."},{kind:"compare",title:"Infraestrutura mínima × infraestrutura essencial",cols:[{h:"Mínima demais",type:"bad",items:["Fossa improvisada para “depois ver”","Energia emprestada do vizinho","Acesso que fecha na chuva"]},{h:"Essencial bem feita",type:"good",items:["Solução de esgoto adequada, orientada por profissional","Padrão de energia dimensionado para crescer","Acesso transitável o ano todo"]}]},{kind:"form",title:"Infraestrutura da fase 1 e das expansões",intro:"Informe valores totais das suas cotações.",fields:[{id:"infra_ess",label:"Infraestrutura essencial (antes da primeira unidade)",type:"list",required:!0,preset:["Acesso e estrada","Energia elétrica","Água","Tratamento de esgoto","Projetos, licenças e taxas","Terraplanagem"],namePlaceholder:"Item",valuePlaceholder:"R$ total"},{id:"infra_exp",label:"Infraestrutura adicional em cada fase de expansão",type:"money",required:!0,allowUnknown:!0,help:"Extensão de redes, caminhos e ligações até as novas unidades, por fase."}]},{kind:"feedback",title:"O peso da infraestrutura",metrics:functi a da próxima fase."},{kind:"compare",title:"Primeira etapa frágil × primeira etapa sólida",cols:[{h:"Frágil",type:"bad",items:["Uma unidade sem padrão de qualidade","Todo o capital gasto na obra","Sem enxoval de reserva nem fotos","Unidade que não poderá ser repetida"]},{h:"Sólida",type:"good",items:["Unidades com o padrão final do projeto","Reserva mantida após a obra","Pronta para gerar avaliações boas desde o início","Modelo replicável nas próximas fases"]}]},{kind:"form",title:"Sua primeira etapa",fields:[{id:"unid_f1",label:"Unidades na fase 1",type:"number",required:!0,min:1,max:200,step:1,unit:"unidade(s)",validate:function(a,e){var o=e.n("unid_final");return ZA.isNum(o)&&a>o?"A fase 1 não pode ter mais unidades que a visão final.":""}},{id:"custo_unid",label:"Custo por unidade (construção + mobiliário)",type:"money",required:!0,min:1},{id:"capital",label:"Capital disponível para começar",type:"money",required:!0}]},{kind:"feedback",title:"A primeira etapa cabe no seu capital?",metrics:function(e,o){return[{label:"Custo da fase 1",value:a.brl(o.custoF1),tag:"calculado"},{label:"Custo por unidade na fase 1",value:a.brl(o.custoF1/o.u1),tag:"calculado"},{label:o.falta>0?"Falta para a fase 1":"Sobra após a fase 1",value:a.brl(o.falta>0?o.falta:o.sobra),tag:"calculado"}]},feedback:function(e,o){var s=[];return o.falta>0?s.push({lv:"bad",t:"O capital disponível não cobre a fase 1: faltam <b>"+a.brl(o.falta)+"</b>. Opções: reduzir unidades da fase 1, rever padrão ou buscar uma fonte complementar (estruturada com advogado e contador). A simulação seguinte considera, como hipótese, que essa diferença foi coberta."}):o.sobra<.05*o.custoF1?s.push({lv:"warn",t:"O capital cobre a fase 1, mas a sobra ("+a.brl(o.sobra)+") é pequena. Um imprevisto na obra pode faltar."}):s.push({lv:"ok",t:"O capital cobre a fase 1 e sobram "+a.brl(o.sobra)+"."}),s.push({lv:"info",t:"Fazer tudo de uma vez custaria cerca de "+a.brl(o.custoTotal)+". A fase 1 representa "+a.pct(o.custoF1/o.custo
