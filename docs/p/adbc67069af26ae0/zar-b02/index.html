 negócio"},{v:"diversificar",l:"Diversificar patrimônio"},{v:"nao_sei",l:"Não sei"}]},{id:"horiz_prop",label:"Por quantos anos você pretende ficar no projeto?",type:"number",required:!0,min:1,max:50,step:1,unit:"anos"},{id:"horiz_parc",label:"Por quantos anos o parceiro pretende ficar?",type:"number",required:!0,allowUnknown:!0,min:1,max:50,step:1,unit:"anos"},{id:"envolv_prop",label:"Seu envolvimento na operação",type:"radio",required:!0,options:[{v:"operar",l:"Quero operar no dia a dia"},{v:"acompanhar",l:"Quero acompanhar e decidir, sem operar"},{v:"nada",l:"Não quero me envolver"}]},{id:"envolv_parc",label:"Envolvimento do parceiro",type:"radio",required:!0,options:[{v:"operar",l:"Quer operar no dia a dia"},{v:"acompanhar",l:"Quer acompanhar e decidir"},{v:"nada",l:"Só quer aportar"},{v:"nao_sei",l:"Não sei"}]}]},{kind:"feedback",title:"Seu índice de alinhamento",metrics:function(e,o){return[{label:"Alinhamento",value:a.num(o.alinh,0)+"/100",tag:"calculado"},{label:"Horizonte",value:a.num(o.alH,0)+"/40",tag:"calculado"},{label:"Objetivos",value:a.num(o.alO,0)+"/30",tag:"calculado"},{label:"Envolvimento",value:a.num(o.alE,0)+"/30",tag:"calculado"}]},feedback:function(e,o){var r=[];return o.alinh>=75?r.push({lv:"ok",t:"Alinhamento de "+a.num(o.alinh,0)+"/100: boa base para conversar sobre números."}):o.alinh>=50?r.push({lv:"warn",t:"Alinhamento de "+a.num(o.alinh,0)+"/100: há pontos a conversar antes de discutir percentuais."}):r.push({lv:"bad",t:"Alinhamento de "+a.num(o.alinh,0)+"/100: há risco alto de conflito. Esclareça objetivos e papéis antes de avançar."}),e.unknown("horiz_parc")?r.push({lv:"warn",t:"Você não sabe por quanto tempo o parceiro quer ficar. Pergunte: é uma das informações mais importantes para desenhar a saída."}):o.difH>=5&&r.push({lv:"warn",t:"Diferença de "+a.num(o.difH)+" anos entre os horizontes. Será preciso uma regra de saída clara (quem compra a parte de quem, e por qual valor)."}),"operar"===e.t("envolv_prop")&&"operar"===e.t("envolv_p
