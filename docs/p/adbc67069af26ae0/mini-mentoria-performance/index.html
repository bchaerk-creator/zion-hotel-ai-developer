preço. Com 3 casais no mês de teste, a contribuição seria 3 × 60 = R$ 180. A decisão é manter o passeio no catálogo se houver pedidos e feedback positivo, e retirar se faltar demanda."}, "erro_comum": "Criar um catálogo grande sem ter ouvido o hóspede nem conferido o fornecedor. Outro erro é ignorar o custo da equipe e da logística e olhar só o valor pago ao fornecedor, o que faz a margem parecer maior do que é.", "como_ler": {"ausente": "Não há catálogo nem levantamento do que os hóspedes desejam. As atividades, quando existem, surgem por improviso e sem custo calculado.", "parcial": "Há atividades oferecidas, mas faltam fornecedor habilitado confirmado, custo incremental calculado ou registro de demanda real dos hóspedes.", "comprovado": "Existe catálogo baseado em pedidos reais, com fornecedor habilitado, custo e preço calculados, regras de segurança e pelo menos uma experiência em teste com resultado registrado."}, "verificacao": "Registre pedidos, vendas e avaliações da experiência-teste por um período curto e compare a contribuição obtida com a calculada. Confirme que a atividade não sobrecarregou a equipe nem piorou outras etapas da estadia. Se faltar demanda ou margem, ajuste ou retire a oferta."}, {"id": "m3q6", "por_que_importa": "Servir alimentos envolve custo, desperdício e responsabilidade sanitária. Sem ficha de custo, você não sabe se cada refeição dá margem. Sem padrão de preparo e guarda, aumenta o risco para o hóspede. Este é um item crítico: padronize uma oferta simples e segura e confirme as regras aplicáveis com o órgão competente, como a vigilância sanitária do município.", "como_coletar": ["Escolha uma oferta, por exemplo o café da manhã ou uma cesta. Liste cada ingrediente com quantidade por porção e o preço pago na última compra.", "Estime as perdas: sobras, itens que estragam e erros de preparo. Registre durante um período real em vez de chutar um percentual.", "Some o custo das porções com as perdas e divida pelo número de pessoas atendidas para chegar ao custo por pessoa. Compare com o preço cobrado.", "Registre como os alimentos são armazenados, preparados e servidos e quais exigências sanitárias valem para o seu caso. Consulte a vigilância sanitária e, se for preciso, um profissional habilitado.", "Padronize uma oferta com receita, porção e fornecedores definidos. Evite itens de risco que você não consegue guardar ou preparar com segurança."], "exemplo": {"titulo": "Ficha de custo do café da manhã", "texto": "Dados fictícios: um café da manhã para 2 pessoas leva pão R$ 6, queijo R$ 9, ovos R$ 4 e frutas R$ 5, total de R$ 24. As perdas observadas foram de 10%, então o custo real é 24 × 1,10 = R$ 26,40, ou R$ 13,20 por pessoa. Cobrado a R$ 60 para o casal, a contribuição é 60 − 26,40 = R$ 33,60. Decisão: manter a oferta padronizada, revisar o desperdício de frutas e consultar o órgão competente sobre as regras de preparo e guarda."}, "erro_comum": "Calcular o custo só com o preço dos ingredientes, ignorando perdas, gás, tempo e embalagem. Outro erro grave é servir alimentos sem conferir exigências sanitárias, supondo que uma oferta pequena e informal está dispensada de qualquer regra.", "como_ler": {"ausente": "Não há ficha de custo nem padrão de preparo. Os alimentos são servidos sem controle de perdas e sem checagem das exigências sanitárias aplicáveis.", "parcial": "Há ficha de custo ou padrão de preparo, mas sem perdas medidas, sem comparação com o preço cobrado ou sem confirmação das regras sanitárias com o órgão competente.", "comprovado": "Existe ficha de custo com ingredientes, perdas e preço, uma oferta padronizada, e as exigências sanitárias foram conferidas com o órgão competente ou profissional habilitado."}, "verificacao": "Compare o custo por pessoa e o desperdício registrados antes e depois da padronização, no mesmo período, e acompanhe comentários sobre alimentos nas avaliações. Confirme que reduzir custo não piorou a qualidade nem a segurança. Em qualquer dúvida sanitária, volte ao órgão competente antes de seguir."}, {"id": "m3q7", "por_que_importa": "Extras como lenha, cesta, late check-out ou decoração podem render receita, mas também dar trabalho e custo. Se você não sabe quanto cada um deixa depois de pagar seus custos, pode manter oferta que consome tempo e não paga. Conhecer a margem por extra mostra quais mantêm valor, quais precisam de ajuste de preço e quais devem sair.", "como_coletar": ["Liste todos os extras oferecidos, de pequenos a grandes, e quantas vezes cada um foi vendido no período. Use o registro de vendas, não a memória.", "Para cada extra, some o custo incremental: produto, embalagem, tempo da equipe, taxas e transporte. Inclua apenas o que existe por causa daquela venda.", "Calcule a margem por extra: preço cobrado menos custo incremental. Marque os extras sem venda e os de margem zero ou negativa.", "Observe a disposição a pagar com o que de fato aconteceu: quantos hóspedes pediram, recusaram ou perguntaram o preço. Não presuma demanda.", "Use a Calculadora de Diária e RevPAR para ver se os extras alteram a receita total da estadia, mantendo a receita de hospedagem separada da de extras."], "exemplo": {"titulo": "Quais extras valem manter", "texto": "Dados fictícios: no mês, o kit de lenha custou R$ 25 e foi vendido por R$ 40, margem de R$ 15 por venda. Com 3 vendas, a contribuição foi 3 × 15 = R$ 45. A tábua de frios custou R$ 62, foi oferecida por R$ 90, margem de R$ 28, mas teve 0 vendas. Decisão: manter a lenha, que vende e deixa margem, e retirar a tábua, que consome compra, espaço e tempo sem demanda observada. A tábua pode voltar se houver pedidos."}, "erro_comum": "Medir sucesso pelo faturamento do extra e não pela margem. Também é comum esquecer o tempo da equipe e a perda de produtos parados, o que faz extras de baixo giro parecerem lucrativos quando não são.", "como_ler": {"ausente": "Não se sabe o custo nem a margem dos extras. Eles são oferecidos por hábito, sem registro de vendas ou de demanda.", "parcial": "Há registro de vendas ou de custo, mas não os dois juntos, ou a margem não separa receita de hospedagem de receita de extras.", "comprovado": "Existe tabela com vendas, custo incremental e margem de cada extra, extras sem demanda ou sem margem foram revistos e a receita de hospedagem está separada."}, "verificacao": "Compare a contribuição dos extras e o número de vendas no período seguinte com o anterior. Confirme que a retirada ou o reajuste não reduziu avaliações nem a procura por outras partes da oferta. Se a queda aparecer, avalie recolocar o extra com outro preço ou formato."}, {"id": "m3q8", "por_que_importa": "Avaliações são o retrato mais direto do que os hóspedes sentiram. Quando você só lê e se incomoda, desperdiça informação. Quando classifica, corrige e responde com fatos, transforma crítica em melhoria e mostra a futuros hóspedes que há alguém atento. Responder com respeito e sem discutir também protege a reputação da hospedagem.", "como_coletar": ["Reúna os comentários do período, de todos os canais em que a hospedagem aparece. Copie texto, nota, data e o canal para uma única planilha.", "Classifique cada comentário por tema: limpeza, acesso, conforto, ruído, atendimento, anfitrião, localização, alimentos e outros. Use um tema principal por comentário.", "Conte quantos comentários cada tema recebeu e se foram elogio ou crítica. Destaque os temas que se repetem, porque pesam mais que um caso isolado.", "Para cada tema repetido, registre a correção feita, o responsável e a data. Isso forma o histórico de melhorias que você poderá mostrar.", "Responda às avaliações com fatos, agradecendo e dizendo o que foi feito ou será feito. Evite acusar o hóspede, expor dados pessoais e discutir em público."], "exemplo": {"titulo": "Classificando comentários do mês", "texto": "Dados fictícios: uma hospedagem recebeu 12 comentários no mês. Classificação: 5 sobre acesso, 4 sobre ruído e 3 elogios ao atendimento, total 5 + 4 + 3 = 12. O acesso aparece em 5 de 12, quase 42%. A ação foi reescrever as instruções de chegada e enviar a mensagem antes da viagem. Para ruído, o dono incluiu aviso no anúncio sobre a estrada próxima. As respostas citam o que mudou, sem discutir, e a data de cada correção entrou no histórico."}, "erro_comum": "Responder na defensiva, culpando o hóspede, ou apagar o assunto sem corrigir nada. Também é erro responder apenas às notas ruins e deixar sem resposta os elogios, ou citar dados pessoais e detalhes da reserva em público.", "como_ler": {"ausente": "Avaliações são lidas de vez em quando, sem classificação, sem registro de correções e muitas vezes sem resposta.", "parcial": "Você responde às avaliações ou as classifica, mas não registra a correção feita nem o prazo, ou só reage às notas mais baixas.", "comprovado": "Existe classificação por tema, histórico de melhorias com data e responsável, e respostas com fatos e respeito a todas as avaliações relevantes do período."}, "verificacao": "Compare a frequência dos temas críticos e a nota média do período seguinte com a do anterior, cuidando do tamanho da amostra, que pode ser pequena. Confirme que a correção de um tema não gerou outro tipo de reclamação. Se o tema persistir, a correção não resolveu a causa."}, {"id": "m3q9", "por_que_importa": "A diária que você anuncia raramente é a que você realmente recebe, depois de descontos, pacotes e ajustes. A diária realizada, o ADR, mostra o valor médio efetivamente obtido por noite vendida. Sem ela, você pode achar que cobra um valor e receber outro, e não consegue avaliar se uma experiência melhor sustenta um preço mais alto.", "como_coletar": ["Defina o período, por exemplo o último mês fechado, e some a receita de hospedagem recebida ou reconhecida, sem extras, taxas repassadas e alimentos.", "Conte as noites vendidas no mesmo período, somando cada noite ocupada de cada unidade. Uma unidade vendida por 3 noites conta 3.", "Divida a receita de hospedagem pelas noites vendidas. O resultado é o ADR do período. Se não houver noites vendidas, o ADR não existe.", "Calcule o ADR mês a mês e por canal quando possível, e compare com a diária de tabela. A diferença revela descontos e promoções reais.", "Registre os números na Calculadora de Diária e RevPAR e guarde a série mensal para comparar com ocupação e RevPAR."], "exemplo": {"titulo": "Da receita ao ADR", "texto": "Dados fictícios: no mês, uma hospedagem recebeu R$ 15.000 de receita de hospedagem e R$ 900 de extras, que ficam fora do cálculo. Foram vendidas 50 noites. O ADR é 15.000 ÷ 50 = R$ 300 por noite. A diária de tabela era R$ 340, então a diária realizada ficou R$ 40 abaixo, indicando descontos e pacotes. Decisão: registrar o ADR de cada mês e analisar os descontos antes de reajustar a tabela."}, "erro_comum": "Dividir a receita total, com extras e taxas, pelo número de reservas ou pelos dias do mês. O ADR usa só a receita de hospedagem e as noites vendidas. Outro erro é confundir diária de tabela com diária realizada.", "como_ler": {"ausente": "O ADR não é calculado. Você conhece a diária de tabela, mas não o valor médio efetivamente recebido por noite vendida.", "parcial": "O ADR é calculado, mas com receita misturada a extras ou taxas, sem série mensal ou sem comparação com ocupação e RevPAR.", "comprovado": "Existe ADR mensal calculado com receita de hospedagem e noites vendidas do mesmo período, com série histórica e comparação com a diária de tabela."}, "verificacao": "Compare o ADR do período após uma ação de preço com o do período anterior e olhe ao lado a ocupação e o RevPAR. Um ADR maior com menos noites vendidas pode não melhorar a receita. Confirme usando a mesma regra de cálculo nos dois períodos."}, {"id": "m3q10", "por_que_importa": "Preço e ocupação andam juntos: subir a diária pode reduzir as noites vendidas, e baixá-la pode encher o calendário sem melhorar a receita. O RevPAR junta os dois lados, mostrando quanto cada noite disponível rendeu. Ele evita decidir só pelo ADR ou só pela ocupação e ajuda a testar preços sem presumir que a demanda ficará igual.", "como_coletar": ["Calcule as noites disponíveis do período: número de unidades vezes dias do período, menos as noites bloqueadas por manutenção, uso próprio ou outro motivo.", "Some a receita de hospedagem do mesmo período, sem extras, taxas repassadas e alimentos. Use a mesma base do ADR para que os números conversem.", "Divida a receita de hospedagem pelas noites disponíveis. O resultado é o RevPAR, que também é igual ao ADR vezes a ocupação.", "Compare ADR, ocupação e RevPAR de pelo menos dois períodos. Observe se uma mudança de preço melhorou o RevPAR ou só trocou uma métrica pela outra.", "Registre os números na Calculadora de Diária e RevPAR e, antes de mudar o preço, defina o período do teste e o que seria considerado melhora."], "exemplo": {"titulo": "Testando um preço menor", "texto": "Dados fictícios: 2 unidades por 30 dias, sem bloqueios, somam 60 noites disponíveis. Cenário A: 30 noites vendidas a R$ 400, receita R$ 12.000, ocupação 50% e RevPAR 12.000 ÷ 60 = R$ 200. Cenário B, no teste: ADR R$ 350 e 36 noites vendidas, receita R$ 12.600, ocupação 60% e RevPAR 12.600 ÷ 60 = R$ 210. Conferindo, 350 × 0,60 = 210. Decisão: manter o teste, observando se a demanda repete e se o custo variável das noites extras cabe na margem."}, "erro_comum": "Presumir que a demanda continuará a mesma depois de mudar o preço, ou olhar só a ocupação. Uma ocupação alta com diária muito baixa pode render menos, e um custo variável por noite precisa ser considerado antes de celebrar.", "como_ler": {"ausente": "O RevPAR não é calculado. Preço e ocupação são analisados separados, ou só pela sensação de calendário cheio ou vazio.", "parcial": "O RevPAR é calculado, mas sem descontar bloqueios das noites disponíveis, sem série mensal ou sem uso para decidir testes de preço.", "comprovado": "Existe RevPAR mensal calculado com noites disponíveis corretas, comparado ao ADR e à ocupação, e usado para planejar testes de preço com período e critério definidos."}, "verificacao": "Compare o RevPAR e a ocupação do teste com o período de referência, considerando feriados e sazonalidade que mudam a demanda. Confirme que a contribuição por noite continua positiva e que as avaliações não pioraram. Se o RevPAR subiu só por um período atípico, repita o teste antes de decidir."}], "fechamento": {"resumo": "Este módulo parte da experiência real do hóspede e chega à diária que ela sustenta. Você mapeou a jornada, testou o acesso, inspecionou o conforto, comparou a privacidade anunciada com a real, avaliou atividades, alimentos e extras com seus custos e aprendeu com as avaliações. Depois calculou o ADR e o RevPAR. Priorize a correção do ponto de maior atrito e do item crítico de alimentos, registre o que mudar e meça de novo no mesmo período de comparação antes de mexer no preço.", "glossario": [{"termo": "Jornada do hóspede", "definicao": "Sequência de etapas que a pessoa vive, da descoberta do anúncio ao pós-estadia."}, {"termo": "Custo incremental", "definicao": "Custo que só existe porque aquela venda aconteceu, como insumo, tempo extra e taxa."}, {"termo": "ADR (diária realizada)", "definicao": "Receita de hospedagem dividida pelas noites vendidas no período."}, {"termo": "RevPAR", "definicao": "Receita de hospedagem dividida pelas noites disponíveis; equivale ao ADR vezes a ocupação."}, {"termo": "Noites disponíveis", "definicao": "Unidades vezes dias do período, menos as noites bloqueadas."}, {"termo": "Margem por extra", "definicao": "Preço cobrado de um extra menos o seu custo incremental."}], "limites": "Este módulo é um diagnóstico orientativo e não substitui auditoria, parecer sanitário, jurídico, tributário ou de segurança. Para alimentos, atividades e estrutura, consulte o órgão competente e profissionais habilitados. Os exemplos usam dados fictícios e não indicam o que acontecerá na sua hospedagem. Nenhuma ação deste guia garante mais reservas, ocupação, receita ou lucro."}}, "4": {"modulo": 4, "titulo": "Você fatura ou realmente lucra?", "subtitulo": "Separe receita, custos, caixa e dívidas para enxergar o que sobra.", "abertura": {"para_que_serve": "Este guia ajuda você a descobrir se a sua hospedagem apenas fatura ou se deixa sobra de verdade. Faturar é ter dinheiro entrando. Lucrar é o que sobra depois de pagar os custos de cada estadia, as despesas fixas, as parcelas e a reposição de tudo o que se desgasta. Aqui você aprende o passo a passo para separar receita de hospedagem e extras, listar custos fixos, calcular o custo por noite, achar a contribuição e a ocupação de equilíbrio, projetar o caixa, mapear dívidas, provisionar reposição e testar cenários ruins. Serve para Airbnb, casas, apartamentos, chalés, pousadas e glampings, com uma ou várias unidades.", "tenha_em_maos": ["Extratos bancários e da maquininha do período", "Relatório de reservas e repasses dos canais", "Contratos, boletos e faturas de despesas recorrentes", "Lista de parcelas, empréstimos e vencimentos", "Lista dos equipamentos e do enxoval, com data e valor de compra"], "como_trabalhar": "Escolha um período fechado, como o último mês completo ou os últimos três meses, e use sempre o mesmo em todas as perguntas. Trabalhe só com dados que você consegue comprovar: extrato, nota, contrato, relatório de reservas. Quando não souber um número, marque não sei e organize a coleta, porque desconhecido não é zero. O diagnóstico é orientativo, não é auditoria e não substitui o trabalho de um contador."}, "perguntas": [{"id": "m4q1", "por_que_importa": "Quando o dinheiro de adiantamentos, extras e repasses entra misturado com a receita da hospedagem, o mês parece melhor ou pior do que foi. Isso distorce diária, ocupação e margem. Um sinal pago em março por uma estadia de abril ainda não é receita de março. Separar as linhas dá uma base limpa para todas as contas seguintes deste módulo.", "como_coletar": ["Defina o período e baixe o extrato bancário, o relatório de repasses dos canais e a lista de reservas com as datas de entrada e de saída.", "Para cada reserva, anote em que mês a estadia aconteceu. Receita por competência é a do mês em que o hóspede usou a hospedagem, não a do mês em que ele pagou.", "Crie linhas separadas: hospedagem, extras próprios (café, passeio, aluguel de equipamento), valores repassados a terceiros e adiantamentos de estadias futuras. Não some tudo numa linha só.", "Concilie: compare o total que entrou no banco com o total das linhas. A diferença precisa ser explicada por taxas, adiantamentos, devoluções ou repasses ainda pendentes.", "Monte um demonstrativo mensal simples com essas linhas e guarde junto os comprovantes que sustentam cada valor."], "exemplo": {"titulo": "Entrou muito, mas nem tudo é do mês", "texto": "Dados fictícios: em março entraram 17 500 reais na conta. Desse total, 11 000 pagam estadias de março (40 noites vendidas), 1 500 são extras próprios e 5 000 são sinais de reservas de abril. A receita de hospedagem de março é 11 000, e não 17 500. A diária realizada fica 11 000 ÷ 40 = 275. Se o dono usasse 17 500 ÷ 40, veria uma diária de 437,50 e acharia que vende caro, quando parte do dinheiro é de abril. Os 5 000 entram como receita em abril."}, "erro_comum": "Tratar tudo o que entrou na conta como receita do mês. Também é comum misturar o valor repassado a um parceiro, como um passeio de terceiros, com a receita da própria hospedagem, o que infla a diária e esconde a margem real.", "como_ler": {"ausente": "Há uma única linha de entradas, sem distinção entre hospedagem, extras e adiantamentos, ou o demonstrativo mensal não existe.", "parcial": "Há separação entre hospedagem e extras, mas adiantamentos entram como receita do mês ou a conciliação com o banco não foi feita.", "comprovado": "Demonstrativo mensal com hospedagem, extras, repasses e adiantamentos separados por competência, conciliado com extrato e relatórios dos canais, com a diferença explicada."}, "verificacao": "O indicador é a diferença entre o total recebido e o total das linhas do demonstrativo, que deve fechar em zero ou ser explicada. Compare dois meses seguidos e confira se os adiantamentos de um mês aparecem como receita no mês da estadia, sem duplicar nem sumir."}, {"id": "m4q2", "por_que_importa": "Custo fixo é o que você paga mesmo sem nenhuma reserva. Se você não sabe esse total, não sabe quantas noites precisa vender só para empatar. Esquecer itens pequenos ou anuais, como imposto do imóvel, seguro e contador, faz a conta parecer mais leve do que é. Esse número alimenta a ocupação de equilíbrio.", "como_coletar": ["Pegue os últimos três meses de extrato e fatura de cartão e marque tudo o que se repete, com ou sem hóspede: aluguel, salários, sistemas, internet, seguros, contratos.", "Procure despesas que não são mensais, como imposto do imóvel, anuidades e manutenções contratadas. Divida o valor anual por 12 e inclua a parcela mensal na lista.", "Separe o que é fixo do que muda com as estadias. Limpeza por reserva, insumos e comissões são variáveis e entram na pergunta seguinte, não aqui.", "Some tudo e anote o total fixo mensal, indicando de onde veio cada valor: contrato, boleto ou extrato.", "Registre o total na Calculadora de Contribuição e Equilíbrio e guarde a lista com os comprovantes."], "exemplo": {"titulo": "Somando o que se paga todo mês", "texto": "Dados fictícios: aluguel do imóvel 3 000; faxineira com salário fixo 1 800; sistema de reservas e internet 400; seguro 250; contador 350; contrato de manutenção da piscina 500; imposto do imóvel de 2 400 por ano, que dá 200 por mês. Soma: 3 000 + 1 800 + 400 + 250 + 350 + 500 + 200 = 6 500. O custo fixo mensal é 6 500 reais. Sem o imposto anual, o dono acharia que o fixo era 6 300 e subestimaria o equilíbrio."}, "erro_comum": "Listar só o que dói todo mês e esquecer contas anuais, trimestrais ou pagas por outra pessoa da família. Outro erro é incluir no fixo gastos que variam com as estadias, como limpeza por reserva, e contar o mesmo custo duas vezes.", "como_ler": {"ausente": "Não existe lista de despesas recorrentes ou o total fixo mensal é uma estimativa de cabeça, sem documento que o sustente.", "parcial": "Existe uma lista, mas faltam itens anuais ou pagos por terceiros, ou ela mistura custos fixos com custos que variam por estadia.", "comprovado": "Total fixo mensal baseado em contratos, boletos e extratos, incluindo itens anuais rateados por mês e sem misturar custos variáveis."}, "verificacao": "Compare o total fixo mensal com a soma das saídas recorrentes dos últimos três meses no extrato. Se aparecer saída recorrente fora da lista, inclua e recalcule. Revise a lista a cada contrato novo ou reajuste, para o total não ficar desatualizado."}, {"id": "m4q3", "por_que_importa": "Cada noite vendida carrega custos que só existem porque o hóspede veio: limpeza, lavanderia, insumos, comissão do canal, taxas de pagamento. Se você olha só a diária, não vê quanto sobra por noite. Conhecer esse custo evita aceitar promoções ou reservas que vendem a noite por menos do que ela custa.", "como_coletar": ["Liste os custos que aparecem somente quando há estadia: limpeza, lavanderia, café ou kit de boas-vindas, produtos de banheiro, energia e água extras, comissão e taxa de pagamento.", "Pegue valores reais de notas, recibos e relatórios dos canais de três ou mais reservas recentes, em vez de usar um palpite.", "Escolha uma unidade de cálculo e use sempre a mesma. Custos por reserva, como a limpeza, são divididos pelo número de noites daquela reserva. Comissão em percentual vira valor sobre a diária.", "Some tudo e chegue ao custo variável por noite vendida. Se o resultado variar muito entre reservas curtas e longas, calcule os dois casos.", "Registre o custo variável por noite na Calculadora de Contribuição e Equilíbrio."], "exemplo": {"titulo": "Quanto custa cada noite vendida", "texto": "Dados fictícios: reserva de 3 noites com diária de 300, total 900. Limpeza 150 e lavanderia 60 por reserva; insumos 15 por noite; comissão do canal 15% sobre 900, ou 135. Custo da reserva: 150 + 60 + 135 + 45 de insumos = 390. Por noite: 390 ÷ 3 = 130. Conferindo por partes: limpeza 50 + lavanderia 20 + insumos 15 + comissão 45 = 130. Numa reserva de 1 noite, a limpeza e a lavanderia pesariam 210 sozinhas, e o custo por noite seria maior."}, "erro_comum": "Usar o custo de uma reserva longa como se valesse para todas. A limpeza é cobrada por entrada, então reservas de uma noite custam mais por noite. Outro erro é esquecer a comissão e a taxa de pagamento, que não aparecem na conta de insumos.", "como_ler": {"ausente": "Não há cálculo do custo por noite ou por reserva; os custos de cada estadia são conhecidos só de forma geral.", "parcial": "Há um custo estimado, mas ele omite itens como comissão, lavanderia ou taxa de pagamento, ou usa uma única reserva como referência.", "comprovado": "Custo variável por noite calculado com notas e relatórios reais de várias reservas, com todos os itens incrementais incluídos e uma unidade de cálculo padronizada."}, "verificacao": "Escolha uma reserva recente que não usou no cálculo e some os custos reais dela. Compare com o custo por noite calculado, multiplicado pelas noites. Uma diferença grande indica item esquecido. Refaça o cálculo quando mudar fornecedor, comissão ou política de limpeza."}, {"id": "m4q4", "por_que_importa": "A contribuição por noite é o que sobra da diária depois dos custos variáveis. É esse valor que paga os custos fixos e, depois deles, vira resultado. Uma diária alta com custo alto pode contribuir menos do que uma diária menor e enxuta. Sem esse número, é fácil priorizar a oferta errada.", "como_coletar": ["Tenha em mãos a diária realizada (receita de hospedagem ÷ noites vendidas) de cada oferta ou tipo de unidade que você vende, no mesmo período.", "Para cada oferta, use o custo variável por noite calculado na pergunta anterior. Ofertas com café, passeio ou serviços extras têm custos diferentes e merecem conta própria.", "Calcule a contribuição por noite: diária realizada menos custo variável por noite. Faça uma linha para cada oferta, canal ou tipo de unidade.", "Ordene as linhas da maior para a menor contribuição e marque as que ficam zeradas ou negativas, para decidir se mudam de preço, de custo ou saem do cardápio.", "Registre as contribuições de cada oferta na Calculadora de Contribuição e Equilíbrio e compare com o período seguinte."], "exemplo": {"titulo": "A diária maior nem sempre sobra mais", "texto": "Dados fictícios: oferta A, diária realizada 300, custo variável 130, contribuição 170. Oferta B, pacote com café, diária 220, custo variável 150, contribuição 70. Oferta C, promoção, diária 140, custo variável 150, contribuição de menos 10. A diária de B parece razoável, mas sobra pouco. Vender C significa pagar 10 reais para receber um hóspede, e ainda sem cobrir nada do fixo. A oferta C precisa de ajuste de preço ou de custo."}, "erro_comum": "Olhar só a receita ou a diária e achar que a oferta vai bem. Outro erro é calcular contribuição com a diária de tabela, e não com a diária realmente recebida depois de descontos, cupons e promoções.", "como_ler": {"ausente": "Não existe cálculo de contribuição por noite; as ofertas são avaliadas só pela diária ou pelo faturamento.", "parcial": "A contribuição é calculada de forma geral, para a hospedagem toda, mas não por oferta, canal ou tipo de unidade, ou usa diária de tabela.", "comprovado": "Contribuição por noite calculada com diária realizada e custo variável reais, separada por oferta ou canal, com as ofertas de contribuição baixa ou negativa identificadas."}, "verificacao": "Refaça o cálculo no mês seguinte e compare com o anterior. Se mudou preço ou custo de uma oferta, confira se a contribuição subiu sem derrubar as noites vendidas dela. Uma contribuição maior com muito menos noites vendidas pode não melhorar o resultado final."}, {"id": "m4q5", "por_que_importa": "A ocupação de equilíbrio mostra o mínimo de noites que você precisa vender para cobrir os custos fixos. Abaixo dela, o mês fecha no prejuízo. Acima, começa a sobrar. Se o resultado passar de 100%, o preço e os custos atuais não fecham a conta nem com a casa cheia.", "como_coletar": ["Reúna o custo fixo do período, a contribuição por noite e as noites disponíveis. Disponíveis são unidades vezes dias do período, menos as noites bloqueadas.", "Calcule a ocupação de equilíbrio: custos fixos do período ÷ (contribuição por noite × noites disponíveis). Se a contribuição for zero ou negativa, não existe equilíbrio.", "Compare o resultado com a ocupação real do mesmo período, que é noites vendidas ÷ noites disponíveis. Veja se você está acima ou abaixo do ponto de equilíbrio.", "Se o resultado passar de 100%, a meta supera a capacidade. Teste preço mais alto, custo variável menor ou custo fixo menor, um de cada vez, e anote o novo equilíbrio.", "Registre os números na Calculadora de Contribuição e Equilíbrio e anote as hipóteses usadas em cada teste."], "exemplo": {"titulo": "Quantas noites para empatar", "texto": "Dados fictícios: duas unidades em 30 dias, sem bloqueios, dão 60 noites disponíveis. Custo fixo do mês 6 500. Contribuição por noite 170. Equilíbrio: 6 500 ÷ (170 × 60) = 6 500 ÷ 10 200 = 63,7%, ou cerca de 38 noites. Com a oferta de contribuição 70: 6 500 ÷ (70 × 60) = 6 500 ÷ 4 200 = 154,8%. Passa de 100%, então essa oferta sozinha não cobre o fixo nem com tudo vendido. É sinal para revisar preço e custos."}, "erro_comum": "Calcular o equilíbrio com a receita total no lugar da contribuição, o que ignora os custos de cada estadia. Outro erro é usar o total de dias do mês sem descontar bloqueios, ou esquecer que mais de 100% é impossível de atingir.", "como_ler": {"ausente": "A ocupação mínima para cobrir os custos nunca foi calculada, ou é apenas um palpite sobre quantas noites bastam.", "parcial": "O equilíbrio foi calculado, mas com custo fixo incompleto, sem descontar bloqueios ou sem comparar com a ocupação real do mesmo período.", "comprovado": "Ocupação de equilíbrio calculada com fixos, contribuição e noites disponíveis reais, comparada à ocupação do período, com o caso acima de 100% sinalizado e tratado."}, "verificacao": "Compare a ocupação real do período com a de equilíbrio. Depois de qualquer mudança de preço ou custo, recalcule e confira se o equilíbrio baixou sem derrubar as noites vendidas. Se subir a ocupação mínima, a mudança piorou a margem e deve ser revista."}, {"id": "m4q6", "por_que_importa": "Uma hospedagem pode ter resultado positivo no mês e ainda assim ficar sem dinheiro em uma semana específica, porque o pagamento das contas vem antes das entradas. A projeção semanal mostra o buraco antes de ele acontecer e dá tempo de agir, em vez de recorrer a crédito caro de última hora.", "como_coletar": ["Monte uma tabela com as próximas 8 a 12 semanas. Coloque o saldo de caixa de hoje, conferido no extrato, na primeira linha.", "Lance as entradas de cada semana pela data em que o dinheiro cai na conta: reservas confirmadas, repasses dos canais, saldos a receber. Não lance reservas ainda incertas como se fossem certas.", "Lance as saídas pela data de vencimento: custos fixos, limpeza, parcelas, impostos e outras contas. Inclua as dívidas e os impostos, mesmo os anuais.", "Calcule o saldo de cada semana: saldo anterior mais entradas menos saídas. Marque as semanas com saldo negativo ou abaixo do mínimo que você considera seguro.", "Revise a tabela toda semana, trocando o previsto pelo realizado, e mantenha as hipóteses de entrada escritas ao lado."], "exemplo": {"titulo": "Mês positivo, terceira semana no vermelho", "texto": "Dados fictícios: saldo inicial 2 000. Semana 1: entradas 3 500, saídas 2 500, saldo 3 000. Semana 2: entradas 1 200, saídas 2 800, saldo 1 400. Semana 3: entradas 900, saídas 3 100 (inclui um imposto de 1 200), saldo 1 400 + 900 − 3 100 = −800. Semana 4: entradas 4 000, saídas 1 000, saldo 2 200. O mês termina positivo, mas falta 800 na semana 3. A ação é guardar essa reserva antes, ou negociar a data do imposto."}, "erro_comum": "Olhar só o saldo do mês e achar que sobra. Outro erro é lançar entradas pela data da estadia, e não pela data em que o dinheiro realmente cai, ou esquecer saídas pontuais como imposto, seguro e parcelas.", "como_ler": {"ausente": "Não há projeção de entradas e saídas; o caixa é acompanhado só olhando o saldo do banco no dia.", "parcial": "Existe projeção, mas só mensal, ou sem dívidas e impostos, ou sem diferença entre reservas confirmadas e incertas.", "comprovado": "Fluxo semanal com saldo inicial conferido, entradas pela data de recebimento, saídas pela data de vencimento, dívidas e impostos incluídos, e revisão periódica com o realizado."}, "verificacao": "Compare, a cada semana, o saldo projetado com o saldo real do extrato. Anote a diferença e a causa. Se a projeção errar sempre para o mesmo lado, ajuste as hipóteses. Confirme que a reserva criada para as semanas fracas não foi gasta em outra coisa."}, {"id": "m4q7", "por_que_importa": "Parcelas, empréstimos e financiamentos têm data certa para sair da conta, e atrasar costuma gerar encargos. Quando você não tem tudo numa agenda, é fácil esquecer um vencimento ou não perceber quanto do faturamento já está comprometido antes de pagar qualquer custo da operação. A agenda dá controle e base para negociar.", "como_coletar": ["Junte contratos, boletos, faturas de cartão e extratos e liste cada compromisso: financiamentos, empréstimos, parcelamentos de compras, consórcios e acordos já feitos.", "Para cada item, anote o valor da parcela, o dia do vencimento, o número de parcelas restantes e o valor total que ainda falta pagar.", "Anote também os encargos previstos em contrato para atraso, para saber o custo de um deslize. Se não encontrar a informação, escreva não sei e peça ao credor.", "Monte uma agenda por data, do primeiro ao último dia do mês, e some o total de parcelas do mês. Compare esse total com a receita de hospedagem do mesmo mês.", "Se alguma parcela estiver pesada, procure um profissional de finanças ou o credor para entender opções antes de atrasar."], "exemplo": {"titulo": "Quanto do mês já está comprometido", "texto": "Dados fictícios: parcela da reforma 1 200 no dia 10, com 10 parcelas restantes; parcelamento do enxoval 450 no dia 15, com 4 restantes; capital de giro 800 no dia 25, com 3 restantes. Parcelas do mês: 1 200 + 450 + 800 = 2 450. Dívida restante: 12 000 + 1 800 + 2 400 = 16 200. Com receita de hospedagem de 11 000 no mês, as parcelas somam 2 450 ÷ 11 000 = 22,3% da receita, antes dos custos fixos e variáveis."}, "erro_comum": "Guardar as dívidas só na memória ou espalhadas em vários aplicativos e papéis. Outro erro é olhar só o valor da parcela e esquecer o saldo total e os encargos de atraso, o que esconde o tamanho real do compromisso.", "como_ler": {"ausente": "Não existe lista dos compromissos financeiros; as parcelas são pagas conforme chegam os avisos, sem visão do total.", "parcial": "Há uma lista, mas faltam vencimentos, saldo restante ou encargos, ou ela não está comparada com a receita do mês.", "comprovado": "Agenda de pagamentos com parcela, vencimento, parcelas restantes, saldo e encargos de cada compromisso, somada por mês e comparada com a receita."}, "verificacao": "Confira a agenda com o extrato do mês: toda parcela paga deve estar na lista, e toda parcela da lista deve ter saído na data. Se houver atraso ou renegociação, atualize saldo e prazos. Confirme que o novo total mensal cabe no fluxo de caixa projetado."}, {"id": "m4q8", "por_que_importa": "Colchões, enxoval, eletrodomésticos e móveis se desgastam e vão precisar ser trocados. Se nenhum valor é guardado para isso, a troca chega como susto no caixa, ou a qualidade cai e a avaliação dos hóspedes sofre. Provisionar é separar um valor mensal para que a reposição seja planejada, não improvisada.", "como_coletar": ["Faça a lista dos itens que se desgastam: colchões, roupa de cama e banho, eletrodomésticos, aquecedores, móveis, equipamentos de área externa. Anote data e valor de compra.", "Estime a vida útil de cada item pela sua própria experiência de troca, ou pela orientação do fabricante. É uma estimativa sua, que você vai ajustando com o uso real.", "Calcule a provisão mensal: custo de reposição ÷ meses de vida útil. Use o preço de hoje para repor, e não o preço pago no passado.", "Some as provisões e inclua o total como custo fixo mensal. Defina onde esse dinheiro será guardado, para não ser usado em outra despesa.", "Registre o total na Calculadora de Contribuição e Equilíbrio e guarde a lista com os comprovantes."], "exemplo": {"titulo": "Guardar um pouco por mês para trocar", "texto": "Dados fictícios: 4 colchões a 1 500 cada, 6 000 no total, vida útil estimada de 5 anos (60 meses): 6 000 ÷ 60 = 100 por mês. Aquecedor de 1 800, vida útil de 6 anos (72 meses): 25 por mês. Roupa de cama de 1 200, vida útil de 2 anos (24 meses): 50 por mês. Provisão mensal: 100 + 25 + 50 = 175 reais. Sem ela, o equilíbrio ignora um custo que vai chegar."}, "erro_comum": "Achar que reposição só entra na conta quando o item quebra. Outro erro é usar o preço antigo do item, ou uma vida útil otimista, o que reduz a provisão e deixa o caixa sem dinheiro quando a troca chegar.", "como_ler": {"ausente": "Não há lista de itens a repor nem valor separado para reposição; as trocas são pagas quando o problema aparece.", "parcial": "Existe lista ou estimativa de custo, mas sem vida útil, sem provisão mensal, ou sem que o valor seja guardado separadamente.", "comprovado": "Plano de reposição com itens, vida útil estimada, custo atual de troca e provisão mensal incluída no custo fixo e separada no caixa."}, "verificacao": "A cada trimestre, compare o gasto real com trocas e consertos com o valor provisionado. Se o gasto ficou acima, revise vida útil ou custo. Confirme que o valor provisionado está realmente guardado e não foi usado para cobrir outras contas."}, {"id": "m4q9", "por_que_importa": "Resultado operacional mostra se a operação sobra depois de pagar o que ela consome no período. Caixa mostra quanto dinheiro existe na conta. Eles diferem porque compra de equipamento, parcela de financiamento e adiantamento de hóspedes mexem no caixa sem mexer no resultado. Confundir os dois leva a decisões erradas, como comprar demais ou achar que não sobrou nada.", "como_coletar": ["Separe os lançamentos do período em três grupos: despesas operacionais, investimentos (compra de equipamentos, reformas) e financiamento (entrada e pagamento do principal de empréstimos).", "Calcule o resultado operacional: receita de hospedagem e extras do período, menos as despesas operacionais do mesmo período. Use a competência da pergunta 1.", "A partir do resultado, ajuste para chegar ao caixa: subtraia investimentos pagos e o principal das dívidas, e some adiantamentos recebidos de estadias futuras.", "Compare o caixa calculado com a variação real do saldo no extrato. Se não bater, procure o lançamento que ficou de fora.", "Leve a conciliação a um contador para confirmar a classificação dos lançamentos, principalmente quando envolver impostos."], "exemplo": {"titulo": "Lucro no mês, caixa menor", "texto": "Dados fictícios: receita realizada 11 000; despesas operacionais 7 800. Resultado operacional: 11 000 − 7 800 = 3 200. No mesmo mês houve compra de ar-condicionado de 2 500 (investimento), pagamento de principal do financiamento de 1 000 e 1 500 recebidos como sinal de reservas futuras. Variação do caixa: 3 200 − 2 500 − 1 000 + 1 500 = 1 200. O resultado foi 3 200, mas o saldo subiu apenas 1 200, e 1 500 desse valor ainda é de estadias futuras."}, "erro_comum": "Usar a variação do saldo do banco como se fosse lucro. Quando entram adiantamentos ou empréstimos, o saldo sobe sem a operação ter sobrado. Quando se compra equipamento, o saldo cai sem que a operação tenha dado prejuízo.", "como_ler": {"ausente": "Resultado e caixa são tratados como a mesma coisa; o saldo do banco é usado para dizer se a hospedagem teve lucro.", "parcial": "Há separação parcial, mas investimentos, financiamentos ou adiantamentos ainda se misturam com as despesas operacionais, ou a conciliação não fecha.", "comprovado": "Conciliação mensal que parte do resultado operacional, separa investimento, financiamento e adiantamentos, fecha com a variação real do saldo e foi revisada por contador."}, "verificacao": "O indicador é a diferença entre o caixa calculado e a variação real do saldo, que deve ser zero ou explicada. Repita por dois meses seguidos e confira se a classificação dos lançamentos se mantém igual. Dúvidas de classificação devem ser levadas ao contador."}, {"id": "m4q10", "por_que_importa": "Planejar só com o cenário que você espera deixa a hospedagem frágil quando a ocupação cai, a diária baixa ou os custos sobem. Testar cenários ruins mostra até onde o negócio aguenta e permite definir de antemão o que fazer, em vez de decidir sob pressão quando o problema já chegou.", "como_coletar": ["Parta do cenário base com os números reais do período: ocupação, diária realizada, custo variável por noite e custos fixos. Calcule o resultado do mês.", "Crie um cenário de queda moderada e outro de queda forte, mudando um ou mais fatores: ocupação menor, diária menor, custo variável ou fixo maior. Escreva as hipóteses.", "Calcule o resultado de cada cenário: noites vendidas × contribuição por noite, menos os custos fixos. Anote em qual cenário o resultado fica negativo.", "Defina gatilhos de contenção: um número que, ao ser atingido, dispara uma ação combinada, como adiar uma compra, rever preço ou reduzir um custo. Escreva ação e responsável.", "Registre os cenários na Calculadora de Contribuição e Equilíbrio e guarde as hipóteses escritas ao lado de cada resultado."], "exemplo": {"titulo": "Três cenários, um gatilho", "texto": "Dados fictícios: 60 noites disponíveis, fixos 6 500. Base: ocupação 70%, 42 noites, diária 300, custo variável 130; contribuição 170 × 42 = 7 140; resultado 7 140 − 6 500 = 640. Queda moderada: ocupação 60%, 36 noites; 170 × 36 = 6 120; resultado −380. Queda forte: ocupação 55%, 33 noites, diária 280, variável 135; contribuição 145 × 33 = 4 785; resultado −1 715. Gatilho: se a ocupação projetada ficar abaixo de 64%, revisar compras e preços."}, "erro_comum": "Testar só um cenário otimista, ou mexer em todos os fatores ao mesmo tempo sem escrever as hipóteses. Outro erro é calcular os cenários e não definir nenhuma ação, deixando a decisão para o dia em que o problema já pesa no caixa.", "como_ler": {"ausente": "Não existem cenários além do esperado; não se sabe o que acontece com o resultado se a ocupação ou o preço caírem.", "parcial": "Há um cenário adverso calculado, mas sem hipóteses escritas, ou sem gatilhos e ações definidas para quando ele se confirmar.", "comprovado": "Três cenários calculados com hipóteses escritas, resultado de cada um, ponto de prejuízo identificado e gatilhos de contenção com ação e responsável definidos."}, "verificacao": "Compare o resultado real de cada mês com o cenário mais próximo e ajuste as hipóteses. Quando um gatilho disparar, registre a ação tomada e o efeito no mês seguinte. Confirme que a contenção não cortou algo que protege a qualidade ou a segurança."}], "fechamento": {"resumo": "Faturar não é lucrar. Para saber a diferença, separe receita de hospedagem, extras e adiantamentos, conheça os custos fixos e o custo variável por noite, calcule a contribuição e a ocupação de equilíbrio, e projete o caixa semana a semana com dívidas e impostos. Reserve valor para repor o que se desgasta, separe resultado de caixa e teste cenários ruins com gatilhos definidos. Escolha uma ação por vez, registre prazo e responsável, e refaça as contas no período seguinte para ver se a mudança ajudou.", "glossario": [{"termo": "Competência", "definicao": "Mês em que a receita ou a despesa pertence, pelo uso da hospedagem, e não pelo mês em que o dinheiro entrou ou saiu."}, {"termo": "Custo variável", "definicao": "Custo que só existe quando há estadia, como limpeza, insumos e comissão, rateado por noite vendida."}, {"termo": "Contribuição por noite", "definicao": "Diária realizada menos o custo variável por noite vendida. É o que sobra para pagar os custos fixos."}, {"termo": "Ocupação de equilíbrio", "definicao": "Custos fixos do período ÷ (contribuição por noite × noites disponíveis). Mostra o mínimo de ocupação para empatar."}, {"termo": "Provisão", "definicao": "Valor separado todo mês para uma despesa que vai acontecer, como a troca de colchões ou de eletrodomésticos."}, {"termo": "Fluxo de caixa", "definicao": "Quadro das entradas e saídas de dinheiro por data, que mostra o saldo projetado de cada semana."}], "limites": "Este módulo é um guia de organização e não substitui contador, advogado ou consultor financeiro. Ele não faz auditoria, não dá parecer tributário nem jurídico, e não avalia a legalidade de contratos ou dívidas. Os exemplos usam dados fictícios. Os resultados dependem dos seus números reais e nada aqui promete reservas, ocupação, renda ou lucro."}}, "5": {"modulo": 5, "titulo": "Sua hospedagem funciona sem você?", "subtitulo": "Teste responsáveis, padrões e rotinas para que a operação siga firme na sua ausência", "abertura": {"para_que_serve": "Este módulo ajuda você a olhar a operação da sua hospedagem com evidências, sem depender de lembrança ou de impressão. Você vai testar se as tarefas têm dono, se a limpeza tem padrão, se a entrada é previsível, se há manutenção, estoque, resposta a problemas, controle de carga de trabalho, conciliação de reservas e pagamentos, verificação de segurança e aprendizado com falhas. Serve para Airbnb, casas, apartamentos, chalés, pousadas e glampings. O objetivo é descobrir o que funciona só porque você está por perto e escolher o que organizar primeiro.", "tenha_em_maos": ["Lista das atividades de um dia comum, da reserva à saída", "Checklists de limpeza e registros de manutenção que já existam", "Contagem atual de itens de consumo e prazos dos fornecedores", "Relatórios de reservas, canais e extratos de um mês fechado", "Documentos de licenças, inspeções e comprovantes de segurança"], "como_trabalhar": "Escolha um período definido, como o último mês, e use dados que você consegue verificar: registros, fotos, extratos e relatórios. Quando não souber a resposta, marque 'não sei' e transforme em tarefa de coleta, porque desconhecido não é zero. Responda com o que está comprovado, não com o que pretende fazer. O resultado é um diagnóstico orientativo para priorizar ações, e não uma auditoria."}, "perguntas": [{"id": "m5q1", "por_que_importa": "Quando ninguém sabe de quem é a tarefa, ela só acontece se alguém lembrar. Isso funciona enquanto você está por perto e falha na primeira viagem, doença ou semana cheia. Uma matriz de responsabilidades mostra quem faz, quem confere e quem substitui. Assim a hospedagem deixa de depender da sua memória e você enxerga rápido onde há buraco.", "como_coletar": ["Liste todas as atividades de um dia comum, da reserva à saída do hóspede: limpeza, mensagens, entrada, compras, manutenção, pagamentos e atendimento de problemas.", "Ao lado de cada atividade, escreva o nome de uma pessoa responsável. Evite 'equipe' ou 'todos'. Se a tarefa for sua, escreva o seu nome mesmo assim.", "Escreva também um substituto para cada atividade e confirme com ele que sabe fazer. Um nome na planilha sem treino não conta como substituto.", "Defina um prazo ou horário para cada tarefa e como o responsável avisa que terminou, por exemplo uma mensagem ou uma marcação na lista.", "Marque as linhas sem responsável ou sem substituto e escolha uma para resolver primeiro. Guarde a matriz com data, pois ela será a sua evidência."], "exemplo": {"titulo": "Contagem de tarefas com dono", "texto": "Dados fictícios: uma casa listou 12 atividades diárias. Nove têm responsável com nome, o que dá 9 ÷ 12 = 75%. Apenas 6 têm substituto que sabe executar, ou seja, 6 ÷ 12 = 50%. As três tarefas sem dono são conferir o estoque, responder mensagens à noite e registrar defeitos. O dono escolhe começar pelas mensagens da noite, define um nome e um substituto e marca o prazo de uma semana para refazer a contagem."}, "erro_comum": "Preencher a matriz com 'equipe' ou 'todos' na coluna do responsável. A tarefa parece coberta no papel, mas na prática ninguém se sente dono, e o substituto citado nunca foi treinado nem avisado.", "como_ler": {"ausente": "Não há lista de tarefas nem nomes. Cada coisa é resolvida por quem lembra, geralmente você, e ninguém sabe quem cobre uma ausência.", "parcial": "Existe lista com responsáveis para parte das tarefas, mas faltam substitutos, prazos ou a forma de avisar que terminou. A lista não é revisada com frequência.", "comprovado": "Matriz atual e datada com responsável, substituto treinado, prazo e forma de aviso para todas as tarefas diárias, conferida em uso real, por exemplo numa ausência sua."}, "verificacao": "Indicador: tarefas com responsável e substituto sobre o total de tarefas. Compare a contagem de hoje com a de 30 dias depois. Para confirmar, fique um dia sem interferir e veja se tudo foi feito. Observe também se alguém ficou sobrecarregado com tarefas novas."}, {"id": "m5q2", "por_que_importa": "Limpeza é uma das coisas que o hóspede mais percebe, e sem padrão cada pessoa limpa do seu jeito. Um padrão verificável diz o que fazer em cada ambiente, em que ordem, e como alguém confere no final. Isso reduz esquecimentos, facilita treinar quem entra e deixa provas de que o trabalho foi feito.", "como_coletar": ["Percorra o imóvel como hóspede e anote, ambiente por ambiente, o que precisa estar pronto: cama, banheiro, cozinha, piso, lixo, cheiro e itens de recepção.", "Monte uma sequência fixa por ambiente, por exemplo de cima para baixo e do fundo para a porta. Transforme cada passo em um item que se responde com sim ou não.", "Inclua uma inspeção final feita por outra pessoa ou por você, com fotos dos pontos principais, para não depender só de quem limpou.", "Treine quem limpa usando o próprio checklist e peça que assine e date cada limpeza. Guarde as folhas ou registros do mês.", "Escolha algumas limpezas ao acaso por semana para auditar, anote o que falhou e converse com a equipe sobre o motivo antes de punir qualquer pessoa."], "exemplo": {"titulo": "Auditoria de amostras de limpeza", "texto": "Dados fictícios: o checklist de uma pousada tem 20 itens por quarto. Na semana, o dono auditou 5 limpezas escolhidas ao acaso. Quatro estavam sem falhas e uma tinha o ralo do banheiro sujo. Então 4 ÷ 5 = 80% sem retrabalho. Como o item repetiu em dois quartos, ele foi movido para o início da sequência do banheiro e o treino passou a mostrar esse ponto. Na semana seguinte, nova amostra de 5 limpezas confirma se o item parou de falhar."}, "erro_comum": "Ter um checklist bonito que ninguém assina nem confere. Sem inspeção e sem registro, ele vira enfeite, e as falhas só aparecem na avaliação do hóspede, tarde demais para corrigir sem custo.", "como_ler": {"ausente": "Cada pessoa limpa de memória, sem lista nem inspeção final. Não há como provar o que foi feito nem treinar alguém novo com o mesmo padrão.", "parcial": "Há checklist ou combinado verbal, mas sem assinatura, sem inspeção final ou sem auditoria de amostras. Funciona quando a mesma pessoa limpa e você confere.", "comprovado": "Checklist por ambiente, assinado e datado em cada limpeza, com inspeção final e auditoria regular de amostras registrada, e correções aplicadas quando algo falha."}, "verificacao": "Indicador: limpezas auditadas sem falha sobre o total auditado, comparado semana a semana. Depois de mudar a sequência, repita a amostra. Confira também o tempo de limpeza, para conferir que o padrão novo não atrasou a próxima entrada de hóspedes."}, {"id": "m5q3", "por_que_importa": "A entrada é o primeiro momento real de operação. Se o processo muda a cada hóspede, aparecem mensagens repetidas, atrasos e dúvidas na porta. Um fluxo previsível diz o que o hóspede recebe, quando, e como acessa o imóvel. Quanto menos etapas redundantes, menos chance de erro e menos trabalho para você ou para a equipe.", "como_coletar": ["Desenhe o fluxo atual de ponta a ponta: reserva confirmada, mensagem de instruções, identificação, envio do horário, acesso ao imóvel e primeiro contato depois da chegada.", "Simule você mesmo o caminho, usando o celular e as mensagens exatas que o hóspede recebe. Anote onde travou, onde ficou confuso e onde repetiu informação.", "Marque as etapas redundantes, como pedir o mesmo dado por dois canais, e as que dependem de uma pessoa específica estar disponível.", "Escreva o fluxo final em passos curtos, com responsável e prazo de cada etapa, e o que fazer se o acesso falhar, como um plano reserva.", "Peça a alguém de fora que siga o fluxo sem ajuda e registre quanto tempo levou e quais dúvidas surgiram."], "exemplo": {"titulo": "Fluxo de entrada com menos etapas", "texto": "Dados fictícios: o fluxo de entrada de um apartamento tinha 7 etapas. Duas eram redundantes, pois pediam a foto do documento por mensagem e de novo na portaria. Removendo as duas, restam 7 − 2 = 5 etapas. Em 10 hóspedes do mês, 3 perguntaram como entrar, ou seja, 3 ÷ 10 = 30%. Depois de reescrever as instruções com fotos do caminho, o dono acompanhará os próximos 10 hóspedes para ver se essa taxa cai."}, "erro_comum": "Achar que o fluxo é claro porque você conhece o imóvel. Quem chega pela primeira vez não sabe qual portão, qual código ou que horas pode entrar. Só a simulação com o olhar do hóspede mostra as falhas.", "como_ler": {"ausente": "Cada entrada é improvisada. Instruções mudam conforme quem atende, e não há plano reserva se o acesso falhar.", "parcial": "Existem instruções padrão, mas o fluxo não foi testado, tem etapas repetidas ou depende de uma única pessoa. Perguntas na chegada ainda são frequentes.", "comprovado": "Fluxo escrito e testado por alguém de fora, com etapas enxutas, responsáveis, plano reserva para o acesso e registro das dúvidas dos hóspedes ao longo do tempo."}, "verificacao": "Indicador: proporção de hóspedes que precisam de ajuda para entrar, por grupo de 10 ou 20 chegadas. Compare antes e depois. Confirme também que a retirada de etapas não removeu algo necessário, como identificação ou aviso de regras da casa."}, {"id": "m5q4", "por_que_importa": "Equipamento que quebra com hóspede dentro custa caro e, em alguns casos, pode envolver segurança. A manutenção preventiva troca o susto por agenda: você sabe o que existe, de quando é a última revisão e quando será a próxima. Itens ligados a gás, eletricidade, água quente e incêndio vêm primeiro e pedem profissional habilitado.", "como_coletar": ["Faça um inventário de tudo que precisa de revisão: aquecimento, chuveiro, ar-condicionado, geladeira, bomba d'água, instalação elétrica, fechaduras, extintores e equipamentos de lazer.", "Para cada item, anote a data da última revisão e o que o fabricante ou o profissional recomenda de intervalo. Se não souber, marque 'não sei'.", "Separe os itens críticos de segurança, como gás, eletricidade e combate a incêndio, e coloque-os no topo da agenda com um profissional habilitado como responsável.", "Monte a agenda com data, responsável e custo previsto, e registre cada serviço feito com nota ou foto do comprovante.", "Defina o que fazer quando um item crítico estiver vencido ou com defeito, incluindo suspender o uso até a avaliação de um profissional."], "exemplo": {"titulo": "Agenda de manutenção com itens críticos", "texto": "Dados fictícios: um chalé inventariou 10 equipamentos. Sete têm data da última revisão, ou seja, 7 ÷ 10 = 70% com registro. Três são críticos de segurança, e dois deles estão com data conhecida, então 2 de 3 críticos estão em dia. O terceiro, um aquecedor a gás, ficou sem registro. O dono coloca esse item no topo da agenda, agenda um profissional habilitado nesta semana e suspende o uso até a avaliação."}, "erro_comum": "Esperar o equipamento quebrar para agir, ou revisar só o que é barato e visível. Itens críticos de segurança sem registro são o maior risco e costumam ser deixados para depois.", "como_ler": {"ausente": "Não existe lista de equipamentos nem datas de revisão. A manutenção só acontece depois da quebra ou da reclamação do hóspede.", "parcial": "Há inventário ou agenda para parte dos itens, mas faltam datas, responsáveis ou os itens críticos de segurança. As revisões acontecem sem comprovante guardado.", "comprovado": "Inventário completo, agenda com datas e responsáveis, itens críticos priorizados com profissional habilitado e comprovantes arquivados de cada serviço feito, com próxima data definida."}, "verificacao": "Indicador: itens críticos com revisão em dia sobre o total de itens críticos, e número de quebras com hóspede dentro por trimestre. Compare trimestre a trimestre. Confirme que a agenda não ficou cara demais, comparando o custo com o dos consertos de emergência."}, {"id": "m5q5", "por_que_importa": "Faltar papel higiênico ou lençol limpo no dia da chegada é um problema evitável. Comprar demais prende dinheiro e ocupa espaço. Controlar saldo, consumo e prazo do fornecedor mostra quando comprar e quanto. O estoque mínimo é a quantidade que protege você do imprevisto até a próxima entrega chegar, sem encher a prateleira.", "como_coletar": ["Liste os itens de consumo: papel, sabonete, café, produtos de limpeza, lâmpadas, pilhas, roupa de cama e toalhas. Comece pelos que causam mais problema quando acabam.", "Contagem do saldo atual de cada item no dia e registro numa planilha simples. Repita a contagem em dia fixo, por exemplo toda semana.", "Anote o consumo médio por dia olhando as últimas semanas: quanto saiu do estoque dividido pelos dias. Se não tiver histórico, comece a registrar hoje.", "Pergunte ao fornecedor o prazo de reposição em dias, incluindo atrasos que já ocorreram, e defina uma margem de segurança para cobrir variações.", "Calcule consumo médio diário × prazo de reposição, some a margem e registre os números na Calculadora de Capacidade e Estoque."], "exemplo": {"titulo": "Estoque mínimo de papel higiênico", "texto": "Dados fictícios: uma hospedagem usa em média 6 rolos de papel por dia e o fornecedor leva 3 dias para entregar. A conta é 6 × 3 = 18 rolos. Com margem de segurança de 6 rolos, o estoque mínimo é 18 + 6 = 24. O saldo contado hoje é 20, abaixo do mínimo. Para voltar ao nível seguro, é preciso comprar pelo menos 24 − 20 = 4 rolos agora, e o dono marca a próxima contagem para a semana seguinte."}, "erro_comum": "Usar o consumo de um mês de baixa ocupação para definir o estoque, ou esquecer o prazo do fornecedor. O saldo parece suficiente, mas acaba antes da reposição chegar, justo na semana de maior movimento.", "como_ler": {"ausente": "Não há contagem nem registro. A compra acontece quando o item acaba, e ninguém sabe o consumo médio nem o prazo do fornecedor.", "parcial": "Há contagem eventual ou compra por costume, sem consumo médio registrado, sem prazo de entrega considerado ou sem margem. Faltas ainda acontecem de vez em quando.", "comprovado": "Saldo contado em data fixa, consumo médio registrado, prazo do fornecedor conhecido e estoque mínimo calculado por item, com compras ajustadas à demanda e histórico guardado."}, "verificacao": "Indicador: número de faltas de itens essenciais por mês e valor parado em estoque. Compare antes e depois de adotar o mínimo. Confirme que não sobrou item vencido ou parado, o que mostraria que o mínimo ficou alto demais."}, {"id": "m5q6", "por_que_importa": "Problemas vão acontecer: falta de água, fechadura travada, reclamação de barulho. O que muda o resultado é saber quem age primeiro e em quanto tempo. Um procedimento de incidentes classifica a urgência, diz quem responde, quem assume se a primeira pessoa não responder e quais contatos de emergência chamar em situações de risco.", "como_coletar": ["Liste os problemas que já aconteceram ou que você teme: acesso, água, energia, barulho, segurança, saúde, danos e reclamações. Use mensagens antigas de hóspedes como fonte.", "Classifique cada tipo em níveis de urgência, por exemplo alta, média e baixa, e defina o tempo desejado de primeira resposta para cada nível.", "Escreva quem responde, quem assume se não houver resposta e quando você entra na decisão. Inclua uma lista de contatos de emergência locais, conferida por você.", "Prepare respostas prontas para os incidentes mais comuns, com tom educado e passos claros, e deixe as instruções de segurança visíveis no imóvel.", "Treine quem atende, simule um incidente de alta urgência e registre cada ocorrência real com horário da primeira resposta e da solução."], "exemplo": {"titulo": "Tempo de resposta por urgência", "texto": "Dados fictícios: em um mês, uma casa registrou 10 incidentes: 2 de urgência alta, 3 média e 5 baixa, somando 2 + 3 + 5 = 10. A meta para urgência alta é responder em até 15 minutos. Um dos dois casos foi respondido em 10 minutos e o outro em 20, então 1 de 2 cumpriu a meta, ou 50%. A equipe revê quem fica de plantão à noite e o dono repete a medição no mês seguinte."}, "erro_comum": "Tratar todo problema como igual, ou deixar a decisão só com uma pessoa. Quando ela está indisponível, o hóspede espera, e situações de risco ficam sem encaminhamento. Contato de emergência desatualizado é tão ruim quanto não ter.", "como_ler": {"ausente": "Cada problema é resolvido na hora, por quem estiver disponível. Não há classificação de urgência, escalonamento nem lista de contatos de emergência conferida.", "parcial": "Existe combinado informal ou lista de contatos, mas sem níveis de urgência, sem substituto para quem atende ou sem treino. Os tempos de resposta não são medidos.", "comprovado": "Procedimento escrito com urgência classificada, quem responde e quem assume, contatos de emergência atualizados, equipe treinada e registro de cada ocorrência com tempo de resposta e solução."}, "verificacao": "Indicador: tempo até a primeira resposta por nível de urgência e proporção dentro da meta, por mês. Compare mês a mês. Confirme também a satisfação dos hóspedes nas mensagens, para ver se a rapidez não veio com respostas mal resolvidas."}, {"id": "m5q7", "por_que_importa": "Equipe sobrecarregada erra mais, atrasa e adoece. Equipe ociosa pesa no custo. Acompanhar a carga mostra se o trabalho cabe nas horas disponíveis. Sem esse número, você só percebe o problema quando alguém pede demissão ou o hóspede reclama. Ajustes devem respeitar contratos e direitos trabalhistas, com orientação de contador ou advogado.", "como_coletar": ["Liste as tarefas de cada turno e o volume típico: quantas trocas de roupa de cama, quantas entradas, quantas mensagens e quantas visitas de manutenção.", "Meça o tempo real de cada tarefa com um cronômetro ou registro de início e fim, em vez de chutar. Anote por pessoa e por dia.", "Registre as horas disponíveis de cada pessoa conforme o combinado, descontando pausas, deslocamentos e folgas previstas.", "Divida as horas necessárias pelas disponíveis em cada turno. Marque os turnos acima de 100% como sobrecarga e abaixo de 60% como folga.", "Registre os números na Calculadora de Capacidade e Estoque e discuta a redistribuição com a equipe, consultando contador ou advogado se envolver jornada."], "exemplo": {"titulo": "Carga de trabalho do dia de troca", "texto": "Dados fictícios: em um dia com 6 trocas de hóspedes, cada troca leva 1,5 hora, então as horas necessárias são 6 × 1,5 = 9. Duas pessoas trabalham 4 horas cada, somando 2 × 4 = 8 horas disponíveis. A carga é 9 ÷ 8 = 112,5%, acima de 100%. Isso indica sobrecarga. O dono avalia mudar horários de saída, levar uma terceira pessoa em dias de troca ou espaçar entradas, sempre conferindo as regras da jornada."}, "erro_comum": "Medir a carga pela impressão de que a equipe 'dá conta'. Sem horas medidas, a sobrecarga fica escondida até virar erro ou afastamento, e a solução pode ferir direitos trabalhistas quando é improvisada.", "como_ler": {"ausente": "Não há registro de horas nem de volume de tarefas. A carga é percebida só pela reclamação ou pelo atraso, e ninguém sabe se o trabalho cabe no tempo.", "parcial": "Há registro de volume ou horas em alguns turnos, mas sem comparar necessidade e disponibilidade, ou sem considerar dias de pico. A redistribuição acontece pelo improviso.", "comprovado": "Mapa de capacidade por turno com horas medidas, carga calculada, dias de pico identificados e decisões de redistribuição registradas e conferidas com orientação profissional quando envolvem jornada."}, "verificacao": "Indicador: carga de trabalho (horas necessárias ÷ disponíveis) por turno, comparada antes e depois do ajuste. Confirme que a nova divisão não deslocou a sobrecarga para outra pessoa, e acompanhe atrasos e erros nas semanas seguintes."}, {"id": "m5q8", "por_que_importa": "Reserva sem pagamento correspondente, ou pagamento duplicado, vira prejuízo silencioso. Conciliar é comparar o que o sistema mostra com o que os canais informam e com o que entrou na conta. Quando os três batem, você confia nos números. Quando não batem, a divergência aponta duplicidade, falha ou acesso indevido.", "como_coletar": ["Escolha um período fechado, como o mês passado, e exporte a lista de reservas do seu sistema de reservas, de cada canal de venda e os extratos de recebimento.", "Alinhe as listas lado a lado por código de reserva, data e valor. Marque cada reserva que aparece em um lugar e não em outro.", "Procure duplicidades, cancelamentos não refletidos, valores diferentes, taxas descontadas e pagamentos que não chegaram. Anote cada divergência com valor.", "Verifique quem tem acesso ao sistema e aos canais, e remova usuários que saíram ou que não precisam mais de acesso.", "Registre quantidade e valor das divergências e o tempo gasto na conferência na Calculadora de Capacidade e Estoque, e defina uma rotina mensal."], "exemplo": {"titulo": "Conciliação do mês com duas divergências", "texto": "Dados fictícios: o sistema de reservas somou R$ 12.000 em um mês. A conciliação achou uma reserva registrada duas vezes, de R$ 450, e um pagamento de R$ 600 que não apareceu no extrato. Valor real das reservas: 12.000 − 450 = R$ 11.550. Valor recebido: 11.550 − 600 = R$ 10.950. A diferença entre sistema e extrato é 450 + 600 = R$ 1.050. O dono corrige a duplicidade e cobra o canal pelo pagamento de R$ 600."}, "erro_comum": "Olhar só o total do mês. Duas divergências podem se compensar e esconder o problema, e uma taxa descontada pode parecer pagamento a menos. Conferir reserva por reserva é o que mostra a causa.", "como_ler": {"ausente": "Ninguém compara sistema, canais e extratos. Divergências só aparecem por acaso, e acessos de pessoas que saíram não são revistos.", "parcial": "A conferência acontece de vez em quando ou só sobre o total, sem relatório de divergências por reserva. Acessos são revistos raramente.", "comprovado": "Conciliação mensal por reserva entre sistema, canais e extratos, com relatório de divergências, correções registradas e acessos revisados, e o tempo de conferência acompanhado."}, "verificacao": "Indicador: valor e número de divergências por mês, comparado ao mês anterior. Confirme que a correção de uma duplicidade não apagou uma reserva válida, conferindo o código no canal, e veja se as divergências novas diminuem."}, {"id": "m5q9", "por_que_importa": "Alguns requisitos de segurança envolvem pessoas e podem ter consequências graves se ignorados. Licenças, inspeções e riscos conhecidos precisam estar listados, com data e responsável. Você não precisa ser especialista: precisa saber o que existe, o que está vencido e quem é o profissional habilitado ou o órgão competente que confirma cada ponto.", "como_coletar": ["Liste licenças, alvarás e autorizações que seu tipo de hospedagem pode exigir, perguntando ao município, ao corpo de bombeiros, à vigilância sanitária e ao contador o que se aplica ao seu caso.", "Para cada item, registre se existe, a validade e onde está o comprovante. Se não souber, marque 'não sei' e transforme em tarefa de consulta.", "Percorra o imóvel procurando riscos: fiação exposta, escadas sem apoio, piscina ou área de risco sem proteção, saídas bloqueadas e produtos perigosos.", "Para cada pendência, defina responsável e prazo, e acione um profissional habilitado para avaliar. Não improvise reparos em gás, eletricidade ou estrutura.", "Suspenda o uso de qualquer área ou atividade que ofereça risco até a avaliação, e registre a decisão com data."], "exemplo": {"titulo": "Registro de pendências de segurança", "texto": "Dados fictícios: uma pousada listou 8 requisitos. Cinco têm comprovante em dia, dois estão vencidos e um está sem informação, somando 5 + 2 + 1 = 8. Em dia: 5 ÷ 8 = 62,5%. O dono marca os dois vencidos com prazo e responsável, transforma o sem informação em consulta ao órgão competente e suspende o uso da área ligada a um deles até o profissional avaliar. Daqui a 30 dias ele refaz a contagem para ver se os requisitos em dia passaram de 5 para mais."}, "erro_comum": "Achar que, se nunca houve problema, está tudo certo. Requisitos vencidos ou desconhecidos continuam sendo risco. Outro erro é consertar sozinho um item crítico em vez de chamar quem é habilitado.", "como_ler": {"ausente": "Não há lista de licenças, inspeções nem riscos. O dono não sabe o que se aplica ao seu caso nem o que está vencido.", "parcial": "Existe lista parcial ou documentos soltos, sem validade conferida, sem responsável por pendência ou sem consulta aos órgãos competentes. Alguns riscos conhecidos seguem sem prazo.", "comprovado": "Registro atualizado com requisito, validade, comprovante, responsável e prazo, confirmado com profissionais habilitados ou órgãos competentes, e atividades inseguras suspensas até a regularização."}, "verificacao": "Indicador: requisitos em dia sobre o total listado e número de pendências com prazo vencido. Revise todo mês. Confirme com o profissional habilitado ou o órgão competente que a regularização foi feita, e não só que o prazo passou."}, {"id": "m5q10", "por_que_importa": "Se o mesmo problema acontece três vezes, o erro não é a sorte: é a causa que ficou sem tratamento. Um histórico de incidentes mostra o que se repete, por que acontece e se a correção funcionou. Sem ele, você apaga incêndios todo mês e a equipe se cansa de consertar o que volta.", "como_coletar": ["Crie um registro simples com data, o que aconteceu, onde, quem resolveu e quanto tempo levou. Use mensagens de hóspedes e conversas com a equipe para preencher o passado recente.", "Agrupe os incidentes por tipo e conte quantos se repetem. Escolha o grupo que mais aparece ou que mais prejudica o hóspede.", "Investigue a causa, perguntando 'por quê?' até chegar a algo que você controla, como falta de treino, de peça, de checklist ou de prazo.", "Defina a correção, o responsável e a data, e escreva como saberá se funcionou, ou seja, qual número deve melhorar e em quanto tempo.", "Depois do prazo, confira o número e registre se a correção funcionou, funcionou em parte ou não funcionou, e decida o próximo passo."], "exemplo": {"titulo": "Falha repetida que foi corrigida", "texto": "Dados fictícios: em 90 dias foram registrados 12 incidentes. Cinco foram de fechadura sem bateria, ou seja, 5 ÷ 12 ≈ 42% do total. A causa era não existir troca programada. A correção foi incluir a troca de pilhas na agenda a cada 60 dias, com responsável. No período seguinte de 90 dias houve 1 caso, uma queda de 5 para 1. O dono registra a melhoria e confere se nenhum caso novo surgiu."}, "erro_comum": "Registrar o incidente só como 'resolvido' e seguir em frente. Sem causa, correção e conferência depois, o problema volta com outro nome. Outro erro é corrigir sem medir e assumir que funcionou.", "como_ler": {"ausente": "Não há registro dos incidentes. Cada falha é esquecida depois de resolvida, e ninguém sabe quais se repetem nem por quê.", "parcial": "Há registro de incidentes, mas sem causa, sem responsável pela correção ou sem conferência depois. As falhas repetidas são percebidas, mas continuam voltando.", "comprovado": "Histórico com causa, correção, responsável e verificação em cada falha recorrente, e confirmação posterior de que o número caiu, com decisão registrada sobre o próximo passo."}, "verificacao": "Indicador: número de ocorrências do mesmo tipo antes e depois da correção, em períodos iguais, como 90 dias. Confirme que a correção não gerou outro tipo de problema, olhando o histórico completo, e mantenha a revisão a cada trimestre."}], "fechamento": {"resumo": "Uma hospedagem que funciona sem você tem tarefas com dono e substituto, limpeza com padrão e inspeção, entrada previsível, manutenção em agenda, estoque com mínimo calculado, procedimento para resolver problemas, carga de trabalho medida, conciliação periódica de reservas e pagamentos, requisitos de segurança registrados e aprendizado com falhas repetidas. Comece pelos itens críticos de segurança, depois pelos de maior impacto e menor esforço. Registre a evidência de cada resposta, escolha uma ação por vez, defina responsável e prazo, e confira o indicador antes de passar para a próxima.", "glossario": [{"termo": "Matriz de responsabilidades", "definicao": "Tabela que mostra quem faz, quem confere e quem substitui cada tarefa."}, {"termo": "Estoque mínimo", "definicao": "Quantidade que cobre o consumo médio diário durante o prazo de reposição, mais uma margem de segurança."}, {"termo": "Carga de trabalho", "definicao": "Horas necessárias dividido pelas horas disponíveis; acima de 100% indica sobrecarga."}, {"termo": "Conciliação", "definicao": "Comparação entre o que o sistema registra, o que os canais informam e o que entrou na conta."}, {"termo": "Escalonamento", "definicao": "Regra que define quem assume o problema quando o primeiro responsável não responde a tempo."}, {"termo": "Manutenção preventiva", "definicao": "Revisão programada de equipamentos antes que quebrem, seguindo o fabricante ou o profissional habilitado."}], "limites": "Este módulo organiza a sua operação, mas não substitui parecer de profissional habilitado, vistoria de órgão competente, orientação trabalhista, contábil ou jurídica, nem auditoria. Itens de segurança, licenças e jornada de trabalho pedem confirmação de quem tem competência para isso. Os exemplos são fictícios, e nenhuma ação aqui garante ocupação, renda ou resultado."}}, "6": {"modulo": 6, "titulo": "Expanda sem começar do zero", "subtitulo": "Um passo a passo para verificar estrutura, regras, demanda e retorno antes de investir em expansão", "abertura": {"para_que_serve": "Este guia ajuda você a decidir com calma se vale a pena expandir a sua hospedagem, seja um Airbnb, uma casa, um apartamento, um chalé, uma pousada ou um glamping. Antes de gastar com obra, você confere o que já tem, o que o terreno permite, quais autorizações podem ser exigidas, se água e energia aguentam, se existe procura demonstrada e quanto custa de verdade. Cada pergunta traz o que coletar, um exemplo com dados fictícios, o erro mais comum e como saber se a ação funcionou.", "tenha_em_maos": ["Lista de estruturas e fotos recentes do imóvel", "Matrícula, levantamento e contas de água e energia", "Registro de pedidos que você não atendeu por falta de vaga", "Orçamentos ou propostas de obra, mobiliário e licenças", "Calendário de ocupação e custos dos últimos 12 meses"], "como_trabalhar": "Defina o projeto de expansão e o período de análise, de preferência os últimos 12 meses. Use só dados que você consegue mostrar: contas, notas, contratos e registros. Quando não souber uma resposta, marque não sei, porque desconhecido não é zero. Este diagnóstico é orientativo e ajuda a organizar a decisão. Ele não é uma auditoria nem substitui profissionais habilitados."}, "perguntas": [{"id": "m6q1", "por_que_importa": "Expandir só faz sentido depois de saber o que você já tem. Muitas vezes há quarto, deck, área comum ou horário parado que pode render antes de qualquer obra. Sem um mapa de ativos, você corre o risco de construir algo novo enquanto uma estrutura existente poderia ser melhor usada. O mapa também mostra o que está em mau estado e vai custar caro para manter.", "como_coletar": ["Liste todas as estruturas: unidades de hospedagem, áreas comuns, cozinha, lavanderia, estacionamento, depósitos e áreas externas. Use uma linha para cada item, com nome e local.", "Anote a capacidade de cada estrutura: quantas pessoas, quantas unidades, quantas noites por mês ela pode ser vendida ou usada, sem contar bloqueios.", "Dê uma nota simples ao estado de conservação: bom, regular ou ruim. Tire uma foto datada de cada item e registre defeitos conhecidos.", "Compare capacidade com uso real dos últimos 12 meses. Marque como ociosa só a parte que ficou parada por falta de procura ou de uso, não por manutenção ou bloqueio.", "Junte tudo em uma planilha ou documento único com colunas: estrutura, capacidade, estado, uso real e ociosidade. Revise o mapa antes de qualquer decisão de expansão."], "exemplo": {"titulo": "Mapa de ativos de um mês", "texto": "Dados fictícios: uma pousada tem 5 unidades e analisa 30 dias. Noites disponíveis = 5 × 30 − 10 bloqueadas para manutenção = 140. Foram vendidas 84 noites. Ocupação = 84 ÷ 140 = 60%. Sobram 140 − 84 = 56 noites livres. O mapa mostra que 40 delas caem de segunda a quinta e que duas unidades estão em estado regular. A capacidade ociosa real é de 56 noites, e não das 150 que a conta bruta sugeriria. Antes de pensar em construir, o dono testa pacotes para dias de semana e conserta as duas unidades."}, "erro_comum": "Contar como ociosa toda estrutura que parece vazia. Uma unidade bloqueada para reforma, um quarto reservado para a família ou um deck que não aguenta peso não são capacidade livre. Ociosidade real é o que está em bom estado e sem uso.", "como_ler": {"ausente": "Não existe lista de estruturas, ou ela está só na memória de quem cuida. Capacidade e estado de conservação nunca foram anotados nem fotografados.", "parcial": "Há lista das estruturas, mas sem capacidade, sem estado de conservação ou sem comparação com o uso real. A ociosidade é uma impressão e não um número.", "comprovado": "Mapa escrito com todas as estruturas, capacidade, estado, fotos datadas e uso dos últimos 12 meses. A ociosidade real aparece em número e está separada de bloqueios."}, "verificacao": "Compare a ociosidade calculada com o calendário de ocupação do mesmo período. A ação funcionou se as noites ociosas diminuírem sem que a diária média caia de forma que a contribuição por noite fique pior que antes. Refaça o mapa a cada 6 a 12 meses."}, {"id": "m6q2", "por_que_importa": "O terreno define o que pode ser feito, e a área que parece livre nem sempre pode receber uma construção. Pode haver faixas de proteção, divisas mal definidas, servidões ou regras do município que limitam o uso. Descobrir isso depois de comprar material ou contratar obra pode gerar perda de dinheiro e retrabalho. Por isso a documentação vem antes do desenho.", "como_coletar": ["Reúna a matrícula atualizada do imóvel e confira se a área e as divisas escritas batem com o que existe no local. Peça uma certidão recente, não uma cópia antiga.", "Providencie um levantamento da área feito por profissional habilitado, mostrando divisas, construções existentes, acessos e qualquer elemento natural relevante, como córregos, encostas ou árvores.", "Pergunte ao município quais regras de uso e ocupação valem para o seu endereço. Registre quem respondeu, a data e, se possível, peça a resposta por escrito.", "Converse com um profissional habilitado, como arquiteto, engenheiro ou advogado, sobre restrições, servidões e áreas que não podem receber construção. Anote o que ele disser.", "Monte uma pasta única com matrícula, levantamento, respostas do município e observações do profissional. Marque no mapa o que está confirmado e o q
