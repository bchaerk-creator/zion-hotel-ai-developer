:root{--preto:#040605;--musgo:#1B2117;--creme:#FEF5F0;--areia:#DED6BF;--terra:#8B714E;--ouro:#C9B37E;--ok:#2f6b3a;--al:#9a5b13;--er:#8e2b2b;--amarelo:#fff3c4;--verde:#dff0df}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Aventa,Jost,system-ui,sans-serif;background:var(--creme);color:#1d211b;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3{font-family:Cormorant,Georgia,serif;font-weight:500;line-height:1.1;margin:0;color:var(--musgo)}
div.stk{position:sticky;top:0;z-index:20}header.top{background:var(--musgo);color:var(--creme);padding:10px 16px;display:flex;align-items:center;gap:12px}
header.top img{height:26px}header.top .tt{font-family:Cormorant,serif;font-size:19px;flex:1;line-height:1.1}header.top .pg{font-size:12px;color:var(--ouro);white-space:nowrap}
.bar{height:5px;background:rgba(222,214,191,.25)}.bar i{display:block;height:100%;background:var(--ouro);width:0;transition:width .3s}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--musgo);padding:0 10px 8px}
nav.tabs button{flex:none;background:transparent;border:0;color:var(--areia);font:inherit;font-size:14px;padding:8px 12px;border-radius:18px;cursor:pointer;min-height:44px}
nav.tabs button.on{background:var(--ouro);color:var(--preto)}
main{max-width:880px;margin:0 auto;padding:18px 16px 70px}
.card{background:#fff;border:1px solid var(--areia);border-radius:10px;padding:16px;margin:0 0 14px}
.card h2{font-size:28px;margin-bottom:6px}.card h3{font-size:22px;margin:4px 0 8px}
.kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
.hero{background:var(--musgo);color:var(--creme);border:0}.hero h1{color:var(--creme);font-size:36px}.hero p{color:var(--areia)}
.btn{display:inline-block;background:var(--musgo);color:var(--creme);border:0;border-radius:6px;padding:12px 18px;font:inherit;font-size:15px;cursor:pointer;min-height:44px;text-decoration:none;margin:2px 4px 2px 0}
.btn.ouro{background:var(--ouro);color:var(--preto)}.btn.ghost{background:transparent;color:var(--musgo);border:1px solid var(--musgo)}.btn:disabled{opacity:.5}
.mods{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:620px){.mods{grid-template-columns:1fr 1fr}}
.mod{text-align:left;background:#fff;border:1px solid var(--areia);border-radius:10px;padding:14px;font:inherit;cursor:pointer;min-height:70px}
.mod b{display:block;font-family:Cormorant,serif;font-size:21px;color:var(--musgo)}.mod small{color:#666}
.pergunta{font-family:Cormorant,serif;font-style:italic;font-size:25px;color:var(--musgo);line-height:1.15;margin:4px 0 8px}
.video{background:var(--musgo);color:var(--areia);border-radius:8px;padding:22px 16px;text-align:center;font-size:14px;margin:0 0 14px}
.opts{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}@media(min-width:620px){.opts{grid-template-columns:repeat(5,1fr)}}
.opts label{display:flex;align-items:center;gap:8px;border:1px solid #c9bfa5;border-radius:8px;padding:10px;min-height:44px;cursor:pointer;font-size:14px;background:#fff}
.opts input{width:20px;height:20px;flex:none}.opts label.sel{background:var(--amarelo);border-color:var(--terra)}
details.ajuda{background:#fbf6ea;border-left:4px solid var(--ouro);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14.5px}details.ajuda summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--musgo)}
details.ajuda ol{margin:6px 0 6px 18px;padding:0}
label.f{display:block;margin:10px 0}label.f span.l{display:block;font-size:14px;color:#444;margin-bottom:3px}
input[type=text],select,textarea,input[type=month]{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #c9bfa5;border-radius:6px;background:var(--amarelo)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:0 14px}@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr;gap:6px;padding:8px 0;border-top:1px dotted #d8cdb0}@media(min-width:620px){.row{grid-template-columns:repeat(var(--c),1fr)}}
.row label span{font-size:12px;color:#555;display:block}
.mes{display:grid;grid-template-columns:42px repeat(3,1fr);gap:6px;align-items:center;margin:4px 0}.mes b{font-size:13px}
.res{background:var(--verde);border-radius:8px;padding:12px 14px;margin:12px 0}
.res .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted #9bb89b}.res .l b{font-variant-numeric:tabular-nums;text-align:right}
.res .dest{font-family:Cormorant,serif;font-size:30px;color:var(--musgo)}
.av{font-size:13.5px;background:#fdebd0;border-left:4px solid var(--al);border-radius:6px;padding:7px 10px;margin:6px 0}
.fb{border:1px solid var(--areia);border-radius:8px;margin:10px 0;overflow:hidden}.fb div{padding:8px 12px;border-top:1px solid #eee;font-size:14.5px}.fb div:first-child{border:0}.fb div b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.aviso{font-size:13px;color:#555;background:#f3eee0;border-radius:6px;padding:8px 10px;margin:10px 0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--areia);color:var(--musgo);margin:0 4px 2px 0}
.tag.ok{background:var(--verde)}.tag.al{background:#fde6c2}.tag.er{background:#f6d0d0}
.pil{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;margin:8px 0;font-size:14px}.pil .t{height:14px;background:#eee7d4;border-radius:7px;position:relative;overflow:hidden}.pil .t i{display:block;height:100%;background:var(--musgo)}.pil .t u{position:absolute;left:0;top:0;height:100%;background:rgba(201,179,126,.45)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid #e6dfcc;text-align:left;vertical-align:top}th{background:var(--musgo);color:var(--creme);font-weight:400}
.pl{border:1px solid var(--areia);border-radius:8px;padding:10px;margin:8px 0;background:#fff}.pl h4{margin:0 0 4px;font-family:Aventa,sans-serif;font-weight:700;font-size:15.5px;line-height:1.35;color:var(--musgo)}
.pl .m{font-size:13.5px;color:#444}.pl .ed{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}@media(min-width:620px){.pl .ed{grid-template-columns:2fr 1fr}}
.rodape{font-size:12px;color:#666;text-align:center;margin-top:20px}
@media print{div.stk,.noprint{display:none!important}main{padding:0}.card{border:0}body{background:#fff}}
</style>
</head>

uando houver evidência que alguém consiga conferir. Se você não souber, marque não sei: desconhecido não é zero, é uma coleta a organizar. O resultado é um diagnóstico orientativo para decidir o que testar primeiro. Ele não é auditoria nem parecer profissional."}, "perguntas": [{"id": "m1q1", "por_que_importa": "Quem decide a viagem raramente decide pelo espaço, e sim pelo motivo: descansar, comemorar, trabalhar, visitar família ou participar de um evento. Cada motivo pede fotos, descrição e regras diferentes. Sem saber quem realmente reserva, você escreve para todo mundo e não conversa com ninguém. Conhecer a distribuição por motivo permite escolher um segmento para testar uma oferta, em vez de presumir o perfil do hóspede.", "como_coletar": ["Abra a lista das últimas 20 reservas concluídas, de qualquer canal. Se tiver menos de 20, use todas e anote que a amostra é pequena.", "Para cada reserva, procure o motivo declarado: mensagem do hóspede, campo do canal, conversa de WhatsApp ou check-in. Não deduza pelo sobrenome, idade ou tamanho do grupo.", "Use poucos grupos, como lazer, comemoração, trabalho, família, evento e outro. Quando o motivo não foi informado, marque como não informado, nunca como o motivo mais provável.", "Conte quantas reservas caíram em cada grupo e calcule a participação de cada um sobre o total. Confira se a soma fecha com o número de reservas analisadas.", "Registre os números na Calculadora de Posicionamento e escolha um segmento para testar uma oferta nos próximos 30 dias."], "exemplo": {"titulo": "Motivo das últimas 20 reservas", "texto": "Dados fictícios: de 20 reservas, 8 foram lazer em casal, 5 comemoração, 4 trabalho remoto e 3 não informaram o motivo. A conta fecha: 8 + 5 + 4 + 3 = 20. Lazer representa 8 de 20, ou 40%, e comemoração 25%. O dono decide testar uma oferta para comemoração, com decoração opcional e saída mais tarde, porque o segmento é relevante e ainda pouco trabalhado no anúncio. Ele também passa a perguntar o motivo da viagem na confirmação da reserva, para reduzir o grupo não informado nas próximas 20."}, "erro_comum": "Presumir o perfil pelo que parece óbvio, como achar que todo casal veio por romance ou que todo hóspede sozinho veio a trabalho. Sem o motivo declarado, o número vira opinião, e a oferta testada pode falar com o público errado.", "como_ler": {"ausente": "Você nunca classificou as reservas por motivo e descreve o hóspede por impressão. Não há tabela nem contagem que outra pessoa consiga conferir.", "parcial": "Você tem ideia dos motivos principais, mas a contagem é incompleta, usa poucas reservas ou mistura motivo declarado com suposição.", "comprovado": "Existe uma tabela com as últimas 20 reservas, motivo declarado de cada uma, soma conferida e um segmento escolhido para teste."}, "verificacao": "Compare a tabela atual com a das próximas 20 reservas e veja se o segmento escolhido ganhou participação. Cuidado: uma amostra pequena oscila por acaso, então confirme com mais de um período antes de mudar o anúncio inteiro. Confira também se a mudança não afastou outros segmentos importantes."}, {"id": "m1q2", "por_que_importa": "O hóspede compara antes de reservar, mesmo que você não veja. Se você só olha o seu preço, não sabe se ele parece caro ou barato para o que entrega. Comparar ofertas equivalentes mostra o que a concorrência inclui, o que cobra à parte e onde existe uma lacuna que você pode ocupar. A comparação só vale com preço total, não apenas com a diária.", "como_coletar": ["Escolha cinco hospedagens da mesma região, com capacidade e padrão parecidos com os seus. Evite comparar com opções muito maiores, mais simples ou de outra proposta.", "Defina duas datas iguais para todos, uma de fim de semana e uma de meio de semana, com a mesma quantidade de hóspedes. Simule a reserva até a tela de preço total.", "Monte uma tabela com preço total (taxas de limpeza e de serviço incluídas), café da manhã, estacionamento, regras de cancelamento, comodidades e nota. Anote a data da consulta.", "Inclua você na mesma tabela, nas mesmas datas. Marque o que só você oferece, o que só os outros oferecem e o que todos oferecem e portanto não diferencia.", "Registre os números na Calculadora de Posicionamento e escreva uma lacuna de oferta que você poderia testar."], "exemplo": {"titulo": "Tabela de cinco concorrentes", "texto": "Dados fictícios: para a mesma noite de sábado, para dois hóspedes, os preços totais das cinco opções foram 380, 420, 450, 460 e 500 reais. A soma é 2.210 e a média é 442. O seu total é 440, quase igual à média. Na tabela, só uma das cinco inclui café da manhã e nenhuma tem check-out tardio. O dono não baixa o preço: ele anota a lacuna check-out tardio opcional e decide testar essa oferta. O preço médio só serve de referência, e a tabela precisa ser refeita depois, porque os preços mudam."}, "erro_comum": "Comparar apenas a diária exibida na listagem. Taxas de limpeza e de serviço mudam o total e podem inverter a conclusão. Outro erro é escolher concorrentes muito diferentes de você e concluir que está caro ou barato.", "como_ler": {"ausente": "Você não compara ofertas ou olha só a diária de um ou dois vizinhos, sem datas iguais, sem preço total e sem registro.", "parcial": "Existe comparação, mas com menos de cinco opções, datas diferentes, diária sem taxas ou sem anotar serviços incluídos.", "comprovado": "Há tabela com cinco opções equivalentes, mesmas datas, preço total, serviços, data da consulta e uma lacuna de oferta escrita."}, "verificacao": "Repita a tabela em outro mês, com as mesmas regras, e veja se a lacuna ainda existe. Se testar um item novo, compare a procura e o preço total antes e depois no mesmo canal, e confirme que o custo do item não consumiu o ganho."}, {"id": "m1q3", "por_que_importa": "Uma promessa vaga como lugar aconchegante e perfeito para relaxar serve para qualquer hospedagem e, por isso, não diferencia nenhuma. A promessa específica diz para quem é o espaço, que experiência ele entrega e qual detalhe prova isso. Ela ajuda a pessoa certa a se reconhecer no anúncio, e a pessoa errada a seguir adiante sem gerar frustração.", "como_coletar": ["Releia o título e a primeira frase do seu anúncio como se fosse um desconhecido. Copie o texto exato em um documento, com a data e o canal.", "Escreva uma frase nova com três partes: para quem é, qual experiência entrega e qual diferencial pode ser verificado, como uma vista, um equipamento, uma distância ou um serviço.", "Teste cada afirmação: dá para provar com uma foto, um número ou uma regra? Se não der, troque a palavra por algo que dê, por exemplo cozinha completa no lugar de ótima estrutura.", "Mostre a frase a duas pessoas que não conhecem o lugar e pergunte para quem elas acham que é. Se a resposta não bater com o seu público, reescreva.", "Publique a frase no título ou na abertura e guarde a versão antiga para comparar depois."], "exemplo": {"titulo": "Da frase vaga à frase específica", "texto": "Dados fictícios: o título original era Casa aconchegante perto de tudo. O dono reescreveu: Casa para família de até 6 pessoas, com cozinha completa e quintal fechado, a 10 minutos a pé do centro. Cada trecho pode ser conferido por foto ou mapa. Ele cria uma segunda versão, mais curta, com foco em quintal fechado para quem viaja com criança. Nos 30 dias seguintes, mostra uma versão por vez e compara as visitas e as reservas de cada uma, sem trocar fotos ou preço no mesmo período."}, "erro_comum": "Usar adjetivos que ninguém consegue provar, como incrível, perfeito ou exclusivo, ou prometer algo que o espaço não entrega. Promessa exagerada traz hóspede decepcionado e avaliação ruim, o contrário do que se queria.", "como_ler": {"ausente": "Seu título e sua abertura são genéricos e poderiam servir para qualquer hospedagem. Não há frase escrita com público, experiência e diferencial.", "parcial": "Há uma frase com diferencial, mas sem dizer para quem é, ou com afirmações que você não consegue provar com foto, número ou regra.", "comprovado": "A frase está publicada, cita público, experiência e diferencial verificável, e você guardou a versão anterior para comparação."}, "verificacao": "Compare as visitas e as reservas dos dois títulos em períodos iguais, sem mudar fotos ou preço ao mesmo tempo. Acompanhe também as avaliações: se aparecerem comentários dizendo que o espaço não era como descrito, a promessa precisa ser corrigida, mesmo que a procura tenha subido."}, {"id": "m1q4", "por_que_importa": "As fotos são a primeira coisa que o hóspede examina e muitas vezes a única. Elas precisam mostrar o que você promete e na ordem que faz sentido para a decisão. Fotos bonitas que escondem um defeito ou mostram algo que não existe geram avaliação ruim. Foto honesta atrai quem vai gostar e afasta quem não vai, o que também protege sua reputação.", "como_coletar": ["Exporte todas as fotos publicadas na ordem exata em que aparecem no anúncio, com o número de cada uma. Use a versão que o hóspede vê, não a pasta original.", "Para cada foto, anote o que ela mostra: ambiente, conforto, vista, banheiro, cozinha ou detalhe. Veja se os três diferenciais da sua promessa aparecem logo nas primeiras fotos.", "Marque fotos enganosas: lente que alarga o espaço, item que não está disponível, vista que não é a do quarto ou luz que esconde problema. Elimine ou substitua cada uma.", "Liste o que falta: ambiente sem foto, cama de perto, banheiro inteiro, acesso, área externa. Escolha os três atributos mais relevantes para o seu público e fotografe com luz natural.", "Reordene as fotos pelo impacto na decisão e guarde a sequência antiga para comparar depois."], "exemplo": {"titulo": "Revisão de uma sequência de 12 fotos", "texto": "Dados fictícios: o anúncio tem 12 fotos. A promessa é cozinha completa e quintal fechado, mas a cozinha só aparece na foto 9 e o quintal na 11. Duas fotos foram tiradas com lente muito aberta e deixam a sala maior do que é: o dono retira as duas. Restam 10, e ele fotografa a cozinha de dois ângulos e o banheiro, chegando a 13. Nova ordem: quintal, sala, cozinha, quarto, banheiro. Antes de mudar, ele anota as visitas dos 30 dias anteriores para comparar com os 30 seguintes."}, "erro_comum": "Escolher só as fotos mais bonitas e esquecer o que o hóspede precisa ver para decidir, como banheiro, cama e acesso. Outro erro é usar imagem gerada ou de banco como se fosse o seu espaço.", "como_ler": {"ausente": "As fotos nunca foram revisadas, há imagens que não correspondem ao espaço e os diferenciais prometidos não aparecem ou ficam escondidos no final.", "parcial": "Há boas fotos, mas a ordem é aleatória, faltam ambientes importantes ou ainda existe uma imagem que dá uma ideia diferente do real.", "comprovado": "Existe a sequência revisada, na ordem de impacto, com os diferenciais nas primeiras fotos, sem imagens enganosas e com registro de antes e depois."}, "verificacao": "Compare visitas, reservas e perguntas dos hóspedes nos 30 dias anteriores e posteriores à troca, sem mudar outra variável. Leia as avaliações novas: se alguém disser que o lugar é diferente das fotos, algo ainda engana e deve ser corrigido."}, {"id": "m1q5", "por_que_importa": "Quando a descrição não responde às dúvidas básicas, o hóspede pergunta, espera ou desiste. Cada pergunta repetida no atendimento mostra uma informação que faltava no anúncio. Uma descrição completa reduz mensagens, evita mal-entendidos na chegada e deixa claro o que está incluído. Isso protege a avaliação, porque o hóspede chega sabendo o que vai encontrar.", "como_coletar": ["Releia as últimas 20 conversas com hóspedes e liste as perguntas que mais se repetiram antes da reserva, como acesso, estacionamento, café, pets, silêncio e horário.", "Cheque se a descrição responde a cinco temas: acesso e localização, capacidade real, regras da casa, privacidade e itens incluídos. Marque os que estão ausentes ou confusos.", "Reescreva em frases curtas e com números: quantos hóspedes cabem, quantas camas, como chega, o que está incluído, horários e regras. Evite parágrafos longos e linguagem de folheto.", "Peça a alguém de fora para ler a descrição e dizer o que ainda ficou sem resposta. Corrija as cinco dúvidas mais frequentes antes de publicar.", "Publique a versão nova e guarde a anterior com a data da troca."], "exemplo": {"titulo": "Cinco dúvidas que se repetem", "texto": "Dados fictícios: em 20 conversas, 9 perguntaram sobre estacionamento, 7 sobre café da manhã, 6 sobre animais, 5 sobre horário de chegada e 4 sobre barulho. Essas dúvidas somam 31 perguntas, cerca de 1,5 por conversa, o que mostra que as respostas faltavam no anúncio. O dono inclui na descrição uma frase para cada tema: vaga para 2 carros, café não incluso, animais sob consulta, check-in a partir das 15h e silêncio após as 22h. Depois ele conta de novo as perguntas nas próximas 20 conversas."}, "erro_comum": "Escrever a descrição pelo que o dono acha bonito, e não pelo que o hóspede precisa saber. Outro erro é esconder uma regra ou uma cobrança extra, o que gera conflito na chegada e avaliação ruim.", "como_ler": {"ausente": "A descrição é curta ou genérica e deixa de responder a acesso, capacidade, regras, privacidade ou itens incluídos. As dúvidas se repetem no atendimento.", "parcial": "A descrição cobre alguns dos cinco temas, mas deixa dúvidas frequentes sem resposta, ou traz informações antigas, vagas ou sem números.", "comprovado": "Existe a descrição revisada, responde aos cinco temas com informação objetiva, foi lida por alguém de fora e as perguntas repetidas diminuíram."}, "verificacao": "Conte quantas perguntas básicas chegam em 20 conversas antes e depois da revisão. Se caírem, a descrição está funcionando. Confira também as avaliações: queixas de que algo não estava claro indicam que ainda falta informação ou que ela ficou escondida."}, {"id": "m1q6", "por_que_importa": "O hóspede costuma ver sua hospedagem em mais de um lugar: anúncio, site, Instagram, WhatsApp. Se o nome, o tom, as regras ou o preço mudam de um canal para outro, ele desconfia. Comunicação consistente passa segurança e evita conflito, porque a promessa é a mesma em todo lugar. Marca, aqui, é a coerência entre o que você diz e o que você entrega.", "como_coletar": ["Liste todos os canais onde sua hospedagem aparece: anúncios, site, redes sociais, WhatsApp comercial, Google, mensagens automáticas e materiais impressos.", "Para cada canal, copie nome, descrição, capacidade, horários, regras, comodidades e preço. Anote também o tom: formal, descontraído, técnico ou vago.", "Monte uma tabela com os canais nas colunas e esses itens nas linhas. Pinte de vermelho cada célula que diverge de outro canal e de amarelo as que estão desatualizadas.", "Escolha uma versão oficial de cada informação divergente e corrija os canais, começando por capacidade, regras e preço, que geram mais conflito.", "Guarde a tabela e uma lista curta com nome, frase de promessa e tom, para usar em novos materiais."], "exemplo": {"titulo": "Inventário de quatro canais", "texto": "Dados fictícios: o inventário tem 4 canais e 6 itens, ou 24 células. Em 5 células havia divergência: o site dizia 6 hóspedes e o anúncio, 8; o Instagram citava café incluído, o anúncio não; o nome aparecia de duas formas. Isso mostra 5 de 24 células divergentes, cerca de 21%. O dono define a versão oficial de cada item, corrige os canais e refaz a tabela após uma semana, esperando 0 divergências. Cada novo material passa a usar a lista com nome, frase e tom."}, "erro_comum": "Atualizar o preço ou a regra em um canal e esquecer os outros. A divergência aparece só quando o hóspede reclama. Outro erro é usar tom diferente em cada rede, o que faz o espaço parecer outro lugar.", "como_ler": {"ausente": "Você nunca comparou os canais. Nome, tom, regras e promessa variam sem que ninguém saiba onde, e não há versão oficial das informações.", "parcial": "Você comparou alguns canais ou itens, mas sobraram divergências abertas, informações desatualizadas ou ausência de uma versão oficial registrada.", "comprovado": "Há inventário de todos os canais ativos, divergências corrigidas, versão oficial de nome, promessa e regras e data da última conferência."}, "verificacao": "Refaça o inventário depois de 30 dias e conte as divergências novas. Observe se as perguntas sobre regras e capacidade diminuem no atendimento. Se mudar preço ou regra, atualize todos os canais no mesmo dia para não criar um novo conflito."}, {"id": "m1q7", "por_que_importa": "As avaliações mostram o que o hóspede realmente percebeu, com palavras dele. Um elogio recorrente indica o que você deve manter e destacar. Uma crítica recorrente indica o que está custando reservas e notas. Sem agrupar por tema, você reage ao último comentário e corrige coisas pouco importantes enquanto o problema principal continua.", "como_coletar": ["Reúna as avaliações dos últimos 12 meses de todos os canais em uma planilha, uma por linha, com data, canal, nota e texto. Inclua as que não têm comentário.", "Defina temas simples, como limpeza, localização, conforto, silêncio, atendimento, custo-benefício, estrutura e fotos. Marque se cada trecho é elogio ou crítica.", "Conte quantas avaliações citam cada tema como elogio e como crítica. Calcule a participação de cada tema sobre o total de avaliações, e não só sobre as que comentam.", "Separe as críticas recorrentes entre as que você controla, como limpeza e comunicação, e as que não controla, como barulho da rua. Priorize a mais frequente e controlável.", "Escreva a ação, o responsável e o prazo, e guarde o mapa para a próxima revisão."], "exemplo": {"titulo": "Mapa de 30 avaliações", "texto": "Dados fictícios: entre 30 avaliações, 12 elogiam a localização, 9 elogiam o atendimento, 6 criticam a água quente fraca e 3 criticam barulho da rua. A soma de menções é 30, uma por avaliação. A água quente aparece em 6 de 30, ou 20%, e é controlável, enquanto o barulho aparece em 10% e depende do entorno. O dono prioriza a água quente: chama um técnico para avaliar, registra a data do reparo e passa a conferir a água na limpeza. Ele acompanha as novas avaliações."}, "erro_comum": "Dar peso à crítica mais recente ou mais dura, em vez da mais frequente. Outro erro é discutir com o hóspede em vez de entender o tema. Também é comum ignorar os elogios, que dizem o que destacar no anúncio.", "como_ler": {"ausente": "Você lê as avaliações de vez em quando, sem agrupar por tema nem contar. Não sabe quais elogios e críticas se repetem.", "parcial": "Você tem uma ideia dos principais temas, mas não contou as menções, usou poucos canais ou não separou o que é controlável do que não é.", "comprovado": "Há mapa de avaliações por tema, com contagem de elogios e críticas, uma crítica controlável priorizada e ação com responsável e prazo."}, "verificacao": "Depois da ação, compare as avaliações dos 60 dias seguintes com as anteriores e veja se a crítica tratada diminuiu. Muitas vezes, poucas avaliações novas não bastam para concluir, então continue contando. Confira se a correção não gerou outra queixa."}, {"id": "m1q8", "por_que_importa": "O hóspede decide melhor quando entende exatamente o que está comprando: o que está incluído, o que custa à parte e o que acontece se precisar cancelar. Um pacote claro reduz perguntas, evita surpresa na cobrança e permite comparar com os concorrentes. Desconto sem critério, por outro lado, reduz a receita sem ensinar nada sobre o que o hóspede valoriza.", "como_coletar": ["Escolha uma oferta que você já vende ou quer testar, como fim de semana, alta de feriado ou estadia longa, e escreva o nome e o público a quem se destina.", "Liste o que está incluído: quantidade de noites, hóspedes, café, limpeza, estacionamento e itens de recepção. Separe o que é extra, com o valor de cada um.", "Descreva as condições de cancelamento e alteração em frases curtas, com prazos e o que é devolvido. Aponte regras de pagamento e horários de entrada e saída.", "Calcule o preço total do pacote e compare com a soma dos itens vendidos separadamente. Confirme que o custo de cada item incluído cabe na margem.", "Publique a ficha da oferta com essas informações e teste o pacote sem usar desconto indiscriminado."], "exemplo": {"titulo": "Ficha de um pacote de fim de semana", "texto": "Dados fictícios: o pacote tem 2 noites para 2 pessoas por 900 reais, com café da manhã e check-out até as 14h. O custo extra desses itens é 40 reais por noite de café mais 30 de limpeza do check-out tardio, ou 110 no total. Já as 2 noites sem pacote saem por 840. A diferença de 60 reais cobre só parte dos 110 de custo, então o preço do pacote precisa ser revisto antes do teste. O dono ajusta o valor para 960 e confere de novo a conta, em vez de oferecer um desconto."}, "erro_comum": "Dar desconto como resposta automática para qualquer baixa de procura. O desconto atrai hóspede sensível a preço, reduz a margem e não diz o que as pessoas valorizam. Outro erro é esconder taxas na etapa final.", "como_ler": {"ausente": "Você vende apenas a diária e as condições mudam conforme a conversa. Não existe ficha com itens incluídos, extras e cancelamento.", "parcial": "Há pacote ou combinação, mas faltam itens, extras ou regras de cancelamento por escrito, ou o custo dos itens incluídos nunca foi calculado.", "comprovado": "Existe ficha da oferta com itens incluídos, extras, cancelamento, preço total e custo dos itens conferido, publicada e usada nos canais."}, "verificacao": "Compare as reservas do pacote com as do mesmo período do ano anterior ou do mês equivalente, e calcule se a contribuição por noite se manteve. Se as reservas subirem e a margem cair, o pacote custa mais do que traz e deve ser ajustado."}, {"id": "m1q9", "por_que_importa": "Mudar o anúncio sem medir é adivinhar. A taxa de conversão mostra quantas visitas viram reserva e permite saber se uma mudança ajudou. Ela só vale quando visitas e reservas são do mesmo canal e do mesmo período. Sem esse número, uma boa semana de feriado pode parecer prova de que o novo título funcionou.", "como_coletar": ["Escolha um canal que informe visitas ao anúncio, como o painel do canal ou do site, e defina o período, por exemplo os últimos 30 dias.", "Anote o número de visitas e de reservas confirmadas, sem cancelamentos, desse mesmo canal e período. Não misture com reservas que vieram por indicação ou WhatsApp.", "Divida as reservas pelas visitas e multiplique por 100. Se o canal não informa visitas, marque não sei e use a medida mais próxima disponível, como cliques ou consultas.", "Escolha uma única variável para mudar por vez, como o título, a foto principal ou o pacote, e registre a data. Mantenha o mesmo período de comparação.", "Registre os números na Calculadora de Posicionamento, antes e depois, e guarde a conclusão no diário de testes."], "exemplo": {"titulo": "Conversão antes e depois do título", "texto": "Dados fictícios: nos 30 dias antes da mudança, o anúncio teve 400 visitas e 8 reservas: 8 ÷ 400 = 2%. Depois de trocar apenas o título, nos 30 dias seguintes foram 420 visitas e 12 reservas: 12 ÷ 420 = 2,86%, cerca de 2,9%. A diferença é de 0,86 ponto percentual, mas os dois períodos têm poucas reservas e o segundo incluiu um feriado. O dono não conclui ainda: repete o teste em um período equivalente para ver se a diferença se mantém."}, "erro_comum": "Comparar períodos diferentes, misturar canais ou mudar título, fotos e preço ao mesmo tempo. Assim é impossível saber o que causou a mudança. Outro erro é concluir com poucas reservas, quando a variação pode ser acaso.", "como_ler": {"ausente": "Você não registra visitas nem reservas por canal e não sabe sua taxa de conversão. As mudanças são feitas sem medir o antes e o depois.", "parcial": "Você registra reservas, mas não visitas, ou mistura canais e períodos, ou muda mais de uma variável de uma vez, o que impede concluir.", "comprovado": "Há registro de visitas e reservas do mesmo canal e período, taxa de conversão calculada e um teste com uma variável por vez."}, "verificacao": "Compare períodos equivalentes e anote eventos externos, como feriado ou obra. Só considere uma mudança confirmada quando a diferença se repetir em outro período. Confira também se a margem por reserva se manteve, para não ganhar conversão perdendo contribuição."}, {"id": "m1q10", "por_que_importa": "Quem não registra o que testou repete os mesmos testes, esquece o que funcionou e discute de memória. O diário de testes transforma tentativas soltas em conhecimento da sua hospedagem. Ele mostra o que mudou, quando, com que resultado e o que mais acontecia no período, para você manter só o que a evidência sustenta e abandonar o resto sem culpa.", "como_coletar": ["Crie uma planilha ou caderno com colunas fixas: data, o que mudou, motivo, canal, período de comparação, resultado, eventos externos e decisão.", "Registre cada mudança já feita neste módulo, mesmo as antigas, com a melhor data que você conseguir confirmar em mensagens, e-mails ou no histórico do canal.", "Para cada teste, anote o número antes e o número depois no período equivalente. Escreva também o que mais mudou, como feriado, obra, nova avaliação ou queda de preço de concorrente.", "Decida entre manter, repetir ou desfazer a mudança e justifique em uma frase. Inclua desconhecido quando faltar dado: não preencha com zero.", "Reserve um momento fixo por mês, de 30 minutos, para revisar o diário e escolher o próximo teste."], "exemplo": {"titulo": "Três linhas de um diário de testes", "texto": "Dados fictícios: linha 1, título novo, conversão de 2,0% para 2,9%, com feriado no segundo período, decisão repetir. Linha 2, fotos reordenadas, visitas de 400 para 440, sem evento externo, decisão manter. Linha 3, pacote de fim de semana, 3 reservas contra 2, com poucas reservas para concluir, decisão repetir. De três testes, um foi mantido e dois seguem em observação. O diário também mostra que dois testes foram feitos juntos, e o dono passa a testar uma coisa por vez."}, "erro_comum": "Anotar só os testes que deram certo ou confiar na memória. Sem o registro dos que falharam, você os repete. Outro erro é esquecer de anotar eventos externos e atribuir à mudança um resultado que veio do calendário.", "como_ler": {"ausente": "Você não tem registro. As mudanças são lembradas de cabeça e ninguém sabe dizer o que foi testado, quando e com qual resultado.", "parcial": "Há anotações soltas, mas sem período de comparação, sem eventos externos ou sem decisão registrada, ou só com os testes que funcionaram.", "comprovado": "Existe diário com data, mudança, resultado, período equivalente, eventos externos e decisão, revisado em rotina mensal."}, "verificacao": "Na revisão mensal, confira se cada decisão de manter tem evidência em dois períodos ou mais. Se uma mudança mantida piorar no período seguinte, reabra o teste. Verifique ainda se o diário está sendo usado de fato para escolher o próximo passo."}], "fechamento": {"resumo": "Identidade é a ponte entre o que você promete e o que o hóspede percebe. Neste módulo, você conferiu para quem a hospedagem é, como ela se compara, o que promete, como se mostra em fotos e texto, como se comunica nos canais, o que dizem as avaliações, o que o pacote inclui e se isso converte em reservas. O mais importante é escolher uma ação por lacuna, testar uma variável por vez e registrar o que aprender. Assim, cada mudança tem evidência atrás dela.", "glossario": [{"termo": "Segmento", "definicao": "Grupo de hóspedes com o mesmo motivo de viagem, como lazer, comemoração ou trabalho."}, {"termo": "Proposta de valor", "definicao": "Frase que diz para quem é o espaço, que experiência entrega e qual diferencial pode ser provado."}, {"termo": "Preço total", "definicao": "Valor final da estadia, com taxas de limpeza, serviço e extras obrigatórios, usado para comparar com concorrentes."}, {"termo": "Taxa de conversão", "definicao": "Reservas divididas pelas visitas ao anúncio, no mesmo canal e período, em porcentagem."}, {"termo": "Diário de testes", "definicao": "Registro de cada mudança com data, resultado, período de comparação, eventos externos e decisão."}], "limites": "Este módulo ajuda a organizar sua análise, mas não substitui consultoria profissional, pesquisa de mercado formal ou auditoria. Os exemplos usam dados fictícios e não indicam resultados esperados. Mudar fotos, textos, pacotes ou preços pode ajudar, mas não garante reservas, ocupação ou renda. Valide cada mudança com seus próprios números e, quando houver dúvida sobre regras, procure o profissional adequado."}}, "2": {"modulo": 2, "titulo": "Por que seu calendário está vazio?", "subtitulo": "Guia para entender noites, canais, preço e atendimento antes de mudar qualquer coisa", "abertura": {"para_que_serve": "Calendário vazio quase nunca tem uma única causa. Pode ser pouca demanda, mas também pode ser bloqueio esquecido, canal caro, estadia mínima que impede a venda, preço fora do que o hóspede compara ou consulta que ficou sem resposta. Este guia ajuda você a separar essas hipóteses com dados do seu próprio negócio, antes de gastar com anúncio, reforma ou desconto. Você vai medir inventário, ocupação, sazonalidade, canais, receita líquida, antecedência de compra, regras, preço, atendimento e testes, sempre no mesmo período e sem misturar números.", "tenha_em_maos": ["Calendários e extratos de reservas de todos os canais, do período escolhido", "Lista de bloqueios, com motivo e datas", "Comissões, taxas e gastos de divulgação de cada canal", "Histórico de consultas e mensagens recebidas", "Preços praticados e preços totais de hospedagens comparáveis"], "como_trabalhar": "Defina um período fechado, por exemplo os últimos três meses, e use o mesmo período em todas as respostas. Use só dados que você consegue comprovar com extrato, calendário ou registro. Desconhecido não é zero: se não souber, marque não sei e organize a coleta. O diagnóstico é orientativo, mostra onde olhar primeiro e não substitui auditoria nem análise de um profissional."}, "perguntas": [{"id": "m2q1", "por_que_importa": "Toda taxa de ocupação depende do número de noites disponíveis. Se você conta bloqueios como noites à venda, a ocupação parece menor do que é. Se esquece bloqueios que ainda existem, parece maior. Sem esse número certo, qualquer decisão sobre preço ou divulgação parte de uma base errada. Por isso o inventário vem primeiro: ele é o denominador de quase todas as contas deste módulo.", "como_coletar": ["Escolha um mês fechado e liste todas as unidades que poderiam receber hóspedes nele, mesmo as que estavam vazias o mês inteiro.", "Multiplique o número de unidades pelos dias do mês. Esse é o total de unidades-noite, antes de qualquer desconto.", "Abra o calendário de cada canal e anote cada bloqueio com data, unidade e motivo: manutenção, uso pessoal, reforma ou esquecimento.", "Confira se cada bloqueio ainda faz sentido. Bloqueio sem motivo claro deve ser investigado e, se for indevido, liberado.", "Calcule noites disponíveis como unidades vezes dias menos bloqueios. Registre os números na Calculadora de Ocupação e Canais."], "exemplo": {"titulo": "Bloqueio esquecido muda a ocupação", "texto": "Dados fictícios: uma pousada tem 4 unidades em um mês de 30 dias, ou seja, 120 unidades-noite. O calendário mostra 12 noites bloqueadas: 4 de manutenção, 3 de uso pessoal e 5 sem motivo, esquecidas em um canal. Disponíveis contando tudo: 120 menos 12 dá 108, e com 62 noites vendidas a ocupação é 62 dividido por 108, cerca de 57,4%. Depois de liberar as 5 noites indevidas, os bloqueios reais são 7 e as disponíveis passam a 113. A ocupação vira 62 dividido por 113, cerca de 54,9%. A diferença mostra que havia noites à venda que ninguém conseguia comprar."}, "erro_comum": "Tratar o calendário como se todo dia vazio fosse noite à venda, ou o oposto: deixar bloqueios antigos acumulados sem revisar. Outro erro é bloquear uma unidade em um canal e esquecer de liberar quando o motivo acabou.", "como_ler": {"ausente": "Você não sabe quantas noites estavam abertas à venda e não separa bloqueios de noites vazias. A ocupação, se existir, é estimada de cabeça.", "parcial": "Você conta unidades e dias, mas os bloqueios aparecem misturados, sem motivo ou só em alguns canais. O número de disponíveis tem margem de erro.", "comprovado": "Existe inventário mensal com unidades, dias, bloqueios separados por motivo e noites disponíveis, conferido nos calendários de todos os canais."}, "verificacao": "Compare o inventário do mês com o calendário de cada canal e confira se os totais batem. Depois de liberar bloqueios indevidos, acompanhe nas semanas seguintes se as noites liberadas receberam consultas ou reservas e se não surgiram reservas duplicadas ou conflitos de data."}, {"id": "m2q2", "por_que_importa": "Noites vendidas divididas por noites disponíveis mostram quanto do que você oferece realmente é comprado. Sem esse número mensal, você só sente que está vazio. Com ele, você enxerga em quais períodos e dias a venda falha e evita decidir por impressão. Registrar todo mês também cria histórico, e é o histórico que permite comparar períodos com justiça mais adiante.", "como_coletar": ["Usando o mesmo mês do inventário, some as noites realmente vendidas. Conte cada noite de cada unidade uma única vez.", "Retire cancelamentos e reservas que não aconteceram. Mantenha só noites efetivamente vendidas ou confirmadas para o período.", "Divida noites vendidas por noites disponíveis, no mesmo período e no mesmo conjunto de unidades. Acima de 100% indica dado inconsistente.", "Repita a conta separando noites de fim de semana e noites de dias úteis, cada uma com o seu próprio total de disponíveis.", "Registre os resultados mensais na Calculadora de Ocupação e Canais e guarde a planilha para comparar com os próximos meses."], "exemplo": {"titulo": "Ocupação geral esconde o fim de semana", "texto": "Dados fictícios: uma casa com 3 unidades tem, em um mês de 31 dias, 93 unidades-noite e 3 bloqueios em dias úteis, o que dá 90 disponíveis. Foram vendidas 54 noites, então a ocupação geral é 54 dividido por 90, ou 60%. Separando: fins de semana têm 24 noites disponíveis e 22 vendidas, cerca de 91,7%. Dias úteis têm 66 disponíveis e 32 vendidas, cerca de 48,5%. A soma fecha: 24 mais 66 dá 90, e 22 mais 32 dá 54. O problema está nos dias úteis, não no mês inteiro."}, "erro_comum": "Dividir pelo total de dias do mês sem descontar bloqueios, ou somar reservas em vez de noites. Uma reserva de cinco noites conta cinco vezes. Também é comum olhar só a média e não perceber que um tipo de dia está lotado e outro vazio.", "como_ler": {"ausente": "Você não sabe quantas noites vendeu em cada mês. A sensação de calendário cheio ou vazio é a única referência que você usa.", "parcial": "Você conta reservas ou noites, mas em períodos diferentes, sem separar bloqueios ou sem dividir por disponíveis. O resultado aparece, mas não é comparável.", "comprovado": "Você tem ocupação mensal calculada com noites vendidas e disponíveis do mesmo período, com recorte de fim de semana e dias úteis."}, "verificacao": "Confira se noites vendidas nunca passam das disponíveis e se o total geral é a soma dos recortes. Compare a ocupação de cada tipo de dia mês a mês, e só tire conclusões depois de pelo menos três meses de registro consistente."}, {"id": "m2q3", "por_que_importa": "Um mês só faz sentido quando comparado com o equivalente: janeiro com janeiro, feriado com feriado. Comparar fevereiro com janeiro pode assustar ou enganar. Um calendário anual mostra seus períodos fortes e fracos e dá tempo para preparar a divulgação antes da baixa. Registrar os 12 meses também ajuda a perceber padrões que a memória costuma apagar, como um mês fraco que se repete.", "como_coletar": ["Monte uma tabela com os 12 meses nas linhas e, nas colunas, noites disponíveis, noites vendidas e ocupação de cada mês.", "Acrescente uma coluna com eventos e feriados locais que mexem na procura, como festas da cidade, feriados prolongados e férias escolares, conferidos em calendários oficiais.", "Acrescente o preço médio praticado em cada mês, calculado como receita de hospedagem dividida por noites vendidas, para ver se o preço acompanhou a procura.", "Compare cada mês com o mesmo mês do ano anterior, se houver histórico, e marque diferenças que podem vir de feriado trocado de mês.", "Marque os meses fracos e a data para começar a preparar divulgação. Registre os números na Calculadora de Ocupação e Canais."], "exemplo": {"titulo": "Comparar fevereiro com fevereiro", "texto": "Dados fictícios: uma pousada com 3 unidades tem 84 noites disponíveis em fevereiro de 28 dias. Neste ano vendeu 42 noites, ocupação de 50%. No fevereiro do ano passado vendeu 50, ocupação de 50 dividido por 84, cerca de 59,5%. À primeira vista parece queda. Ao olhar o calendário de eventos, o feriado prolongado que caiu em fevereiro no ano passado caiu em março neste ano. A comparação justa inclui março dos dois anos, e a decisão muda: em vez de baixar preço, vale preparar a divulgação para o feriado que mudou de lugar."}, "erro_comum": "Comparar um mês com o anterior e concluir que a procura caiu, sem considerar feriados, férias e eventos que mudam de data de um ano para o outro. Também é comum guardar só ocupação e esquecer o preço do período.", "como_ler": {"ausente": "Você não tem os meses organizados lado a lado e compara de memória ou apenas com o mês anterior. Eventos e feriados não aparecem no seu registro.", "parcial": "Você tem parte dos meses registrados ou só a ocupação, sem eventos e preços. A comparação com o mesmo mês do ano anterior é rara ou incompleta.", "comprovado": "Existe um calendário anual com ocupação, eventos e preço por mês, comparado ao mesmo mês anterior, com meses fracos marcados e data de preparação definida."}, "verificacao": "Quando houver ações para a baixa temporada, compare a ocupação daquele mês com o mesmo mês do ano anterior, ajustando por feriados e eventos. Confira também se a ação não reduziu a contribuição por noite, e só repita o que mostrou resultado."}, {"id": "m2q4", "por_que_importa": "Se você não sabe de onde vêm as reservas, não sabe quais canais sustentam o negócio nem quais só parecem importantes. Conhecer a participação de cada canal mostra dependência, ajuda a negociar e evita cortar um canal que traz hóspedes que você não conseguiria de outro jeito. Também ajuda a perceber se você depende de um único canal e o que aconteceria se as regras dele mudassem.", "como_coletar": ["Reúna os extratos ou listas de reservas de cada canal: plataformas, site próprio, mensagens diretas, telefone e indicações. Use o mesmo período para todos.", "Padronize uma tabela com data da reserva, data de chegada, noites, valor e canal. Preencha uma linha por reserva, nunca por noite.", "Procure duplicidades: a mesma reserva que aparece em dois canais por sincronização de calendário, ou lançada duas vezes à mão. Remova uma das linhas.", "Para reservas sem origem clara, pergunte ao hóspede ou marque como origem desconhecida. Desconhecido não é zero e não deve ser empurrado para o direto.", "Calcule a participação de cada canal em reservas e em noites. Registre os números na Calculadora de Ocupação e Canais."], "exemplo": {"titulo": "Reserva duplicada distorce a conta", "texto": "Dados fictícios: a planilha de um mês tem 42 linhas de reservas. Ao conferir, 2 são a mesma reserva lançada em dois canais, então o correto é 40 reservas. Por canal: direto 12, plataforma A 20 e plataforma B 8, somando 40. A participação fica em 30% direto, 50% plataforma A e 20% plataforma B. Sem a limpeza, o total seria 42 e as porcentagens sairiam erradas. Com a conta certa, o dono vê que metade das reservas depende de uma única plataforma e decide como proteger essa fonte."}, "erro_comum": "Somar reservas de cada canal sem conferir duplicidade, ou classificar toda reserva sem origem como direta. Também é comum olhar só o número de reservas e esquecer que um canal pode trazer estadias mais curtas ou mais longas.", "como_ler": {"ausente": "Você não registra a origem das reservas. Quando alguém pergunta de onde vêm os hóspedes, a resposta é uma impressão, sem número.", "parcial": "Você conhece a origem de parte das reservas ou de alguns canais, mas há reservas sem origem, duplicidades não conferidas ou períodos diferentes entre canais.", "comprovado": "Existe uma tabela por canal, com um período único, sem duplicidade e com reservas de origem desconhecida identificadas à parte."}, "verificacao": "Compare o total de reservas da tabela com o total dos extratos, canal por canal, e confirme que nenhuma reserva aparece duas vezes. Refaça a participação todo mês e observe se mudanças de preço ou divulgação alteram a distribuição, sem prejudicar a ocupação total."}, {"id": "m2q5", "por_que_importa": "A receita bruta de um canal engana. O que fica depois de comissão e custo de divulgação é o que paga a operação. Um canal com comissão alta pode ainda valer a pena pela demanda que traz, e um canal sem comissão pode ter custos escondidos. Só a conta mostra.", "como_coletar": ["Pegue a receita bruta de hospedagem de cada canal no período, a partir dos extratos e do que o hóspede pagou de diária.", "Registre a comissão cobrada em cada reserva, conforme o extrato do canal, e some por canal. Se houver taxa de pagamento própria, anote à parte.", "Some os custos de aquisição que você consegue atribuir ao canal: anúncios, taxas do meio de pagamento, ferramenta de reservas, comissão de parceiros.", "Calcule receita líquida do canal como receita bruta menos comissão menos custo de aquisição atribuível. Calcule também a porcentagem que sobra da bruta.", "Registre os valores na Calculadora de Ocupação e Canais e compare os canais por receita líquida, sem esquecer a ocupação que cada um traz."], "exemplo": {"titulo": "O canal direto também tem custo", "texto": "Dados fictícios: no mês, a plataforma A vendeu R$ 10.000 brutos e cobrou R$ 1.500 de comissão, sem outro custo atribuível, então a receita líquida é 10.000 menos 1.500, ou R$ 8.500, 85% da bruta. O canal direto vendeu R$ 6.000 brutos, sem comissão, mas teve R$ 600 de anúncios e R$ 180 de taxa de pagamento, somando R$ 780. A receita líquida é 6.000 menos 780, ou R$ 5.220, 87% da bruta. O direto sobra um pouco mais por real vendido, mas a plataforma A traz bem mais volume."}, "erro_comum": "Achar que reserva direta é de graça e esquecer anúncios, taxas de pagamento e tempo de atendimento. O erro oposto é cortar um canal só porque a comissão parece alta, sem medir quantas noites ele traz que você não venderia de outro jeito.", "como_ler": {"ausente": "Você olha só a receita bruta ou o valor depositado, sem separar comissão e custo de aquisição. Não sabe quanto sobra de cada canal.", "parcial": "Você conhece a comissão dos principais canais, mas não soma custos de aquisição, ou calcula só para alguns canais, ou mistura períodos diferentes.", "comprovado": "Você tem receita líquida por canal, com bruta, comissão e custo de aquisição atribuível documentados em extratos e notas, no mesmo período."}, "verificacao": "Confira se a soma das receitas brutas dos canais bate com a receita de hospedagem total. Ao rever um canal caro, compare por três meses a ocupação total e a receita líquida somada, para ver se a mudança não derrubou a demanda útil."}, {"id": "m2q6", "por_que_importa": "Se a maioria das pessoas reserva com poucos dias de antecedência, uma oferta lançada com dois meses de folga pode passar despercebida, e uma lançada em cima da hora chega tarde. Conhecer a janela de compra ajuda a escolher o momento certo de divulgar. Essa informação também ajuda a decidir quando abrir datas novas no calendário e quando reforçar mensagens de última hora.", "como_coletar": ["Liste as reservas do período com a data em que foram feitas e a data de chegada. Use a data de criação da reserva, não a de pagamento.", "Calcule, para cada reserva, quantos dias existem entre a data da reserva e a data de chegada, contando os dias do calendário.", "Ordene os números do menor para o maior e pegue o valor do meio. Esse valor é a mediana. Com quantidade par, use a média dos dois do meio.", "Separe por segmento quando houver volume: fim de semana e dias úteis, feriados, estadias curtas e longas. Cada grupo pode ter janela diferente.", "Registre as janelas na Calculadora de Ocupação e Canais e anote o menor número de reservas que sustenta cada resultado."], "exemplo": {"titulo": "Mediana e média contam histórias diferentes", "texto": "Dados fictícios: sete reservas de um mês tiveram antecedência de 3, 5, 9, 14, 20, 30 e 45 dias. Em ordem, o valor do meio é o quarto: 14 dias, que é a mediana. A média seria a soma, 126, dividida por 7, ou 18 dias, puxada pelas reservas mais distantes. Metade das reservas aconteceu com até 14 dias de antecedência. A decisão possível é publicar a oferta de uma data com pelo menos três semanas de folga, para alcançar quem decide com 14 dias ou mais. Com apenas sete reservas, trate o resultado como pista, não como regra."}, "erro_comum": "Usar a média em vez da mediana e deixar uma reserva muito antecipada distorcer o resultado. Outro erro é calcular a janela com poucas reservas e tratá-la como regra, ou misturar feriado e dia comum no mesmo cálculo.", "como_ler": {"ausente": "Você não sabe com quanta antecedência as pessoas reservam e divulga sempre no mesmo momento, sem relação com o comportamento dos hóspedes.", "parcial": "Você tem uma noção geral da antecedência, ou calcula a média sem separar tipos de estadia, ou usa poucas reservas para sustentar a conclusão.", "comprovado": "Você calcula a mediana de dias entre reserva e chegada, por segmento quando há volume, e usa o resultado para definir quando lançar ofertas."}, "verificacao": "Depois de ajustar o momento da oferta, compare as reservas feitas para as datas seguintes com as datas anteriores, no mesmo tipo de período. Confira se a janela observada mudou e se a mudança de calendário não trouxe só reservas de menor valor."}, {"id": "m2q7", "por_que_importa": "Estadia mínima protege você de reservas curtas que dão muito trabalho, mas também pode deixar noites soltas entre duas reservas sem possibilidade de venda. Revisar a regra com datas concretas mostra quanto você está deixando de vender e se vale testar algo diferente. A regra certa depende da sua operação, da equipe de limpeza e do tipo de hóspede, e por isso precisa ser testada, não copiada.", "como_coletar": ["Abra o calendário dos últimos meses e procure intervalos livres entre duas reservas que sejam menores que a estadia mínima exigida.", "Para cada intervalo, anote unidade, datas, número de noites livres e a regra de estadia mínima que valia naquele dia.", "Verifique no histórico de consultas se alguém perguntou por essas datas e desistiu por causa da regra, quando a informação estiver registrada.", "Calcule a contribuição possível: noites do intervalo multiplicadas pela diária menos o custo variável por noite, para saber o ganho potencial.", "Escolha poucas datas para testar uma regra mais flexível e anote como a limpeza e a operação ficam. Defina quando o teste termina."], "exemplo": {"titulo": "Quatro lacunas de duas noites", "texto": "Dados fictícios: duas unidades têm 60 noites disponíveis no mês, e a estadia mínima é de 3 noites. O calendário mostra 4 lacunas de 2 noites entre reservas, 8 noites que a regra impede de vender. A diária é R$ 300 e o custo variável por noite é R$ 90, então cada noite vendida deixa R$ 210. O dono testa estadia mínima de 2 noites só nessas datas e vende 2 lacunas, ou 4 noites. A contribuição é 4 vezes 210, ou R$ 840. As outras 2 lacunas continuam abertas e o teste segue por mais um mês."}, "erro_comum": "Manter a mesma regra o ano todo por costume, ou o oposto: derrubar a estadia mínima em todas as datas de uma vez. A mudança sem teste pode encher o calendário de estadias curtas que custam mais para limpar e atender.", "como_ler": {"ausente": "Você não sabe se a regra de estadia mínima deixa noites sem venda. A regra foi definida no começo e nunca foi revisada com dados.", "parcial": "Você percebe lacunas no calendário, mas não as lista nem calcula o que poderia ganhar. As regras mudam por sensação, sem data de teste.", "comprovado": "Existe lista de lacunas com datas, regras em vigor e contribuição potencial, e há testes planejados em datas selecionadas, com início e fim."}, "verificacao": "Compare, nas datas testadas e em datas parecidas sem teste, as noites vendidas e a contribuição por noite. Confira também o custo de limpeza e o esforço da equipe, e volte à regra anterior se o ganho não cobrir o custo extra."}, {"id": "m2q8", "por_que_importa": "Mudar o preço por palpite pode custar caro: baixar demais corrói a margem, e manter alto demais deixa a noite vazia. Comparar ocupação futura com o preço total de hospedagens parecidas dá uma base para testar mudanças pequenas e medir o que acontece. O objetivo não é ser o mais barato, e sim vender noites que fazem sentido para a sua margem e para a experiência que você entrega.", "como_coletar": ["Escolha datas futuras e anote quantas unidades já estão reservadas para elas e quantas ainda estão livres. Isso é a ocupação futura.", "Pesquise o preço total de hospedagens comparáveis para as mesmas datas, incluindo taxas de limpeza e serviço, do jeito que o hóspede vê. Anote a data da consulta.", "Compare seu preço total com os comparáveis considerando o que cada um entrega: tamanho, localização, comodidades, avaliações e regras. Evite comparar itens muito diferentes.", "Defina um ajuste pequeno e limitado, uma data de início e fim e o piso abaixo do qual você não vende, conferido com o custo variável.", "Registre cada mudança em um histórico de preços, com data, valor anterior, valor novo e resultado de consultas e reservas."], "exemplo": {"titulo": "Quanto precisa vender a mais?", "texto": "Dados fictícios: faltam 14 dias para um sábado e 3 de 10 quartos estão reservados. Comparáveis cobram de R$ 380 a R$ 420 no total, e o preço do dono é R$ 450, com custo variável de R$ 100 por noite. Cada noite vendida a 450 deixa 350, então 3 noites rendem R$ 1.050. Baixando para R$ 420, cada noite deixa 320. Para superar 1.050 são necessárias 4 noites, que somam R$ 1.280, pois 3 noites dariam só R$ 960. O dono testa por duas semanas e confere se a quarta noite aparece."}, "erro_comum": "Copiar o preço do concorrente sem comparar o que cada hospedagem entrega, ou baixar o preço sem calcular quantas noites a mais são necessárias para compensar. Também é comum esquecer de registrar a mudança e não conseguir avaliar depois.", "como_ler": {"ausente": "Você muda preço por impulso ou mantém o mesmo valor o ano todo. Não há registro de ocupação futura nem comparação com outras hospedagens.", "parcial": "Você olha preços de outras hospedagens de vez em quando, mas não compara o preço total nem registra as mudanças. Os ajustes são feitos sem limite e sem data de revisão.", "comprovado": "Existe histórico de preços ligado à ocupação futura e a comparáveis, com ajustes pequenos, limites definidos e conta de quantas noites extras pagam a mudança."}, "verificacao": "Ao fim do teste, compare noites vendidas, diária realizada e contribuição total das datas ajustadas com datas parecidas sem ajuste. Se a contribuição caiu, volte ao preço anterior. Confira também se as avaliações e o perfil dos hóspedes não mudaram de forma negativa."}, {"id": "m2q9", "por_que_importa": "Parte do calendário vazio pode vir de quem perguntou e não reservou. Se você não registra consultas, não sabe se perdeu por preço, por data indisponível ou por demora na resposta. Registrar esses casos mostra onde uma resposta melhor pode fazer diferença. Muitas vezes a perda está na resposta, e não no preço ou no produto, e essa é uma das correções mais baratas de testar.", "como_coletar": ["Reúna as consultas do período em todos os canais: mensagens de plataformas, WhatsApp, e-mail, redes sociais e telefone. Use uma tabela, com uma linha por consulta.", "Para cada consulta, anote data e hora em que chegou, data e hora da primeira resposta, datas pedidas, número de pessoas e se virou reserva.", "Calcule o tempo até a primeira resposta de cada consulta e veja quais passaram de um limite que você definiu, como 24 horas.", "Quando o hóspede informar por que não reservou, registre o motivo em poucas categorias: preço, data, regra, localização, sem resposta, outro.", "Calcule quantas consultas viraram reserva e quantas se perderam em cada categoria. Marque os motivos desconhecidos à parte."], "exemplo": {"titulo": "Vinte e cinco consultas, dez reservas", "texto": "Dados fictícios: em um mês chegaram 25 consultas e 10 viraram reserva, o que dá 10 dividido por 25, ou 40%. As outras 15 se perderam: 6 foram respondidas depois de 24 horas, 5 desistiram por causa do preço e 4 não deram motivo. A soma fecha, pois 6 mais 5 mais 4 dá 15. O motivo mais frequente foi a demora, e não o preço. A ação possível é preparar respostas prontas para as perguntas mais comuns e testar responder em até 2 horas durante o próximo mês."}, "erro_comum": "Registrar só quem reservou e perder de vista quem perguntou. Outro erro é supor que toda desistência foi por preço, sem olhar o tempo de resposta. Também é comum guardar as conversas em vários aplicativos sem juntar os números.", "como_ler": {"ausente": "Você não registra consultas que não viraram reserva e não sabe quanto tempo leva para responder. Só vê as reservas que deram certo.", "parcial": "Você guarda algumas conversas ou lembra de casos marcantes, mas não mede tempo de resposta nem organiza os motivos de perda. O registro cobre só um canal.", "comprovado": "Existe registro de consultas com horário de chegada, tempo de resposta, resultado e motivo de perda quando informado, reunindo os canais usados."}, "verificacao": "Depois de criar respostas prontas e metas de tempo, compare por pelo menos um mês o tempo de resposta e a proporção de consultas que viram reserva. Confira também se a equipe consegue manter a rapidez sem prejudicar a qualidade do atendimento."}, {"id": "m2q10", "por_que_importa": "Uma ação pode parecer boa porque a receita subiu e ainda assim reduzir o que sobra. Medir o resultado comercial com a mesma régua antes e depois evita manter mudanças que enchem o calendário mas não ajudam o negócio. Também evita concluir algo por efeito de temporada. Um bom teste tem começo, fim, indicador definido e decisão registrada, para que a experiência vire aprendizado e não opinião.", "como_coletar": ["Antes de mudar qualquer coisa, escreva o que será testado, a data de início, a data de fim e qual indicador vai julgar o resultado.", "Registre no período anterior as noites disponíveis, as noites vendidas, a receita de hospedagem e o custo variável por noite vendida.", "Registre os mesmos dados no período do teste, com as mesmas unidades e o mesmo número de dias, ou ajuste a comparação para refletir a diferença.", "Calcule receita por noite disponível, diária realizada e contribuição total nos dois períodos. Compare também com o mesmo período do ano anterior, quando houver.", "Escreva a decisão: manter, ajustar ou interromper, com data. Guarde o relatório do teste para consultar nas próximas mudanças."], "exemplo": {"titulo": "Receita subiu, contribuição caiu", "texto": "Dados fictícios: 4 unidades por 28 dias dão 112 noites disponíveis. Antes da promoção foram vendidas 56 noites a R$ 300, receita de R$ 16.800 e receita por noite disponível de R$ 150. Com a promoção foram 70 noites a R$ 256, receita de R$ 17.920 e R$ 160 por noite disponível. Com custo variável de R$ 100, a contribuição antes foi 56 vezes 200, ou R$ 11.200. Depois foi 70 vezes 156, ou R$ 10.920. A receita subiu, mas a contribuição caiu. Se a temporada for parecida nos dois períodos, a decisão é interromper."}, "erro_comum": "Julgar o teste só pela receita ou pela ocupação, sem descontar o custo variável, e esquecer que o período seguinte pode ter outra demanda por feriado ou estação. Também é comum mudar várias coisas ao mesmo tempo e não saber o que funcionou.", "como_ler": {"ausente": "Você muda preço, regras ou divulgação sem registrar o antes e o depois. Não há relatório, e a avaliação é feita pela sensação do mês.", "parcial": "Você compara receita ou ocupação antes e depois, mas sem custo variável, sem considerar a temporada ou mudando várias coisas ao mesmo tempo.", "comprovado": "Existe relatório de teste com período, indicador, comparação de receita por noite disponível e contribuição, cuidado com a temporada e decisão registrada."}, "verificacao": "Depois de manter ou interromper a mudança, acompanhe por mais um período a receita por noite disponível e a contribuição total. Confira se os resultados se mantêm fora do teste e se avaliações e atendimento não pioraram por causa da mudança."}], "fechamento": {"resumo": "Calendário vazio é um sintoma, e o diagnóstico começa pelo básico: saber quantas noites estavam realmente à venda, quantas foram vendidas e em quais dias, meses e canais. Depois vêm a receita líquida de cada canal, a antecedência de compra, as regras de estadia, o preço comparado e as consultas que não viraram reserva. Cada resposta indica onde agir primeiro. Antes de mudar algo, defina o indicador, o período e a data de revisão, e interrompa o que reduzir a contribuição por noite.", "glossario": [{"termo": "Noites disponíveis", "definicao": "Unidades multiplicadas por dias do período, menos os bloqueios."}, {"termo": "Ocupação", "definicao": "Noites vendidas divididas por noites disponíveis, no mesmo período."}, {"termo": "Receita líquida do canal", "definicao": "Receita bruta menos comissão e custo de aquisição atribuível ao canal."}, {"termo": "Janela de compra", "definicao": "Mediana dos dias entre a data da reserva e a data de chegada."}, {"termo": "Contribuição por noite", "definicao": "Diária realizada menos o custo variável por noite vendida."}, {"termo": "Estadia mínima", "definicao": "Número menor de noites que uma reserva precisa ter para ser aceita."}], "limites": "Este módulo organiza dados e ajuda a fazer perguntas melhores. Ele não substitui auditoria, consultoria de preços, contabilidade ou análise de um profissional, e não garante reservas, ocupação, receita ou lucro. Os exemplos usam dados fictícios e servem para treinar o raciocínio. Decida sempre com os números do seu negócio."}}, "3": {"modulo": 3, "titulo": "Sua diária vale mais?", "subtitulo": "Como medir a experiência do hóspede e a diária que ela sustenta", "abertura": {"para_que_serve": "Este guia ajuda você a olhar a hospedagem com os olhos de quem chega, dorme e vai embora. Você vai mapear a jornada, testar o acesso, inspecionar o conforto, conferir se a privacidade anunciada é real, avaliar atividades, alimentos e extras, aprender com as avaliações e, por fim, calcular a diária realizada e o RevPAR. A ideia é separar o que o hóspede percebe do que você apenas acredita, para decidir com evidência onde corrigir primeiro e se a diária cobrada tem sustentação.", "tenha_em_maos": ["Mensagens e e-mails enviados ao hóspede, da reserva ao pós-estadia", "Avaliações e comentários recebidos no período", "Receita de hospedagem, noites vendidas e noites disponíveis do mês", "Lista de extras e atividades oferecidos, com custos e fornecedores", "Receitas e custos de alimentos, se você os serve", "Fotos ou anotações da última inspeção da unidade"], "como_trabalhar": "Defina um período, por exemplo o último mês fechado, e use só dados que você consegue mostrar. Teste de verdade: faça a chegada como visitante e inspecione a unidade com um checklist. Quando não souber um número, marque não sei e organize a coleta; desconhecido não é zero. O resultado é um diagnóstico orientativo para priorizar ações. Ele não é auditoria nem garante resultado."}, "perguntas": [{"id": "m3q1", "por_que_importa": "A experiência não começa na porteira e não termina no check-out. O hóspede pesquisa, reserva, recebe mensagens, viaja, chega, dorme, sai e depois avalia. Quando você só olha a estadia, os atritos escondidos nas outras etapas passam batido. O mapa da jornada mostra onde a pessoa hesita, pergunta ou se frustra, e ajuda a corrigir primeiro o ponto que mais pesa.", "como_coletar": ["Liste as etapas na ordem real: descoberta do anúncio, dúvida antes de reservar, reserva, mensagens antes da viagem, chegada, estadia, saída e pós-estadia.", "Para cada etapa, escreva o que o hóspede precisa saber ou fazer e o que você entrega hoje. Use suas mensagens e anúncios como prova, não a memória.", "Marque onde houve perguntas repetidas, reclamações, atrasos ou pedidos de ajuda no período. Conte as ocorrências de cada etapa.", "Peça a um amigo ou a um hóspede de confiança que descreva a viagem dele. Compare o relato com o seu mapa e anote as diferenças.", "Escolha a etapa com mais ocorrências e defina uma correção pequena, com responsável e prazo, antes de mexer nas outras."], "exemplo": {"titulo": "Achando o ponto de maior atrito", "texto": "Dados fictícios: uma casa de temporada atendeu 12 hóspedes no mês. Ao contar as ocorrências por etapa, o dono anotou 5 perguntas sobre como chegar, 3 sobre o horário de entrada, 1 sobre o Wi-Fi e 0 na saída e no pós-estadia. Total de 9 ocorrências. A chegada concentra 8 delas, ou seja, 5 mais 3, quase 89% do total de 9. Decisão: corrigir primeiro o acesso e o horário, com um guia de chegada enviado antes da viagem, e só depois revisar o restante."}, "erro_comum": "Mapear a jornada pensando no que você faz, e não no que o hóspede vive. Também é comum parar na estadia e esquecer descoberta, mensagens antes da viagem e pós-estadia, justamente onde mora muito atrito evitável.", "como_ler": {"ausente": "Não existe mapa. A jornada só vive na sua cabeça e os problemas são descobertos por reclamação ou por avaliação ruim.", "parcial": "Há um mapa incompleto, sem alguma etapa, ou sem contagem de ocorrências, ou sem ação definida para o ponto crítico.", "comprovado": "Existe mapa da descoberta ao pós-estadia, com ocorrências do período por etapa, o ponto de maior atrito identificado e uma correção com responsável e prazo."}, "verificacao": "Compare o número de ocorrências da etapa corrigida no mês seguinte com o mês de partida, usando a mesma contagem. Veja se o atrito caiu sem aparecer em outra etapa, por exemplo mais perguntas depois da mudança. Se subiu em outro ponto, ajuste a correção em vez de abandoná-la."}, {"id": "m3q2", "por_que_importa": "A chegada é o primeiro momento real do produto. Quem viaja cansado, de noite ou sem sinal de celular depende de instruções claras para entrar sem ajuda. Acesso confuso gera ligações, atraso, estresse e uma primeira impressão ruim que contamina o resto da estadia. Instruções testadas por alguém de fora custam pouco e evitam muito desgaste.", "como_coletar": ["Escolha alguém que nunca esteve no local e entregue só as instruções que o hóspede recebe hoje: mensagem, mapa, link e códigos de acesso.", "Peça que essa pessoa faça o trajeto real, com o carro ou o transporte que o hóspede usaria, sem ajuda sua. Anote cada dúvida e cada parada.", "Teste também de noite, sem sinal e com bagagem, se o seu acesso tiver estrada de terra, escada, portão, trilha ou fechadura eletrônica.", "Verifique se o endereço no mapa leva ao ponto certo, se a fechadura ou o portão funcionam do jeito descrito e se há onde estacionar.", "Reescreva as instruções com os pontos de dúvida, inclua fotos dos pontos de virada e defina em que momento a mensagem é enviada ao hóspede."], "exemplo": {"titulo": "Antes e depois das instruções", "texto": "Dados fictícios: um chalé recebeu 10 hóspedes no mês e 6 mandaram mensagem com dúvida de acesso, ou seja, 60% dos hóspedes. O dono pediu a uma amiga que fizesse o trajeto sozinha e ela errou a entrada da estrada. Ele reescreveu o texto, incluiu foto do portão e enviou tudo 48 horas antes da chegada. No mês seguinte, 2 de 10 hóspedes perguntaram sobre acesso, 20%. A queda de 60% para 20% mostra melhora no ponto testado, sem provar a causa isolada."}, "erro_comum": "Achar que a explicação está boa porque você conhece o caminho de olhos fechados. Quem já foi ao local mil vezes não enxerga as dúvidas de quem chega pela primeira vez, e por isso o teste precisa ser feito por outra pessoa.", "como_ler": {"ausente": "As instruções de acesso não foram testadas por alguém de fora ou dependem de você explicar por telefone na hora da chegada.", "parcial": "As instruções existem e foram revisadas, mas o teste não cobriu chegada à noite, sem sinal ou com bagagem, ou não são enviadas antes da viagem.", "comprovado": "Alguém sem conhecimento do local fez a chegada seguindo só o texto enviado, os pontos de dúvida foram corrigidos e as instruções chegam ao hóspede com antecedência definida."}, "verificacao": "Conte quantos hóspedes pedem ajuda para chegar, antes e depois da mudança, no mesmo tamanho de período. Confirme também se a hora de entrada real bate com a combinada. Se as dúvidas persistirem, refaça o teste com outra pessoa, porque um único testador pode ter passado pelo mesmo ponto cego."}, {"id": "m3q3", "por_que_importa": "Conforto é o que o hóspede sente com o corpo: dormir bem, temperatura agradável, silêncio, luz adequada e banho funcionando. Falhas simples nesses itens pesam mais na avaliação do que detalhes decorativos. Inspecionar com regularidade permite corrigir o essencial antes de gastar com acabamento, e dá a você uma prova de que a unidade foi conferida.", "como_coletar": ["Monte um checklist curto com cama, temperatura, ruído, iluminação e banho. Acrescente o que for essencial na sua unidade, como tomadas, fechaduras e cortinas.", "Faça a inspeção como hóspede: deite na cama, ligue o ar ou o aquecedor, abra o chuveiro, acenda todas as luzes e escute o ambiente à noite.", "Registre cada item como ok, com defeito ou não testado, com data, responsável e foto quando houver falha. Não marque ok o que você não testou.", "Classifique as falhas por efeito no sono, na higiene e na segurança. Corrija primeiro o que impede dormir, tomar banho ou usar a unidade.", "Repita a inspeção em ciclo fixo, por exemplo uma vez por mês ou a cada troca de hóspede, e guarde os registros para comparar."], "exemplo": {"titulo": "Inspeção de quatro unidades", "texto": "Dados fictícios: uma pousada com 4 quartos inspecionou 5 itens em cada um, somando 20 verificações. Resultado: 14 itens ok e 6 com defeito, entre eles 2 chuveiros com pouca pressão, 2 cortinas que deixavam entrar luz e 2 colchões com afundamento. Taxa de conformidade: 14 ÷ 20 = 70%. Decisão: consertar chuveiros e colchões primeiro, porque afetam banho e sono, e deixar as cortinas para a rodada seguinte. Só depois discutir decoração."}, "erro_comum": "Gastar com itens de luxo, como decoração e brindes, enquanto o chuveiro esquenta pouco ou a cama range. Outro erro é inspecionar apenas olhando o ambiente, sem usar de verdade cada item como o hóspede usa.", "como_ler": {"ausente": "Não há inspeção registrada. Os problemas aparecem quando o hóspede reclama durante a estadia ou na avaliação.", "parcial": "Há checklist ou inspeção, mas feitos de vista, sem testar uso real, sem registro das falhas ou sem prazo e responsável para corrigi-las.", "comprovado": "Existe checklist aplicado com uso real de cama, temperatura, ruído, luz e banho, com registros datados, falhas essenciais corrigidas e inspeção repetida em ciclo definido."}, "verificacao": "Compare a taxa de itens conformes e as menções a conforto nas avaliações do período seguinte com as do período anterior. Confirme que a correção não gerou outro problema, como ruído novo de um equipamento trocado. Se a mesma falha voltar, investigue a causa e não só o sintoma."}, {"id": "m3q4", "por_que_importa": "Quando o anúncio promete privacidade, o hóspede espera não ser visto nem ouvido por vizinhos, outros hóspedes ou funcionários. Se a realidade é diferente, a frustração é imediata e aparece na avaliação. Medir a exposição real permite ajustar a promessa ao que existe e, quando possível, melhorar barreiras, sem exagerar o que a unidade entrega.", "como_coletar": ["Releia seu anúncio e liste cada promessa de privacidade, como isolamento, vista livre, silêncio, espaço exclusivo ou entrada independente.", "Percorra a unidade e as áreas comuns e anote de onde alguém consegue ver o interior, a varanda ou o banho: janelas, trilhas, estacionamento, unidades vizinhas.", "Verifique a circulação: por onde passam funcionários, entregadores e outros hóspedes, e em quais horários isso acontece perto da unidade.", "Teste o som: peça a alguém para conversar em volume normal em pontos vizinhos e escute de dentro. Registre o que se ouve e a que horas.", "Compare as promessas com o mapa. Ajuste o texto do anúncio ao que é real e avalie barreiras permitidas, como cortina, planta ou horário de serviço."], "exemplo": {"titulo": "Mapa de exposição de um chalé", "texto": "Dados fictícios: um chalé anuncia total privacidade. Ao percorrer o local, o dono encontra 6 pontos de exposição: 2 janelas visíveis da trilha, 1 varanda vista do estacionamento, 1 caminho de serviço a 5 metros da porta, 1 chalé vizinho com som audível e 1 banheiro com janela sem película. Ele resolve 3 deles, com película, cortina e horário de serviço, e reescreve o anúncio para dizer vista livre, com circulação de serviço pela manhã. Restam 3 pontos conhecidos e comunicados."}, "erro_comum": "Manter no anúncio palavras fortes como total privacidade sem ter conferido o local. Também é comum instalar barreiras sem verificar se são permitidas pelo condomínio, pelo município ou pelas regras de segurança.", "como_ler": {"ausente": "Não houve verificação. A promessa de privacidade do anúncio nunca foi comparada com linhas de visão, circulação e ruído reais.", "parcial": "Houve verificação parcial, só de visão ou só de som, ou o mapa existe, mas o anúncio e as barreiras ainda não foram ajustados.", "comprovado": "Existe mapa de exposição com visão, circulação e ruído, as barreiras permitidas foram avaliadas e o texto do anúncio descreve apenas a privacidade que a unidade realmente tem."}, "verificacao": "Compare as menções a privacidade e barulho nas avaliações antes e depois do ajuste, no mesmo tamanho de período. Confirme que a nova barreira não criou outro problema, como menos ventilação ou luz. Se a reclamação persistir, revise de novo o texto e o mapa."}, {"id": "m3q5", "por_que_importa": "Atividades podem dar motivo para escolher a sua hospedagem e justificar uma diária melhor, mas só quando respondem a um desejo real do hóspede e são entregues com segurança. Oferecer muitas coisas sem teste cria custo, complexidade e risco. Um catálogo pequeno, baseado em pedidos reais e em fornecedores habilitados, protege a margem e a reputação.", "como_coletar": ["Levante o que os hóspedes pedem ou perguntam: passeios, aulas, massagem, cesta, transporte. Use mensagens e avaliações do período como fonte.", "Para cada ideia, liste quem executaria e confirme que o fornecedor é habilitado para a atividade, com documentos e seguros que o órgão competente exigir.", "Calcule o custo incremental por pessoa ou por casal, incluindo fornecedor, insumos, tempo da equipe e taxas, e compare com o preço que o hóspede aceitaria pagar.", "Monte um catálogo simples com descrição, duração, preço, restrições, regras de segurança e prazo de pedido. Deixe claro o que não está incluído.", "Escolha uma experiência de baixo custo e baixo risco para testar por um período curto, com meta, registro de pedidos e feedback dos hóspedes."], "exemplo": {"titulo": "Conta de uma experiência-teste", "texto": "Dados fictícios: uma pousada recebeu 4 pedidos de passeio guiado em um mês. O fornecedor habilitado cobra R$ 80 por casal e há R$ 10 de insumos, custo incremental de R$ 90. O preço de teste é R$ 150, então a contribuição é 150 − 90 = R$ 60 por casal, 40% do
