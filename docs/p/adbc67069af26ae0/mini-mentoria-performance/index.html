ue ainda é dúvida."], "exemplo": {"titulo": "Área livre que não era livre", "texto": "Dados fictícios: um terreno tem 2.000 m² na matrícula. As construções atuais ocupam 900 m². O dono imaginava ter 1.100 m² livres. O levantamento mostra que 600 m² estão numa faixa com restrição de uso, aguardando confirmação do município. Resta uma área de 500 m² a confirmar para novas unidades. Conta: 900 + 600 + 500 = 2.000 m². O plano de uma nova unidade só pode considerar os 500 m², e mesmo esse número depende da resposta escrita do município e do parecer do profissional."}, "erro_comum": "Presumir que todo espaço sem construção pode receber uma unidade. A área vazia pode ter restrição, divisa duvidosa ou regra local. Presumir área edificável é um dos erros mais caros, porque só aparece depois do dinheiro gasto.", "como_ler": {"ausente": "Não há matrícula atualizada nem levantamento, e ninguém consultou as regras locais. A área disponível é uma estimativa feita a olho.", "parcial": "Há matrícula ou levantamento, mas falta consultar o município ou um profissional sobre as restrições. A área edificável ainda é uma suposição parcial.", "comprovado": "Pasta com matrícula recente, levantamento, resposta do município e parecer de profissional habilitado. A área utilizável está desenhada e as dúvidas restantes estão listadas."}, "verificacao": "Compare a área utilizável confirmada com a área que você imaginava. A ação funcionou se o projeto couber dentro do que está documentado. Confirme se alguma restrição nova apareceu e, se apareceu, refaça o desenho antes de gastar. Este módulo não substitui parecer profissional."}, {"id": "m6q3", "por_que_importa": "Uma expansão costuma exigir autorizações do município e de outros órgãos, e as exigências dependem do projeto, do local e do tipo de uso. Sem saber quais são, você pode investir em algo que não consegue abrir ou que precisa ser refeito. Conhecer a lista antes mostra o prazo, o custo e se o projeto é viável. É uma decisão de investimento, e não só de papelada.", "como_coletar": ["Descreva o projeto em uma página: quantas unidades, tamanho aproximado, tipo de uso, número de hóspedes e se haverá cozinha, piscina, eventos ou outra atividade adicional.", "Leve essa descrição ao município e aos órgãos competentes, como corpo de bombeiros e vigilância sanitária, e pergunte quais autorizações e documentos valem para o seu caso específico.", "Anote para cada exigência: o órgão, o documento pedido, o prazo informado, o custo previsto e quem respondeu. Peça tudo por escrito ou guarde o protocolo.", "Marque cada item como confirmado por escrito, informado verbalmente ou pendente. Confirme com um profissional habilitado, como arquiteto, engenheiro ou advogado, o que não ficou claro.", "Transforme a lista em uma condição de investimento: o dinheiro de obra só é liberado quando as exigências críticas estiverem confirmadas como possíveis e com prazo e custo conhecidos."], "exemplo": {"titulo": "Lista de exigências com status", "texto": "Dados fictícios: o dono levantou 5 exigências para uma nova unidade. Duas estão confirmadas por escrito, uma está informada só por telefone e duas estão pendentes de resposta. Confirmadas por escrito = 2 de 5 = 40%. As outras 3 ainda não permitem concluir nada. Decisão: ele não contrata a obra nem compra material. Registra os protocolos, cobra as respostas pendentes e define uma data para rever a lista. Se algum órgão disser que o projeto é inviável, o investimento nem começa."}, "erro_comum": "Começar a obra enquanto o pedido de autorização ainda está em análise, confiando que vai dar certo. Uma resposta verbal informal também não protege você. Sem a exigência confirmada, o dinheiro investido corre o risco de ficar parado ou de ser perdido.", "como_ler": {"ausente": "Ninguém consultou o município nem os órgãos competentes sobre o projeto. As exigências são conhecidas só por comentários de terceiros ou por experiências de outros imóveis.", "parcial": "Algumas exigências foram levantadas, mas faltam respostas por escrito ou itens críticos continuam pendentes. Não há prazo nem custo claros para as autorizações.", "comprovado": "Lista completa por órgão, com documento, prazo, custo, responsável e confirmação por escrito ou protocolo. O investimento está condicionado à viabilidade confirmada."}, "verificacao": "Acompanhe quantas exigências passaram de pendente para confirmada por escrito e se prazos e custos mudaram. A ação funcionou se nenhum gasto de obra ocorreu antes da confirmação. Este módulo não substitui orientação do órgão competente ou de profissional habilitado."}, {"id": "m6q4", "por_que_importa": "Mais unidades significam mais banho, mais ar-condicionado, mais cozinha e mais lavanderia. Se a água e a energia do local já estão no limite, a expansão pode falhar no pico de uso ou exigir um reforço caro que não estava no plano. Quando esse reforço aparece só no meio da obra, o custo total sobe e o retorno cai.", "como_coletar": ["Anote o que existe hoje: fonte de água, caixa ou reservatório, tipo de ligação elétrica, quadro de energia e qualquer gerador, poço ou sistema de tratamento. Tire fotos e guarde contas recentes.", "Estime a demanda adicional da nova unidade: número de hóspedes, equipamentos elétricos, aquecimento de água e uso de áreas comuns. Registre os horários de maior uso.", "Peça uma avaliação técnica a profissional habilitado, como engenheiro ou eletricista, e à concessionária, quando houver. Leve a estimativa de demanda e peça laudo ou orçamento por escrito.", "Compare a capacidade atual com a demanda de hoje mais a nova unidade. Anote com clareza o que precisa de reforço: reservatório, bomba, quadro, cabeamento, ligação ou tratamento.", "Some os reforços ao orçamento do investimento, como linha própria. Marque o que está confirmado por laudo ou orçamento e o que ainda é estimativa."], "exemplo": {"titulo": "Reforço que entra no orçamento", "texto": "Dados fictícios: a unidade nova está orçada em R$ 80.000. A avaliação técnica mostra que o quadro de energia atual não suporta a nova carga e que o reservatório de água é pequeno para o uso em fins de semana cheios. Orçamento do reforço elétrico: R$ 9.000. Orçamento do novo reservatório: R$ 7.500. Reforços = 9.000 + 7.500 = R$ 16.500. Investimento ajustado = 80.000 + 16.500 = R$ 96.500. O dono passa a usar R$ 96.500 nas contas de retorno, em vez de R$ 80.000."}, "erro_comum": "Achar que, se hoje funciona, vai continuar funcionando com uma unidade a mais. Falta de água ou queda de energia no pico afeta a experiência de todos os hóspedes, inclusive os das unidades atuais, e não só da unidade nova.", "como_ler": {"ausente": "Ninguém avaliou se água e energia suportam mais uma unidade. A conclusão é baseada na sensação de que hoje não falta nada.", "parcial": "Há uma estimativa informal ou conversa com alguém, mas sem laudo ou orçamento por escrito. Os reforços ainda não entraram no custo total do investimento.", "comprovado": "Laudo ou orçamento por escrito de profissional habilitado, demanda estimada, reforços listados com valores e esses valores incluídos no investimento total."}, "verificacao": "Compare o consumo e a estabilidade de água e energia nos períodos de pico, antes e depois de qualquer reforço. A ação funcionou se o orçamento incluir os reforços sem surpresas e se não houver falhas no pico. Este módulo não substitui laudo técnico."}, {"id": "m6q5", "por_que_importa": "Construir para uma demanda que não existe é um dos riscos mais comuns de expansão. Capacidade nova não cria hóspedes por si só. Antes de investir, procure sinais de que existe procura que hoje você não consegue atender, de preferência registrados, e confira se a concorrência e a sazonalidade não já cobrem essa procura.", "como_coletar": ["Registre por 6 a 12 meses os pedidos que você não conseguiu atender: data pedida, número de pessoas, motivo da recusa e canal. Use planilha simples ou o histórico das conversas.", "Separe pedidos recusados por falta de vaga dos que desistiram por preço, regra ou perfil. Só os primeiros mostram demanda que uma nova unidade poderia atender.", "Pesquise a concorrência local: quantas ofertas parecidas existem, em que datas ficam cheias e com que preço. Anote a data da pesquisa e as fontes para poder repetir.", "Olhe a sazonalidade da sua própria ocupação: em quais meses e dias falta vaga e em quais sobra. Uma demanda que só aparece em poucos fins de semana pesa diferente de uma demanda o ano todo.", "Teste a oferta antes de construir: divulgue o conceito, abra lista de interesse ou faça uma oferta limitada. Registre quantas pessoas pedem, em quais datas e a que preço."], "exemplo": {"titulo": "Pedidos recusados em seis meses", "texto": "Dados fictícios: em 6 meses, o dono registrou 22 pedidos sem vaga. Desses, 9 eram de grupos maiores e 13 de casais. Em 26 fins de semana, 22 pedidos dão menos de 1 por fim de semana. Com média de 2 noites por pedido, são 44 noites não atendidas. Ele ainda não constrói. Divulga uma lista de interesse para a unidade nova e vê se pelo menos parte desses pedidos se repete e aceita o preço previsto. Só então decide, com base em evidência."}, "erro_comum": "Usar a opinião de amigos ou a ideia de que sempre falta lugar como prova de demanda. Sem registro de pedidos recusados, de concorrência e de sazonalidade, a demanda é só uma crença, e crença não paga a obra.", "como_ler": {"ausente": "Não há registro de pedidos recusados nem pesquisa de concorrência. A demanda adicional é apenas uma impressão ou um desejo de crescer.", "parcial": "Há alguns registros ou uma pesquisa de concorrência, mas incompletos: sem período suficiente, sem separar motivos de recusa ou sem olhar sazonalidade. A demanda ainda não está demonstrada.", "comprovado": "Registro de pedidos recusados por período definido, concorrência pesquisada com data, sazonalidade analisada e algum teste de oferta feito antes da obra."}, "verificacao": "Compare os pedidos recusados e o resultado do teste de oferta com a capacidade da nova unidade. A ação funcionou se a procura demonstrada cobrir uma parte relevante das noites novas. Se a procura for fraca, adiar a obra também é um bom resultado."}, {"id": "m6q6", "por_que_importa": "A nova unidade precisa fazer sentido junto com o que você já oferece. Se ela atrai o mesmo público e disputa as mesmas datas, pode apenas tirar reservas das unidades atuais. Se exige uma operação muito diferente, pode sobrecarregar a equipe. Comparar alternativas ajuda a escolher o conceito que combina com o local e com a sua rotina.", "como_coletar": ["Liste de 3 a 4 alternativas de conceito para o espaço, como mais uma unidade igual, uma unidade maior para grupos, uma unidade mais reservada ou melhorar o que já existe.", "Descreva o público de cada alternativa e verifique se ele já é atendido hoje pelas suas unidades ou se seria um público novo para o seu imóvel.", "Avalie a privacidade entre as unidades: ruído, vista, circulação de hóspedes e acessos. Pergunte se a nova unidade atrapalha a experiência de quem já está hospedado.", "Avalie a operação: limpeza, check-in, manutenção e atendimento extras. Pergunte se a sua equipe atual dá conta e se o conceito se encaixa no seu terreno e nas regras locais.", "Monte uma matriz com notas de 1 a 5 por critério, some por alternativa e registre a decisão com o motivo. Lembre que as notas são julgamento seu e podem mudar com mais dados."], "exemplo": {"titulo": "Matriz com três alternativas", "texto": "Dados fictícios: um dono compara 3 conceitos com 4 critérios, notas de 1 a 5: público novo, privacidade, operação simples e encaixe no terreno. A) Unidade para casais: 4 + 3 + 5 + 3 = 15. B) Unidade para grupos: 5 + 2 + 3 + 4 = 14. C) Área comum com espaço de convivência: 3 + 4 + 2 + 5 = 14. A alternativa A fica na frente, mas por pouco. As notas são subjetivas, então ele valida o conceito A com a lista de interesse antes de decidir e registra o que mudaria o resultado."}, "erro_comum": "Escolher o conceito pelo gosto pessoal ou porque outro imóvel fez igual. O que funciona em outro lugar pode não combinar com o seu terreno, o seu público e a sua equipe. Compare por critérios escritos.", "como_ler": {"ausente": "Nenhuma alternativa foi comparada. O conceito da nova unidade foi escolhido por preferência ou por imitação, sem avaliar público, privacidade ou operação.", "parcial": "Há mais de uma ideia, mas sem comparação por critérios. Público, privacidade ou operação foram avaliados só em parte, ou sem registro escrito.", "comprovado": "Matriz escrita com alternativas, critérios, notas e justificativa da escolha. O conceito escolhido foi conferido com o terreno, a operação e o público desejado."}, "verificacao": "Compare, depois de algum tempo, a ocupação e a avaliação dos hóspedes das unidades atuais com as da nova. A ação funcionou se a nova unidade atrair público sem reduzir as reservas das existentes ou piorar a experiência delas."}, {"id": "m6q7", "por_que_importa": "Muita gente calcula só o preço da unidade e esquece obras, licenças, mobiliário, instalações e imprevistos. O custo total instalado é tudo o que precisa ser pago até a unidade estar pronta para receber o primeiro hóspede. Sem esse número completo, o retorno parece melhor do que é e o capital pode faltar no meio do caminho.", "como_coletar": ["Liste todos os itens: a unidade em si, fundação ou base, obras civis, instalações elétricas e hidráulicas, licenças e projetos, mobiliário, enxoval, equipamentos e paisagismo.", "Peça pelo menos 3 propostas comparáveis para os itens maiores, com o mesmo escopo, e confira o que cada proposta inclui e o que deixa de fora, como frete e montagem.", "Inclua custos que costumam ser esquecidos: projetos, taxas, transporte, montagem, ligações de água e energia e primeiros estoques. Se não souber, marque como a confirmar.", "Some tudo e acrescente uma contingência para imprevistos. Escolha o percentual com base no grau de incerteza do projeto e explique a escolha por escrito.", "Registre o total e os itens nas linhas de investimento. Registre os números na Calculadora de Custo e Retorno da Expansão."], "exemplo": {"titulo": "Orçamento completo com contingência", "texto": "Dados fictícios: unidade R$ 60.000, obras R$ 25.000, licenças e projetos R$ 4.000 e mobiliário R$ 12.000. Subtotal = 60.000 + 25.000 + 4.000 + 12.000 = R$ 101.000. O dono escolhe contingência de 10% pela incerteza do terreno: 10% de 101.000 = R$ 10.100. Custo total instalado = 101.000 + 10.100 = R$ 111.100. Se ele tivesse levado em conta só a unidade, o custo pareceria R$ 60.000, quase metade do valor real, e o retorno ficaria muito acima da realidade."}, "erro_comum": "Comparar propostas que não cobrem a mesma coisa e escolher a mais barata. Uma proposta sem frete, montagem ou licenças parece menor, mas depois recebe acréscimos. Compare itens iguais e pergunte o que está fora do preço.", "como_ler": {"ausente": "Só se conhece o preço da unidade ou uma estimativa de bolso. Obras, licenças, mobiliário e contingência não foram listados nem orçados.", "parcial": "Há orçamento de parte dos itens, ou uma única proposta, ou falta contingência. O total instalado ainda tem lacunas ou itens estimados sem proposta.", "comprovado": "Orçamento completo, com propostas comparáveis dos itens maiores, todos os custos listados e contingência justificada. O total instalado está registrado na calculadora."}, "verificacao": "Compare o custo realizado com o orçado à medida que a obra avança. A ação funcionou se o desvio ficar dentro da contingência. Revise o total sempre que uma proposta mudar e confirme que o capital cobre o valor completo."}, {"id": "m6q8", "por_que_importa": "A nova unidade vai gastar com limpeza, energia, água, enxoval, equipe, comissões e manutenção. Tratar a estrutura existente como gratuita faz o resultado parecer maior que o real, porque a cozinha, a recepção e a sua própria hora de trabalho passam a servir mais uma unidade. Só o custo incremental, aquele que existe por causa da expansão, entra nessa conta.", "como_coletar": ["Separe custos variáveis por noite vendida: limpeza, insumos, comissões, taxas e lavanderia. Estime o valor por noite com base nas notas e faturas das unidades atuais.", "Separe custos fixos adicionais por ano: energia e água de uso contínuo, manutenção, seguros, internet, impostos sobre o imóvel e a parte da equipe que será acrescentada.", "Estime o tempo extra de gestão: atendimento, check-in, compras e manutenção. Se alguém precisar trabalhar mais horas, atribua um custo, mesmo que seja o seu tempo.", "Calcule a contribuição por noite: diária realizada menos o custo variável por noite vendida. Depois calcule quantas noites vendidas são precisas para cobrir os custos fixos adicionais.", "Registre custos variáveis e fixos na projeção incremental. Registre os números na Calculadora de Custo e Retorno da Expansão."], "exemplo": {"titulo": "Contribuição e noites de equilíbrio", "texto": "Dados fictícios: diária realizada R$ 400. Custo variável por noite vendida: limpeza R$ 70, insumos R$ 15, comissões e taxas R$ 30, total R$ 115. Contribuição por noite = 400 − 115 = R$ 285. Custos fixos adicionais por ano: energia e água R$ 3.600, manutenção R$ 4.800 e equipe R$ 6.000, total R$ 14.400. Noites para cobrir os fixos = 14.400 ÷ 285 = 50,5, ou seja, 51 noites vendidas por ano. Acima disso, a unidade nova começa a sobrar resultado. Abaixo disso, ela dá prejuízo."}, "erro_comum": "Considerar que a cozinha, a recepção ou a limpeza já existem e portanto não custam nada. Elas passam a ser mais usadas, e isso gera desgaste, hora extra ou nova contratação. Ignorar isso inflaciona o retorno.", "como_ler": {"ausente": "Os custos adicionais nunca foram estimados. A conta olha só a diária e conclui que tudo que entrar é lucro.", "parcial": "Há estimativa de alguns custos, geralmente limpeza ou energia, mas faltam equipe, manutenção, comissões ou o tempo de gestão. A projeção incremental está incompleta.", "comprovado": "Projeção incremental com custos variáveis por noite e custos fixos anuais baseados em notas reais, contribuição por noite calculada e noites de equilíbrio definidas."}, "verificacao": "Compare os custos reais dos primeiros meses com os projetados. A ação funcionou se o desvio for pequeno e a contribuição por noite não ficar abaixo do previsto. Se os custos reais forem maiores, refaça a projeção e as noites de equilíbrio."}, {"id": "m6q9", "por_que_importa": "Retorno não é número único. Depende de quantas noites você vende, da diária e dos custos, e tudo isso pode variar. Por isso, calcule pelo menos três cenários: prudente, base e otimista. Assim você vê o que acontece se a procura vier abaixo do esperado, e uma projeção deixa de ser tratada como promessa.", "como_coletar": ["Defina três cenários com noites vendidas por ano, diária realizada e custos variáveis e fixos. O cenário prudente deve ser pessimista o bastante para você se sentir desconfortável.", "Para cada cenário, calcule o resultado anual incremental: contribuição por noite × noites vendidas − custos fixos adicionais. Use os mesmos custos da projeção incremental.", "Calcule o retorno simples anual: resultado anual incremental ÷ investimento total. Use o custo total instalado, com contingência e reforços, e não só o preço da unidade.", "Calcule o payback simples: investimento ÷ resultado anual, apenas se o resultado for positivo. Se o resultado for zero ou negativo, o investimento não se paga naquele cenário.", "Registre os três cenários lado a lado. Registre os números na Calculadora de Custo e Retorno da Expansão."], "exemplo": {"titulo": "Três cenários e payback simples", "texto": "Dados fictícios: investimento R$ 100.000, contribuição por noite R$ 285 e fixos de R$ 14.400 por ano. Prudente, 90 noites: 285 × 90 − 14.400 = R$ 11.250; retorno 11,25%; payback 100.000 ÷ 11.250 = 8,9 anos. Base, 120 noites: 34.200 − 14.400 = 19.800 reais; retorno 19,8%; payback 5,1 anos. Otimista, 150 noites: 42.750 − 14.400 = R$ 28.350; retorno 28,35%; payback 3,5 anos. São projeções, e não uma previsão do que vai acontecer."}, "erro_comum": "Olhar só o cenário otimista, ou tratar o cenário base como certo. Projeção não é promessa: se a procura vier abaixo do esperado, o payback pode passar de anos aceitáveis para anos que você não consegue sustentar.", "como_ler": {"ausente": "Não há cálculo de retorno. A decisão se baseia em entusiasmo, em casos de outros imóveis ou em um único número otimista.", "parcial": "Há um cálculo de retorno, mas em um único cenário, ou sem custos incrementais completos, ou usando só o preço da unidade como investimento.", "comprovado": "Três cenários calculados com os mesmos custos da projeção incremental, investimento total, retorno simples, payback simples e registro de que são projeções."}, "verificacao": "Depois da expansão, compare o resultado real com o cenário prudente, o base e o otimista. A ação funcionou se o resultado real ficar dentro da faixa calculada. Revise os cenários a cada trimestre com dados reais."}, {"id": "m6q10", "por_que_importa": "Entusiasmo é um mau critério para investir. Ter condições escritas, com antecedência, impede que você avance só porque já gastou tempo e dinheiro no projeto. Os critérios de avanço juntam o que foi visto nas outras perguntas e dizem com clareza quando seguir, quando esperar e quando desistir, com base em fatos verificados.", "como_coletar": ["Reúna as respostas das perguntas anteriores: ativos, terreno, autorizações, água e energia, demanda, conceito, investimento, custos incrementais e cenários de retorno.", "Escreva condições técnicas, legais, comerciais e financeiras. Exemplo: autorizações confirmadas por escrito, laudo de água e energia, procura demonstrada e capital próprio cobrindo o investimento.", "Para cada condição, defina um limite verificável, como um payback máximo no cenário prudente. Defina os limites antes de ver os resultados, para não ajustá-los ao desejo.", "Marque cada condição como atendida, parcial ou não atendida, com a evidência ao lado. Dê um responsável e uma data para cada condição pendente.", "Decida em três opções: avançar, esperar para verificar mais ou desistir. Só avance quando todas as condições essenciais estiverem atendidas e registre a data da decisão."], "exemplo": {"titulo": "Critérios que seguram a decisão", "texto": "Dados fictícios: o dono definiu 6 condições. Atendidas: autorizações por escrito, laudo de água e energia, capital próprio e teste de interesse. Não atendidas: payback no cenário prudente abaixo de 6 anos e orçamento com 3 propostas. O payback prudente calculado é 8,9 anos, acima do limite de 6. Atendidas = 4 de 6. Decisão: esperar. Ele refaz os orçamentos e revê o conceito para reduzir o investimento, e só volta a decidir quando todas as 6 condições estiverem atendidas."}, "erro_comum": "Criar critérios depois de ver os números, ou ajustá-los para o projeto passar. Critério que muda para caber no desejo deixa de proteger. Escreva antes e aceite a resposta, inclusive quando for esperar ou desistir.", "como_ler": {"ausente": "Não existem critérios escritos. A decisão de expandir será tomada por entusiasmo, por pressão de terceiros ou por já ter gasto tempo no projeto.", "parcial": "Existem algumas condições, mas sem limites verificáveis, sem responsável ou sem data. Ou foram definidas depois de ver os resultados.", "comprovado": "Lista escrita de condições técnicas, legais, comerciais e financeiras, com limites definidos antes, evidências, responsáveis e datas, e decisão registrada."}, "verificacao": "Confira, no fim, se o projeto aprovado atendeu a todas as condições e se nenhuma foi alterada depois do resultado. A ação funcionou se a decisão puder ser explicada com as evidências arquivadas, mesmo quando for esperar ou desistir."}], "fechamento": {"resumo": "Expandir sem começar do zero significa usar o que você já sabe e tem antes de gastar. Primeiro mapeie os ativos e a capacidade ociosa real. Depois confirme os limites do terreno, as autorizações e a capacidade de água e energia. Em seguida, procure evidência de demanda e compare conceitos. Por fim, calcule o custo total instalado, os custos incrementais e o retorno em cenários, e escreva critérios de avanço. Se faltar evidência, esperar é uma decisão válida.", "glossario": [{"termo": "Capacidade ociosa real", "definicao": "Noites ou estruturas em bom estado que ficaram sem uso por falta de procura, e não por bloqueio ou manutenção."}, {"termo": "Custo total instalado", "definicao": "Tudo o que precisa ser pago até a unidade estar pronta: unidade, obras, licenças, mobiliário, reforços e contingência."}, {"termo": "Custo incremental", "definicao": "Custo que passa a existir por causa da expansão, como limpeza, energia, equipe e manutenção extras."}, {"termo": "Retorno simples anual", "definicao": "Resultado incremental anual dividido pelo investimento. É uma projeção, e não uma previsão de resultado."}, {"termo": "Payback simples", "definicao": "Investimento dividido pelo resultado anual, calculado só se o resultado for positivo. Indica em quantos anos o valor investido voltaria."}, {"termo": "Contingência", "definicao": "Reserva incluída no orçamento para imprevistos de obra e de instalação."}], "limites": "Este guia organiza a sua análise, mas não substitui parecer de arquiteto, engenheiro, advogado, contador ou dos órgãos competentes, principalmente sobre terreno, autorizações, água e energia. Os exemplos usam dados fictícios e os cenários são projeções, e não previsões. Nenhum resultado de reservas, ocupação, renda ou retorno está prometido."}}, "7": {"modulo": 7, "titulo": "Encontre o parceiro certo", "subtitulo": "Prepare sua hospedagem para conversar sobre parceria com clareza, números e limites", "abertura": {"para_que_serve": "Este guia ajuda você a se preparar antes de procurar qualquer parceiro para a sua hospedagem, seja Airbnb, casa, apartamento, chalé, pousada ou glamping. Você vai definir o que busca, documentar o que tem, organizar números verificáveis, calcular o aporte necessário, comparar modelos de parceria e fixar seus limites. Parceria com a Zion aparece apenas como possibilidade opcional, sujeita à análise e sem promessa de investimento. O objetivo não é fechar negócio rápido, e sim chegar a qualquer conversa sabendo o que oferece, o que precisa e até onde aceita ir.", "tenha_em_maos": ["Escrituras, contratos de locação ou outros documentos do imóvel", "Relatórios de reservas e receitas de períodos comparáveis", "Lista de custos fixos e variáveis do período", "Inventário de equipamentos, mobiliário e marca", "Orçamentos de obras ou melhorias que você pretende fazer", "Anotações sobre o que você aceita e não aceita negociar"], "como_trabalhar": "Defina um período claro, de preferência com meses comparáveis, e use apenas dados que você consegue comprovar com extratos, relatórios ou contratos. Quando não souber um número, marque \"não sei\" e organize a coleta, porque desconhecido não é zero. O resultado deste guia é um diagnóstico orientativo de preparação. Ele não é auditoria, não substitui análise profissional e não indica qual parceria escolher."}, "perguntas": [{"id": "m7q1", "por_que_importa": "Quem procura parceiro sem saber o que busca costuma aceitar a primeira proposta que aparece. Capital, operação, conhecimento e distribuição são necessidades diferentes e levam a conversas diferentes. Escrever a prioridade ajuda você a filtrar propostas, evita misturar pedidos e deixa claro, para quem avalia, o que você espera receber em troca do que oferece. Sem objetivo escrito, qualquer proposta parece boa.", "como_coletar": ["Escreva em uma folha quatro títulos: capital, operação, conhecimento e distribuição. Em cada um, anote com suas palavras o que hoje falta na hospedagem naquela área.", "Para cada necessidade, descreva uma situação concreta que você vive hoje, como obra parada, equipe sobrecarregada, falta de preço bem definido ou poucos canais de venda.", "Dê uma nota de 1 a 4 para a urgência de cada necessidade e escolha apenas uma como prioridade. As demais ficam como desejáveis.", "Escreva o objetivo em uma frase simples, com prazo e sem prometer resultado, por exemplo: \"Quero resolver a necessidade de capital para concluir a reforma em até um ano\".", "Mostre a frase a um sócio, familiar ou contador de confiança e ajuste se a leitura dele for diferente da sua."], "exemplo": {"titulo": "Quatro necessidades, uma prioridade", "texto": "Dados fictícios: uma pousada pequena anota suas faltas. Capital: precisa reformar 4 quartos. Operação: a equipe dá conta. Conhecimento: falta saber definir diárias. Distribuição: vende por dois canais. As notas de urgência são capital 4, conhecimento 3, distribuição 2 e operação 1. A soma das notas é 10 e o capital responde por 4 de 10, ou seja, 40%. A prioridade escolhida é capital. O objetivo escrito fica: \"Quero conhecer opções para financiar a reforma dos 4 quartos em até 12 meses\". Conhecimento passa a ser desejável, não condição."}, "como_ler": {"ausente": "Você nunca escreveu o que busca ou só tem uma ideia vaga na cabeça, como \"quero crescer\". Não há prioridade definida entre as quatro necessidades.", "parcial": "Você tem uma ideia clara, mas ela não está escrita, ou lista várias necessidades sem escolher uma prioridade, ou não tem prazo associado.", "comprovado": "Existe objetivo escrito, com uma necessidade prioritária escolhida entre as quatro, um prazo e uma situação concreta que justifica a escolha."}, "verificacao": "Releia o objetivo escrito após uma semana e confirme que ele ainda faz sentido. Compare qualquer proposta recebida com a prioridade escolhida e anote se ela resolve a necessidade ou outra coisa. Se você mudar a prioridade a cada conversa, o objetivo ainda não está firme.", "erro_comum": "Escrever que quer \"um parceiro que ajude em tudo\". Pedir capital, operação, conhecimento e distribuição ao mesmo tempo torna a proposta confusa, atrai ofertas genéricas e dificulta comparar o que cada interessado realmente resolve para você."}, {"id": "m7q2", "por_que_importa": "Quem avalia uma parceria precisa saber o que existe de fato: terreno ou imóvel, estrutura, equipamentos, marca e jeito de operar. Se você só descreve de memória, a conversa fica na base da impressão. Um inventário com evidências mostra seriedade, evita esquecer itens relevantes e separa o que é seu do que é de terceiros. Atribuir valor sem avaliação costuma gerar expectativa irreal e conflito depois.", "como_coletar": ["Crie uma tabela com quatro grupos: propriedade, equipamentos e mobiliário, marca e presença digital, e operação. Cada linha é um item que você realmente possui ou controla.", "Para cada item, anote a evidência que o comprova: matrícula, contrato, nota fiscal, foto datada, perfil verificado ou procedimento escrito. Sem evidência, marque o item como \"a comprovar\".", "Registre o estado de cada item de forma objetiva, como novo, bom, precisa de reparo ou emprestado, e o que ainda deve ser pago por ele.", "Marque o que é de terceiros, alugado ou financiado, porque isso muda o que você pode colocar em uma parceria.", "Deixe a coluna de valor em branco ou escreva \"sem avaliação\" até que um profissional habilitado avalie o item."], "exemplo": {"titulo": "Inventário com evidência por linha", "texto": "Dados fictícios: uma casa de temporada lista 5 grupos de itens. Imóvel com matrícula, 1 item. Mobiliário com notas fiscais, 3 itens, sendo 2 com nota e 1 sem. Marca com perfil e logotipo, 2 itens, ambos com prova. Operação com roteiro de limpeza, 1 item. São 7 itens no total e 5 têm evidência, ou seja, 5 de 7, cerca de 71%. Os 2 sem evidência ficam marcados como \"a comprovar\". A coluna de valor continua vazia para todos até uma avaliação profissional."}, "como_ler": {"ausente": "Você não tem lista do que oferece, ou ela existe só na memória. Não há evidência reunida para propriedade, equipamentos, marca ou operação.", "parcial": "Há uma lista, mas faltam grupos, faltam evidências em vários itens ou o estado e a situação de cada item não estão registrados.", "comprovado": "O inventário cobre propriedade, equipamentos, marca e operação, com evidência por item, estado registrado, terceiros identificados e nenhum valor atribuído sem avaliação."}, "verificacao": "Confira se cada linha tem evidência e se o inventário bate com o que existe fisicamente, fazendo uma visita ao imóvel com a lista na mão. Refaça a contagem de itens com evidência a cada revisão. Se aparecer item novo ou vendido, atualize antes de compartilhar com qualquer interessado.", "erro_comum": "Colocar um valor de venda ao lado de cada item com base em palpite ou em anúncios de outros imóveis. Esse número vira âncora na negociação e, se não for sustentado por avaliação, pode afastar quem analisa."}, {"id": "m7q3", "por_que_importa": "Ninguém avalia uma parceria sem enxergar o que a hospedagem já produz. Receitas, ocupação e custos de períodos comparáveis mostram a realidade e permitem ver tendência, sazonalidade e lacunas. Números soltos, de meses diferentes ou sem comprovação perdem credibilidade. Identificar o que falta antes de apresentar evita que a outra parte descubra a lacuna por conta própria e passe a duvidar do resto.", "como_coletar": ["Escolha pelo menos três meses seguidos, ou o mesmo período de dois anos, para que os números sejam comparáveis. Anote o período escolhido no topo da folha.", "Reúna os relatórios dos canais de venda e os extratos bancários desses meses. Registre receita de hospedagem, noites vendidas, número de unidades e dias bloqueados.", "Calcule noites disponíveis (unidades × dias − bloqueios), ocupação (noites vendidas ÷ noites disponíveis), diária realizada (receita ÷ noites vendidas) e receita por noite disponível (receita ÷ noites disponíveis).", "Liste os custos do mesmo período, separando fixos de variáveis, e marque com \"não sei\" qualquer valor que você ainda não consegue comprovar.", "Anote as lacunas, como meses sem relatório ou custos sem nota, e defina quem vai buscar cada documento e até quando."], "exemplo": {"titulo": "Três meses comparáveis", "texto": "Dados fictícios: 2 unidades, 90 dias, sem bloqueios. Noites disponíveis: 2 × 90 = 180. Noites vendidas: 99. Ocupação: 99 ÷ 180 = 55%. Receita de hospedagem: R$ 59.400. Diária realizada: 59.400 ÷ 99 = R$ 600. Receita por noite disponível: 59.400 ÷ 180 = R$ 330, que confere com 600 × 0,55. Os custos do período aparecem em planilha, mas o valor de energia está marcado \"não sei\" porque faltam duas contas. A lacuna foi anotada com prazo de busca de uma semana."}, "como_ler": {"ausente": "Você não tem receitas, ocupação e custos organizados por período, ou os números existem apenas de memória e sem relatório que os comprove.", "parcial": "Há números, mas de períodos diferentes, sem custos completos ou sem comprovação. As lacunas existem, mas ainda não foram listadas nem têm responsável.", "comprovado": "Receitas, ocupação e custos de períodos comparáveis estão organizados, as contas fecham com os relatórios e as lacunas estão identificadas, com responsável e prazo."}, "verificacao": "Refaça as contas de ocupação, diária realizada e receita por noite disponível a partir dos relatórios originais e confira se o resultado é o mesmo da planilha. Compare com o mesmo período do ano anterior, quando existir. Ocupação acima de 100% indica dado inconsistente e deve ser revisada antes de apresentar.", "erro_comum": "Apresentar apenas o melhor mês, ou misturar meses de temporada alta com meses fracos sem avisar. Também é comum deixar custos de fora porque \"ainda não fechou\", o que faz o resultado parecer maior do que é."}, {"id": "m7q4", "por_que_importa": "Pedir ou aceitar um aporte sem calcular o necessário leva a dois problemas: faltar dinheiro no meio da obra ou comprometer parte maior do negócio do que seria preciso. O cálculo correto soma o investimento total, inclui reserva para imprevistos e capital de giro e só então desconta o que você já tem. Conhecer esse número dá base para qualquer conversa sobre parceria.", "como_coletar": ["Liste todos os gastos do projeto em categorias, como obra, equipamentos, licenças, marketing de abertura e outros. Use orçamentos reais, de preferência mais de um por item relevante.", "Some os gastos e acrescente uma contingência para imprevistos. Defina o percentual com base no seu grau de incerteza e escreva a razão dessa escolha.", "Estime o capital de giro, que é o dinheiro para pagar custos nos primeiros meses, antes de a receita se estabilizar. Use seus custos fixos mensais como ponto de partida.", "Some os recursos próprios que você pode usar sem comprometer a operação e subtraia do investimento total. O resultado é a necessidade de capital.", "Registre os números na Calculadora de Necessidade de Capital e guarde os orçamentos que sustentam cada valor."], "exemplo": {"titulo": "Necessidade de capital calculada", "texto": "Dados fictícios: obra R$ 60.000, equipamentos R$ 25.000 e outros gastos R$ 15.000, somando R$ 100.000. Contingência escolhida de 10%: R$ 10.000. Capital de giro para dois meses: R$ 20.000. Investimento total: 100.000 + 10.000 + 20.000 = R$ 130.000. Recursos próprios disponíveis: R$ 45.000. Necessidade de capital: 130.000 − 45.000 = R$ 85.000. Esse é o valor de referência para conversar, sempre mostrado com os orçamentos que o sustentam."}, "como_ler": {"ausente": "Você não sabe quanto precisaria de aporte ou tem apenas uma estimativa sem lista de gastos, sem contingência e sem capital de giro.", "parcial": "Há uma soma dos gastos, mas faltam contingência, capital de giro ou a conta dos recursos próprios. O número ainda não está sustentado por orçamentos.", "comprovado": "A necessidade de capital está calculada como investimento total, com contingência e capital de giro, menos recursos próprios, e cada valor tem orçamento ou documento de apoio."}, "verificacao": "Recalcule com valores mais pessimistas, como orçamentos 10% maiores e um mês a mais de capital de giro, e veja se a necessidade continua suportável. Revise quando um orçamento mudar. Se o número crescer muito, ajuste o plano antes de levá-lo a qualquer interessado.", "erro_comum": "Calcular só o custo da obra e esquecer contingência e capital de giro. Também é comum contar como recurso próprio um dinheiro que já está comprometido com contas da operação, o que faz a necessidade parecer menor."}, {"id": "m7q5", "por_que_importa": "Parceria não é um modelo só. Locação, sociedade e prestação de serviços com assessoria dividem de forma diferente o dinheiro, o controle, as obrigações e os riscos. Quem conhece as alternativas entende o que está sendo proposto, pergunta o que importa e percebe quando uma oferta não combina com o seu objetivo. Comparar antes evita aceitar um formato por falta de opção.", "como_coletar": ["Monte uma tabela com três colunas: locação, sociedade e prestação de serviços com assessoria. Nas linhas, coloque quem investe, quem opera, quem decide, quem recebe e o que acontece na saída.", "Preencha cada célula com o que você entende hoje e marque com ponto de interrogação o que ainda não sabe. Essas perguntas viram roteiro para conversar com um profissional.", "Para cada modelo, liste as obrigações que você assume, como custos, prazos, prestação de contas e responsabilidade perante hóspedes e terceiros.", "Simule a divisão do dinheiro nos três modelos com os mesmos números do seu histórico, para ver a diferença na prática.", "Anote os riscos de cada modelo e o que você faria se o parceiro não cumprisse o combinado."], "exemplo": {"titulo": "Mesmo negócio, três divisões", "texto": "Dados fictícios: a hospedagem tem receita mensal de R$ 40.000, custos de R$ 28.000 e resultado de R$ 12.000. Na locação, o dono recebe um valor fixo de R$ 8.000 por mês e o locatário assume a operação. Na prestação de serviços, a assessoria cobra 15% da receita, R$ 6.000, e o dono fica com 12.000 − 6.000 = R$ 6.000. Na sociedade, o sócio recebe 30% do resultado, R$ 3.600, e o dono fica com R$ 8.400. A conta não diz qual é melhor, porque cada modelo traz obrigações diferentes."}, "como_ler": {"ausente": "Você conhece apenas um formato de parceria, ou nenhum, e não comparou alternativas. Não existe quadro com riscos e obrigações.", "parcial": "Há um quadro com alguns modelos, mas faltam riscos, obrigações ou simulação com seus números. As dúvidas ainda não viraram perguntas para um profissional.", "comprovado": "O quadro compara pelo menos locação, sociedade e prestação de serviços, com simulação numérica, obrigações e riscos de cada um e uma lista de perguntas para revisão profissional."}, "verificacao": "Releia o quadro com um contador ou advogado de sua confiança e confira se as obrigações e riscos estão corretos. Refaça a simulação se os números do histórico mudarem. O quadro cumpre o papel quando você consegue explicar cada modelo a outra pessoa sem consultar anotações.", "erro_comum": "Comparar os modelos só pelo valor que entra no bolso no primeiro mês. Ignorar prazo, saída, responsabilidades e quem decide pode transformar um modelo aparentemente mais vantajoso em um compromisso difícil de desfazer."}, {"id": "m7q6", "por_que_importa": "A maioria dos conflitos em parcerias nasce de pontos que ninguém combinou por escrito: quem decide o quê, quando entra dinheiro, como se prestam contas e como cada um sai. Listar esses pontos antes de qualquer contrato deixa a conversa mais objetiva. Este é um tema crítico: o texto final de qualquer acordo deve ser revisado por advogado independente, que defende o seu interesse.", "como_coletar": ["Liste as decisões do dia a dia e as decisões grandes, como preço, reformas, contratação e venda. Para cada uma, escreva quem você imagina que decide e quem precisa concordar.", "Escreva os aportes previstos: quanto, quando, por quem e o que acontece se alguém não conseguir aportar na data combinada.", "Defina como será a prestação de contas, com frequência, formato do relatório e acesso aos extratos e relatórios dos canais.", "Anote as hipóteses de saída, como fim do prazo, venda, desacordo e descumprimento, e o que você espera que aconteça em cada uma.", "Reúna tudo em uma minuta de pontos negociais, sem linguagem jurídica, e leve a um advogado independente antes de assinar qualquer coisa."], "exemplo": {"titulo": "Pontos negociais organizados", "texto": "Dados fictícios: a minuta lista 12 pontos, sendo 4 sobre decisões, 3 sobre aportes, 2 sobre prestação de contas e 3 sobre saída. Ao revisar, o dono percebe que 5 dos 12 pontos ainda estão em branco, ou seja, 5 de 12, cerca de 42% sem definição. Esses 5 viram perguntas para o advogado: quem decide reformas acima de determinado valor, prazo para aportes, frequência de relatórios, hipóteses de saída e o que ocorre com a marca. A minuta não é contrato, só roteiro."}, "como_ler": {"ausente": "Nada foi definido por escrito sobre decisões, aportes, prestação de contas ou saída, e não houve consulta a advogado independente.", "parcial": "Há uma lista de alguns pontos, mas faltam áreas inteiras, como saída ou prestação de contas, ou a minuta ainda não foi vista por advogado independente.", "comprovado": "A minuta cobre decisões, aportes, prestação de contas e saída, com pendências marcadas, e foi ou será revisada por advogado independente antes de qualquer assinatura."}, "verificacao": "Confirme que cada ponto da minuta tem uma resposta ou está marcado como pendência com responsável e prazo. Registre a data e o nome do profissional que revisou. O texto só vale como acordo depois da revisão jurídica e da assinatura, e este guia não substitui essa etapa.", "erro_comum": "Confiar em acordo verbal ou usar um modelo de contrato copiado da internet sem revisão. Também é comum deixar a saída para depois, quando já existe desconfiança, e o assunto fica muito mais difícil de resolver."}, {"id": "m7q7", "por_que_importa": "Quem avalia uma parceria pede documentos, e entregar tudo desorganizado atrasa a conversa e passa insegurança. Por outro lado, compartilhar tudo de uma vez expõe dados que ninguém precisa ver, como documentos pessoais e extratos completos. Este é um tema crítico: organize um índice, compartilhe só o necessário, com acesso restrito, e peça o consentimento de quem tem dados pessoais nos documentos.", "como_coletar": ["Crie um índice com os documentos relevantes agrupados por tema: imóvel, empresa ou responsável, finanças, operação e regularização. Anote o nome do arquivo, a data e quem o guarda.", "Marque ao lado de cada item o nível de sensibilidade: público, restrito ou muito restrito. Documentos pessoais, extratos completos e dados de hóspedes ficam nos níveis mais altos.", "Defina quais documentos você mostraria já na primeira conversa e quais só depois de uma etapa de confiança e de um compromisso de sigilo por escrito.", "Guarde os arquivos em uma pasta com acesso restrito, com senha ou permissão por pessoa, e registre quem recebeu o quê e quando.", "Retire ou oculte dados que não são necessários, como números de documentos de terceiros, e confirme o consentimento de pessoas citadas nos papéis."], "exemplo": {"titulo": "Índice com níveis de acesso", "texto": "Dados fictícios: o índice tem 20 documentos. Dez são de uso geral, como fotos e descrição do imóvel. Seis são restritos, como contratos e relatórios financeiros. Quatro são muito restritos, como documentos pessoais e extratos completos. Para a primeira conversa, apenas os 10 de uso geral são enviados, ou seja, 10 de 20, 50%. Os outros 10 só são liberados depois de um acordo de sigilo por escrito, com registro de quem recebeu cada um."}, "como_ler": {"ausente": "Os documentos estão espalhados, sem índice e sem critério de quem pode ver o quê. Você compartilharia tudo ou nada, sem controle de acesso.", "parcial": "Existe uma pasta ou índice, mas sem níveis de sensibilidade, sem controle de acesso ou sem registro do que foi compartilhado e com quem.", "comprovado": "Há índice documental com níveis de acesso, pasta restrita, registro de compartilhamento, consentimento de terceiros quando necessário e envio apenas do que é necessário a cada etapa."}, "verificacao": "Teste o acesso: peça a uma pessoa de confiança para tentar abrir a pasta sem permissão e confirme que não consegue. Confira o registro de quem recebeu o quê e revogue acessos que não são mais necessários. Em dúvida sobre proteção de dados, consulte um profissional habilitado.", "erro_comum": "Enviar uma pasta compartilhada aberta, com todos os documentos, por link sem controle. Isso expõe dados pessoais e financeiros a quem não precisa deles e impede saber quem acessou o quê."}, {"id": "m7q8", "por_que_importa": "Um projeto que só você entende não ajuda quem precisa avaliá-lo. O dossiê preliminar resume mercado, ativos, números, riscos e proposta em poucas páginas, de forma honesta. Declarar hipóteses e dados ausentes aumenta a credibilidade, porque mostra que você separa o que sabe do que supõe. Quem lê consegue decidir se quer conversar e o que perguntar.", "como_coletar": ["Escreva uma página para cada tema: mercado e público, ativos, números do histórico, riscos e proposta. Use frases curtas e evite adjetivos que não possam ser comprovados.", "Em cada página, separe com títulos o que é fato comprovado, o que é hipótese sua e o que é dado ausente. Marque cada hipótese claramente como hipótese.", "Use as informações dos itens anteriores: objetivo escrito, inventário, histórico de períodos comparáveis e necessidade de capital calculada.", "Liste os riscos que você enxerga, como dependência de um canal, sazonalidade e obras pendentes, sem esconder os mais difíceis de explicar.", "Peça a alguém de fora do negócio para ler e dizer, em uma frase, o que entendeu. Ajuste o texto até a resposta bater com a sua intenção."], "exemplo": {"titulo": "Dossiê com hipóteses declaradas", "texto": "Dados fictícios: o dossiê tem 5 páginas e 20 afirmações. Doze são fatos com documento, 5 são hipóteses marcadas e 3 são dados ausentes listados no fim. Os fatos somam 12 de 20, ou 60%. Entre as hipóteses está a expectativa de manter a diária de R$ 600 após a reforma, descrita como hipótese e não como promessa. Os 3 dados ausentes, como contas de energia de dois meses, têm responsável e prazo. O leitor externo diz que entendeu o objetivo e a necessidade de R$ 85.000."}, "como_ler": {"ausente": "Não existe resumo escrito do projeto. Quando alguém pergunta, a explicação muda a cada vez e não há separação entre fatos e suposições.", "parcial": "Há um texto, mas ele mistura fato e hipótese, deixa de fora riscos ou números, ou ainda não foi lido por alguém de fora do negócio.", "comprovado": "O dossiê cobre mercado, ativos, números, riscos e proposta, separa fato, hipótese e dado ausente, e um leitor externo conseguiu explicar o projeto corretamente."}, "verificacao": "Cheque cada número do dossiê contra a planilha e os documentos de origem. Peça a uma segunda pessoa para marcar qualquer frase que pareça promessa e reescreva. O dossiê funciona quando o leitor consegue apontar o que ainda falta, sem que você precise explicar.", "erro_comum": "Escrever um texto de vendas, com frases como \"negócio perfeito\" ou \"oportunidade única\". Isso afasta quem analisa com cuidado e mistura fato com opinião, o que reduz a confiança em todo o resto do material."}, {"id": "m7q9", "por_que_importa": "Negociar sem limites definidos leva a aceitar, sob pressão, condições que você não aceitaria com a cabeça fria. Saber o que é aceitável, o que precisa de mais análise e o que você recusa dá firmeza. Ter também uma alternativa à parceria evita a sensação de que é preciso fechar a qualquer custo. Compromissos sem diligência, isto é, sem checar a outra parte, são um risco.", "como_coletar": ["Liste as condições que você aceita, as que aceita só com ajustes e as que recusa de forma firme. Escreva o motivo de cada uma em uma linha.", "Defina limites numéricos quando fizer sentido, como valor máximo de aporte que você aceita assumir e prazo máximo de compromisso, usando os cálculos já feitos.", "Descreva ao menos duas alternativas à parceria, como seguir sozinho em ritmo menor, buscar outro formato ou adiar o projeto, com os custos de cada uma.", "Liste o que você precisa verificar sobre a outra parte antes de qualquer compromisso, como histórico, referências, situação documental e operações semelhantes que ela mantém.", "Combine consigo mesmo uma regra: nenhuma decisão final na primeira reunião e nenhuma assinatura sem tempo para revisão profissional."], "exemplo": {"titulo": "Limites escritos antes da conversa", "texto": "Dados fictícios: o dono define que aceita aporte do parceiro até R$ 85.000, que é a necessidade calculada, e recusa abrir mão da decisão sobre preço. Prazo máximo de compromisso: 5 anos. Alternativa A: reformar apenas 2 dos 4 quartos com recursos próprios de R$ 45.000, gastando R$ 20.000 por quarto, ou seja, 2 × 20.000 = R$ 40.000 e deixando R$ 5.000 de folga. Alternativa B: adiar um ano. Em qualquer proposta acima de R$ 85.000 ou com perda do controle de preço, a resposta inicial é pedir tempo."}, "como_ler": {"ausente": "Você não tem critérios definidos e decidiria na hora, conforme a pressão da conversa. Também não há alternativa à parceria considerada.", "parcial": "Há alguns limites na cabeça, mas não escritos, ou faltam limites numéricos, alternativas à parceria ou a lista de verificações sobre a outra parte.", "comprovado": "Existem critérios escritos com condições aceitáveis, limites numéricos, ao menos duas alternativas com custos e uma regra de não assinar nem decidir sem verificação e revisão profissional."}, "verificacao": "Releia os critérios antes de cada reunião e, depois dela, marque se algum limite foi ultrapassado. Se aconteceu, anote por quê e refaça a análise com calma. O critério funciona quando você consegue dizer \"preciso de tempo\" sem constrangimento e voltar à conversa só depois de checar tudo.", "erro_comum": "Anotar os limites só na cabeça e abandoná-los quando a outra parte insiste ou oferece um benefício imediato. Também é comum não ter alternativa e, por isso, aceitar condições ruins por medo de perder a chance."}, {"id": "m7q10", "por_que_importa": "Antes de pedir avaliação a qualquer parceiro, vale conferir se a casa está em ordem: pendências técnicas, financeiras e legais resolvidas ou, no mínimo, declaradas. Um checklist de prontidão mostra o que falta e evita enviar material incompleto. Enviar o projeto à Zion, ou a qualquer outro interessado, é uma escolha sua. A análise é opcional, depende de critérios do avaliador e não significa investimento assegurado.", "como_coletar": ["Monte um checklist com os itens dos passos anteriores: objetivo escrito, inventário, histórico, necessidade de capital, quadro de alternativas, pontos negociais, índice documental, dossiê e critérios de negociação.", "Para cada item, marque se está pronto, em andamento ou ausente, e anote a evidência. Inclua as pendências técnicas, como licenças e vistorias, financeiras, como dívidas, e legais, como regularização do imóvel.", "Peça a um profissional habilitado, como contador, advogado ou engenheiro, para olhar as pendências da sua área e dizer o que precisa ser resolvido antes de apresentar.", "Decida se quer enviar o projeto à Zion ou a outro interessado. Essa autorização é opcional e só deve ser dada por você, depois de entender quais dados serão compartilhados.", "Defina uma data para revisar o checklist e não envie nada enquanto itens críticos estiverem ausentes e sem plano."], "exemplo": {"titulo": "Checklist de prontidão preenchido", "texto": "Dados fictícios: o checklist tem 10 itens. Seis estão prontos, três em andamento e um ausente. Prontos: 6 de 10, ou 60%. O item ausente é a regularização de um documento do imóvel, que depende de profissional habilitado. O dono decide não enviar o projeto ainda, define uma data de revisão em 30 dias e registra que a decisão de enviar ou não é dele. Quando os dez itens estiverem prontos, ele decide com calma se deseja pedir uma análise."}, "como_ler": {"ausente": "Você não tem checklist, não sabe quais pendências existem e não decidiu se quer enviar o projeto a alguém. Não há plano para resolver o que falta.", "parcial": "Existe lista de itens, mas faltam pendências técnicas, financeiras ou legais, ou não há evidência por item, ou não houve revisão por profissional habilitado.", "comprovado": "O checklist cobre todos os itens e pendências, tem evidência por item, passou por profissionais habilitados e a decisão de enviar o projeto, opcional, foi tomada por você."}, "verificacao": "Revise o checklist na data marcada e compare o número de itens prontos com o da revisão anterior. Confirme que nenhum item crítico ficou ausente sem plano. Se enviar o projeto, registre quais dados foram compartilhados, com quem e quando, e lembre que a análise não significa investimento assegurado.", "erro_comum": "Enviar o material para avaliação com pressa, sem resolver pendências críticas, esperando que o parceiro \"ajude a resolver depois\". Também é erro tratar o envio como obrigação ou entender que enviar significa ter investimento assegurado."}], "fechamento": {"resumo": "Preparar-se bem é a parte do processo que depende só de você. Defina o que busca, documente o que oferece, organize números de períodos comparáveis e calcule a necessidade de capital com contingência e capital de giro. Compare modelos de parceria, escreva os pontos negociais, organize documentos com acesso restrito, monte um dossiê honesto e fixe seus limites. Só então decida se quer pedir uma avaliação. Esse caminho serve para qualquer parceria, com a Zion ou com outro interessado, e protege você de decidir com pressa.", "glossario": [{"termo": "Aporte", "definicao": "Dinheiro que alguém coloca em um projeto para viabilizá-lo."}, {"termo": "Capital de giro", "definicao": "Dinheiro para pagar os custos nos primeiros meses, antes de a receita se estabilizar."}, {"termo": "Contingência", "definicao": "Reserva para imprevistos, somada ao investimento previsto."}, {"termo": "Diligência", "definicao": "Checagem cuidadosa da outra parte e dos documentos antes de assumir um compromisso."}, {"termo": "Governança", "definicao": "Regras sobre quem decide, quem aporta, como se prestam contas e como cada um sai."}, {"termo": "Dossiê", "definicao": "Resumo organizado do projeto, com fatos, hipóteses, riscos e dados ausentes."}], "limites": "Este guia ajuda na preparação e não substitui parecer jurídico, tributário, contábil, de engenharia ou de avaliação de imóveis, que devem vir de profissionais habilitados. Não é auditoria nem análise de investimento. Parceria com a Zion é uma possibilidade opcional, sujeita a análise, sem promessa de investimento, e qualquer resultado depende de fatores externos que este material não controla."}}},AULAS={"1": {"titulo": "Sua hospedagem tem identidade?", "paragrafos": ["Olá! Hoje vamos analisar identidade da sua hospedagem. Antes de investir, precisamos entender a situação real. Abra o formulário e acompanhe comigo.", "Você conhece o motivo da viagem do hóspede? Classifique as últimas 20 reservas por motivo declarado, sem presumir perfil. O que queremos obter é: distribuição por motivo. Se houver uma lacuna, uma ação possível é: escolha um segmento para testar uma oferta.", "Você compara ofertas equivalentes? Selecione cinco hospedagens da mesma região, capacidade e padrão; compare datas iguais. O que queremos obter é: tabela com preço total e serviços. Se houver uma lacuna, uma ação possível é: identifique uma lacuna de oferta.", "Sua promessa é específica? Escreva uma frase com público, experiência e diferencial verificável. O que queremos obter é: frase publicada. Se houver uma lacuna, uma ação possível é: teste duas versões do título.", "As imagens mostram os diferenciais reais? Ordene fotos por impacto, ambiente, conforto e detalhes; elimine imagens enganosas. O que queremos obter é: sequência revisada. Se houver uma lacuna, uma ação possível é: fotografe os três atributos mais relevantes.", "O anúncio responde às dúvidas essenciais? Liste acesso, capacidade, regras, privacidade e itens incluídos. O que queremos obter é: descrição revisada. Se houver uma lacuna, uma ação possível é: corrija as cinco dúvidas mais frequentes.", "A comunicação é consistente? Compare site, redes e anúncios quanto a nome, tom e promessa. O que queremos obter é: inventário de canais. Se houver uma lacuna, uma ação possível é: padronize informações divergentes.", "Você conhece os elogios e críticas recorrentes? Agrupe avaliações recentes por tema e frequência. O que queremos obter é: mapa de avaliações. Se houver uma lacuna, uma ação possível é: priorize a crítica recorrente mais controlável.", "Seu pacote é claro? Separe itens inclusos, extras e condições de cancelamento. O que queremos obter é: ficha da oferta. Se houver uma lacuna, uma ação possível é: teste um pacote sem desconto indiscriminado.", "Você mede a resposta à oferta? Registre visitas e reservas atribuíveis ao mesmo canal e período. O que queremos obter é: taxa de conversão. Se houver uma lacuna, uma ação possível é: altere uma variável por teste.", "Você registra aprendizados? Compare períodos equivalentes e anote eventos externos. O que queremos obter é: diário de testes. Se houver uma lacuna, uma ação possível é: mantenha apenas mudanças sustentadas por evidências.", "Agora responda ao formulário com evidências. Se não souber, marque desconhecido. Escolha uma ação e registre o prazo. Na próxima etapa, vamos consolidar seu plano de ação."]}, "2": {"titulo": "Por que seu calendário está vazio?", "paragrafos": ["Olá! Hoje vamos analisar vendas da sua hospedagem. Antes de investir, precisamos entender a situação real. Abra o formulário e acompanhe comigo.", "Você registra noites disponíveis? Some unidades-noite abertas à venda e registre bloqueios separadamente. O que queremos obter é: inventário mensal. Se houver uma lacuna, uma ação possível é: corrija bloqueios indevidos.", "Você acompanha noites vendidas? Divida noites vendidas por disponíveis no mesmo período. O que queremos obter é: ocupação mensal. Se houver uma lacuna, uma ação possível é: separe dias úteis e fins de semana.", "Você compara meses equivalentes? Organize 12 meses de ocupação, eventos e preços. O que queremos obter é: calendário anual. Se houver uma lacuna, uma ação possível é: planeje campanhas antes da baixa temporada.", "Você conhece a origem das reservas? Separe vendas diretas e intermediadas, sem duplicar reservas. O que queremos obter é: participação por canal. Se houver uma lacuna, uma ação possível é: priorize canais com margem e demanda.", "Você calcula receita líquida por canal? Subtraia comissões e custos de aquisição atribuíveis. O que queremos obter é: receita líquida por canal. Se houver uma lacuna, uma ação possível é: revise canais caros sem cortar demanda útil.", "Você conhece a janela de compra? Calcule dias entre reserva e chegada. O que queremos obter é: mediana por segmento. Se houver uma lacuna, uma ação possível é: antecipe ofertas conforme a janela observada.", "Você revisa estadia mínima? Identifique lacunas que regras de estadia impedem vender. O que queremos obter é: lista de lacunas. Se houver uma lacuna, uma ação possível é: teste regras em datas selecionadas.", "Você ajusta preço com evidência? Compare ocupação futura e preço total dos concorrentes. O que queremos obter é: histórico de preços. Se houver uma lacuna, uma ação possível é: teste ajustes limitados e monitore margem.", "Você acompanha consultas não convertidas? Registre tempo de resposta e motivo de perda quando informado. O que queremos obter é: registro de consultas. Se houver uma lacuna, uma ação possível é: crie respostas claras e rápidas.", "Você mede resultado comercial? Compare receita por unidade disponível antes e depois, controlando sazonalidade. O que queremos obter é: relatório de teste. Se houver uma lacuna, uma ação possível é: interrompa mudanças que reduzem contribuição.", "Agora responda ao formulário com evidências. Se não souber, marque desconhecido. Escolha uma ação e registre o prazo. Na próxima etapa, vamos consolidar seu plano de ação."]}, "3": {"titulo": "Sua diária vale mais?", "paragrafos": ["Olá! Hoje vamos analisar experiência da sua hospedagem. Antes de investir, precisamos entender a situação real. Abra o formulário e acompanhe comigo.", "Você mapeia a experiência completa? Descreva etapas da descoberta ao pós-estadia. O que queremos obter é: mapa da jornada. Se houver uma lacuna, uma ação possível é: corrija o ponto de maior atrito.", "O acesso é bem explicado? Simule a chegada de um visitante sem conhecimento local. O que queremos obter é: instruções testadas. Se houver uma lacuna, uma ação possível é: envie orientação antes da viagem.", "Você verifica conforto e funcionalidade? Inspecione cama, temperatura, ruído, iluminação e banho. O que queremos obter é: checklist de inspeção. Se houver uma lacuna, uma ação possível é: corrija falhas essenciais antes de adicionar luxo.", "A privacidade anunciada é real? Verifique linhas de visão, circulação e ruídos. O que queremos obter é: mapa de exposição. Se houver uma lacuna, uma ação possível é: ajuste comunicação e barreiras permitidas.", "Você oferece atividades relevantes? Identifique desejos reais e fornecedores habilitados. O que queremos obter é: catálogo de experiências. Se houver uma lacuna, uma ação possível é: teste uma experiência de baixo custo.", "Você controla qualidade e custo dos alimentos? Registre ingredientes, perdas e requisitos sanitários. O que queremos obter é: ficha de custo. Se houver uma lacuna, uma ação possível é: padronize uma oferta segura.", "Você conhece o valor dos extras? Compare disposição a pagar observada e custo incremental. O que queremos obter é: margem por extra. Se houver uma lacuna, uma ação possível é: retire extras sem demanda ou margem.", "Você responde e aprende com avaliações? Classifique comentários e registre correções. O que queremos obter é: histórico de melhorias. Se houver uma lacuna, uma ação possível é: responda com fatos e respeito.", "Você calcula diária realizada? Divida receita de hospedagem por noites vendidas. O que queremos obter é: adr mensal. Se houver uma lacuna, uma ação possível é: compare com ocupação e revpar.", "Você avalia preço e ocupação juntos? Divida receita de hospedagem por unidades-noite disponíveis. O que queremos obter é: revpar mensal. Se houver uma lacuna, uma ação possível é: teste preço sem presumir demanda constante.", "Agora responda ao formulário com evidências. Se não souber, marque desconhecido. Escolha uma ação e registre o prazo. Na próxima etapa, vamos consolidar seu plano de ação."]}, "4": {"titulo": "Você fatura ou realmente lucra?", "paragrafos": ["Olá! Hoje vamos analisar finanças da sua hospedagem. Antes de investir, precisamos entender a situação real. Abra o formulário e acompanhe comigo.", "Você separa hospedagem de extras? Classifique receitas por competência e concilie recebimentos. O que queremos obter é: demonstrativo mensal. Se houver uma lacuna, uma ação possível é: separe adiantamentos de receita realizada.", "Você conhece despesas recorrentes? Liste aluguel, salários, sistemas e contratos. O que queremos obter é: total fixo mensal. Se houver uma lacuna, uma ação possível é: revise contratos sem comprometer qualidade.", "Você conhece custo por estadia? Some limpeza, insumos, comissões e outros custos incrementais. O que queremos obter é: custo por noite ou reserva. Se houver uma lacuna, uma ação possível é: padronize unidades de cálculo.", "Você calcula contribuição? Subtraia custos variáveis da receita. O que queremos obter é: margem de contribuição. Se houver uma lacuna, uma ação possível é: priorize ofertas com contribuição positiva.", "Você conhece ocupação mínima? Divida custo fixo pela contribuição por noite e capacidade. O que queremos obter é: ocupação de equilíbrio. Se houver uma lacuna, uma ação possível é: revise preço e custos se superar capacidade.", "Você projeta entradas e saídas? Monte fluxo semanal incluindo dívidas e impostos. O que queremos obter é: saldo projetado. Se houver uma lacuna, uma ação possível é: planeje reserva para períodos deficitários.", "Você conhece compromissos financeiros? Liste parcelas, vencimentos e encargos. O que queremos obter é: agenda de pagamentos. Se houver uma lacuna, uma ação possível é: negocie com orientação especializada quando necessário.", "Você reserva recursos para reposição? Estime vida útil e custo de reposição dos ativos. O que queremos obter é: plano de reposição. Se houver uma lacuna, uma ação possível é: inclua provisão no planejamento.", "Você distingue resultado operacional de caixa? Separe despesas operacionais, investimentos e financiamento. O que queremos obter é: conciliação de resultado e caixa. Se houver uma lacuna, uma ação possível é: revise com contador.", "Você testa hipóteses adversas? Simule queda de ocupação, preço e aumento de custos. O que queremos obter é: três cenários. Se houver uma lacuna, uma ação possível é: defina gatilhos de contenção.", "Agora responda ao formulário com evidências. Se não souber, marque desconhecido. Escolha uma ação e registre o prazo. Na próxima etapa, vamos consolidar seu plano de ação."]}, "5": {"titulo": "Sua hospedagem funciona sem você?", "paragrafos": ["Olá! Hoje vamos analisar operação da sua hospedagem. Antes de investir, precisamos entender a situação real. Abra o formulário e acompanhe comigo.", "Cada tarefa tem responsável? Liste atividades diárias e substitutos. O que queremos obter é: matriz de responsabilidades. Se houver uma lacuna, uma ação possível é: defina responsável e prazo.", "Existe padrão verificável de limpeza? Crie sequência por ambiente e inspeção final. O que queremos obter é: checklist assinado. Se houver uma lacuna, uma ação possível é: treine e audite amostras.", "
