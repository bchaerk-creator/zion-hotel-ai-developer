/li><li><b>Noites vendidas</b>: noites efetivamente ocupadas por hóspedes pagantes.</li><li><b>Diária média</b>: quanto você recebeu, em média, por noite vendida.</li><li><b>Reservas</b>: quantas estadias diferentes aconteceram.</li></ul><p>Com eles calculamos a <b>ocupação</b> (vendidas ÷ disponíveis), a <b>receita por noite disponível</b> (receita ÷ noites disponíveis) e a <b>estadia média</b> (noites vendidas ÷ reservas). A receita por noite disponível junta preço e ocupação num número só: é ela que mostra se baixar a diária está realmente ajudando.</p>",example:"Exemplo ilustrativo: 30 noites disponíveis, 9 vendidas a R$ 250. Ocupação de 30%, receita de R$ 2.250 e receita por noite disponível de R$ 75. Se baixar para R$ 200 e vender 11 noites, a receita por noite disponível vai a R$ 73,33: vendeu mais noites, mas ganhou menos por noite aberta."},{kind:"compare",title:"Achismo × diagnóstico",cols:[{h:"Achismo",type:"bad",items:["“O mês foi fraco” sem saber quantas noites foram vendidas","Comparar com o mês de alta temporada","Olhar só o faturamento total","Concluir que o problema é preço sem olhar o resto"]},{h:"Diagnóstico",type:"good",items:["Ocupação calculada com noites disponíveis reais","Comparar o mesmo mês ou meses parecidos","Acompanhar receita por noite disponível","Testar uma hipótese por vez e medir"]}]},{kind:"form",title:"Os números do seu último mês",intro:"Use o último mês completo. Some todas as unidades.",fields:[{id:"noites_disp",label:"Noites disponíveis no mês (todas as unidades)",type:"number",required:!0,min:1,max:6200,step:1,unit:"noites",help:"Ex.: 1 unidade aberta o mês todo = 30. Desconte bloqueios de uso próprio ou manutenção."},{id:"noites_vend",label:"Noites vendidas no mês",type:"number",required:!0,min:0,max:6200,step:1,unit:"noites",validate:function(e,a){var o=a.n("noites_disp");return ZA.isNum(o)&&e>o?"Noites vendidas não podem passar das disponíveis.":""}},{id:"diaria_media",label:"Diária média recebida",type:"money",required:!
