ter({id:"B06",code:"ZAR-B06",collection:"Terrenos",title:"Como Saber Quanto Custa Construir uma Hospedagem?",subtitle:"Monte Seu Orçamento de Implantação",tool:"Calculadora de Implantação Turística",deliverable:"Orçamento Preliminar de Implantação",nameField:"nome",propertyField:"propriedade",disclaimer:"Este orçamento é preliminar e soma apenas os valores que você informou (cotações e estimativas próprias). A Zion não fornece preços de mercado. Custos de obra mudam com o projeto, o terreno, o fornecedor e o tempo: confirme cada item com orçamentos formais e com engenheiro ou arquiteto habilitado. Licenças, regularização e exigências ambientais devem ser verificadas com a prefeitura, o órgão ambiental e profissionais habilitados; este material não garante aprovação, prazo nem custo final.",intro:[{kind:"mirror",title:"Você sabe o preço da cabana. Mas sabe quanto custa deixar tudo pronto?",lead:"Você viu o valor de uma cabana pronta, fez a conta de quantas cabem no terreno e imaginou o investimento. Mas, quando começa a perguntar, aparecem estrada, energia, fossa, projeto, taxa, móveis, enxoval… e o número não para de crescer.",body:'<div class="za-card"><p>Se você se reconhece em alguma destas situações, esta mini mentoria foi feita para você:</p><ul><li>“Tenho o orçamento da cabana, mas não sei quanto custa o resto.”</li><li>“Não sei se preciso de projeto, licença ou responsável técnico.”</li><li>“Tenho medo de começar a obra e o dinheiro acabar no meio.”</li><li>“Não sei quanto guardar para os primeiros meses de operação.”</li></ul></div>'},{kind:"collapse",title:"O preço de uma unidade de hospedagem pode representar apenas parte do investimento necessário.",lead:"Uma cabana precisa de chão firme, acesso, água, energia, esgoto, documentação, mobília e caixa para funcionar até as reservas engrenarem. Quem orça só a unidade orça só uma parte do projeto.",body:'<div class="za-card"><p>Um orçamento de implantação completo tem <b>seis blocos</b>:</p><ol><li>Projetos, licenças e documentação</li><li>Infraestrutura do terreno</li><li>Construção e instalação das unidades e áreas comuns</li><li>Mobiliário, equipamentos e pré-operação</li><li>Capital de giro para os primeiros meses</li><li>Contingência para imprevistos</li></ol><p>Neste percurso, você preenche cada bloco com <b>as suas cotações</b>. A ferramenta soma, mostra a composição e monta três cenários. Nenhum preço é inventado pela ferramenta.</p></div>'},{kind:"start",title:"Vamos montar o seu orçamento de implantação",lead:"Em 7 pilares, você vai listar tudo o que custa para colocar a hospedagem em funcionamento e sair com um orçamento preliminar em três cenários.",body:"<p>Tenha à mão, se possível: orçamentos de fornecedores de cabanas ou construtoras, cotações de terraplanagem, poço, fossa e energia, e uma lista de móveis e enxoval. Se ainda não tiver um valor, marque “não sei” onde houver essa opção ou deixe a linha em branco. O relatório mostrará o que ficou de fora.</p>",fields:[{id:"nome",label:"Seu nome",type:"text",required:!0,placeholder:"Ex.: Marta"},{id:"propriedade",label:"Nome do projeto ou da propriedade",type:"text",required:!0,placeholder:"Ex.: Refúgio Serra Azul"},{id:"municipio",label:"Município / região do terreno",type:"text",required:!0,placeholder:"Ex.: Alto Paraíso (GO)"},{id:"modelo",label:"Modelo de hospedagem que você pretende implantar",type:"select",required:!0,options:[{v:"cabana",l:"Cabanas"},{v:"chale",l:"Chalés"},{v:"glamping",l:"Glamping (tendas, domos, bolhas)"},{v:"container",l:"Módulos / contêineres"},{v:"pousada",l:"Pequena pousada"},{v:"outro",l:"Outro"}]}]}],pillars:[{title:"Modelo de hospedagem",screens:[{kind:"learn",title:"O modelo define o tamanho da conta",body:"<p>Antes de orçar, é preciso saber <b>o que</b> será construído. O modelo (cabana, chalé, glamping, módulo, pousada) e o <b>padrão de acabamento</b> mudam praticamente todos os itens: fundação, área construída, instalações, mobiliário e até o tipo de licença exigida.</p><p>Por isso, o primeiro passo é descrever a unidade-padrão: área aproximada, padrão (econômico, intermediário ou alto) e o que vem incluído na cotação do fornecedor. Uma cotação “cabana pronta” pode incluir ou não fundação, instalação elétrica, hidráulica, frete e montagem.</p><p>Também importa a <b>qualidade da informação</b>: uma cotação formal por escrito vale mais do que um valor visto num anúncio.</p>",example:"Exemplo ilustrativo: duas cotações de “cabana de 30 m²” podem parecer próximas, mas uma inclui fundação e montagem e a outra entrega apenas o kit. Comparar sem ler o escopo pode criar uma diferença grande no orçamento final."},{kind:"compare",title:"Cotação incompleta × cotação comparável",cols:[{h:"Cotação que engana",type:"bad",items:["Valor de anúncio ou de conversa informal","Não diz o que está incluído","Sem prazo de validade","Sem frete, montagem ou fundação"]},{h:"Cotação comparável",type:"good",items:["Por escrito, com data e validade","Escopo detalhado: o que está e o que não está incluído","Mesma área e mesmo padrão para comparar fornecedores","Frete, montagem e fundação discriminados"]}]},{kind:"form",title:"Descreva a unidade-padrão",intro:"Pense na unidade de hospedagem que se repetirá no projeto.",fields:[{id:"padrao",label:"Padrão de acabamento pretendido",type:"radio",required:!0,options:[{v:"economico",l:"Econômico"},{v:"intermediario",l:"Intermediário"},{v:"alto",l:"Alto padrão"}]},{id:"area_unid",label:"Área aproximada de cada unidade",type:"number",required:!0,min:1,max:2e3,step:1,unit:"m²",allowUnknown:!0},{id:"qualidade_cot",label:"Que tipo de valores você tem hoje?",type:"radio",required:!0,options:[{v:"formal",l:"Cotações formais por escrito"},{v:"informal",l:"Valores de conversa, anúncio ou site"},{v:"nenhum",l:"Ainda não tenho valores, vou buscar"}]},{id:"n_cotacoes",label:"Quantos fornecedores você consultou para a unidade?",type:"number",required:!0,min:0,max:50,step:1,unit:"fornecedor(es)"}]},{kind:"feedback",title:"A qualidade do seu ponto de partida",metrics:function(a,o){return[{label:"Padrão",value:{economico:"Econômico",intermediario:"Intermediário",alto:"Alto padrão"}[a.t("padrao")]||"—",tag:"informado"},{label:"Área por unidade",value:a.has("area_unid")?e.num(a.n("area_unid"))+" m²":"—",tag:"informado"},{label:"Fornecedores consultados",value:e.num(a.n("n_cotacoes",0)),tag:"informado"}]},feedback:function(a,o){var r=[],i=a.t("qualidade_cot"),t=a.n("n_cotacoes",0);return"formal"===i&&r.push({lv:"ok",t:"Você trabalha com cotações formais. Isso dá muito mais confiança ao orçamento. Confira a validade de cada uma."}),"informal"===i&&r.push({lv:"warn",t:"Valores de conversa ou anúncio servem para uma primeira noção, mas o relatório deve ser lido como <b>estimativa</b>. Peça propostas por escrito com escopo detalhado."}),"nenhum"===i&&r.push({lv:"bad",t:"Sem valores, o orçamento ainda não pode ser fechado. Use este percurso como <b>roteiro de cotação</b>: cada linha que você deixar em branco é um pedido de orçamento a fazer."}),t<3?r.push({lv:"warn",t:"Você consultou "+e.num(t)+" fornecedor(es). Comparar pelo menos 3 propostas com o mesmo escopo ajuda a identificar valores fora da curva."}):r.push({lv:"ok",t:e.num(t)+" fornecedores consultados: boa base para comparação."}),a.unknown("area_unid")&&r.push({lv:"warn",t:"Sem a área da unidade, não será possível calcular o custo por m². Defina pelo menos uma área aproximada com o fornecedor ou arquiteto."}),r}},{kind:"apply",title:"Compromissos do Pilar 1",actions:[{id:"a1_1",text:"Pedir propostas por escrito a pelo menos 3 fornecedores, com o mesmo escopo"},{id:"a1_2",text:"Montar uma planilha comparando o que cada cotação inclui e não inclui"},{id:"a1_3",text:"Definir a área e o padrão da unidade antes de pedir novos orçamentos"}]}]},{title:"Quantidade de unidades",screens:[{kind:"learn",title:"Quantas unidades: a decisão que multiplica tudo",body:"<p>O número de unidades multiplica o custo de construção e de mobiliário, mas <b>não multiplica</b> boa parte da infraestrutura: a estrada de acesso, o padrão de energia e o projeto servem para 2 ou para 6 unidades (com ajustes). Por isso, o <b>custo por unidade</b> costuma cair quando a quantidade aumenta, mas o desembolso total sobe.</p><p>A quantidade deve nascer de três limites: o que o terreno comporta (e a legislação permite), o que a demanda sustenta e o que o seu orçamento alcança. Escolher pelo terreno sem olhar o orçamento é o caminho mais curto para uma obra parada.</p>",example:"Exemplo ilustrativo: R$ 60.000 de infraestrutura divididos por 2 unidades pesam R$ 30.000 em cada uma; divididos por 5, pesam R$ 12.000. Mas 5 unidades exigem muito mais capital total."},{kind:"compare",title:"Como decidir a quantidade",cols:[{h:"Decisões arriscadas",type:"bad",items:["“Cabem 10 no terreno, então vou fazer 10”","Copiar a quantidade de outro empreendimento","Ignorar o limite de ocupação permitido pela prefeitura","Decidir sem saber o custo total"]},{h:"Decisão estruturada",type:"good",items:["Partir do orçamento disponível e do custo total por unidade","Confirmar com a prefeitura e um profissional o que é permitido","Considerar começar menor e expandir por etapas","Olhar a demanda do destino antes de multiplicar"]}]},{kind:"form",title:"Quantas unidades você pretende implantar",intro:"Considere o projeto que você quer orçar agora.",fields:[{id:"unidades",label:"Quantidade de unidades de hospedagem",type:"number",required:!0,min:1,max:200,step:1,unit:"unidade(s)"},{id:"hospedes_unid",label:"Hóspedes por unidade (capacidade)",type:"number",required:!0,min:1,max:30,step:1,unit:"pessoas"},{id:"motivo_qtd",label:"O que mais definiu essa quantidade?",type:"radio",required:!0,options:[{v:"orcamento",l:"O orçamento que tenho"},{v:"terreno",l:"O espaço do terreno"},{v:"demanda",l:"A demanda que pesquisei"},{v:"intuicao",l:"Intuição / referência de outro lugar"}]}]},{kind:"feedback",title:"O tamanho do seu projeto",metrics:function(a,o){return[{label:"Unidades",value:e.num(o.U),tag:"informado"},{label:"Capacidade total",value:e.num(o.leitos)+" hóspedes",tag:"calculado"}]},feedback:function(a,o){var r=[],i=a.t("motivo_qtd");return"terreno"===i&&r.push({lv:"warn",t:"A quantidade foi definida pelo espaço do terreno. Confira se o orçamento acompanha: no Pilar 7 você verá quanto custa cada unidade com toda a infraestrutura."}),"intuicao"===i&&r.push({lv:"warn",t:"Quantidade definida por intuição. Use o custo total por unidade (Pilar 7) e a demanda do destino para validar esse número."}),"orcamento"===i&&r.push({lv:"ok",t:"Você partiu do orçamento. Ótimo: o Pilar 7 vai mostrar se as "+e.num(o.U)+" unidades cabem nele com contingência."}),"demanda"===i&&r.push({lv:"ok",t:"Quantidade baseada em demanda pesquisada. Guarde as fontes dessa pesquisa para o relatório."}),o.U>=8&&r.push({lv:"info",t:"Com "+e.num(o.U)+" unidades, avalie implantar por etapas: começar com parte das unidades reduz o capital inicial e permite testar a demanda."}),r.push({lv:"info",t:"Capacidade total de "+e.num(o.leitos)+" hóspedes simultâneos. Esse número influencia exigências de água, esgoto, estacionamento e, em alguns municípios, o tipo de licença."}),r}},{kind:"apply",title:"Compromissos do Pilar 2",actions:[{id:"a2_1",text:"Consultar a prefeitura sobre o limite de ocupação e o uso permitido no terreno"},{id:"a2_2",text:"Simular o orçamento com menos unidades para comparar"},{id:"a2_3",text:"Registrar de onde veio a quantidade escolhida (orçamento, terreno ou demanda)"}]}]},{title:"Projetos e licenças",screens:[{kind:"learn",title:"Projetos e licenças: o custo que vem antes do primeiro tijolo",body:"<p>Antes de construir, um empreendimento de hospedagem geralmente passa por etapas técnicas e documentais: levantamento topográfico, projeto arquitetônico, projetos complementares (estrutural, elétrico, hidráulico, sanitário), estudos e licenças ambientais quando exigidos, alvarás e taxas municipais, regularização do imóvel e responsável técnico (ART ou RRT).</p><p>Quais etapas se aplicam ao seu caso depende do município, do tamanho do projeto, da localização (por exemplo, áreas de preservação) e da situação documental do terreno. <b>Quem define isso são a prefeitura, o órgão ambiental e os profissionais habilitados</b> (arquiteto, engenheiro, advogado). Aqui você só registra os custos que levantou com eles.</p>",example:"Exemplo ilustrativo: um proprietário que orçou R$ 0 para projetos e licenças descobre, ao pedir o alvará, que precisa de topografia, projeto e responsável técnico. O custo e o prazo dessas etapas entram depois, quando o dinheiro já foi para a obra."},{kind:"compare",title:"Pular etapas × planejar etapas",cols:[{h:"Pular etapas",type:"bad",items:["Construir antes de saber o que a prefeitura permite","Não ter responsável técnico pela obra","Deixar a regularização do terreno para depois","Descobrir exigências ambientais no meio da obra"]},{h:"Planejar etapas",type:"good",items:["Consulta prévia à prefeitura sobre uso e ocupação","Orçar projetos e responsável técnico desde o início","Verificar a documentação do imóvel com advogado","Consultar o órgão ambiental antes de definir a implantação"]}]},{kind:"form",title:"Seus custos de projetos, licenças e documentação",intro:"Informe o valor total de cada item para o projeto inteiro. Deixe em branco o que não se aplica ou o que ainda não foi cotado.",fields:[{id:"projetos",label:"Projetos, licenças e documentação",type:"list",required:!0,preset:["Levantamento topográfico","Projeto arquitetônico","Projetos complementares (estrutural, elétrico, hidráulico)","Estudos e licenças ambientais","Alvarás e taxas municipais","Regularização documental / cartório","Responsável técnico (ART/RRT) e acompanhamento"],namePlaceholder:"Item",valuePlaceholder:"R$ total"},{id:"status_lic",label:"Em que ponto está a parte de licenças?",type:"radio",required:!0,options:[{v:"nada",l:"Ainda não comecei"},{v:"consulta",l:"Já fiz consulta prévia à prefeitura ou ao órgão ambiental"},{v:"andamento",l:"Processo em andamento"},{v:"aprovado",l:"Já tenho as aprovações necessárias"}]}]},{kind:"feedback",title:"O peso dos projetos e licenças",metrics:function(a,o){return[{label:"Projetos e licenças",value:e.brl(o.projetos),tag:"calculado"},{label:"Itens orçados",value:e.num(o.projItens)+" de "+e.num((a.v.projetos||[]).length),tag:"calculado"}]},feedback:function(a,o){var r=[],i=a.t("status_lic");return o.projItens<3?r.push({lv:"warn",t:"Apenas "+e.num(o.projItens)+" item(ns) de projeto e licença têm valor. Confirme com arquiteto ou engenheiro quais etapas se aplicam ao seu caso antes de considerar esse bloco fechado."}):r.push({lv:"ok",t:e.num(o.projItens)+" itens de projetos e licenças orçados, somando "+e.brl(o.projetos)+"."}),o.temResp||r.push({lv:"warn",t:"Não há valor para responsável técnico (ART/RRT). Em obras, normalmente é exigido um profissional habilitado responsável. Confirme com a prefeitura."}),"nada"===i&&r.push({lv:"bad",t:"As licenças ainda não foram iniciadas. Antes de contratar a obra, faça uma consulta prévia à prefeitura e, se houver área sensível, ao órgão ambiental. Prazos de aprovação podem afetar todo o cronograma."}),"consulta"===i&&r.push({lv:"info",t:"Você já fez consulta prévia. Registre por escrito o que foi orientado e confirme com um profissional habilitado."}),"aprovado"===i&&r.push({lv:"ok",t:"Aprovações já obtidas. Guarde os documentos: eles serão pedidos por sócios, financiadores e seguradoras."}),r}},{kind:"apply",title:"Compromissos do Pilar 3",actions:[{id:"a3_1",text:"Fazer a consulta prévia de uso e ocupação do solo na prefeitura"},{id:"a3_2",text:"Pedir a um arquiteto ou engenheiro a lista de projetos e licenças necessários"},{id:"a3_3",text:"Verificar a documentação do terreno com um advogado ou no cartório"}]}]},{title:"Infraestrutura",screens:[{kind:"learn",title:"Infraestrutura: o investimento que o hóspede não vê, mas sente",body:"<p>Terrenos rurais e áreas de natureza raramente estão prontos para receber hóspedes. A infraestrutura inclui: acesso e estrada interna, terraplanagem, rede elétrica e padrão de entrada, água (poço, caixa d’água, rede), tratamento de esgoto, internet, estacionamento, iluminação externa, paisagismo e trilhas.</p><p>Esse bloco costuma ser o mais subestimado porque depende do terreno: distância da rede de energia, tipo de solo, declividade, disponibilidade de água. Só um levantamento no local, com fornecedores e profissionais, dá o valor real.</p>",example:"Exemplo ilustrativo: uma cabana pode custar o mesmo em dois terrenos, mas num deles a rede elétrica está na porteira e no outro a centenas de metros. A diferença está toda na infraestrutura."},{kind:"compare",title:"O que o terreno já tem × o que precisa ser feito",cols:[{h:"Erros comuns",type:"bad",items:["Supor que “depois a gente puxa a luz”","Não testar vazão e qualidade da água","Esquecer o tratamento de esgoto","Não prever estacionamento e iluminação"]},{h:"Boa prática",type:"good",items:["Listar o que existe e o que falta, item por item","Pedir orçamento à concessionária de energia","Consultar profissional sobre poço e tratamento de esgoto","Orçar acesso transitável em época de chuva"]}]},{kind:"form",title:"Infraestrutura do terreno",intro:"Primeiro marque o que o terreno <b>já tem</b> funcionando. Depois informe o custo total do que precisa ser feito.",fields:[{id:"infra_existe",label:"O terreno já tem, funcionando:",type:"checks",options:[{v:"acesso",l:"Acesso transitável o ano todo"},{v:"energia",l:"Energia elétrica no local"},{v:"agua",l:"Água em quantidade suficiente"},{v:"esgoto",l:"Solução de esgoto adequada"},{v:"internet",l:"Internet / sinal de celular"}]},{id:"infra",label:"Custos de infraestrutura",type:"list",required:!0,preset:["Acesso e estrada interna","Terraplanagem e drenagem","Rede elétrica e padrão de entrada","Água (poço, caixa, rede)","Tratamento de esgoto","Internet","Estacionamento","Iluminação externa","Paisagismo e trilhas"],namePlaceholder:"Item",valuePlaceholder
