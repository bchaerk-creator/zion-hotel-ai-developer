o",t:"Público corporativo costuma precisar de estrutura coletiva (salas, refeições). Confira se a nota da pousada reflete isso."}),a}},{kind:"apply",title:"Compromissos do Pilar 2",actions:[{id:"a2_1",text:"Ler avaliações de 10 hospedagens do destino e anotar o perfil dos hóspedes"},{id:"a2_2",text:"Conversar com 3 pessoas do trade local (guias, restaurantes, secretaria de turismo)"},{id:"a2_3",text:"Descrever em uma frase o hóspede ideal do projeto"}]}]},{title:"Modelos disponíveis",screens:[{kind:"learn",title:"Conheça os quatro modelos antes de dar nota",body:"<ul><li><b>Cabana:</b> unidade independente, geralmente de madeira ou sistema construtivo industrializado, com privacidade e apelo de natureza.</li><li><b>Glamping:</b> estrutura leve (tenda, domo, bolha) com conforto de hotel. Costuma ter apelo visual forte; o conforto térmico e a durabilidade dependem muito do projeto e do clima.</li><li><b>Chalé:</b> unidade independente em alvenaria ou estrutura mista, normalmente mais robusta e com mais área.</li><li><b>Pousada:</b> várias acomodações numa estrutura com áreas comuns e, frequentemente, serviços como café da manhã e recepção.</li></ul><p>Neste pilar, a nota é sobre <b>atratividade e diferenciação</b>: quanto cada modelo, no seu destino, se destacaria diante do que já existe.</p>",example:"Exemplo ilustrativo: num destino com muitas pousadas tradicionais e nenhum glamping, um proprietário deu nota 5 para glamping em diferenciação e 2 para pousada. Num destino cheio de domos, a lógica poderia ser a inversa."},{kind:"compare",title:"Diferenciação real × moda passageira",cols:[{h:"Moda",type:"bad",items:["Repetir o modelo que está em alta nas redes","Escolher pelo que o fornecedor vende","Não olhar o que os concorrentes já oferecem"]},{h:"Diferenciação",type:"good",items:["Contar quantos concorrentes oferecem cada modelo","Combinar o modelo com um atrativo do terreno (vista, rio, mata)","Pensar se a proposta continua interessante daqui a alguns anos"]}]},{ki
