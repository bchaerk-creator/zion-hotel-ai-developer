<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-label="Corte do terreno com a parte acima de 30% de inclinação marcada; uma régua de 10 metros para a frente e 3 para cima; curvas de nível juntas onde o chão sobe rápido"><rect width="1600" height="1800" fill="#ECE5D8"/><defs><pattern id="hr" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="22" stroke="#B5482F" stroke-width="4"/></pattern></defs><text x="240.0" y="330.0" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="600" fill="#8A6D2F" text-anchor="start" letter-spacing="3">CORTE</text><path d="M210 960 L520 930 L760 870 L900 700 L1040 540 L1200 500 L1390 480 L1390 1040 L210 1040 Z" fill="#E2D9C7" stroke="#16261C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M760 870 L900 700 L1040 540 L1040 1040 L760 1040 Z" fill="url(#hr)" opacity="0.55"/><path d="M760.0 870.0 L900.0 700.0 L1040.0 540.0" fill="none" stroke="#B5482F" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><text x="1060.0" y="760.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="600" fill="#B5482F" text-anchor="start" letter-spacing="0">acima de 30%</text><line x1="300.0" y1="1220.0" x2="800.0" y2="1220.0" stroke="#16261C" stroke-width="5" stroke-linecap="round"/><line x1="800.0" y1="1220.0" x2="800.0" y2="1070.0" stroke="#8A6D2F" stroke-width="7" stroke-linecap="round"/><line x1="300.0" y1="1220.0" x2="800.0" y2="1070.0" stroke="#16261C" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/><text x="550.0" y="1280.0" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="500" fill="#16261C" text-anchor="middle" letter-spacing="0">10 m para a frente</text><text x="830.0" y="1160.0" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="600" fill="#8A6D2F" text-anchor="start" letter-spacing="0">3 m para cima</text><rect x="860.0" y="1190.0" width="230.0" height="74.0" rx="37" fill="#8A6D2F"/><text x="975.0" y="1240.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#ECE5D8" text-anchor="middle" letter-spacing="0">= 30%</text><text x="240.0" y="1400.0" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="600" fill="#8A6D2F" text-anchor="start" letter-spacing="3">DE CIMA: CURVAS DE NÍVEL</text><path d="M260 1460 C320 1540 220 1620 290 1700" fill="none" stroke="#16261C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M400 1460 C460 1540 360 1620 430 1700" fill="none" stroke="#16261C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M540 1460 C600 1540 500 1620 570 1700" fill="none" stroke="#16261C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M640 1460 C700 1540 600 1620 670 1700" fill="none" stroke="#B5482F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M690 1460 C750 1540 650 1620 720 1700" fill="none" stroke="#B5482F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M740 1460 C800 1540 700 1620 770 1700" fill="none" stroke="#B5482F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M860 1460 C920 1540 820 1620 890 1700" fill="none" stroke="#16261C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="960.0" y="1560.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" fill="#16261C" text-anchor="start" letter-spacing="0">linhas juntas =</text><text x="960.0" y="1615.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="600" fill="#B5482F" text-anchor="start" letter-spacing="0">chão que sobe rápido</text></svg>