<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-label="A decisão escrita: avançar, ajustar ou parar; embaixo, os três caminhos: fazer sozinho com o Dossiê, levar ao banco ou a um investidor e conversar com a Zion, que avalia cada caso"><rect width="1600" height="1800" fill="#ECE5D8"/><text x="800.0" y="250.0" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="700" fill="#16261C" text-anchor="middle" letter-spacing="0">A decisão, escrita</text><line x1="520.0" y1="295.0" x2="1080.0" y2="295.0" stroke="#8A6D2F" stroke-width="4" stroke-linecap="round"/><rect x="130.0" y="360.0" width="400.0" height="120.0" rx="60" fill="#16261C"/><text x="330.0" y="438.0" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#ECE5D8" text-anchor="middle" letter-spacing="4">AVANÇAR</text><rect x="600.0" y="360.0" width="400.0" height="120.0" rx="60" fill="#8A6D2F"/><text x="800.0" y="438.0" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#ECE5D8" text-anchor="middle" letter-spacing="4">AJUSTAR</text><rect x="1070.0" y="360.0" width="400.0" height="120.0" rx="60" fill="#B5482F"/><text x="1270.0" y="438.0" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#ECE5D8" text-anchor="middle" letter-spacing="4">PARAR</text><text x="800.0" y="560.0" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="400" fill="#8C8A80" text-anchor="middle" letter-spacing="0" font-style="italic">com o critério que mudaria a decisão</text><line x1="800.0" y1="610.0" x2="800.0" y2="700.0" stroke="#16261C" stroke-width="8" stroke-linecap="round"/><path d="M774.0 690.0 L826.0 690.0 L800.0 730.0 Z" fill="#16261C"/><rect x="150.0" y="760.0" width="1300.0" height="720.0" rx="22" fill="#FBF8F2" stroke="#16261C" stroke-width="4"/><text x="220.0" y="860.0" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Três caminhos</text><line x1="220.0" y1="895.0" x2="1380.0" y2="895.0" stroke="#8A6D2F" stroke-width="4" stroke-linecap="round"/><rect x="210.0" y="950.0" width="1180.0" height="150.0" rx="14" fill="#E2D9C7"/><circle cx="270.0" cy="1025.0" r="30.0" fill="#8A6D2F"/><text x="270.0" y="1038.0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ECE5D8" text-anchor="middle" letter-spacing="0">1</text><text x="330.0" y="1016.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Fazer sozinho, com o Dossiê</text><text x="330.0" y="1070.0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#4A4F45" text-anchor="start" letter-spacing="0">o Dossiê é a sua régua</text><rect x="210.0" y="1120.0" width="1180.0" height="150.0" rx="14" fill="#E2D9C7"/><circle cx="270.0" cy="1195.0" r="30.0" fill="#8A6D2F"/><text x="270.0" y="1208.0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ECE5D8" text-anchor="middle" letter-spacing="0">2</text><text x="330.0" y="1186.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Levar ao banco ou a um investidor</text><text x="330.0" y="1240.0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#4A4F45" text-anchor="start" letter-spacing="0">cada um lê uma página primeiro</text><rect x="210.0" y="1290.0" width="1180.0" height="150.0" rx="14" fill="#E2D9C7"/><circle cx="270.0" cy="1365.0" r="30.0" fill="#8A6D2F"/><text x="270.0" y="1378.0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ECE5D8" text-anchor="middle" letter-spacing="0">3</text><text x="330.0" y="1356.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Conversar com a Zion</text><text x="330.0" y="1410.0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#4A4F45" text-anchor="start" letter-spacing="0">reunião e Land Bank Zion</text><text x="800.0" y="1590.0" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="600" fill="#8A6D2F" text-anchor="middle" letter-spacing="0">a Zion avalia cada caso</text><text x="800.0" y="1660.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="400" fill="#8C8A80" text-anchor="middle" letter-spacing="0" font-style="italic">estar na lista não garante investimento, venda ou sociedade</text></svg>