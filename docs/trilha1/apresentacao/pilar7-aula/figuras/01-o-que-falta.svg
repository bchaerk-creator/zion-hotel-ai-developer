<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-label="O que falta de verdade e a alternativa de cada necessidade: dinheiro, mão para uma tarefa, conhecimento, mercado e, por último, gestão e decisão, onde talvez caiba um sócio"><rect width="1600" height="1800" fill="#ECE5D8"/><rect x="150.0" y="230.0" width="1300.0" height="1170.0" rx="22" fill="#FBF8F2" stroke="#16261C" stroke-width="4"/><text x="220.0" y="340.0" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">O que me falta de verdade?</text><line x1="220.0" y1="380.0" x2="1380.0" y2="380.0" stroke="#8A6D2F" stroke-width="4" stroke-linecap="round"/><rect x="210.0" y="450.0" width="1180.0" height="150.0" rx="14" fill="#E2D9C7"/><text x="250.0" y="512.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Dinheiro</text><text x="250.0" y="568.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" fill="#4A4F45" text-anchor="start" letter-spacing="0">→ recurso próprio, banco, investidor</text><rect x="210.0" y="630.0" width="1180.0" height="150.0" rx="14" fill="#E2D9C7"/><text x="250.0" y="692.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Mão para uma tarefa</text><text x="250.0" y="748.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" fill="#4A4F45" text-anchor="start" letter-spacing="0">→ contratar</text><rect x="210.0" y="810.0" width="1180.0" height="150.0" rx="14" fill="#E2D9C7"/><text x="250.0" y="872.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Conhecimento</text><text x="250.0" y="928.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" fill="#4A4F45" text-anchor="start" letter-spacing="0">→ profissional ou consultoria</text><rect x="210.0" y="990.0" width="1180.0" height="150.0" rx="14" fill="#E2D9C7"/><text x="250.0" y="1052.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#16261C" text-anchor="start" letter-spacing="0">Mercado</text><text x="250.0" y="1108.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" fill="#4A4F45" text-anchor="start" letter-spacing="0">→ parceria comercial</text><rect x="210.0" y="1170.0" width="1180.0" height="150.0" rx="14" fill="#8A6D2F"/><text x="250.0" y="1232.0" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#ECE5D8" text-anchor="start" letter-spacing="0">Gestão e decisão</text><text x="250.0" y="1288.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" fill="#ECE5D8" text-anchor="start" letter-spacing="0">→ talvez, um sócio</text><text x="800.0" y="1530.0" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="600" fill="#8A6D2F" text-anchor="middle" letter-spacing="0">dinheiro não é sócio</text><text x="800.0" y="1600.0" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="400" fill="#8C8A80" text-anchor="middle" letter-spacing="0" font-style="italic">primeiro o que falta, depois quem</text></svg>