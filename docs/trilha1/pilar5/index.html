   1. Apoio: leitura e formatação pt-BR (as mesmas regras das ferramentas dos Pilares 1 a 3)
   --------------------------------------------------------------------- */
const Z = (function () {

  const d = carregarChave(CHAVE);

  const e = Object.assign(estadoVazio(), d);
  e.sim = Object.assign({ valores: {}, data: null }, d.sim || {});
  e.sim.valores = Object.assign({}, (d.sim && d.sim.valores) || {});
  return e;
}
function salvar() {

function respostasBase() {
  const r = {};
  for (const q of QUESTOES) if (q.id in S.respostas && visivel(q)) r[q.id] = S.respostas[q.id];
  return r;
}

/* ---------------------------------------------------------------------
   O simulador: o aluno equaliza os números e vê o efeito na hora.
   S.sim.valores guarda só o que ele moveu. "Voltar ao meu número" apaga tudo.
   --------------------------------------------------------------------- */
const simAtivos = () => (AULA.SIM || []).filter((s) => { const q = Q(s.id); return (!q || visivel(q)) && (!s.mostrar || s.mostrar(S.respostas)); });
function simBase(s) { const v = S.respostas[s.id]; return v === undefined || ehNS(v) ? null : paraNumero(v); }
function simValor(s) { return Object.prototype.hasOwnProperty.call(S.sim.valores, s.id) ? S.sim.valores[s.id] : simBase(s); }
function simMudancas() {
  return simAtivos().filter((s) => Object.prototype.hasOwnProperty.call(S.sim.valores, s.id) && S.sim.valores[s.id] !== simBase(s)).map((s) => ({ s, de: simBase(s), para: S.sim.valores[s.id] }));
}
const simAjustado = () => simMudancas().length > 0;
function fmtSim(s, x) {
  if (x === null || x === undefined) return "sem número";
  if (s.un === "R$") return brl0(x);
  if (s.un === "%") return fmtN(x, 1) + "%";
  return fmtN(x, s.casas ?? 2) + (s.un ? " " + s.un : "");
}
/** As respostas que entram nas contas: as do aluno, com o que ele mexeu no simulador por cima. */
function respostasEfetivas() {
  const r = respostasBase();
  for (const m of simMudancas()) r[m.s.id] = m.para;
  return r;
}

function notaItem(q) {
  const v = S.respostas[q.id];
  if (typeof q.nota === "function") return Math.max(0, Math.min(3, q.nota(S.respostas, S.fontes) || 0));
  if (v === undefined || ehNS(v) || paraNumero(v) === null) return 0;
  const f = fontesDe(q).find((x) => x.v === S.fontes[q.id]);
  return f ? f.nota : 1;
}
const nsDoAluno = () => qsVisiveis().filter((q) => q.aceitaNS && ehNS(S.respostas[q.id]));

function ler() {
  const r = respostasEfetivas();
  const res = AULA.calcular(r, S);
  const notas = itensNota().map((q) => ({ q, nota: notaItem(q) }));
  const soma = notas.reduce((s, x) => s + x.nota, 0);
  const nsAluno = nsDoAluno();
  const ctx = { r, res, notas, soma, nsAluno, nsIds: nsAluno.map((q) => q.id), g: (id) => calc(res, id), nome: S.perfil.nome || "Eu", S, ajustado: simAjustado() };
  const lt = AULA.leitura(ctx);
  ctx.v = lt.v; ctx.motivo = lt.motivo;
  const alertas = [];
  for (const a of (AULA.alertasAntes ? AULA.alertasAntes(ctx) : [])) alertas.push(a);
  for (const c of res.calculos) if (c.alerta === "critico") alertas.push({ t: "critico", tit: "Crítico", txt: c.texto });
  for (const q of nsAluno) alertas.push({ t: "ns", tit: "Não sei · vale zero", txt: `${q.curto}: vira tarefa da semana. Onde conseguir: ${q.ondeCurto}.` });
  for (const x of notas) if (x.nota === 1) alertas.push({ t: "sem", tit: "Nota 1 · sem evidência", txt: `${x.q.curto}: ${x.q.semEvidencia || "é estimativa. Nota sem documento ou medida que prove não vale."} Para confirmar: ${x.q.ondeCurto}.` });
  for (const x of notas) if (x.nota === 0 && !ehNS(S.respostas[x.q.id]) && x.q.zeroTexto) alertas.push({ t: "sem", tit: "Nota 0 · ainda não feito", txt: `${x.q.curto}: ${x.q.zeroTexto} Para resolver: ${x.q.ondeCurto}.` });
  for (const c of res.calculos) if (c.alerta === "atencao") alertas.push({ t: "atencao", tit: "Atenção", txt: c.texto });
  for (const a of (AULA.alertasDepois ? AULA.alertasDepois(ctx) : [])) alertas.push(a);
  ctx.alertas = alertas;
  const fragil = AULA.fragil(ctx);
  const criterioSug = AULA.criterio(ctx);
  const comp = Object.assign({}, AULA.compromisso(ctx));
  comp.responsavel = comp.responsavel || S.perfil.nome || "Eu"; comp.prazo = hojeISO(7);
  return { res, r, notas, soma, alertas, fragil, v: lt.v, motivo: lt.motivo, criterioSug, comp, nsAluno, ctx, ajustado: ctx.ajustado };
}

/** O resumo que esta ferramenta deixa salvo para as próximas (o Pilar 7 monta o Dossiê completo com ele). */
function montarResumo(L) {
  const lt = AULA.LEITURAS[L.v];
  return {
    pilar: AULA.n, aula: AULA.n, tema: META.tema, pagina: META.pagina, ficha: META.pagina, v: L.v, rot: lt.rot, sub: lt.sub, motivo: L.motivo, fragil: L.fragil,
    soma: L.soma, max: notaMax(), numeros: AULA.numeros(L), nCriticos: L.alertas.filter((a) => a.t === "critico").length,
    nNS: L.nsAluno.length, criterio: S.criterio, compromisso: S.compromisso, data: hojeISO(),
    dados: AULA.dados ? AULA.dados(L) : {},
    simulador: { ajustado: L.ajustado, data: S.sim.data, mudou: simMudancas().map((m) => ({ id: m.s.id, rotulo: m.s.rot, respondeu: m.de, na_tela: m.para })) },
    mentor: mentorDoResumo(L),
  };
}

/* ---------------------------------------------------------------------
   4. Envio (desligado): só monta o JSON
   --------------------------------------------------------------------- */
function montarPayload(L) {
  L = L || ler();
  return {
    email: S.perfil.email, nome: S.perfil.nome, etapa: AULA.etapa,
    nota: L.soma, leitura: L.v, ponto_fragil: L.fragil,
    respostas: Object.assign({}, respostasBase(), { fontes: Object.assign({}, S.fontes), cidade: S.perfil.cidade, uf: S.perfil.uf, criterio_para_parar: S.criterio, compromisso_7_dias: S.compromisso, simulador: montarResumo(L).simulador }),
    calculos: L.res.calculos,
  };
}
/* Zion · CRM: guarda a página do Dossiê (Lovable) e registra o aluno no ClickMax. Nunca trava a ferramenta. */
const ZION_PAGINA = "t1-pilar-5";
function zionEmailOk(e) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(e || "").trim()); }
function zionLead(nome, email) {
  try {
    if (!zionEmailOk(email)) return;
    const f = document.getElementById("zx-lead"); if (!f) return;
    f.querySelector('[data-cx-field="name"]').value = String(nome || "").slice(0, 200);
    f.querySelector('[data-cx-field="email"]').value = String(email).trim();
    if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
  } catch (e) { console.log("[Zion] lead não enviado", e); }
}
async function enviarParaZion(payload) {
  payload = payload || {};
  zionLead(payload.nome, payload.email);
  if (!ZION_WEBHOOK_URL) { console.log("[Zion] envio desligado (ZION_WEBHOOK_URL vazia). Payload:", payload); return { enviado: false }; }
  try {
    const corpo = { pagina: ZION_PAGINA, email: zionEmailOk(payload.email) ? String(payload.email).trim() : "", nome: String(payload.nome || "").slice(0, 200), payload: payload };
    const r = await fetch(ZION_WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    return { enviado: r.ok };
  } catch (e) { return { enviado: false, erro: String(e) }; }
}

/* ---------------------------------------------------------------------
   Mentor virtual (o mesmo bloco das ferramentas dos Pilares 1 a 3).
   Só chama a rede quando o aluno toca no botão e FEEDBACK_URL está preenchida.
   Para testes, window.ZION_FEEDBACK_URL (se existir) toma o lugar da constante.
   --------------------------------------------------------------------- */
const MENTOR_AULA_ID = AULA.mentorId;
const mentorRotulo = (k) => (AULA.LEITURAS[k] ? AULA.LEITURAS[k].rot : k);
const MENTOR_TEMPO_MS = 90000;
const MENTOR_AVISO = "O mentor nunca é mais otimista que as contas.";
const MENTOR_PESO = { pausar: 3, testar: 2, ajustar: 1, avancar: 0 };
const MENTOR_MAPA = { avancar: "avancar", seguir: "avancar", testar: "testar", investigar: "testar", ajustar: "ajustar", renegociar: "ajustar", pausar: "pausar", trocar: "pausar" };
const MENTOR_COR_PDF = { verde: [22, 38, 28], ok: [31, 90, 51], verm: [155, 44, 31], ouro: [122, 94, 18], cinza: [70, 86, 75] };
function vereditoParaMentor(v) {
  const k = String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().split(/[^a-z]/)[0];
  return MENTOR_MAPA[k] || null;
}
function urlDoMentor() {
  try { const u = window.ZION_FEEDBACK_URL; if (typeof u === "string" && u.trim()) return u.trim(); } catch (e) {}
  return FEEDBACK_URL;
}
/** A leitura do mentor vale enquanto as respostas (com o simulador) e a leitura da ferramenta forem as mesmas. */
const assinaturaMentor = (L) => JSON.stringify([respostasEfetivas(), L.v]);
const mentorValido = (L) => !!(S.mentor && S.mentor.resultado && S.mentor.assinatura === assinaturaMentor(L));
const mentorDoResumo = (L) => (mentorValido(L) ? Object.assign({ data: S.mentor.data }, S.mentor.resultado) : null);

function corpoDoPedidoMentor(L) {
  const calculos = {};
  for (const c of L.res.calculos) calculos[c.id] = { rotulo: c.rotulo, valor: c.valor === undefined ? null : c.valor, texto: c.texto, alerta: c.alerta || null };
  calculos.leitura_da_ferramenta = { veredito: L.v, motivo: L.motivo, ponto_fragil: L.fragil, nota: L.soma, nota_maxima: notaMax(), alertas: L.alertas.map((a) => ({ tipo: a.t, texto: a.txt })) };
  return { aula: MENTOR_AULA_ID, nome: S.perfil.nome, email: S.perfil.email, respostas: montarPayload(L).respostas, calculos, veredito_ferramenta: vereditoParaMentor(L.v) || "testar" };
}
function normalizarMentor(x, L) {
  if (!x || typeof x !== "object") return null;
  const txt = (v) => (typeof v === "string" ? v.trim() : "");
  const lista = (v) => (Array.isArray(v) ? v.map(txt).filter(Boolean) : []);
  const resumo = txt(x.resumo);
  if (!resumo) return null;
  const pa = x.proxima_acao && typeof x.proxima_acao === "object" ? x.proxima_acao : {};
  const ferr = vereditoParaMentor(L.v) || "testar";
  const doMentor = vereditoParaMentor(x.veredito);
  const v = doMentor && MENTOR_PESO[doMentor] >= MENTOR_PESO[ferr] ? doMentor : ferr;
  return {
    resumo, pontos_fortes: lista(x.pontos_fortes), ponto_fragil: txt(x.ponto_fragil), veredito: v, veredito_rot: mentorRotulo(v),
    criterio_para_parar: txt(x.criterio_para_parar),
    proxima_acao: { acao: txt(pa.acao), responsavel: txt(pa.responsavel), prazo: txt(pa.prazo), evidencia: txt(pa.evidencia) },
    perguntas_em_aberto: lista(x.perguntas_em_aberto),
  };
}
async function pedirMentor(L) {
  const url = urlDoMentor();
  if (!url) return { erro: "Disponível em breve." };
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const relogio = setTimeout(() => { if (ctrl) ctrl.abort(); }, MENTOR_TEMPO_MS);
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpoDoPedidoMentor(L)), signal: ctrl ? ctrl.signal : undefined });
    let d = null;
    try { d = await r.json(); } catch (e) { d = null; }
    const erroServ = d && typeof d.erro === "string" ? d.erro.trim() : "";
    if (r.status === 429) return { erro: erroServ || "O mentor recebeu muitos pedidos agora. Espere alguns minutos e tente de novo." };
    if (!r.ok) return { erro: (r.status < 500 && erroServ) || "O mentor virtual não respondeu agora. Tente de novo daqui a pouco." };
    const m = normalizarMentor(d && d.resultado, L);
    if (!m) return { erro: erroServ || "O mentor virtual não conseguiu ler as suas respostas agora. Tente de novo daqui a pouco." };
    return { resultado: m };
  } catch (e) {
    return { erro: e && e.name === "AbortError" ? "O mentor demorou mais de 90 segundos para responder. Tente de novo daqui a pouco." : "Não foi possível falar com o mentor virtual. Confira a conexão com a internet e tente de novo." };
  } finally { clearTimeout(relogio); }
}
function htmlMentorResultado(m) {
  const lst = (a, vazio) => (a.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p>${vazio}</p>`);
  const pa = m.proxima_acao;
  return `<div id="mentor-resultado">
    <div class="caixa porque"><h3>Resumo</h3><p>${esc(m.resumo)}</p></div>
    <div class="caixa onde"><h3>Pontos fortes</h3>${lst(m.pontos_fortes, "Nenhum apontado.")}</div>
    <div class="fragil" style="margin-top:14px"><b>Ponto frágil</b><br>${esc(m.ponto_fragil || "Em branco")}</div>
    <div class="leitura" id="mentor-leitura" style="margin-top:14px"><div class="eyebrow" style="color:var(--creme)">Leitura do mentor</div><div class="rot">${esc(m.veredito_rot)}</div><p><b>${esc(MENTOR_AVISO)}</b></p></div>

    <div class="caixa onde"><h3>Perguntas em aberto</h3>${lst(m.perguntas_em_aberto, "Nenhuma.")}</div>
    <p class="dica" style="margin-top:10px">A leitura do mentor complementa as contas e a leitura acima, não as substitui. Ela entra no seu PDF enquanto os números na tela forem os mesmos.</p>
  </div>`;
}
function htmlSecaoMentor(L) {
  let corpo;
  if (!urlDoMentor()) corpo = `<p id="mentor-estado"><b>Disponível em breve.</b></p><button type="button" class="btn btn-s" id="mentor-pedir" disabled>Pedir a leitura do mentor virtual</button>`;
  else if (mentorValido(L)) corpo = htmlMentorResultado(S.mentor.resultado);
  else corpo = `<p class="dica">Uma segunda leitura das suas respostas, com o método da Zion: o que está forte, o que está frágil e a próxima ação. Ao pedir, esta página envia ao mentor virtual da Zion o seu nome, o seu e-mail, as suas respostas, os números do simulador e as contas.${S.mentor && S.mentor.resultado ? " Você mexeu nos números depois da última leitura: peça de novo para ela valer para a tela de agora." : ""}</p>
    <button type="button" class="btn btn-s" id="mentor-pedir">Pedir a leitura do mentor virtual</button>
    <div id="mentor-estado" role="status" aria-live="polite"></div>`;
  return `<section class="bloco" id="b-mentor"><h2>O mentor virtual</h2><div id="mentor-corpo">${corpo}</div></section>`;
}
function ligarMentor() {
  const b = document.getElementById("mentor-pedir");
  if (!b || b.disabled) return;
  b.onclick = async () => {
    const L = ler();
    const st = document.getElementById("mentor-estado");
    b.disabled = true;
    st.innerHTML = `<p class="dica" style="margin-top:10px"><b>Lendo as suas respostas...</b> Pode levar até um minuto e meio.</p>`;
    const r = await pedirMentor(L);
    if (r.resultado) {
      S.mentor = { resultado: r.resultado, assinatura: assinaturaMentor(L), data: hojeISO() };
      S.resumo = montarResumo(L);
      salvar();
      const c = document.getElementById("mentor-corpo");
      if (c) c.innerHTML = htmlMentorResultado(r.resultado);
    } else {
      b.disabled = false;
      st.innerHTML = `<div class="alerta a-atencao" id="mentor-erro"><b>O mentor não respondeu</b>${esc(r.erro)} O resto da página continua funcionando: o PDF sai normalmente, sem a leitura do mentor.</div>`;
    }
  };
}
function mentorParaPDF(m) {
  const pa = m.proxima_acao || {};
  const itens = (a, vazio) => (a && a.length ? a.map((x) => "- " + x).join("\n") : vazio);
  return [

}

/* ---------------------------------------------------------------------
   5. Telas
   --------------------------------------------------------------------- */
const app = document.getElementById("app");
document.getElementById("rodape").textContent = RODAPE;
const UFS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

/** Leva o passo para a próxima pergunta que vale (para frente) ou a anterior (para trás). */
function ajustarPasso(p, dir) {
  if (p < 0) return -1;
  if (p >= QUESTOES.length) return QUESTOES.length;
  let i = p;
  while (i >= 0 && i < QUESTOES.length && !visivel(QUESTOES[i])) i += dir;
  if (i < 0) return -1;
  return Math.min(i, QUESTOES.length);
}
function render() {
  if (S.passo < 0) return telaAbertura();
  S.passo = ajustarPasso(S.passo, 1);
  if (S.passo >= QUESTOES.length) return telaResultado();
  return telaPergunta(S.passo);
}
function irPara(p, dir = 1) { S.passo = ajustarPasso(p, dir); salvar(); render(); window.scrollTo(0, 0); const h = app.querySelector("h1"); if (h) h.focus({ preventScroll: true }); }
const val = (id) => document.getElementById(id).value.trim();

function telaAbertura() {

  if (!S.perfil.nome) { const p = perfilDeOutraFerramenta(); if (p) S.perfil = Object.assign({}, S.perfil, p); }

    <form id="f-abertura" novalidate>

      <input type="text" id="nome" autocomplete="name" value="${esc(S.perfil.nome)}" required>

      <label for="cidade">Cidade do terreno</label>

      <select id="uf" required><option value="">Escolha o estado</option>${UFS.map((u) => `<option ${S.perfil.uf === u ? "selected" : ""}>${u}</option>`).join("")}</select>
      <div class="erro" id="erro-abertura" role="alert"></div>
      <div class="nav"><button class="btn btn-p" type="submit" id="comecar">Começar</button></div>
      <p class="dica">As respostas ficam salvas só neste aparelho, para você poder parar e voltar. Nada é enviado sem você pedir.${AULA.abertura.dica ? " " + esc(AULA.abertura.dica) : ""}</p>
    </form>
  </div>`;
  if (temSalvo) {
    document.getElementById("continuar").onclick = () => { S = salvo; S.passo = Math.min(Math.max(S.passo, 0), QUESTOES.length); salvar(); render(); };

    document.getElementById("erro-abertura").textContent = erro;

    irPara(S.passo >= 0 ? Math.min(S.passo, QUESTOES.length) : 0);
  };

/** Traz a resposta de um pilar anterior, uma vez só, para o aluno conferir. */
function aplicarVeio(q) {
  if (!q.veio || S.veio[q.id] !== undefined || S.respostas[q.id] !== undefined) return;
  let x = null;
  try { x = q.veio(); } catch (e) { x = null; }
  S.veio[q.id] = x ? x.de : null;
  if (x && x.valor !== undefined && x.valor !== null && x.valor !== "") {
    S.respostas[q.id] = x.valor;
    if (x.fonte) S.fontes[q.id] = x.fonte;
  }
  salvar();
}
const ehNumerico = (q) => q.tipo === "numero" || q.tipo === "moeda" || q.tipo === "percentual";
const botaoNS = (ns) => `<button type="button" class="btn btn-ns" id="ns" aria-pressed="${ns}">${ns ? "Marcado: Não sei (toque para desfazer)" : "Não sei"}</button>`;

function telaPergunta(i) {
  const q = QUESTOES[i];
  aplicarVeio(q);
  const vis = qsVisiveis();
  const total = vis.length;
  const pos = vis.indexOf(q);
  const v = S.respostas[q.id];
  const ns = ehNS(v);
  let campo = "";
  if (ehNumerico(q)) {
    const pre = q.tipo === "moeda" ? `<span class="un">R$</span>` : "";
    const pos2 = q.tipo === "percentual" ? `<span class="un">%</span>` : q.tipo === "numero" && q.unidade ? `<span class="un">${esc(q.unidade)}</span>` : "";
    campo = `
      <label for="resp" class="sr">${esc(q.pergunta)}</label>
      <div class="campo-num">${pre}
        <input type="text" id="resp" inputmode="decimal" autocomplete="off" placeholder="${esc(q.placeholder || (q.tipo === "moeda" ? "Ex.: 600" : "Digite o número"))}" value="${ns || v === undefined ? "" : esc(v)}" ${ns ? "disabled" : ""}>
        ${pos2}
      </div>
      ${q.aceitaNS ? botaoNS(ns) : ""}
      ${q.nota === "fonte" ? `<fieldset class="fonte" id="fs-fonte" ${ns ? "hidden" : ""}>
        <legend>De onde veio esse número?</legend>
        <div class="opcoes">${fontesDe(q).map((f) => `<label class="op"><input type="radio" name="fonte" value="${f.v}" ${S.fontes[q.id] === f.v ? "checked" : ""}><span>${esc(f.rot)}</span></label>`).join("")}</div>
      </fieldset>` : ""}`;
  } else if (q.tipo === "texto") {
    campo = `<label for="resp" class="sr">${esc(q.pergunta)}</label>
      <textarea id="resp" placeholder="${esc(q.placeholder || "Escreva com as suas palavras")}" ${ns ? "disabled" : ""}>${ns || v === undefined ? "" : esc(v)}</textarea>
      ${q.aceitaNS ? botaoNS(ns) : ""}`;
  } else if (q.tipo === "multipla") {

      ${q.aceitaNS ? botaoNS(ns) : ""}`;
  }

  const ultima = pos === total - 1;
  app.innerHTML = `
  <div class="progresso" aria-label="Progresso">
    <div class="txt"><span>Pergunta ${pos + 1} de ${total}</span><span>${Math.round((pos / total) * 100)}%</span></div>
    <div class="barra"><i style="width:${(pos / total) * 100}%"></i></div>
  </div>
  <div class="card">
    <div class="eyebrow">${esc(q.bloco || META.tema)}</div>
    <h1 class="pergunta" tabindex="-1">${esc(q.pergunta)}</h1>
    <p class="explica">${esc(q.explica)}</p>

      <div class="caixa marina"><h3>Exemplo ilustrativo · Marina</h3><p>${esc(q.marina)} A Marina é um exemplo para ensinar a conta, não é meta nem média de mercado.</p></div>

  if (nsBtn) nsBtn.onclick = () => {
    if (ehNS(S.respostas[q.id])) { delete S.respostas[q.id]; } else { S.respostas[q.id] = "nao_sei"; delete S.fontes[q.id]; }

  f.onsubmit = (e) => {

function validar(q) {
  const v = S.respostas[q.id];
  if (ehNumerico(q)) {
    if (ehNS(v)) return "";
    const n = paraNumero(v);
    if (n === null) return q.aceitaNS ? "Escreva um número (só dígitos, pode usar ponto para milhar e vírgula para decimal) ou toque em Não sei." : "Escreva um número (só dígitos, pode usar ponto para milhar e vírgula para decimal).";
    if (n < 0) return "O número não pode ser negativo.";
    if (q.min !== undefined && n < q.min) return `O número precisa ser pelo menos ${fmtN(q.min)}.`;
    if (q.max !== undefined && n > q.max) return `O número não pode passar de ${fmtN(q.max)}.`;
    if (q.positivo && n <= 0) return "O número precisa ser maior que zero.";
    if (q.validar) { const e = q.validar(n, S.respostas); if (e) return e; }
    if (q.nota === "fonte" && !S.fontes[q.id]) return "Diga de onde veio esse número: é isso que separa dado de palpite.";
    return "";
  }
  if (q.tipo === "texto") {
    if (ehNS(v) || q.opcional) return "";
    if (v === undefined || String(v).trim() === "") return q.aceitaNS ? "Escreva a sua resposta ou toque em Não sei." : "Escreva a sua resposta.";
    return "";
  }
  if (q.tipo === "escolha" && (v === undefined || v === "")) return q.aceitaNS ? "Escolha uma opção ou toque em Não sei." : "Escolha uma opção.";
  return "";
}

function respostaTexto(q) {
  const v = S.respostas[q.id];
  if (ehNS(v)) return "Não sei";
  if (q.tipo === "multipla") { const a = Array.isArray(v) ? v : []; return a.length ? q.opcoes.filter((o) => a.includes(o.v)).map((o) => o.rot).join("; ") : "Nenhum"; }
  if (q.tipo === "escolha") { const o = q.opcoes.find((x) => x.v === v); return o ? o.rot : "Em branco"; }
  if (q.tipo === "texto") { const t = typeof v === "string" ? v.trim() : ""; return t || "Em branco"; }
  const n = paraNumero(v);
  if (n === null) return "Em branco";
  if (q.tipo === "moeda") return brl(n);
  if (q.tipo === "percentual") return fmtN(n, 2) + "%";
  return `${fmtN(n, 2)}${q.unidade ? " " + q.unidade : ""}`;
}
const fonteTexto = (q) => { if (q.nota !== "fonte" || ehNS(S.respostas[q.id])) return ""; const f = fontesDe(q).find((x) => x.v === S.fontes[q.id]); return f ? f.curto : ""; };

/* ---- O simulador na tela ---- */
const rotOrig = (s, base, mudou) => (base === null ? (mudou ? "Testando um número · você não respondeu" : "Você não respondeu este número") : mudou ? "Ajustado · você respondeu " + fmtSim(s, base) : "A sua resposta: " + fmtSim(s, base));

/** Atualiza só o que depende dos números: os controles continuam onde o dedo está. */
function atualizarVivo() {
  const L = ler();
  S.resumo = montarResumo(L);
  salvar();
  document.getElementById("vivo").innerHTML = htmlVivo(L);
  document.getElementById("sim-painel").innerHTML = htmlPainel(L);
  for (const s of simAtivos()) {
    const o = document.getElementById("or-" + s.id); if (!o) continue;
    const base = simBase(s);
    const mudou = Object.prototype.hasOwnProperty.call(S.sim.valores, s.id) && S.sim.valores[s.id] !== base;
    o.className = "orig" + (mudou ? " mudou" : "");
    o.textContent = rotOrig(s, base, mudou);
    const box = o.closest(".sl"); if (box) box.classList.toggle("desligado", simValor(s) === null);

function ligarSimulador() {
  const sims = simAtivos();
  for (const s of sims) {
    const r = document.getElementById("sl-" + s.id), n = document.getElementById("nu-" + s.id);
    if (!r || !n) continue;
    const gravar = (x) => { S.sim.valores[s.id] = x; S.sim.data = hojeISO(); atualizarVivo(); };
    r.addEventListener("input", () => { const x = Z.arred(Number(r.value), s.casas ?? 2); n.value = fmtN(x, s.casas ?? 2); n.placeholder = ""; gravar(x); });
    n.addEventListener("input", () => {
      const x = paraNumero(n.value);
      if (x === null || x < 0) return;
      if (s.maxDigitado !== undefined && x > s.maxDigitado) return;
      r.value = String(Math.min(Math.max(x, s.min), s.max));
      gravar(Z.arred(x, s.casas ?? 2));
    });
  }
  const bv = document.getElementById("sim-voltar");
  if (bv) bv.onclick = () => {
    S.sim = { valores: {}, data: null };
    for (const s of sims) {
      const r = document.getElementById("sl-" + s.id), n = document.getElementById("nu-" + s.id);
      const b = simBase(s);
      if (r) r.value = String(b === null ? (s.padrao ?? s.min) : Math.min(Math.max(b, s.min), s.max));
      if (n) { n.value = b === null ? "" : fmtN(b, s.casas ?? 2); n.placeholder = b === null ? "vazio" : ""; }
    }
    atualizarVivo();
  };
}

/* ---------------------------------------------------------------------
   6. PDF A4 com jsPDF (fonte padrão Helvetica / Times)
   --------------------------------------------------------------------- */
const VERDE = [22, 38, 28], CREME = [245, 241, 232], OURO = [224, 190, 94], OURO_E = [122, 94, 18], CINZA = [70, 86, 75], VERM = [155, 44, 31], AREIA = [235, 228, 212], MUSGO = [191, 211, 191], ROSA = [201, 169, 162];
const COR_ALERTA = { critico: VERM, ns: [122, 83, 0], sem: [122, 94, 18], atencao: [150, 110, 20], info: [31, 90, 51] };

function criarPDF(cabecalho) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("jsPDF não carregou");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  // A fonte padrão do jsPDF só desenha o alfabeto latino básico: m² vira m2 e as aspas curvas viram retas.
  const pt = (t) => String(t ?? "").replace(/²/g, "2").replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/\u2026/g, "...").replace(/[\u2013\u2014]/g, "-").replace(/\u2265/g, ">=").replace(/\u2264/g, "<=").replace(/\u2192/g, "->").replace(/\u00d7/g, "x").replace(/\u2212/g, "-");
  const _text = doc.text.bind(doc), _split = doc.splitTextToSize.bind(doc);
  doc.text = (t, ...a) => _text(Array.isArray(t) ? t.map(pt) : pt(t), ...a);
  doc.splitTextToSize = (t, ...a) => _split(pt(t), ...a);
  const P = { doc, W: 210, H: 297, M: 18, y: 0 };
  P.CW = P.W - 2 * P.M;
  P.fundo = () => { doc.setFillColor(...CREME); doc.rect(0, 0, P.W, P.H, "F"); doc.setFillColor(...VERDE); doc.rect(0, 0, P.W, 12, "F"); doc.setFillColor(...OURO); doc.rect(0, 12, P.W, 0.8, "F"); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...CREME); doc.text(cabecalho, P.M, 8); doc.text(`${S.perfil.nome}`.slice(0, 50), P.W - P.M, 8, { align: "right" }); P.y = 22; };
  P.novaPagina = () => { doc.addPage(); P.fundo(); };
  P.cabe = (h) => { if (P.y + h > P.H - 22) P.novaPagina(); };
  P.titulo = (t) => { P.cabe(34); P.y += 4; doc.setFont("times", "bold"); doc.setFontSize(15); doc.setTextColor(...VERDE); doc.text(t, P.M, P.y); P.y += 2.5; doc.setDrawColor(...OURO); doc.setLineWidth(0.7); doc.line(P.M, P.y, P.M + 40, P.y); P.y += 6; };
  P.par = (t, o = {}) => {
    doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 10); doc.setTextColor(...(o.cor || VERDE));
    const linhas = doc.splitTextToSize(String(t), o.w || P.CW);
    const lh = (o.size || 10) * 0.45;
    for (const l of linhas) { P.cabe(lh + 1); doc.text(l, o.x || P.M, P.y); P.y += lh; }
    P.y += o.after ?? 2;
  };
  P.caixa = (rot, t, cor) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
    let linhas = doc.splitTextToSize(String(t), P.CW - 10);
    const max = Math.floor((P.H - 22 - 22 - 12) / 4.3);
    while (linhas.length) {
      const parte = linhas.slice(0, max); linhas = linhas.slice(max);
      const h = parte.length * 4.3 + 10;
      P.cabe(h + 2);
      doc.setFillColor(255, 253, 248); doc.setDrawColor(...cor); doc.setLineWidth(0.3); doc.roundedRect(P.M, P.y, P.CW, h, 2, 2, "FD");
      doc.setFillColor(...cor); doc.rect(P.M, P.y, 1.6, h, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...cor); doc.text(rot.toUpperCase(), P.M + 5, P.y + 5);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...VERDE);
      parte.forEach((l, k) => doc.text(l, P.M + 5, P.y + 9.5 + k * 4.3));
      P.y += h + 3;
    }
  };
  P.linhaTabela = (cols, larg, o = {}) => {
    doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 9);
    const partes = cols.map((c, k) => doc.splitTextToSize(String(c), larg[k] - 3));
    const h = Math.max(...partes.map((p) => p.length)) * 4 + 3;
    P.cabe(Math.min(h, 60));
    if (o.fundo) { doc.setFillColor(...o.fundo); doc.rect(P.M, P.y - 3.4, P.CW, h, "F"); }
    let x = P.M;
    partes.forEach((p, k) => { doc.setTextColor(...((o.cores && o.cores[k]) || o.cor || VERDE)); p.forEach((l, j) => doc.text(l, x + 1.5, P.y + j * 4)); x += larg[k]; });
    P.y += h; doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.line(P.M, P.y - 3.4, P.M + P.CW, P.y - 3.4);
  };
  P.caixasNumeros = (box) => {
    const n = box.length, bw = (P.CW - 3 * (n - 1)) / n;
    P.cabe(26);
    box.forEach(([r, v], k) => { const x = P.M + k * (bw + 3); doc.setFillColor(...VERDE); doc.roundedRect(x, P.y, bw, 22, 2, 2, "F"); doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...CREME); doc.text(doc.splitTextToSize(r, bw - 5).slice(0, 2), x + 3, P.y + 5); doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.setTextColor(...OURO); doc.text(doc.splitTextToSize(String(v), bw - 5)[0], x + 3, P.y + 17); });
    P.y += 30;
  };
  /** Barras horizontais: [[rótulo, valor, texto do valor, cor]] contra um máximo. */
  P.barras = (itens, max) => {
    const rotW = 58, area = P.CW - rotW - 34;
    for (const [rot, v, txt, cor] of itens) {
      P.cabe(11);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...VERDE);
      doc.text(doc.splitTextToSize(rot, rotW - 3).slice(0, 2), P.M, P.y + 3.5);
      doc.setFillColor(...AREIA); doc.roundedRect(P.M + rotW, P.y, area, 6, 1.2, 1.2, "F");
      const w = max > 0 && v > 0 ? Math.max(1.5, Math.min(1, v / max) * area) : 0;
      if (w) { doc.setFillColor(...(cor || VERDE)); doc.roundedRect(P.M + rotW, P.y, w, 6, 1.2, 1.2, "F"); }
      doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.text(txt, P.M + rotW + area + 2, P.y + 4.3);
      P.y += 10;
    }
    P.y += 2;
  };
  /** Uma faixa dividida em partes: [[fração, cor, rótulo]], com legenda embaixo. */
  P.faixa = (partes, altura = 10) => {
    P.cabe(altura + 16);
    let x = P.M;
    doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.rect(P.M, P.y, P.CW, altura);
    for (const [f, cor] of partes) { const w = Math.max(0, f) * P.CW; if (w > 0) { doc.setFillColor(...cor); doc.rect(x, P.y, Math.max(w, 0.6), altura, "F"); } x += w; }
    P.y += altura + 4;
    let lx = P.M;
    doc.setFontSize(7.5);
    for (const [, cor, rot] of partes) { if (!rot) continue; const tw = doc.getTextWidth(rot) + 9; if (lx + tw > P.M + P.CW) { lx = P.M; P.y += 4.5; } doc.setFillColor(...cor); doc.rect(lx, P.y - 2.6, 3, 3, "F"); doc.setFont("helvetica", "normal"); doc.setTextColor(...CINZA); doc.text(rot, lx + 4.2, P.y); lx += tw; }
    P.y += 6;
  };
  P.capa = (sobre, l1, l2, sub, extra) => {
    doc.setFillColor(...VERDE); doc.rect(0, 0, P.W, P.H, "F");
    doc.setDrawColor(...OURO); doc.setLineWidth(0.6); doc.rect(10, 10, P.W - 20, P.H - 20);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...OURO); doc.text(sobre, P.M + 4, 48);
    doc.setFont("times", "bold"); doc.setFontSize(32); doc.setTextColor(...CREME); doc.text(l1, P.M + 4, 72); if (l2) doc.text(l2, P.M + 4, 86);
    doc.setFillColor(...OURO); doc.rect(P.M + 4, 93, 50, 1.2, "F");
    doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(...CREME); doc.text(doc.splitTextToSize(sub, P.CW - 8), P.M + 4, 104);
    doc.setFontSize(10); doc.setTextColor(220, 214, 200); doc.text(doc.splitTextToSize(CURSO, P.CW - 8), P.M + 4, 117); doc.text(SUBTITULO, P.M + 4, 122.5);
    if (extra) extra(doc);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...OURO); doc.text("ALUNO", P.M + 4, 200);
    doc.setFont("times", "bold"); doc.setFontSize(22); doc.setTextColor(...CREME); doc.text(doc.splitTextToSize(S.perfil.nome || "", P.CW - 8), P.M + 4, 210);
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(220, 214, 200);
    doc.text(`Terreno em ${S.perfil.cidade}${S.perfil.uf ? "/" + S.perfil.uf : ""}`, P.M + 4, 222);
    doc.text(`Gerada em ${dataBR(hojeISO())}`, P.M + 4, 229);
    doc.setFontSize(8); doc.text(doc.splitTextToSize(RODAPE, P.CW - 8), P.M + 4, P.H - 26);
  };
  P.fechar = (nomeArquivo) => {
    const n = doc.getNumberOfPages();
    for (let k = 1; k <= n; k++) {
      doc.setPage(k);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
      doc.setTextColor(...(k === 1 ? [220, 214, 200] : CINZA));
      if (k > 1) { doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.line(P.M, P.H - 16, P.W - P.M, P.H - 16); doc.text(doc.splitTextToSize(RODAPE, P.CW - 14), P.M, P.H - 12); }
      doc.text(`${k}/${n}`, P.W - P.M, P.H - 12, { align: "right" });
    }
    const arq = nomeArquivo + "-" + (S.perfil.nome || "aluno").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + (simAjustado() ? "-ajustado" : "") + ".pdf";
    window.__ultimoPDF = { arq, paginas: n, doc };
    doc.save(arq);
    return arq;
  };
  return P;
}

/** O corpo da página deste pilar no PDF (usado aqui e, depois, no Dossiê completo do Pilar 7). */
function corpoDaPaginaPDF(P, L) {
  P.titulo("O resumo");
  P.caixasNumeros(AULA.numeros(L));
  const mud = simMudancas();
  if (mud.length) P.caixa(`Ajustado no simulador em ${dataBR(S.sim.data || hojeISO())}`, "Esta página saiu com os números que estavam na tela, e não só com as respostas. O que mudou:\n" + mud.map((m) => `- ${m.s.rot}: ${m.de === null ? "você não respondeu (Não sei)" : "você respondeu " + fmtSim(m.s, m.de)}; na tela, ${fmtSim(m.s, m.para)}`).join("\n") + "\nOs números ajustados são uma simulação de referência: não são medida nem promessa.", [150, 110, 20]);
  else P.par(`Números das suas respostas, sem ajuste no simulador. Gerada em ${dataBR(hojeISO())}.`, { size: 8.5, cor: CINZA, after: 3 });
  const leit = AULA.LEITURAS[L.v];
  P.caixa("A leitura" + (L.ajustado ? " (com o simulador)" : ""), `${leit.rot}. ${leit.sub} ${L.motivo}`, VERDE);
  P.caixa("O ponto mais frágil", L.fragil, VERM);
  if (AULA.pdfExtra) AULA.pdfExtra(P, L);
  P.y += 2;
  if (notaMax()) P.par(`Nota: ${L.soma} de ${notaMax()}. Não existe nota de corte: primeiro os alertas, depois a soma, depois a decisão.`, { bold: true, after: 4 });
  const mentor = mentorDoResumo(L);
  if (mentor) { P.titulo("Leitura do mentor virtual"); mentorParaPDF(mentor).forEach(([r, t, c]) => P.caixa(r, t, c)); P.y += 2; }
  P.titulo("Os alertas");
  if (L.alertas.length) L.alertas.forEach((x) => P.caixa(x.tit, x.txt, COR_ALERTA[x.t] || VERDE));
  else P.par("Nenhum alerta nesta página.", { cor: CINZA });
  P.titulo("As contas e as leituras");
  const contas = (AULA.contas || L.res.calculos.filter((c) => c.id !== "veredito_sugerido").map((c) => c.id)).map((id) => calc(L.res, id)).filter((c) => c && c.texto);
  contas.forEach((c) => { P.par(c.rotulo, { bold: true, after: 0.5 }); P.par(c.texto, { cor: CINZA, size: 9.5, after: 3 }); });
  P.titulo("As suas respostas");
  const larg = [50, 100, 24];
  P.linhaTabela(["Pergunta", "Resposta e fonte", "Nota"], larg, { bold: true, size: 8, cor: CINZA });
  qsVisiveis().forEach((q) => {
    const nota = q.nota ? String(notaItem(q)) : "";
    const fonte = fonteTexto(q);
    P.linhaTabela([q.curto, respostaTexto(q) + (fonte ? ` (${fonte})` : ""), nota], larg, { cores: [VERDE, VERDE, nota === "0" || nota === "1" ? VERM : VERDE] });
  });
  P.y += 2;
  if (notaMax()) P.par(`Soma: ${L.soma} de ${notaMax()}. ${AULA.escalaNota}`, { size: 8.5, cor: CINZA, after: 4 });
  P.titulo("O critério para parar");
  P.caixa("Escrito antes, para não decidir pelo entusiasmo", S.criterio || "Em branco", OURO_E);
  P.titulo("O Compromisso de 7 dias");
  const cp = S.compromisso || {};
  [["Ação", cp.acao], ["Responsável", cp.responsavel], ["Prazo", dataBR(cp.prazo)], ["Evidência", cp.evidencia]].forEach(([r, v]) => P.linhaTabela([r, v || "Em branco"], [40, P.CW - 40], {}));
  P.y += 4;
}

function gerarFichaPDF(L) {
  const P = criarPDF(`Zion · Pilar ${AULA.n} · ${META.pagina}`);
  const [l1, l2] = AULA.capaTitulo;
  P.capa(`PILAR ${AULA.n} · ${META.tema.toUpperCase()}`, l1, l2, `Página ${AULA.n} do Dossiê de Desenvolvimento`, (doc) => {
    if (L.ajustado) { doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...OURO); doc.text(`AJUSTADO NO SIMULADOR EM ${dataBR(S.sim.data || hojeISO())}`, P.M + 4, 140); }
  });
  P.novaPagina();
  corpoDaPaginaPDF(P, L);
  P.par(AULA.notaFinalPDF, { size: 8, cor: CINZA });
  return P.fechar(AULA.arquivoPDF);
}

/* ---------------------------------------------------------------------
   7. Início
   --------------------------------------------------------------------- */
window.ZionApp = { ler, montarPayload, enviarParaZion, montarResumo, vereditoParaMentor, corpoDoPedidoMentor, simMudancas, get estado() { return S; }, AULA };
(function iniciar() {
  const salvo = carregar();
  if (salvo) S.perfil = Object.assign(S.perfil, salvo.perfil);
  render();
})();
