<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faça agora · O seu CAPEX</title>
<meta name="description" content="Faça agora do Aprofundamento 6A do Pilar 6: O seu CAPEX. Parte por parte, com a origem de cada número, você abre as linhas da sua página 6, confere o limite que ela escreveu e baixa a página 6A do seu Dossiê de Desenvolvimento em PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{
  --verde:#16261C; --verde-2:#22382A; --creme:#F5F1E8; --creme-2:#EBE4D4; --dourado:#E0BE5E;
  --dourado-escuro:#7A5E12; --texto:#16261C; --texto-2:#46564B; --linha:#D6CDB8; --branco:#FFFDF8;
  --critico:#9B2C1F; --critico-bg:#F8E3DE; --atencao:#7A5300; --atencao-bg:#FBEFD2; --ok:#1F5A33; --ok-bg:#E1EFE3;
  --raio:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--texto);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
h1,h2,h3{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
p{margin:0 0 .8em}
a{color:var(--verde)}
.topo{background:var(--verde);color:var(--creme);padding:14px 16px;border-bottom:3px solid var(--dourado)}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{font-family:"Playfair Display",Georgia,serif;font-size:1.05rem;letter-spacing:.02em}
.marca a{color:inherit;text-decoration:none}
.marca b{color:var(--dourado);font-weight:600}
.etiqueta{font-size:.78rem;opacity:.85;text-align:right}
.wrap{max-width:720px;margin:0 auto}
main{padding:20px 14px 32px}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);padding:20px 14px;box-shadow:0 1px 0 rgba(22,38,28,.04)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dourado-escuro);font-weight:600;margin-bottom:6px}
.lead{font-size:1.05rem;color:var(--texto-2)}
.tres{display:grid;gap:10px;margin:18px 0}
.tres div{background:var(--creme);border-left:4px solid var(--dourado);border-radius:8px;padding:10px 12px}
.tres b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--verde)}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;color:var(--texto);background:#fff;border:1.5px solid #B9AE95;border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--dourado);outline-offset:1px;border-color:var(--verde)}
.campo-num{display:flex;align-items:stretch;gap:6px}
.campo-num input{flex:1;min-width:0;font-weight:600}
.campo-num.grande input{font-size:1.25rem}
.campo-num .un{display:flex;align-items:center;padding:0 10px;background:var(--creme-2);border-radius:10px;font-weight:600;white-space:nowrap;font-size:.9rem}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;min-height:48px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-p{background:var(--verde);color:var(--creme)}
.btn-p:hover{background:var(--verde-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-s{background:transparent;color:var(--verde);border:1.5px solid var(--verde)}
.btn-ouro{background:var(--dourado);color:var(--verde)}
.btn-ns{background:#fff;color:var(--verde);border:1.5px dashed var(--verde);border-radius:10px;width:100%;margin-top:8px;min-height:44px}
.btn-ns[aria-pressed=true]{background:var(--verde);color:var(--creme);border-style:solid}
.btn-ex{background:#FFF7E6;color:var(--verde);border:1.5px solid #E7C980;border-radius:10px;width:100%;margin-top:10px}
.btn-mini{min-height:40px;padding:8px 14px;font-size:.9rem}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.nav .btn{flex:1}
.progresso{margin:0 0 16px}
.progresso .txt{display:flex;justify-content:space-between;font-size:.85rem;color:var(--texto-2);margin-bottom:6px}
.barra{height:8px;background:var(--creme-2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .25s}
.pergunta{font-size:1.35rem}
.explica{color:var(--texto-2);margin-top:-2px}
.caixa{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.95rem;overflow-wrap:anywhere}
.caixa h3{font-family:Inter,system-ui,sans-serif;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.caixa p:last-child,.caixa ul:last-child{margin-bottom:0}
.caixa ul{padding-left:20px;margin:0 0 .6em}
.porque{background:var(--creme);border:1px solid var(--linha)}
.onde{background:#EEF3EC;border:1px solid #C9D8C6}
.exemplo{background:#fff;border:1px dashed var(--dourado-escuro);font-size:.9rem}
.exemplo h3{color:var(--dourado-escuro)}
.faixa-ex{background:var(--dourado);color:var(--verde);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:700;margin-bottom:12px}
.veio{background:#FFF7E6;border:1px solid #E7C980;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.88rem}
.opcoes{display:grid;gap:8px;margin-top:6px}
.op{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid #B9AE95;border-radius:10px;padding:11px 12px;cursor:pointer;font-weight:500;margin:0}
.op input{margin-top:3px;width:20px;height:20px;accent-color:var(--verde);flex:none}
.op:has(input:checked){border-color:var(--verde);background:#F1F5EF}
fieldset{border:0;padding:0;margin:14px 0 0;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:6px}
.erro{color:var(--critico);font-size:.9rem;margin-top:8px;min-height:1.2em}
.falta{color:var(--texto-2);font-size:.88rem;margin-top:10px;min-height:1.2em}
section.bloco{margin-top:22px}
.bloco h2{font-size:1.25rem;border-bottom:2px solid var(--dourado);padding-bottom:6px}
.numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.num{background:var(--verde);color:var(--creme);border-radius:12px;padding:10px;min-width:0}
.num.largo{grid-column:1/-1}
.num small{display:block;font-size:.72rem;opacity:.85;line-height:1.3}
.num strong{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.15rem;color:var(--dourado);line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.alerta{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.93rem;border-left:5px solid;overflow-wrap:anywhere}
.alerta b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.alerta small{display:block;opacity:.75;margin-top:4px;font-size:.75rem}
.a-bloqueia,.a-critico{background:var(--critico-bg);border-color:var(--critico);color:#4A140D}
.a-ns{background:var(--atencao-bg);border-color:var(--atencao);color:#3F2B00}
.a-atencao{background:#FFF7E6;border-color:#B98A1C;color:#3F2B00}
.a-info{background:#EEF3EC;border-color:var(--ok);color:#173F25}
table{width:100%;border-collapse:collapse;font-size:.88rem;table-layout:fixed}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--linha);vertical-align:top;overflow-wrap:anywhere}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-2)}
td.v,th.v{text-align:right}
td small{display:block;color:var(--texto-2);font-size:.75rem}
tr.tot td{font-weight:700;border-top:2px solid var(--verde)}
tr.parte td{color:var(--texto-2);font-style:italic}
.dica{font-size:.85rem;color:var(--texto-2)}
.retomar{background:#EEF3EC;border:1px solid #C9D8C6;border-radius:12px;padding:12px 14px;margin:14px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.aviso{font-size:.85rem;color:var(--texto-2);border-top:1px solid var(--linha);margin-top:18px;padding-top:12px}
/* linhas dos blocos */
.lin{border:1.5px solid var(--linha);border-radius:12px;padding:10px 10px 8px;margin-top:12px;background:#fff}
.lin.na{opacity:.7;background:#FAF7F0}
.lin-cab{display:flex;gap:6px;align-items:center}
.lin-cab input{flex:1;min-width:0;font-weight:600}
.lin-x{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--linha);background:#fff;color:var(--critico);font-size:1.2rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #B9AE95;border-radius:99px;padding:6px 10px;font-size:.82rem;font-weight:600;margin:0;cursor:pointer;background:#fff}
.chip input{accent-color:var(--verde);margin:0}
.chip:has(input:checked){border-color:var(--verde);background:var(--verde);color:var(--creme)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.grade .inteiro{grid-column:1/-1}
.lin label{font-size:.8rem;margin:8px 0 3px;font-weight:600;color:var(--texto-2)}
.lin .check{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:.85rem;color:var(--texto);margin-top:8px}
.lin .check input{width:20px;height:20px;flex:none;accent-color:var(--verde)}
.lin-tot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.9rem;border-top:1px dashed var(--linha);padding-top:6px}
.lin-tot b{white-space:nowrap}
.lin-err{color:var(--critico);font-size:.82rem}
.lin details{margin-top:6px;font-size:.85rem}
.lin summary{cursor:pointer;color:var(--texto-2);min-height:32px;display:flex;align-items:center}
.total-bloco{position:sticky;bottom:0;z-index:2;background:var(--verde);color:var(--creme);border-radius:12px;padding:10px 12px;margin-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 -4px 10px rgba(22,38,28,.15)}
.total-bloco b{color:var(--dourado);font-family:"Playfair Display",Georgia,serif;font-size:1.2rem;white-space:nowrap}
.check-lg{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin-top:14px;background:#fff;border:1.5px solid #B9AE95;border-radius:10px;padding:11px 12px}
.check-lg input{width:20px;height:20px;flex:none;accent-color:var(--verde);margin-top:2px}
.regua{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0}
.regua span{text-align:center;font-size:.78rem;font-weight:700;padding:8px 2px;border-radius:8px;background:var(--creme-2);color:var(--texto-2)}
.regua span.on{background:var(--verde);color:var(--dourado)}
.regua span.diag{outline:2px dashed var(--dourado-escuro);outline-offset:-3px}
.crit{list-style:none;padding:0;margin:8px 0}
.crit li{padding:6px 0 6px 30px;position:relative;border-bottom:1px solid var(--linha);font-size:.92rem}
.crit li::before{content:"";position:absolute;left:4px;top:9px;width:16px;height:16px;border-radius:50%;background:var(--critico-bg);border:2px solid var(--critico)}
.crit li.ok::before{background:var(--ok);border-color:var(--ok)}
.selo{display:flex;gap:12px;align-items:center;background:var(--verde);color:var(--creme);border:2px solid var(--dourado);border-radius:14px;padding:14px;margin-top:14px}
.selo .med{flex:none;width:56px;height:56px;border-radius:50%;background:var(--dourado);color:var(--verde);display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.1rem}
.selo b{font-family:"Playfair Display",Georgia,serif;font-size:1.15rem;color:var(--dourado);display:block}
.acoes{display:grid;gap:10px;margin-top:18px}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linha);padding:6px 0;font-size:.9rem}
.kv span:last-child{font-weight:600;text-align:right;white-space:nowrap}
.rodape{font-size:.8rem;color:var(--texto-2);text-align:center;padding:18px 16px 28px;border-top:1px solid var(--linha);margin-top:10px}
.ref{background:#F3EEE2;border:1px solid var(--linha);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.85rem;color:var(--texto-2)}
.duas{display:grid;gap:8px;margin:12px 0}
.duas div{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font-size:.9rem}
.passos{padding-left:20px;margin:6px 0}
.passos li{margin-bottom:6px;font-size:.92rem}
.num.ok strong{color:#B9E3C2}
.num.ruim{background:var(--critico)}
.num.ruim strong{color:#FFE1D9}
@media (min-width:720px){
  main{padding:36px 16px 48px}
  .card{padding:30px 32px}
  .pergunta{font-size:1.65rem}
  .tres{grid-template-columns:1fr 1fr 1fr}
  .numeros{grid-template-columns:repeat(3,1fr)}
  .num.largo{grid-column:auto}
  .acoes{grid-template-columns:1fr 1fr}
  .grade{grid-template-columns:repeat(3,1fr)}
}
@media print{.topo,.nav,.acoes{display:none}}
</style>
<body>
<header class="topo"><div class="wrap"><div class="marca"><a href="../index.html"><b>Zion</b> · Método Zion</a></div><div class="etiqueta">Pilar 6<br>Aprofundamento 6A · CAPEX</div></div></header>
<main><div class="wrap" id="app" aria-live="polite"></div></main>
<footer class="rodape" id="rodape"></footer>

<script src="logic.js"></script>
<script>
/* =====================================================================
   Zion · Trilha 1 · Pilar 6 · Aprofundamento 6A · "Faça agora · O seu CAPEX" (página 6A)
   Toda conta, alerta e texto de leitura vem de logic.js (a mesma lógica testada em Node).
   Lê, sem alterar: zion-t1-pilar6 (a página 6), zion-t1-pilar5 (unidades e rede) e zion-t1-marco-zero (situação).
   Grava só em zion-t1-pilar6a (respostas + resumo.dados), sem apagar o que a aula interativa guardou ali.
   Nada é enviado: as respostas ficam só neste aparelho (localStorage).
   ===================================================================== */
"use strict";
const Z = window.ZCAPEX;
const { brl, brl0, fmtPct, fmtN, paraNumero, dataBR } = Z;
const NS = Z.NS, NF = Z.NAO_FIZ;
const CHAVE = "zion-t1-pilar6a";
const CHAVE_P6 = "zion-t1-pilar6", CHAVE_P5 = "zion-t1-pilar5", CHAVE_MZ = "zion-t1-marco-zero";
const OUTRAS = ["zion-t1-pilar7", CHAVE_P6, CHAVE_P5, "zion-t1-pilar4", "zion-t1-aula3", "zion-t1-aula2", "zion-t1-aula1", CHAVE_MZ];
const TELAS = Z.TELAS;
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ehNS = (v) => v === NS;
function hojeISO(desloc = 0) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + desloc); const p = (n) => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
const HOJE = hojeISO();
const TURMA = (() => { try { return new URLSearchParams(window.location.search).get("turma") === "acompanhamento" ? "acompanhamento" : "autonomo"; } catch (e) { return "autonomo"; } })();
document.getElementById("rodape").textContent = Z.TEXTOS.aviso + " " + Z.TEXTOS.naoEnvia;

/* ---------- estado e salvamento no aparelho ---------- */
function estadoVazio() {
  const r = Z.estadoInicial(HOJE); r.turma = TURMA;
  return { versao: 2, pilar: "6A", pagina: Z.TEXTOS.pagina, perfil: { nome: "", cidade: "" }, respostas: r, passo: 0, iniciado: false, semeado: {}, veio: {}, lido: false, pagina6Achada: false, resumo: null, atualizado: null };
}
let S = estadoVazio();
function rawDe(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function carregarChave(k) { try { const raw = rawDe(k); if (!raw) return null; const d = JSON.parse(raw); return d && typeof d === "object" ? d : null; } catch (e) { return null; } }
function carregar() {
  const d = carregarChave(CHAVE);
  if (!d) return null;
  const e = Object.assign(estadoVazio(), d);
  let resp = {}; try { resp = Z.migrar(JSON.parse(JSON.stringify(d.respostas || {}))); } catch (x) { resp = {}; }
  e.respostas = Object.assign(Z.estadoInicial(HOJE), resp);
  e.respostas.partes = Object.assign({ 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }, resp.partes || {});
  e.respostas.turma = TURMA;
  e.semeado = Object.assign({}, d.semeado || {}); e.veio = Object.assign({}, d.veio || {});
  e.passo = Number.isInteger(d.passo) ? d.passo : 0;
  return e;
}
const E = () => S.respostas;
const calc = () => Z.calcular(E(), HOJE);
function salvar() {
  S.atualizado = new Date().toISOString();
  S.perfil.nome = E().nome || ""; S.perfil.cidade = E().cidadeUF || "";
  try { const C = calc(); S.resumo = { pagina: "6A", tema: "CAPEX", ficha: Z.TEXTOS.tituloCompleto, data: HOJE, dados: Z.resumoDados(E(), C), selo: Z.criterio(E(), C, HOJE).ok }; } catch (e) { S.resumo = null; }
  const copia = Object.assign({}, S, { passo: S.retomar ? S.passoSalvo : S.passo }); delete copia.retomar; delete copia.passoSalvo;
  try { window.localStorage.setItem(CHAVE, JSON.stringify(copia)); } catch (e) { /* sem armazenamento: a ficha segue funcionando */ }
}
function apagar() { try { window.localStorage.removeItem(CHAVE); } catch (e) {} }
/** Recomeça do zero, sem apagar o que a aula interativa guardou na mesma chave. */
function recomecar() {
  const extras = S.aulaExtras;
  apagar(); S = estadoVazio();
  if (extras) S.aulaExtras = extras;
  semear(); salvar(); S.retomar = false;
}
/** Qualquer mudança de resposta pede um PDF novo para o selo. */
function mudou() { E().pdfBaixado = false; salvar(); }

/* ---------- leituras de outras páginas do Dossiê neste aparelho (tolerante: se falhar, fica vazio) ---------- */
const dadosDe = (k) => { const d = carregarChave(k); return (d && d.resumo && d.resumo.dados) || (d && d.dados) || {}; };
function nomeDoPerfil() {
  let melhor = null;
  for (const k of OUTRAS) {
    const d = carregarChave(k); if (!d) continue;
    const nome = (d.perfil && typeof d.perfil.nome === "string" && d.perfil.nome.trim()) || (typeof d.nome === "string" && d.nome.trim()) || "";
    if (nome && (!melhor || String(d.atualizado || "") > String(melhor.at || ""))) melhor = { nome, at: d.atualizado };
  }
  return melhor ? melhor.nome : "";
}
/** Lê uma vez, ao começar: Marco Zero (situação), perfil (nome), página 6 e página 5. Só preenche o que está vazio. */
function semear() {
  if (S.lido || E().exemplo) return;
  S.lido = true;
  const r = E();
  try {
    const mz = Z.lerMarcoZero(rawDe(CHAVE_MZ));
    if (mz && mz.situacao && !r.situacao) { r.situacao = mz.situacao; S.veio.situacao = "Marco Zero"; }
    const nome = nomeDoPerfil();
    if (nome && !r.nome && nome.length >= 2 && nome.length <= 60) { r.nome = nome; S.veio.nome = "perfil salvo nas outras fichas"; }
    const P6 = Z.lerPagina6(rawDe(CHAVE_P6));
    S.pagina6Achada = !!(P6 && P6.temDados);
    if (P6) { const v = Z.aplicarPagina6(r, P6, HOJE); Object.assign(S.veio, v); if (v.unidadesFase) S.veio.unidadesFase = "página 6"; }
    const d5 = dadosDe(CHAVE_P5);
    const u1 = paraNumero(d5.unidades_fase1), uc = paraNumero(d5.unidades_projeto_completo), rede = paraNumero(d5.rede_para);
    if (u1 !== null && (Z.falta(r.unidadesFase) || S.veio.unidadesFase === "página 6")) { r.unidadesFase = String(u1); S.veio.unidadesFase = "página 5"; }
    if (uc !== null && Z.falta(r.unidadesProjeto) && !ehNS(r.unidadesProjeto)) { r.unidadesProjeto = String(uc); S.veio.unidadesProjeto = "página 5"; }

  blocoAnexo(() => { titulo("As partes da 6A nas abas da Planilha 1"); Z.PL1_MAPA.forEach((x) => par(`${x.parte} -> ${x.aba}`, { size: 7, after: 0.4 })); par(Z.TEXTOS.pl1Aviso, { size: 6.6, cor: CINZA, after: 0.5 }); }, 50);
  blocoAnexo(() => { titulo("Próxima etapa, na ordem do Mapa"); Z.PROXIMOS.forEach((x, k) => par(`${k + 1}. ${x}`, { size: 7, after: 0.4 })); par(Z.TEXTOS.sensibilidade, { size: 6.6, cor: CINZA }); }, 42);
  // rodapé em todas as páginas
  const n = doc.getNumberOfPages();
  for (let k = 1; k <= n; k++) {
    doc.setPage(k); doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.line(M, H - 12, W - M, H - 12);
    fonte("normal", 6.2, CINZA); doc.text(doc.splitTextToSize(Z.TEXTOS.aviso + " " + Z.TEXTOS.naoEnvia, CW - 14), M, H - 9);
    doc.text(`${k}/${n}`, W - M, H - 9, { align: "right" });
  }
  const arq = "Pagina-6A-CAPEX-" + (r.projeto || "projeto").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".pdf";
  doc.save(arq);
  return { arquivo: arq, paginas: n, yPagina1, limitePagina1: LIM };
}

  render();
})();
