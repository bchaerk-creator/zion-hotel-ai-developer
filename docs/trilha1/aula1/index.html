<script>
/* =====================================================================
   Zion Exercícios · Trilha 1 · Etapa 1 · Pilar 1 · Território e destino
   Um arquivo só. Sem framework. Nada é enviado: ZION_WEBHOOK_URL vazia.
   ===================================================================== */
"use strict";
const ZION_WEBHOOK_URL = "https://zion-dossie-aulas.lovable.app/api/dossie";
/** Endereço do mentor virtual (app da Lovable). Vazia: a seção mostra "Disponível em breve". O build.js copia esta linha de _fonte/base.html. */
const FEEDBACK_URL = "https://zion-dossie-aulas.lovable.app/api/feedback";
const RODAPE = "Leitura do método, não promessa. Conteúdo educacional. Não é oferta de investimento nem promessa de renda, retorno, ocupação, crédito ou sociedade.";
const CHAVE = "zion-t1-aula1"; // chave comum da Trilha 1: zion-t1-aula1 a zion-t1-aula6
const CHAVE_ANTIGA = "zion-etapa1-territorio-v1"; // lida uma vez, para quem começou antes da troca

/* ---------------------------------------------------------------------
   1. As contas. Reescrita em JS de kit-code/ferramentas/ts/util.ts e
      ts/t1-a02.ts (calculadoras["1-2"]). Mesma lógica, mesmos textos,
      mesmo arredondamento. Conferida com os testes do TS (testes/).
   --------------------------------------------------------------------- */
const ZionCalc = (function () {
  function falta(v) {
    if (v === undefined || v === null) return true;
    if (v === "nao_sei") return true;
    if (typeof v === "string") return v.trim() === "" || v.trim().toLowerCase() === "nao_sei";
    if (Array.isArray(v)) return v.length === 0;
    if (typeof v === "number") return !Number.isFinite(v);
    return false;
  }
  function paraNumero(v) {
    if (falta(v)) return null;
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    if (typeof v !== "string") return null;
    let s = v.replace(/R\$|%|\s/g, "");
    if (s === "") return null;
    if (s.includes(",")) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else {
      const pontos = (s.match(/\./g) || []).length;
      if (pontos > 1 || /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g, "");
    }
    if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }
  const num = (r, id) => paraNumero(r[id]);
  function escolha(r, id) {
    const v = r[id];
    if (v === "nao_sei") return "nao_sei";
    if (typeof v === "number") return String(v);
    if (typeof v !== "string") return null;
    const t = v.trim();
    return t === "" ? null : t;
  }
  function lista(r, id, permitidos) {
    const v = r[id];
    let arr = [];
    if (Array.isArray(v)) arr = v.map((x) => String(x).trim());
    else if (typeof v === "string" && v !== "nao_sei" && v.trim() !== "") arr = v.split(/[,;\n]/).map((x) => x.trim());
    else if (typeof v === "number") arr = [String(v)];
    arr = arr.filter((x) => x !== "" && x !== "nao_sei");
    if (permitidos) arr = arr.filter((x) => permitidos.includes(x));
    return Array.from(new Set(arr));
  }
  function ok(...xs) { return xs.every((x) => typeof x === "number" && Number.isFinite(x)); }
  function div(a, b) {
    if (!ok(a, b) || b === 0) return null;
    const q = a / b;
    return Number.isFinite(q) ? q : null;
  }
  function arred(x, casas = 2) {
    const f = Math.pow(10, casas);
    const y = Math.abs(x) * f;
    const r = Math.round(y + 1e-7) / f;
    const res = x < 0 ? -r : r;
    return Object.is(res, -0) ? 0 : res;
  }
  const agrupar = (i) => i.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  function fmtNum(x, casas = 2) {
    const r = arred(x, casas);
    const neg = r < 0;
    const [i, d] = Math.abs(r).toFixed(casas).split(".");
    return (neg ? "-" : "") + agrupar(i) + (casas > 0 ? "," + d : "");
  }
  function fmtN(x, casasMax = 2) {
    const s = fmtNum(x, casasMax);
    if (!s.includes(",")) return s;
    return s.replace(/,?0+$/, "");
  }
  function brl(x) {
    const r = arred(x, 2);
    return (r < 0 ? "-" : "") + "R$ " + fmtNum(Math.abs(r), 2);
  }
  const fmtPct = (frac, casas = 1) => fmtNum(frac * 100, casas) + "%";
  function juntar(itens) {
    if (itens.length === 0) return "";
    if (itens.length === 1) return itens[0];
    return itens.slice(0, -1).join(", ") + " e " + itens[itens.length - 1];
  }
  const limpaNumero = (x, casas) => (Number.isFinite(x) ? arred(x, casas) : null);
  const limpaTexto = (s) => s.replace(/\s*\u2014\s*/g, ", ").replace(/\u2013/g, "-");
  function limpaDetalhe(v, casas) {
    if (typeof v === "number") return limpaNumero(v, casas);
    if (typeof v === "string") return limpaTexto(v);
    if (Array.isArray(v)) return v.map(limpaTexto);
    return v;
  }
  function fechar(c, casas = 2) {
    const out = {
      id: c.id,
      rotulo: limpaTexto(c.rotulo),
      valor: typeof c.valor === "number" ? limpaNumero(c.valor, casas) : typeof c.valor === "string" ? limpaTexto(c.valor) : c.valor,
      texto: limpaTexto(c.texto),
    };
    if (c.alerta) out.alerta = c.alerta;
    if (c.detalhes) {
      out.detalhes = {};
      for (const [k, v] of Object.entries(c.detalhes)) out.detalhes[k] = limpaDetalhe(v, 4);
    }
    return out;
  }

  const SUBS = [["sub_preservacao", "preservação"], ["sub_reserva_legal", "reserva legal"], ["sub_encosta", "encosta forte"], ["sub_recuos", "recuos e faixas"], ["sub_servico", "área de serviço"]];
  const LIMITES = [["limite_fisico", "físico"], ["limite_infra", "de infraestrutura"], ["limite_experiencia", "de experiência"], ["limite_mercado", "de mercado"]];
  const DOCS = [["matricula", "matrícula atualizada"], ["car", "CAR"], ["zoneamento", "zoneamento"], ["consulta_previa", "consulta prévia"]];
  const CAMPOS_NS = ["sub_preservacao", "sub_reserva_legal", "sub_encosta", "sub_recuos", "sub_servico", "preco_terreno", "investimento_total", "limite_fisico", "limite_infra", "limite_experiencia", "limite_mercado", "caminho_leitura"];
  const m2 = (x) => `${fmtN(x, 2)} m²`;

  function calcular(r) {
    const calculos = [];
    // 1. area_usavel
    const areaMat = num(r, "area_matricula");
    const subsFaltando = SUBS.filter(([id]) => num(r, id) === null).map(([, n]) => n);
    const somaSubs = SUBS.reduce((s, [id]) => s + (num(r, id) ?? 0), 0);
    const areaUsavel = areaMat !== null && areaMat > 0 ? areaMat - somaSubs : null;
    const provisoria = subsFaltando.length > 0;
    {
      let t, alerta;
      if (areaUsavel === null) {
        t = "Falta a área da matrícula: sem ela não dá para subtrair nada.";
      } else {
        t = `Área que você pode usar: ${m2(areaMat)} da matrícula menos ${m2(somaSubs)} de subtrações = ${m2(areaUsavel)}.`;
        if (provisoria) t += ` No máximo e provisória: ${juntar(subsFaltando)} em Não sei entrou como zero. Cada Não sei vira tarefa.`;
        if (areaUsavel <= 0) {
          t += " As subtrações passam da área da matrícula: confira os números com o CAR e o topógrafo.";
          alerta = "critico";
        }
      }
      calculos.push({ id: "area_usavel", rotulo: "Área que você pode usar", valor: areaUsavel, texto: t, alerta, detalhes: { subtracoes_m2: somaSubs, provisoria, em_nao_sei: subsFaltando } });
    }
    const usavelPos = areaUsavel !== null && areaUsavel > 0 ? areaUsavel : null;
    // 2. pct_usavel
    const pctUsavel = div(usavelPos, areaMat);
    calculos.push({
      id: "pct_usavel", rotulo: "Quanto da matrícula vira negócio", valor: pctUsavel === null ? null : pctUsavel * 100,
      texto: pctUsavel === null ? "Sem a área usável, a porcentagem fica em branco." : `${fmtPct(pctUsavel)} da matrícula vira negócio${provisoria ? " (no máximo, provisório)" : ""}.`,
    });
    // capacidade (calculada antes; mostrada na ordem do JSON)
    const lims = LIMITES.map(([id, nome]) => ({ id, nome, v: num(r, id) }));
    const conhecidos = lims.filter((l) => l.v !== null);
    const faltamLim = lims.filter((l) => l.v === null);
    const capacidade = conhecidos.length ? Math.min(...conhecidos.map((l) => l.v)) : null;
    const mandam = capacidade === null ? [] : conhecidos.filter((l) => l.v === capacidade);
    // 3. tres_precos
    const preco = num(r, "preco_terreno");
    const pM2Total = div(preco, areaMat);
    const pM2Usavel = div(preco, usavelPos);
    const pUnidade = div(preco, capacidade);
    {
      let t;
      if (preco === null) t = "Falta o valor do terreno: os três preços ficam em branco.";
      else {
        const partes = [
          pM2Total !== null ? `${brl(pM2Total)} por m² total` : "por m² total em branco",
          pM2Usavel !== null ? `${brl(pM2Usavel)} por m² que você pode usar` : "por m² usável em branco (falta a área usável)",
          pUnidade !== null ? `${brl(pUnidade)} por unidade possível` : "por unidade em branco (falta a capacidade)",
        ];
        t = `O mesmo terreno de ${brl(preco)}: ${partes.join("; ")}. O preço por m² usável é o número da negociação; o preço por unidade conversa com o investimento.`;
      }
      calculos.push({ id: "tres_precos", rotulo: "Os três preços do terreno", valor: pM2Usavel, texto: t, detalhes: { preco_m2_total: pM2Total, preco_m2_usavel: pM2Usavel, preco_por_unidade: pUnidade } });
    }
    // 4. capacidade
    {
      let t;
      if (capacidade === null) t = "Nenhum dos quatro limites foi preenchido: a capacidade fica em branco. O de mercado se mede no Pilar 2, Mercado e demanda.";
      else {
        t = `O lugar aguenta ${fmtN(capacidade)} unidades: é o menor dos limites. Quem manda é o limite ${juntar(mandam.map((l) => l.nome))}.`;
        if (faltamLim.length) {
          t += ` Provisória: falta o limite ${juntar(faltamLim.map((l) => l.nome))}.`;
          if (faltamLim.some((l) => l.id === "limite_mercado")) t += " O de mercado se mede no Pilar 2, Mercado e demanda.";
        }
      }
      calculos.push({ id: "capacidade", rotulo: "Quantas unidades o lugar aguenta, e qual limite manda", valor: capacidade, texto: t, detalhes: { limite_que_manda: mandam.map((l) => l.id), provisoria: faltamLim.length > 0, limites_faltando: faltamLim.map((l) => l.id) } });

    // 5. ilusao_preco

    calculos.push({
      id: "ilusao_preco", rotulo: "Quanto o terreno parece mais barato se contar pelo que cabe", valor: ilusao,
      texto: ilusao === null ? "Falta o limite físico ou a capacidade para comparar." : `Contar pelo limite físico (${fmtN(fisico)} unidades) em vez da capacidade (${fmtN(capacidade)}) faz o terreno parecer ${fmtN(ilusao, 2)} vezes mais barato do que é.`,
    });
    // 6. peso_terreno
    const invest = num(r, "investimento_total");
    const peso = div(preco, invest);
    {
      let t, alerta;
      const regra = "Regra de bolso: até 10% fora do alerta; de 10% a 20% sensível; acima de 20% alerta aceso.";
      if (peso === null) t = `Peso a calcular: falta ${preco === null ? "o valor do terreno" : "o investimento total"}. ${regra}`;

      else if (peso > 0.1) { t = `O terreno pesa ${fmtPct(peso)} do investimento total: zona da regra de bolso, sensível. ${regra}`; alerta = "atencao"; }
      else { t = `O terreno pesa ${fmtPct(peso)} do investimento total: fora do alerta. ${regra}`; alerta = "ok"; }
      calculos.push({ id: "peso_terreno", rotulo: "Quanto o terreno pesa no investimento total", valor: peso === null ? null : peso * 100, texto: t, alerta });
    }
    // 7. documentos_faltando
    const temDocs = lista(r, "documentos", DOCS.map(([v]) => v));
    const faltamDocs = DOCS.filter(([v]) => !temDocs.includes(v));
    calculos.push({
      id: "documentos_faltando", rotulo: "Documentos que faltam",
      valor: faltamDocs.length ? faltamDocs.map(([, n]) => n).join(", ") : "nenhum",
      texto: faltamDocs.length ? `Faltam ${faltamDocs.length} de 4 documentos: ${juntar(faltamDocs.map(([, n]) => n))}.` : "Os quatro documentos estão na mão.",
      alerta: faltamDocs.some(([v]) => v === "matricula" || v === "car") ? "atencao" : faltamDocs.length ? undefined : "ok",
      detalhes: { faltam: faltamDocs.map(([v]) => v) },
    });
    // 8. conta_nao_sei
    const ns = CAMPOS_NS.filter((id) => falta(r[id]));
    calculos.push({
      id: "conta_nao_sei", rotulo: "Quantos Não sei", valor: ns.length,
      texto: ns.length ? `${ns.length} Não sei (ou em branco). Cada um vira uma tarefa: em leitura de terreno, não saber custa igual a estar errado.` : "Nenhum Não sei.",
      detalhes: { campos: ns },
    });
    // 9. veredito_sugerido
    const caminho = escolha(r, "caminho_leitura");
    const faltaMatCar = faltamDocs.some(([v]) => v === "matricula" || v === "car");
    let v, motivo;
    if (caminho === "trocar") {
      v = "pausar"; motivo = "Caminho \"trocar de terreno\": existe um limite que não se resolve. Muda-se o terreno, não o projeto.";
    } else if (caminho === "renegociar" || (peso !== null && peso > 0.2)) {
      v = "ajustar";
      motivo = caminho === "renegociar" ? "Caminho \"renegociar\": o terreno pesa demais no investimento." : `O terreno pesa ${fmtPct(peso)} do investimento, acima de 20% pela regra de bolso.`;
    } else if (peso === null || caminho === "investigar" || ns.length > 0 || faltaMatCar) {
      v = "testar";
      const m = [];
      if (caminho === "investigar") m.push("o caminho é investigar antes");
      if (ns.length > 0) m.push(`há ${ns.length} Não sei`);
      if (faltaMatCar) m.push("falta matrícula ou CAR");
      if (peso === null && ns.length === 0) m.push("o peso do terreno está em branco");
      motivo = `Testar: ${juntar(m)}. Não desenha nem põe dinheiro antes de medir.`;
    } else {
      v = "avancar";
      motivo = "Caminho \"seguir\": área usável com fonte, os quatro limites preenchidos e o peso do terreno fora do alerta.";
    }
    calculos.push({ id: "veredito_sugerido", rotulo: "Veredito sugerido pela página", valor: v, texto: motivo });
    return { calculos: calculos.map((c) => fechar(c)), veredito_sugerido: v, motivo_veredito: motivo };
  }
  return { calcular, paraNumero, falta, fmtN, brl, fmtPct, juntar, arred };
})();

  try {
    const raw = window.localStorage.getItem(CHAVE) || window.localStorage.getItem(CHAVE_ANTIGA);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object" || !d.perfil) return null;

  } catch (e) { return null; }

  const faltaMatCar = faltam.includes("matricula") || faltam.includes("car");
  // Não sei do aluno (o limite de mercado não é perguntado neste pilar)
  const nsAluno = QUESTOES.filter((q) => q.aceitaNS && (ehNS(S.respostas[q.id]) || S.respostas[q.id] === undefined || S.respostas[q.id] === ""));
  const caminho = S.respostas.caminho_leitura;
  const pesoV = peso.valor; // em pontos
  // Notas por item
  const notas = ITENS_NOTA.map((q) => ({ q, nota: notaItem(q) }));
  const soma = notas.reduce((s, x) => s + x.nota, 0);

  // Leitura: o veredito da calculadora 1-2. Única leitura a mais: quando o único
  // motivo de "testar" é o limite de mercado (que esta aula não pergunta), a leitura
  // do território é "seguir" para o Pilar 2, onde o mercado é medido.
  let v = res.veredito_sugerido, motivo = res.motivo_veredito;
  if (v === "testar" && caminho !== "investigar" && nsAluno.length === 0 && !faltaMatCar && pesoV !== null) {
    v = "avancar";
    motivo = "Território lido: área usável com fonte, matrícula e CAR na mão, três limites preenchidos e o peso do terreno fora do alerta. Falta só o limite de mercado, que se mede no Pilar 2. Até lá, não desenha nem põe dinheiro.";
  } else if (v === "testar") {
    const m = [];
    if (caminho === "investigar") m.push("você escolheu investigar antes");
    if (nsAluno.length) m.push(`há ${nsAluno.length} Não sei nas suas respostas`);
    if (faltaMatCar) m.push("falta a matrícula ou o CAR na mão");
    if (pesoV === null && !nsAluno.length) m.push("o peso do terreno está em branco");
    motivo = `Investigar antes: ${juntar(m)}. E o limite de mercado ainda se mede no Pilar 2. Não desenha nem põe dinheiro antes de medir.`;
  }

  // Alertas: críticos e Não sei primeiro
  const alertas = [];
  if (caminho === "trocar") alertas.push({ t: "critico", tit: "Crítico", txt: "Você escolheu trocar de terreno: existe um limite que não se resolve." });
  if (area.alerta === "critico") alertas.push({ t: "critico", tit: "Crítico", txt: area.texto });
  if (peso.alerta === "critico") alertas.push({ t: "critico", tit: "Crítico", txt: peso.texto });
  for (const q of nsAluno) alertas.push({ t: "ns", tit: "Não sei · vale zero", txt: `${q.curto}: vira tarefa. Onde conseguir: ${q.ondeCurto}.` });
  for (const x of notas) if (x.nota === 1) alertas.push({ t: "sem", tit: "Nota 1 · sem evidência", txt: `${x.q.curto}: é estimativa. Nota sem documento ou medida que prove não vale. Para confirmar: ${x.q.ondeCurto}.` });
  if (peso.alerta === "atencao") alertas.push({ t: "atencao", tit: "Atenção", txt: peso.texto });
  if (faltam.length) alertas.push({ t: "atencao", tit: "Atenção", txt: docs.texto + (faltaMatCar ? " Sem matrícula e CAR, a área que você pode usar ainda não tem fonte." : "") });
  alertas.push({ t: "info", tit: "Para a próxima aula", txt: "O limite de mercado (quantas unidades o destino compra) não entra neste pilar. Ele se mede no Pilar 2, Mercado e demanda, e pode mudar a capacidade." });

  // Ponto mais frágil (o que, se continuar assim, mais pesa na decisão)
  let fragil;
  const nsIds = nsAluno.map((q) => q.id);
  const ordemNS = ["sub_preservacao", "sub_reserva_legal", "limite_infra", "sub_encosta", "preco_terreno", "limite_experiencia", "limite_fisico", "sub_recuos", "investimento_total", "sub_servico", "caminho_leitura"];
  if (caminho === "trocar") fragil = "Existe um limite que não se resolve neste terreno. Antes de qualquer outra conta, escreva qual é e quem confirmou.";
  else if (area.alerta === "critico") fragil = "As subtrações passam da área da matrícula. Algum número está errado ou o terreno não comporta o projeto: confira com o CAR e o topógrafo.";
  else if (peso.alerta === "critico") fragil = `O terreno pesa ${fmtN(pesoV, 1)}% do investimento total, acima de 20% pela regra de bolso. Ou o lugar tem algo que justifica pesar mais, e o mercado paga por isso, ou a conta do terreno precisa mudar.`;
  else if (faltaMatCar) fragil = "Falta a matrícula atualizada ou o CAR na mão. Sem eles, a área que você pode usar é palpite, e todas as contas daqui para frente se apoiam nela.";
  else if (nsIds.length) {
    const id = ordemNS.find((x) => nsIds.includes(x)) || nsIds[0];
    fragil = `${Q(id).curto} ainda é Não sei. Enquanto for, a conta que depende dele fica provisória. Próximo passo: ${Q(id).ondeCurto}.`;
  } else if (notas.some((x) => x.nota === 1)) {
    const x = notas.find((y) => y.nota === 1);
    fragil = `${x.q.curto} é estimativa sem fonte. Nota sem evidência não vale: ${x.q.ondeCurto}.`;
  } else if (peso.alerta === "atencao") fragil = `O terreno pesa ${fmtN(pesoV, 1)}% do investimento total, na zona sensível da regra de bolso (de 10% a 20%).`;
  else {
    const manda = (cap.detalhes.limite_que_manda || []).map((id) => Q(id) ? Q(id).curto.toLowerCase() : id);
    fragil = `A capacidade ainda depende do limite de mercado, que se mede no Pilar 2. Hoje quem manda é o ${juntar(manda) || "menor limite"}.`;
  }

  // Sugestões para o aluno editar
  let criterioSug;
  if (peso.alerta === "critico" || caminho === "renegociar") criterioSug = "Se o produto não sustentar uma diária acima da média da região, então o peso do terreno não se justifica: pauso e renegocio, ou troco de terreno.";
  else if (faltaMatCar || nsIds.some((x) => x.startsWith("sub_"))) criterioSug = "Se a matrícula ou o CAR mostrarem que a área que posso usar não comporta o projeto, então pauso e renegocio, ou troco de terreno.";
  else if (nsIds.includes("limite_infra")) criterioSug = "Se a concessionária ou a medição da água mostrarem que a infraestrutura não se resolve a um custo que o projeto aguenta, então troco de terreno.";
  else criterioSug = "Se a consulta prévia mostrar que a zona não permite hospedagem, então troco de terreno.";

  let comp;
  const nome = S.perfil.nome || "Eu";
  if (faltaMatCar) comp = { acao: "Pegar a matrícula atualizada e o mapa do CAR e fazer as subtrações com eles.", evidencia: "Os dois documentos salvos, com as áreas marcadas e a área que posso usar escrita." };
  else if (nsIds.includes("limite_infra")) comp = { acao: "Ligar para a concessionária e anotar a distância até o poste e a tensão disponível.", evidencia: "A resposta anotada, com data e nome de quem atendeu." };
  else if (nsIds.includes("limite_experiencia")) comp = { acao: "Fazer as duas visitas ao terreno no mesmo dia, às 7h e às 17h.", evidencia: "As fotos e as anotações de sol, vento, silêncio e vista, e a contagem de unidades." };
  else if (faltam.includes("consulta_previa")) comp = { acao: "Protocolar a consulta prévia na prefeitura sobre o que quero fazer no terreno.", evidencia: "O número do protocolo." };
  else comp = { acao: "Ligar para a concessionária e anotar a distância até o poste e a tensão disponível.", evidencia: "A resposta anotada, com data e nome de quem atendeu." };
  comp.responsavel = nome; comp.prazo = hojeISO(7);

  return { res, notas, soma, alertas, fragil, v, motivo, criterioSug, comp, nsAluno, faltam };
}

/* Zion · CRM: guarda a página do Dossiê (Lovable) e registra o aluno no ClickMax. Nunca trava a ferramenta. */
const ZION_PAGINA = "t1-aula-1";
function zionEmailOk(e) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(e || "").trim()); }
function zionLead(nome, email) {
  try {
    if (!zionEmailOk(email)) return;
    const f = document.getElementById("zx-lead"); if (!f) return;
    f.querySelector('[data-cx-field="name"]').value = String(nome || "").slice(0, 200);
    f.querySelector('[data-cx-field="email"]').value = String(email).trim();
    if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
  } catch (e) { console.log("[Zion] lead não enviado", e); }
}
async function enviarParaZion(payload) {
  payload = payload || {};
  zionLead(payload.nome, payload.email);
  if (!ZION_WEBHOOK_URL) { console.log("[Zion] envio desligado (ZION_WEBHOOK_URL vazia). Payload:", payload); return { enviado: false }; }
  try {
    const corpo = { pagina: ZION_PAGINA, email: zionEmailOk(payload.email) ? String(payload.email).trim() : "", nome: String(payload.nome || "").slice(0, 200), payload: payload };
    const r = await fetch(ZION_WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    return { enviado: r.ok };
  } catch (e) { return { enviado: false, erro: String(e) }; }
}

const MENTOR_AULA_ID = "t1-aula-1";
const mentorRotulo = (k) => (LEITURAS[k] ? LEITURAS[k].rot : k);
const mentorAtualizarResumo = (L) => { S.resumo = resumoParaDossie(L); };
/* ---------------------------------------------------------------------
   Mentor virtual (o mesmo bloco nas seis ferramentas da Trilha 1).
   Só chama a rede quando o aluno toca no botão e FEEDBACK_URL está preenchida.
   Para testes, window.ZION_FEEDBACK_URL (se existir) toma o lugar da constante.
   --------------------------------------------------------------------- */
const MENTOR_TEMPO_MS = 90000;
const MENTOR_AVISO = "O mentor nunca é mais otimista que as contas.";
const MENTOR_PESO = { pausar: 3, testar: 2, ajustar: 1, avancar: 0 };
const MENTOR_MAPA = { avancar: "avancar", seguir: "avancar", testar: "testar", investigar: "testar", ajustar: "ajustar", renegociar: "ajustar", pausar: "pausar", trocar: "pausar" };
const MENTOR_COR_PDF = { verde: [22, 38, 28], ok: [31, 90, 51], verm: [155, 44, 31], ouro: [122, 94, 18], cinza: [70, 86, 75] };
/** A leitura no vocabulário do mentor: avancar, testar, ajustar ou pausar (aceita também seguir, investigar, renegociar e trocar). */
function vereditoParaMentor(v) {
  const k = String(v || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim().split(/[^a-z]/)[0];
  return MENTOR_MAPA[k] || null;
}
function urlDoMentor() {
  try { const u = window.ZION_FEEDBACK_URL; if (typeof u === "string" && u.trim()) return u.trim(); } catch (e) {}
  return FEEDBACK_URL;
}
/** A leitura do mentor vale enquanto as respostas e a leitura da ferramenta forem as mesmas. */
const assinaturaMentor = (L) => JSON.stringify([respostasParaCalculo(), L.v]);
const mentorValido = (L) => !!(S.mentor && S.mentor.resultado && S.mentor.assinatura === assinaturaMentor(L));
/** O que vai para o resumo salvo (campo mentor), ou null. */
const mentorDoResumo = (L) => (mentorValido(L) ? Object.assign({ data: S.mentor.data }, S.mentor.resultado) : null);

function corpoDoPedidoMentor(L) {
  const calculos = {};
  for (const c of L.res.calculos) calculos[c.id] = { rotulo: c.rotulo, valor: c.valor === undefined ? null : c.valor, texto: c.texto, alerta: c.alerta || null };
  calculos.leitura_da_ferramenta = { veredito: L.v, motivo: L.motivo, ponto_fragil: L.fragil, nota: L.soma, nota_maxima: NOTA_MAX, alertas: L.alertas.map((a) => ({ tipo: a.t, texto: a.txt })) };
  return { aula: MENTOR_AULA_ID, nome: S.perfil.nome, email: S.perfil.email, respostas: montarPayload(L).respostas, calculos, veredito_ferramenta: vereditoParaMentor(L.v) || "testar" };
}
function normalizarMentor(x, L) {
  if (!x || typeof x !== "object") return null;
  const txt = (v) => (typeof v === "string" ? v.trim() : "");
  const lista = (v) => (Array.isArray(v) ? v.map(txt).filter(Boolean) : []);
  const resumo = txt(x.resumo);
  if (!resumo) return null;
  const pa = x.proxima_acao && typeof x.proxima_acao === "object" ? x.proxima_acao : {};
  const ferr = vereditoParaMentor(L.v) || "testar";
  const doMentor = vereditoParaMentor(x.veredito);
  // Nunca mais otimista que as contas: fica a mais cautelosa entre a do mentor e a da ferramenta.
  const v = doMentor && MENTOR_PESO[doMentor] >= MENTOR_PESO[ferr] ? doMentor : ferr;
  return {
    resumo, pontos_fortes: lista(x.pontos_fortes), ponto_fragil: txt(x.ponto_fragil), veredito: v, veredito_rot: mentorRotulo(v),
    criterio_para_parar: txt(x.criterio_para_parar),
    proxima_acao: { acao: txt(pa.acao), responsavel: txt(pa.responsavel), prazo: txt(pa.prazo), evidencia: txt(pa.evidencia) },
    perguntas_em_aberto: lista(x.perguntas_em_aberto),
  };
}
async function pedirMentor(L) {
  const url = urlDoMentor();
  if (!url) return { erro: "Disponível em breve." };
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const relogio = setTimeout(() => { if (ctrl) ctrl.abort(); }, MENTOR_TEMPO_MS);
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpoDoPedidoMentor(L)), signal: ctrl ? ctrl.signal : undefined });
    let d = null;
    try { d = await r.json(); } catch (e) { d = null; }
    const erroServ = d && typeof d.erro === "string" ? d.erro.trim() : "";
    if (r.status === 429) return { erro: erroServ || "O mentor recebeu muitos pedidos agora. Espere alguns minutos e tente de novo." };
    if (!r.ok) return { erro: (r.status < 500 && erroServ) || "O mentor virtual não respondeu agora. Tente de novo daqui a pouco." };
    const m = normalizarMentor(d && d.resultado, L);
    if (!m) return { erro: erroServ || "O mentor virtual não conseguiu ler as suas respostas agora. Tente de novo daqui a pouco." };
    return { resultado: m };
  } catch (e) {
    return { erro: e && e.name === "AbortError" ? "O mentor demorou mais de 90 segundos para responder. Tente de novo daqui a pouco." : "Não foi possível falar com o mentor virtual. Confira a conexão com a internet e tente de novo." };
  } finally { clearTimeout(relogio); }
}

    <div class="caixa onde"><h3>Perguntas em aberto</h3>${lst(m.perguntas_em_aberto, "Nenhuma.")}</div>
    <p class="dica" style="margin-top:10px">A leitura do mentor complementa as contas e a leitura acima, não as substitui. Ela entra no seu PDF.</p>

}
function htmlSecaoMentor(L) {
  let corpo;
  if (!urlDoMentor()) corpo = `<p id="mentor-estado"><b>Disponível em breve.</b></p><button type="button" class="btn btn-s" id="mentor-pedir" disabled>Pedir a leitura do mentor virtual</button>`;
  else if (mentorValido(L)) corpo = htmlMentorResultado(S.mentor.resultado);
  else corpo = `<p class="dica">Uma segunda leitura das suas respostas, com o método da Zion: o que está forte, o que está frágil e a próxima ação. Ao pedir, esta página envia ao mentor virtual da Zion o seu nome, o seu e-mail, as suas respostas e as contas.</p>
    <button type="button" class="btn btn-s" id="mentor-pedir">Pedir a leitura do mentor virtual</button>
    <div id="mentor-estado" role="status" aria-live="polite"></div>`;
  return `<section class="bloco" id="b-mentor"><h2>O mentor virtual</h2><div id="mentor-corpo">${corpo}</div></section>`;
}
function ligarMentor(L) {
  const b = document.getElementById("mentor-pedir");
  if (!b || b.disabled) return;
  b.onclick = async () => {
    const st = document.getElementById("mentor-estado");
    b.disabled = true;
    st.innerHTML = `<p class="dica" style="margin-top:10px"><b>Lendo as suas respostas...</b> Pode levar até um minuto e meio.</p>`;
    const r = await pedirMentor(L);
    if (r.resultado) {
      S.mentor = { resultado: r.resultado, assinatura: assinaturaMentor(L), data: hojeISO() };
      mentorAtualizarResumo(L);
      salvar();
      const c = document.getElementById("mentor-corpo");
      if (c) c.innerHTML = htmlMentorResultado(r.resultado);
    } else {
      b.disabled = false;
      st.innerHTML = `<div class="alerta a-atencao" id="mentor-erro"><b>O mentor não respondeu</b>${esc(r.erro)} O resto da página continua funcionando: o PDF sai normalmente, sem a leitura do mentor.</div>`;
    }
  };
}
/** As caixas da leitura do mentor no PDF: [rótulo, texto, cor]. */
function mentorParaPDF(m) {
  const pa = m.proxima_acao || {};
  const itens = (a, vazio) => (a && a.length ? a.map((x) => "- " + x).join("\n") : vazio);
  return [

    ["Pontos fortes", itens(m.pontos_fortes, "Nenhum apontado."), "ok"],

    ["Critério para parar", m.criterio_para_parar || "Em branco", "ouro"],

    ["Perguntas em aberto", itens(m.perguntas_em_aberto, "Nenhuma."), "cinza"],
  ].map(([r, t, c]) => [r, t, MENTOR_COR_PDF[c]]);
}

function validar(q) {

/* ---------------------------------------------------------------------
   7. PDF A4 com jsPDF (fonte padrão Helvetica / Times)
   --------------------------------------------------------------------- */
function gerarPDF(L) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("jsPDF não carregou");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  // A fonte padrão do jsPDF não desenha o "²": no PDF, m² vira m2.
  const pt = (t) => String(t ?? "").replace(/²/g, "2");
  const _text = doc.text.bind(doc), _split = doc.splitTextToSize.bind(doc);
  doc.text = (t, ...a) => _text(Array.isArray(t) ? t.map(pt) : pt(t), ...a);
  doc.splitTextToSize = (t, ...a) => _split(pt(t), ...a);
  const W = 210, H = 297, M = 18, CW = W - 2 * M;
  const VERDE = [22, 38, 28], CREME = [245, 241, 232], OURO = [224, 190, 94], CINZA = [70, 86, 75], VERM = [155, 44, 31];
  let y = 0;
  const fundo = () => { doc.setFillColor(...CREME); doc.rect(0, 0, W, H, "F"); doc.setFillColor(...VERDE); doc.rect(0, 0, W, 12, "F"); doc.setFillColor(...OURO); doc.rect(0, 12, W, 0.8, "F"); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...CREME); doc.text("Zion · Mentoria Zion · Ficha do Território", M, 8); doc.text(`${S.perfil.nome}`.slice(0, 50), W - M, 8, { align: "right" }); y = 22; };
  const novaPagina = () => { doc.addPage(); fundo(); };
  const cabe = (h) => { if (y + h > H - 22) novaPagina(); };
  const titulo = (t) => { cabe(34); y += 4; doc.setFont("times", "bold"); doc.setFontSize(15); doc.setTextColor(...VERDE); doc.text(t, M, y); y += 2.5; doc.setDrawColor(...OURO); doc.setLineWidth(0.7); doc.line(M, y, M + 40, y); y += 6; };
  const par = (t, o = {}) => {
    doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 10); doc.setTextColor(...(o.cor || VERDE));
    const linhas = doc.splitTextToSize(String(t), o.w || CW);
    const lh = (o.size || 10) * 0.45;
    for (const l of linhas) { cabe(lh + 1); doc.text(l, o.x || M, y); y += lh; }
    y += o.after ?? 2;
  };
  const caixa = (rot, t, cor) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
    const linhas = doc.splitTextToSize(String(t), CW - 10);
    const h = linhas.length * 4.3 + 10;
    cabe(h + 2);
    doc.setFillColor(255, 253, 248); doc.setDrawColor(...cor); doc.setLineWidth(0.3); doc.roundedRect(M, y, CW, h, 2, 2, "FD");
    doc.setFillColor(...cor); doc.rect(M, y, 1.6, h, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...cor); doc.text(rot.toUpperCase(), M + 5, y + 5);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...VERDE);
    linhas.forEach((l, k) => doc.text(l, M + 5, y + 9.5 + k * 4.3));
    y += h + 3;
  };
  const linhaTabela = (cols, larg, o = {}) => {
    doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 9);
    const partes = cols.map((c, k) => doc.splitTextToSize(String(c), larg[k] - 3));
    const h = Math.max(...partes.map((p) => p.length)) * 4 + 3;
    cabe(h);
    if (o.fill) { doc.setFillColor(...o.fill); doc.rect(M, y - 3.6, CW, h, "F"); }
    let x = M;
    partes.forEach((p, k) => { doc.setTextColor(...((o.cores && o.cores[k]) || o.cor || VERDE)); p.forEach((l, j) => doc.text(l, x + 1.5, y + j * 4, k === partes.length - 1 && o.ultimaCentro ? { align: "center" } : undefined)); x += larg[k]; });
    y += h; doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.line(M, y - 3.4, M + CW, y - 3.4);
  };

  // Capa
  doc.setFillColor(...VERDE); doc.rect(0, 0, W, H, "F");
  doc.setDrawColor(...OURO); doc.setLineWidth(0.6); doc.rect(10, 10, W - 20, H - 20);
  doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...OURO);
  doc.text("TRILHA 1 · AULA 1 · ETAPA 1", M + 4, 48);
  doc.setFont("times", "bold"); doc.setFontSize(34); doc.setTextColor(...CREME);
  doc.text("Ficha do", M + 4, 72); doc.text("Território", M + 4, 86);
  doc.setFillColor(...OURO); doc.rect(M + 4, 93, 50, 1.2, "F");
  doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(...CREME);
  doc.text("Página 1 do Dossiê do projeto · Território e destino", M + 4, 104);
  doc.setFontSize(10); doc.setTextColor(220, 214, 200);
  doc.text(doc.splitTextToSize("Metodologia Zion de Desenvolvimento de Negócios de Hospedagem", CW - 8), M + 4, 111);
  doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...OURO); doc.text("ALUNO", M + 4, 200);
  doc.setFont("times", "bold"); doc.setFontSize(22); doc.setTextColor(...CREME); doc.text(doc.splitTextToSize(S.perfil.nome || "", CW - 8), M + 4, 210);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(220, 214, 200);
  doc.text(`Terreno em ${S.perfil.cidade}${S.perfil.uf ? "/" + S.perfil.uf : ""}`, M + 4, 222);
  doc.text(`Gerada em ${dataBR(hojeISO())}`, M + 4, 229);
  doc.setFontSize(8); doc.text(doc.splitTextToSize(RODAPE, CW - 8), M + 4, H - 26);

  // Página de resultado
  novaPagina();
  titulo("O resumo");
  const res = L.res, g = (id) => calc(res, id);
  const box = [
    ["Área que pode usar", g("area_usavel").valor === null ? "em branco" : fmtN(g("area_usavel").valor) + " m²"],
    ["Da matrícula", g("pct_usavel").valor === null ? "em branco" : fmtN(g("pct_usavel").valor, 1) + "%"],
    ["Unidades que aguenta", g("capacidade").valor === null ? "em branco" : fmtN(g("capacidade").valor)],
    ["Peso do terreno", g("peso_terreno").valor === null ? "a calcular" : fmtN(g("peso_terreno").valor, 1) + "%"],
  ];
  const bw = (CW - 9) / 4;
  box.forEach(([r, v], k) => { const x = M + k * (bw + 3); doc.setFillColor(...VERDE); doc.roundedRect(x, y, bw, 22, 2, 2, "F"); doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...CREME); doc.text(r, x + 3, y + 6); doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(...OURO); doc.text(doc.splitTextToSize(v, bw - 5)[0], x + 3, y + 16); });
  y += 30;
  const leit = LEITURAS[L.v];
  caixa("A leitura", `${leit.rot}. ${leit.sub} ${L.motivo}`, VERDE);
  caixa("O ponto mais frágil", L.fragil, VERM);
  y += 3;
  par(`Nota: ${L.soma} de ${NOTA_MAX}. Não existe nota de corte: primeiro os alertas, depois a soma, depois a decisão.`, { bold: true, after: 4 });
  const mentor = mentorDoResumo(L);
  if (mentor) { titulo("Leitura do mentor virtual"); mentorParaPDF(mentor).forEach(([r, t, c]) => caixa(r, t, c)); y += 2; }

  titulo("Os alertas");
  const corA = { critico: VERM, ns: [122, 83, 0], sem: [122, 94, 18], atencao: [150, 110, 20], info: [31, 90, 51] };
  L.alertas.forEach((x) => caixa(x.tit, x.txt, corA[x.t] || VERDE));

  titulo("As contas");
  ["area_usavel", "pct_usavel", "tres_precos", "capacidade", "ilusao_preco", "peso_terreno", "documentos_faltando"].forEach((id) => { const c = g(id); par(c.rotulo, { bold: true, after: 0.5 }); par(textoTela(c.texto), { cor: CINZA, size: 9.5, after: 3 }); });

  titulo("As suas respostas");
  const larg = [52, 92, 30];
  linhaTabela(["Pergunta", "Resposta e fonte", "Nota"], larg, { bold: true, size: 8, cor: CINZA });
  QUESTOES.forEach((q) => {
    const nota = q.nota ? String(notaItem(q)) : "";
    const fonte = fonteTexto(q);
    linhaTabela([q.curto, respostaTexto(q) + (fonte ? ` (${fonte})` : ""), nota], larg, { cores: [VERDE, VERDE, nota === "0" || nota === "1" ? VERM : VERDE] });
  });
  y += 2;
  par(`Soma: ${L.soma} de ${NOTA_MAX}. Escala por item: 0 = Não sei; 1 = estimativa sem fonte; 2 = um profissional falou, sem papel; 3 = documento ou medida.`, { size: 8.5, cor: CINZA, after: 4 });

  titulo("O critério para parar");
  caixa("Escrito antes, para não decidir pelo entusiasmo", S.criterio || "Em branco", [122, 94, 18]);

  titulo("O Compromisso de 7 dias");
  const cp = S.compromisso || {};
  [["Ação", cp.acao], ["Responsável", cp.responsavel], ["Prazo", dataBR(cp.prazo)], ["Evidência", cp.evidencia]].forEach(([r, v]) => linhaTabela([r, v || "Em branco"], [40, CW - 40], {}));
  y += 4;
  par("A Marina, citada nas explicações, é um exemplo ilustrativo: os números dela ensinam a conta e não dizem quanto vale o seu terreno. Temas jurídicos, ambientais e urbanísticos aparecem em nível introdutório: quem confirma no seu caso é o advogado, o técnico ambiental, o topógrafo, a concessionária e a prefeitura.", { size: 8, cor: CINZA });

  // Rodapé obrigatório em todas as páginas
  const n = doc.getNumberOfPages();
  for (let k = 1; k <= n; k++) {
    doc.setPage(k);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
    doc.setTextColor(...(k === 1 ? [220, 214, 200] : CINZA));
    if (k > 1) { doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.line(M, H - 16, W - M, H - 16); doc.text(doc.splitTextToSize(RODAPE, CW - 14), M, H - 12); }
    doc.text(`${k}/${n}`, W - M, H - 12, { align: "right" });
  }
  const arq = "Ficha-do-Territorio-" + (S.perfil.nome || "aluno").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".pdf";
  doc.save(arq);
  return arq;
}

/* ---------------------------------------------------------------------
   8. Início
   --------------------------------------------------------------------- */
window.ZionCalc = ZionCalc;
window.ZionApp = { ler, montarPayload, enviarParaZion, resumoParaDossie, vereditoParaMentor, corpoDoPedidoMentor, get estado() { return S; } };
(function iniciar() {
  const salvo = carregar();
  if (salvo) S.perfil = Object.assign(S.perfil, salvo.perfil);
  render();
})();
</script>
