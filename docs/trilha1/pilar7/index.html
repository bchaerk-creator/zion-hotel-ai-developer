async function pedirMentor(L) {

}

/* ---------------------------------------------------------------------
   7. O Dossiê completo em PDF A4 com jsPDF

const VERDE = [22, 38, 28], CREME = [245, 241, 232], OURO = [224, 190, 94], CINZA = [70, 86, 75], VERM = [155, 44, 31], OURO_E = [122, 94, 18];
const COR_ALERTA = { critico: VERM, ns: [122, 83, 0], sem: OURO_E, atencao: [150, 110, 20], info: [31, 90, 51] };
function criarPDF(cabecalho) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("jsPDF não carregou");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  // A fonte padrão do jsPDF só desenha o alfabeto latino básico: m² vira m2 e as aspas curvas viram retas.
  const pt = (t) => String(t ?? "").replace(/²/g, "2").replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/\u2026/g, "...").replace(/[\u2013\u2014]/g, "-").replace(/\u2265/g, ">=").replace(/\u2264/g, "<=").replace(/\u2192/g, "->").replace(/\u2212/g, "-");
  const _text = doc.text.bind(doc), _split = doc.splitTextToSize.bind(doc);
  doc.text = (t, ...a) => _text(Array.isArray(t) ? t.map(pt) : pt(t), ...a);
  doc.splitTextToSize = (t, ...a) => _split(pt(t), ...a);
  const P = { doc, W: 210, H: 297, M: 18, y: 0 };
  P.CW = P.W - 2 * P.M;
  P.fundo = () => { doc.setFillColor(...CREME); doc.rect(0, 0, P.W, P.H, "F"); doc.setFillColor(...VERDE); doc.rect(0, 0, P.W, 12, "F"); doc.setFillColor(...OURO); doc.rect(0, 12, P.W, 0.8, "F"); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...CREME); doc.text(cabecalho, P.M, 8); doc.text(`${S.perfil.nome}`.slice(0, 50), P.W - P.M, 8, { align: "right" }); P.y = 22; };
  P.novaPagina = () => { doc.addPage(); P.fundo(); };
  P.cabe = (h) => { if (P.y + h > P.H - 22) P.novaPagina(); };
  P.titulo = (t) => { P.cabe(34); P.y += 4; doc.setFont("times", "bold"); doc.setFontSize(15); doc.setTextColor(...VERDE); doc.text(t, P.M, P.y); P.y += 2.5; doc.setDrawColor(...OURO); doc.setLineWidth(0.7); doc.line(P.M, P.y, P.M + 40, P.y); P.y += 6; };
  P.par = (t, o = {}) => {
    doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 10); doc.setTextColor(...(o.cor || VERDE));
    const linhas = doc.splitTextToSize(String(t), o.w || P.CW);
    const lh = (o.size || 10) * 0.45;
    for (const l of linhas) { P.cabe(lh + 1); doc.text(l, o.x || P.M, P.y); P.y += lh; }
    P.y += o.after ?? 2;
  };
  P.caixa = (rot, t, cor) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
    let linhas = doc.splitTextToSize(String(t), P.CW - 10);
    const max = Math.floor((P.H - 22 - 22 - 12) / 4.3);
    while (linhas.length) {
      const parte = linhas.slice(0, max); linhas = linhas.slice(max);
      const h = parte.length * 4.3 + 10;
      P.cabe(h + 2);
      doc.setFillColor(255, 253, 248); doc.setDrawColor(...cor); doc.setLineWidth(0.3); doc.roundedRect(P.M, P.y, P.CW, h, 2, 2, "FD");
      doc.setFillColor(...cor); doc.rect(P.M, P.y, 1.6, h, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...cor); doc.text(rot.toUpperCase(), P.M + 5, P.y + 5);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...VERDE);
      parte.forEach((l, k) => doc.text(l, P.M + 5, P.y + 9.5 + k * 4.3));
      P.y += h + 3;
    }
  };
  P.linhaTabela = (cols, larg, o = {}) => {
    doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 9);
    const partes = cols.map((c, k) => doc.splitTextToSize(String(c), larg[k] - 3));
    const h = Math.max(...partes.map((p) => p.length)) * 4 + 3;
    P.cabe(Math.min(h, 60));
    let x = P.M;
    partes.forEach((p, k) => { doc.setTextColor(...((o.cores && o.cores[k]) || o.cor || VERDE)); p.forEach((l, j) => doc.text(l, x + 1.5, P.y + j * 4)); x += larg[k]; });
    P.y += h; doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.line(P.M, P.y - 3.4, P.M + P.CW, P.y - 3.4);
  };
  P.tabela = (t) => {
    if (t.titulo) P.par(t.titulo, { bold: true, after: 2 });
    const larg = t.larg && t.larg.length === t.cab.length ? t.larg : t.cab.map(() => P.CW / t.cab.length);
    P.linhaTabela(t.cab, larg, { bold: true, size: 8, cor: CINZA });
    t.linhas.forEach((l) => P.linhaTabela(l, larg, { bold: /^Investimento total|^Soma da folha/.test(String(l[0])) }));
    P.y += 3;
  };
  P.caixasNumeros = (box) => {
    const n = box.length, bw = (P.CW - 3 * (n - 1)) / n;
    P.cabe(26);
    box.forEach(([r, v], k) => { const x = P.M + k * (bw + 3); doc.setFillColor(...VERDE); doc.roundedRect(x, P.y, bw, 22, 2, 2, "F"); doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...CREME); doc.text(doc.splitTextToSize(r, bw - 5).slice(0, 2), x + 3, P.y + 5); doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...OURO); doc.text(doc.splitTextToSize(String(v), bw - 5).slice(0, 2), x + 3, P.y + 15.5); });
    P.y += 30;
  };
  P.regua = (C) => {
    const marcas = [["C", C.volta.cons], ["B", C.volta.base], ["O", C.volta.otim], ["T", C.voltaComTerreno]].filter(([, a]) => okN(a));
    if (!marcas.length) return;
    P.cabe(30);
    const x0 = P.M, w = P.CW, esc16 = (a) => x0 + (Math.min(a, 16) / 16) * w, y = P.y + 8;
    [[0, 5, [31, 90, 51]], [5, 8, [94, 143, 98]], [8, 12, [185, 138, 28]], [12, 16, VERM]].forEach(([a, b, c]) => { doc.setFillColor(...c); doc.rect(esc16(a), y, esc16(b) - esc16(a), 4, "F"); });
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    marcas.forEach(([r, a]) => { const x = esc16(a); doc.setDrawColor(...(r === "T" ? VERM : VERDE)); doc.setLineWidth(0.8); doc.line(x, y - 3, x, y + 7); doc.setTextColor(...VERDE); doc.text(r + (a > 16 ? "+" : ""), x, y - 4.5, { align: "center" }); });
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...CINZA);
    [0, 5, 8, 12, 16].forEach((a) => doc.text(a === 16 ? "16+ anos" : String(a), esc16(a), y + 11, { align: a === 16 ? "right" : a === 0 ? "left" : "center" }));
    P.y = y + 15;
    P.par("C = conservador · B = base · O = otimista · T = conservador com o terreno somado. Régua: até 5 anos, muito bom e raro; 5 a 8, bom; 8 a 12, aceitável com valorização; acima de 12, só com razão escrita.", { size: 8, cor: CINZA, after: 3 });
  };
  P.capa = (sobre, l1, l2, sub, extra) => {
    doc.setFillColor(...VERDE); doc.rect(0, 0, P.W, P.H, "F");
    doc.setDrawColor(...OURO); doc.setLineWidth(0.6); doc.rect(10, 10, P.W - 20, P.H - 20);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...OURO); doc.text(sobre, P.M + 4, 48);
    doc.setFont("times", "bold"); doc.setFontSize(32); doc.setTextColor(...CREME); doc.text(l1, P.M + 4, 72); if (l2) doc.text(l2, P.M + 4, 86);
    doc.setFillColor(...OURO); doc.rect(P.M + 4, 93, 50, 1.2, "F");
    doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(...CREME); doc.text(doc.splitTextToSize(sub, P.CW - 8), P.M + 4, 104);
    doc.setFontSize(10); doc.setTextColor(220, 214, 200); doc.text(doc.splitTextToSize(`${CURSO} · ${SUBTITULO}`, P.CW - 8), P.M + 4, 117);
    if (extra) extra(doc);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...OURO); doc.text("ALUNO", P.M + 4, 200);
    doc.setFont("times", "bold"); doc.setFontSize(22); doc.setTextColor(...CREME); doc.text(doc.splitTextToSize(S.perfil.nome || "", P.CW - 8), P.M + 4, 210);
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(220, 214, 200);
    doc.text(`Terreno em ${S.perfil.cidade}${S.perfil.uf ? "/" + S.perfil.uf : ""}`, P.M + 4, 222);
    doc.text(`Gerada em ${dataBR(hojeISO())}`, P.M + 4, 229);
    doc.setFontSize(8); doc.text(doc.splitTextToSize(RODAPE, P.CW - 8), P.M + 4, P.H - 30);
  };
  P.fechar = (nomeArquivo) => {
    const n = doc.getNumberOfPages();
    for (let k = 1; k <= n; k++) {
      doc.setPage(k);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
      doc.setTextColor(...(k === 1 ? [220, 214, 200] : CINZA));
      if (k > 1) { doc.setDrawColor(214, 205, 184); doc.setLineWidth(0.2); doc.line(P.M, P.H - 16, P.W - P.M, P.H - 16); doc.text(doc.splitTextToSize(RODAPE, P.CW - 14), P.M, P.H - 12.5); }
      doc.text(`${k}/${n}`, P.W - P.M, P.H - 12.5, { align: "right" });
    }
    const arq = nomeArquivo + "-" + (S.perfil.nome || "aluno").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".pdf";
    doc.save(arq);

  };

}

const COR_VP = { avancar: [31, 90, 51], testar: [150, 110, 20], ajustar: [122, 83, 0], pausar: VERM, parar: VERM };
function abrirPagina(P, n, nome, pergunta, status) {
