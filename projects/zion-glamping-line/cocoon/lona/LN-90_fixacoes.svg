<text x="60.00" y="866.00" fill="#8B714E" text-anchor="start" style="font-family:'DM Sans','Aventa',Helvetica,Arial,sans-serif;font-size:9px;font-weight:400;letter-spacing:0em;">clamps e anéis · 5 tensionar em cruz, em 3 passes (30 %, 70 %, 100 %) · 6 medir pré-tensão e flechas, registrar · 7 teste de água · vento > 30 km/h suspende.</text>
