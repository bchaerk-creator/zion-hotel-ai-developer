<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Carrossel Zion</title>
<style>
@font-face{font-family:C;src:url(__FONTS__/cormorant.woff2);font-weight:300 700}
@font-face{font-family:A;src:url(__FONTS__/aventa.woff2);font-weight:300 700}
:root{--bg:#040605;--musgo:#1B2117;--creme:#FEF5F0;--areia:#DED6BF;--dest:#C9B37E}
*{margin:0;box-sizing:border-box}
body{background:#222;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px}
.slide{position:relative;width:1080px;height:1350px;background:var(--bg);color:var(--creme);font-family:A;overflow:hidden;flex:none}
.slide.alt{background:var(--musgo)}
.n{position:absolute;right:72px;top:64px;font-size:28px;letter-spacing:.12em;color:var(--dest)}
.k{font-size:30px;letter-spacing:.26em;text-transform:uppercase;color:var(--dest)}
h1{font-family:C;font-weight:600;line-height:1.02;color:var(--creme)}
.txt{color:var(--areia);line-height:1.32}
.body{position:absolute;left:72px;right:72px;top:150px}
.f{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;font-size:24px;letter-spacing:.08em;color:var(--dest);border-top:1px solid rgba(201,179,126,.45);padding-top:20px}
.visual{position:absolute;left:72px;right:72px;bottom:130px}
/* capa e cta */
.capa .body,.cta .body{top:auto;bottom:170px}
.capa h1{font-size:128px;margin:24px 0 32px}.cta h1{font-size:112px;margin:24px 0 32px}
.capa .txt,.cta .txt{font-size:44px}
.capa .seta{color:var(--dest);font-size:44px;margin-top:28px;letter-spacing:.06em}
.barra{position:absolute;left:72px;top:150px;width:120px;height:6px;background:var(--dest)}
/* texto / passo */
.texto h1,.passo h1{font-size:92px;margin:22px 0 28px}
.texto .txt,.passo .txt{font-size:42px}
.texto .body{top:230px}
.passo .body{top:130px}
.passo h1{font-size:80px}
/* visuais */
table{width:100%;border-collapse:collapse;font-size:35px}
th{font-family:C;font-size:42px;color:var(--dest);text-align:left;padding:18px 24px;border-bottom:2px solid var(--dest);font-weight:600}
td{padding:22px 24px;border-bottom:1px solid rgba(222,214,191,.25);line-height:1.25;vertical-align:top}
td:first-child{font-weight:700;color:var(--dest);width:260px}
.leg{font-size:25px;letter-spacing:.06em;color:var(--areia);margin-top:16px;opacity:.85}
.win{border:2px solid rgba(201,179,126,.5);border-radius:22px;background:var(--bg);overflow:hidden}
.alt .win{background:#0c120a}
.win .bar{display:flex;gap:10px;padding:16px 22px;border-bottom:1px solid rgba(201,179,126,.3)}
.win .bar i{width:16px;height:16px;border-radius:50%;background:rgba(201,179,126,.55)}
.win .in{padding:30px 34px;font-size:33px;line-height:1.38;color:var(--creme);white-space:pre-line}
.win .tag{font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:var(--dest);padding:0 34px 0;margin-top:26px}
.lado{display:flex;gap:26px;align-items:stretch}
.lado .win{flex:1}
.lado .in{font-size:28px;min-height:330px}
.mini{display:flex;flex-direction:column;gap:12px;padding:26px}
.mini div{border:1px solid rgba(201,179,126,.55);border-radius:12px;padding:16px 18px;font-size:23px;color:var(--areia);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;text-align:center;width:150px}
.minis{display:flex;gap:12px;padding:26px 26px 0}
.pasta{padding:30px 36px}
.pasta .nome{font-family:C;font-size:46px;color:var(--dest);margin-bottom:18px;font-weight:600}
.pasta .arq{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;font-size:29px;color:var(--creme)}
.pasta .arq div:before{content:"▢  ";color:var(--dest)}
</style></head><body>
<script id="dados" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('dados').textContent);
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const N=D.slides.length;
function visual(v){
 if(!v)return '';
 let h='';
 if(v.tipo==='tabela'){
  h='<table><tr>'+v.colunas.map(c=>'<th>'+e(c)+'</th>').join('')+'</tr>'+v.linhas.map(l=>'<tr>'+l.map(c=>'<td>'+e(c)+'</td>').join('')+'</tr>').join('')+'</table>';
 }else if(v.tipo==='chat'){
  h='<div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="in">'+e(v.texto)+'</div></div>';
 }else if(v.tipo==='lado'){
  h='<div class="lado"><div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="tag">'+e(v.esquerda)+'</div><div class="in">'+e(v.conversa||'')+'</div></div>'+
  '<div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="tag">'+e(v.direita)+'</div><div class="minis">'+(v.minis||[]).map(m=>'<div style="border:1px solid rgba(201,179,126,.55);border-radius:12px;padding:14px;font-size:22px;color:#DED6BF;aspect-ratio:4/5;flex:1;display:flex;align-items:center;justify-content:center;text-align:center">'+e(m)+'</div>').join('')+'</div></div></div>';
 }else if(v.tipo==='pasta'){
  h='<div class="win pasta"><div class="nome">'+e(v.nome)+'/</div><div class="arq">'+v.arquivos.map(a=>'<div>'+e(a)+'</div>').join('')+'</div></div>';
 }
 if(v.legenda)h+='<div class="leg">'+e(v.legenda)+'</div>';
 return '<div class="visual">'+h+'</div>';
}
D.slides.forEach((s,i)=>{
 const el=document.createElement('section');
 el.className='slide '+s.papel+(i%2?' alt':'');
 const seta=s.papel==='capa'?'<div class="seta">Arrasta pro lado →</div>':'';
 el.innerHTML=(s.papel==='capa'?'':'<div class="n">'+(i+1)+'/'+N+'</div>')+
  '<div class="body"><div class="k">'+e(s.kicker||'')+'</div><h1>'+e(s.titulo)+'</h1>'+(s.texto?'<div class="txt">'+e(s.texto)+'</div>':'')+seta+'</div>'+
  visual(s.visual)+'<div class="f"><span>'+e(D.marca)+'</span><span>'+(i+1)+' / '+N+'</span></div>';
 document.body.appendChild(el);
});
</script></body></html>
