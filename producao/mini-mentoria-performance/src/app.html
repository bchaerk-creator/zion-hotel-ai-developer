<style>
@font-face{font-family:Cormorant;src:url(data:font/woff2;base64,{{FONT_CORM}}) format("woff2");font-weight:300 700}
@font-face{font-family:Cormorant;font-style:italic;src:url(data:font/woff2;base64,{{FONT_CORM_I}}) format("woff2")}
@font-face{font-family:Aventa;src:url(data:font/woff2;base64,{{FONT_AVENTA}}) format("woff2")}
:root{--preto:#040605;--musgo:#1B2117;--creme:#FEF5F0;--areia:#DED6BF;--terra:#8B714E;--ouro:#C9B37E;--ok:#2f6b3a;--al:#9a5b13;--er:#8e2b2b;--amarelo:#fff3c4;--verde:#dff0df}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Aventa,Jost,system-ui,sans-serif;background:var(--creme);color:#1d211b;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3{font-family:Cormorant,Georgia,serif;font-weight:500;line-height:1.1;margin:0;color:var(--musgo)}
div.stk{position:sticky;top:0;z-index:20}header.top{background:var(--musgo);color:var(--creme);padding:10px 16px;display:flex;align-items:center;gap:12px}
header.top img{height:26px}header.top .tt{font-family:Cormorant,serif;font-size:19px;flex:1;line-height:1.1}header.top .pg{font-size:12px;color:var(--ouro);white-space:nowrap}
.bar{height:5px;background:rgba(222,214,191,.25)}.bar i{display:block;height:100%;background:var(--ouro);width:0;transition:width .3s}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--musgo);padding:0 10px 8px}
nav.tabs button{flex:none;background:transparent;border:0;color:var(--areia);font:inherit;font-size:14px;padding:8px 12px;border-radius:18px;cursor:pointer;min-height:44px}
nav.tabs button.on{background:var(--ouro);color:var(--preto)}
main{max-width:880px;margin:0 auto;padding:18px 16px 70px}
.card{background:#fff;border:1px solid var(--areia);border-radius:10px;padding:16px;margin:0 0 14px}
.card h2{font-size:28px;margin-bottom:6px}.card h3{font-size:22px;margin:4px 0 8px}
.kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
.hero{background:var(--musgo);color:var(--creme);border:0}.hero h1{color:var(--creme);font-size:36px}.hero p{color:var(--areia)}
.btn{display:inline-block;background:var(--musgo);color:var(--creme);border:0;border-radius:6px;padding:12px 18px;font:inherit;font-size:15px;cursor:pointer;min-height:44px;text-decoration:none;margin:2px 4px 2px 0}
.btn.ouro{background:var(--ouro);color:var(--preto)}.btn.ghost{background:transparent;color:var(--musgo);border:1px solid var(--musgo)}.btn:disabled{opacity:.5}
.mods{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:620px){.mods{grid-template-columns:1fr 1fr}}
.mod{text-align:left;background:#fff;border:1px solid var(--areia);border-radius:10px;padding:14px;font:inherit;cursor:pointer;min-height:70px}
.mod b{display:block;font-family:Cormorant,serif;font-size:21px;color:var(--musgo)}.mod small{color:#666}
.pergunta{font-family:Cormorant,serif;font-style:italic;font-size:25px;color:var(--musgo);line-height:1.15;margin:4px 0 8px}
.video{background:var(--musgo);color:var(--areia);border-radius:8px;padding:22px 16px;text-align:center;font-size:14px;margin:0 0 14px}
.opts{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}@media(min-width:620px){.opts{grid-template-columns:repeat(5,1fr)}}
.opts label{display:flex;align-items:center;gap:8px;border:1px solid #c9bfa5;border-radius:8px;padding:10px;min-height:44px;cursor:pointer;font-size:14px;background:#fff}
.opts input{width:20px;height:20px;flex:none}.opts label.sel{background:var(--amarelo);border-color:var(--terra)}
details.ajuda{background:#fbf6ea;border-left:4px solid var(--ouro);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14.5px}details.ajuda summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--musgo)}
details.ajuda ol{margin:6px 0 6px 18px;padding:0}
label.f{display:block;margin:10px 0}label.f span.l{display:block;font-size:14px;color:#444;margin-bottom:3px}
input[type=text],select,textarea,input[type=month]{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #c9bfa5;border-radius:6px;background:var(--amarelo)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:0 14px}@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr;gap:6px;padding:8px 0;border-top:1px dotted #d8cdb0}@media(min-width:620px){.row{grid-template-columns:repeat(var(--c),1fr)}}
.row label span{font-size:12px;color:#555;display:block}
.mes{display:grid;grid-template-columns:42px repeat(3,1fr);gap:6px;align-items:center;margin:4px 0}.mes b{font-size:13px}
.res{background:var(--verde);border-radius:8px;padding:12px 14px;margin:12px 0}
.res .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted #9bb89b}.res .l b{font-variant-numeric:tabular-nums;text-align:right}
.res .dest{font-family:Cormorant,serif;font-size:30px;color:var(--musgo)}
.av{font-size:13.5px;background:#fdebd0;border-left:4px solid var(--al);border-radius:6px;padding:7px 10px;margin:6px 0}
.fb{border:1px solid var(--areia);border-radius:8px;margin:10px 0;overflow:hidden}.fb div{padding:8px 12px;border-top:1px solid #eee;font-size:14.5px}.fb div:first-child{border:0}.fb div b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.aviso{font-size:13px;color:#555;background:#f3eee0;border-radius:6px;padding:8px 10px;margin:10px 0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--areia);color:var(--musgo);margin:0 4px 2px 0}
.tag.ok{background:var(--verde)}.tag.al{background:#fde6c2}.tag.er{background:#f6d0d0}
.pil{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;margin:8px 0;font-size:14px}.pil .t{height:14px;background:#eee7d4;border-radius:7px;position:relative;overflow:hidden}.pil .t i{display:block;height:100%;background:var(--musgo)}.pil .t u{position:absolute;left:0;top:0;height:100%;background:rgba(201,179,126,.45)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid #e6dfcc;text-align:left;vertical-align:top}th{background:var(--musgo);color:var(--creme);font-weight:400}
.pl{border:1px solid var(--areia);border-radius:8px;padding:10px;margin:8px 0;background:#fff}.pl h4{margin:0 0 4px;font-family:Aventa,sans-serif;font-weight:700;font-size:15.5px;line-height:1.35;color:var(--musgo)}
.pl .m{font-size:13.5px;color:#444}.pl .ed{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}@media(min-width:620px){.pl .ed{grid-template-columns:2fr 1fr}}
.rodape{font-size:12px;color:#666;text-align:center;margin-top:20px}
@media print{div.stk,.noprint{display:none!important}main{padding:0}.card{border:0}body{background:#fff}}
</style>
<div class="stk"><header class="top"><img alt="Zion" src="data:image/png;base64,{{LOGO}}"><div class="tt">Raio-X da Hospedagem</div><div class="pg" id="pgTxt"></div></header>
<div class="bar"><i id="pgBar"></i></div><nav class="tabs" id="tabs"></nav></div>
<main id="v"></main>
<script>{{LOGIC}}</script>
<script>
(function(){
"use strict";
var Q={{QUESTOES}}.questions,META={{META}},GUIA={{GUIA}},AULAS={{AULAS}},VIDEOS={{VIDEOS}};
var $=function(s,r){return(r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var MODS=[null,"Identidade","Vendas","Experiência","Finanças","Operação","Expansão","Parcerias"];
var CK={C1:1,C2:2,C3:3,C4:4,C5:5,C6:6,C7:7};
var PFX="zion_rx_v1:",perfilId=null,P=null,view="inicio";
/* ---------- armazenamento local, uma chave por perfil ---------- */
function lsGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{window.localStorage.setItem(k,v);return true}catch(e){return false}}
function indice(){try{return JSON.parse(lsGet(PFX+"indice")||"[]")}catch(e){return[]}}
function novoPerfil(nome){return{nome:nome,criado:hoje(),identificacao:{},respostas:{},notas:{},calculadoras:{},edicoesPlano:{},consentimento:false,aulasVistas:{}}}
function hoje(){return new Date().toISOString().slice(0,10)}
function carregar(id){var raw=lsGet(PFX+"p:"+id);var p=null;try{p=raw?JSON.parse(raw):null}catch(e){}return p}
function salvar(){if(!perfilId)return;lsSet(PFX+"p:"+perfilId,JSON.stringify(P))}
function entrar(nome){nome=(nome||"").trim().slice(0,40);if(!nome)return false;var id=nome.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"perfil";var ix=indice();if(ix.indexOf(id)<0){ix.push(id);lsSet(PFX+"indice",JSON.stringify(ix))}
 perfilId=id;P=carregar(id)||novoPerfil(nome);P.nome=P.nome||nome;lsSet(PFX+"ativo",id);salvar();return true}
function sair(){perfilId=null;P=null;lsSet(PFX+"ativo","");render()}
/* ---------- progresso ---------- */
function respondidas(){return Q.filter(function(q){return P.respostas[q.id]!==undefined&&P.respostas[q.id]!==null}).length}
function progresso(){var n=respondidas(),c=Object.keys(P.calculadoras).filter(function(k){return Object.keys(P.calculadoras[k]).length}).length;return Math.round((n+c)/(Q.length+7)*100)}
function atualizaTopo(){var p=P?progresso():0;$("#pgBar").style.width=p+"%";$("#pgTxt").textContent=P?p+"% concluído":""}
/* ---------- utilidades de tela ---------- */
function fmt(v,suf,dec){if(v===null||v===undefined||(typeof v==="number"&&!isFinite(v)))return"—";return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:dec===undefined?(Number.isInteger(v)?0:2):dec,maximumFractionDigits:dec===undefined?2:dec})+(suf||"")}
function brl(v){return v===null||v===undefined?"—":"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function nivelTxt(n){return{construir:"base a construir",desenvolvimento:"em desenvolvimento",consolidado:"consolidado",sem_dados:"sem dados"}[n]}
function nivelCls(n){return n==="consolidado"?"ok":n==="desenvolvimento"?"al":n==="construir"?"er":""}
function confTxt(c){return{baixa:"cobertura baixa: nota provisória",media:"cobertura média",alta:"cobertura alta",sem_dados:"sem dados"}[c]}
function dx(){return RX.diagnostico(Q,P.respostas)}
function pl(){return RX.plano(Q,META,P.respostas,{inicio:P.inicioPlano||hoje(),edits:P.edicoesPlano})}
/* ---------- abas ---------- */
var TABS=[["inicio","Início"],["ficha","Ficha"]].concat([1,2,3,4,5,6,7].map(function(i){return["aula"+i,i+" · "+MODS[i]]})).concat([["diag","Diagnóstico"],["plano","Plano"],["dossie","Dossiê"],["convite","Convite"]]);
function abas(){$("#tabs").innerHTML=P?TABS.map(function(t){return'<button data-v="'+t[0]+'" class="'+(view===t[0]?"on":"")+'">'+esc(t[1])+"</button>"}).join(""):"";document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){ir(b.dataset.v)}})}
function ir(v){view=v;history.replaceState(null,"","#"+v);render();window.scrollTo(0,0)}
/* ---------- telas ---------- */
function telaEntrada(){var ix=indice(),h='<div class="card hero"><div class="kick" style="color:var(--ouro)">Zion Hotel Academy · Mini Mentoria de Performance Hoteleira</div><h1>Raio-X da Hospedagem</h1><p>Descubra o que pode estar impedindo sua hospedagem de crescer e seu calendário de reservas de estar cheio. Responda, calcule e receba um plano de ação personalizado.</p></div>';
 h+='<div class="card"><h2>Quem vai usar?</h2><p>Seus dados ficam <b>só neste aparelho</b>, em um perfil com o nome que você escolher. Nada é enviado à Zion. Use "Dossiê" para guardar uma cópia de segurança.</p>';
 if(ix.length){h+='<p>Perfis neste aparelho:</p>'+ix.map(function(id){var p=carregar(id);return'<button class="btn ghost" data-pf="'+esc(id)+'">'+esc(p?p.nome:id)+"</button>"}).join("")}
 h+='<label class="f"><span class="l">Novo perfil (nome ou apelido)</span><input type="text" id="nomePf" maxlength="40" autocomplete="off"></label><button class="btn ouro" id="criaPf">Começar</button></div>';
 $("#v").innerHTML=h;$("#criaPf").onclick=function(){if(entrar($("#nomePf").value))ir("inicio")};document.querySelectorAll("[data-pf]").forEach(function(b){b.onclick=function(){entrar(carregar(b.dataset.pf)?carregar(b.dataset.pf).nome:b.dataset.pf);ir("inicio")}})}
function telaInicio(){var d=dx(),h='<div class="card hero"><div class="kick" style="color:var(--ouro)">Olá, '+esc(P.nome)+'</div><h1>Seu Raio-X da Hospedagem</h1><p>Percurso: ficha, 7 módulos (aula, formulário e calculadora), diagnóstico, plano de ação e dossiê em PDF.</p><button class="btn ouro" data-ir="'+(P.identificacao.nome?"aula1":"ficha")+'">'+(respondidas()?"Continuar":"Começar pela ficha")+'</button></div>';
 h+='<div class="card"><div class="kick">Os 7 módulos</div><div class="mods">'+[1,2,3,4,5,6,7].map(function(i){var p=d.pilares[i-1];return'<button class="mod" data-ir="aula'+i+'"><b>'+i+" · "+esc(AULAS[i].titulo)+"</b><small>"+p.validos+" de "+p.aplicaveis+" respondidas com dados"+(P.calculadoras["C"+i]&&Object.keys(P.calculadoras["C"+i]).length?" · calculadora usada":"")+"</small></button>"}).join("")+"</div></div>";
 h+='<div class="aviso">Orientação educacional baseada nos dados que você declarar. Não é auditoria nem parecer profissional e não garante reservas, ocupação, renda ou investimento. Marque "não sei" quando não souber: desconhecido não vale zero.</div>';
 h+='<p class="noprint"><button class="btn ghost" id="trocaPf">Trocar de perfil</button></p>';
 $("#v").innerHTML=h;ligaIr();$("#trocaPf").onclick=sair}
function ligaIr(){document.querySelectorAll("[data-ir]").forEach(function(b){b.onclick=function(){ir(b.dataset.ir)}})}
var TIPOS=["Airbnb / casa / apartamento","Chalé","Pousada","Glamping / cabana","Hotel pequeno","Outro"],ESTAGIOS=["Ainda não opera (projeto)","Opera há menos de 1 ano","Opera de 1 a 3 anos","Opera há mais de 3 anos"],OBJ=["Encher o calendário","Aumentar a diária","Melhorar a margem","Organizar a operação","Expandir","Buscar parceria ou capital","Ainda não sei"];
function telaFicha(){var i=P.identificacao,h='<div class="card"><div class="kick">Ficha inicial</div><h2>Sobre o seu empreendimento</h2><p>Só o que for útil para o seu diagnóstico. Não coletamos CPF, e-mail nem telefone aqui.</p><div class="grid2">';
 function sel(k,l,o){return'<label class="f"><span class="l">'+l+'</span><select data-id="'+k+'"><option value="">Escolha</option>'+o.map(function(x){return"<option"+(i[k]===x?" selected":"")+">"+esc(x)+"</option>"}).join("")+"</select></label>"}
 function tx(k,l,ph){return'<label class="f"><span class="l">'+l+'</span><input type="text" data-id="'+k+'" value="'+esc(i[k]||"")+'" placeholder="'+esc(ph||"")+'"></label>'}
 h+=tx("nome","Nome do empreendimento (opcional)")+sel("tipo","Tipo de hospedagem",TIPOS)+tx("municipio","Município e UF")+sel("estagio","Estágio",ESTAGIOS)+sel("objetivo","Objetivo principal",OBJ)+tx("unidades","Quantidade de unidades","ex.: 4")+tx("periodo","Período dos dados","ex.: jan a dez de 2026")+tx("fonte","Fonte dos dados","ex.: planilha própria, extrato, sistema de reservas")+tx("infra","Infraestrutura disponível (água, energia, acesso, áreas)")+tx("ativos","Ativos principais (camas, equipamentos, marca, site)")+tx("canais","Canais de venda usados")+tx("tipoInfo","Observações")+"</div>";
 h+='<div class="aviso">Se uma informação for desconhecida, deixe em branco. Em branco não é zero.</div></div>';
 $("#v").innerHTML=h;document.querySelectorAll("[data-id]").forEach(function(e){e.oninput=e.onchange=function(){P.identificacao[e.dataset.id]=e.value;salvar()}})}
var OPC=[["2","Implementado e comprovado"],["1","Parcial"],["0","Ausente"],["unknown","Não sei"],["na","Não se aplica"]];
function telaAula(m){var a=AULAS[m],g=GUIA[m],qs=Q.filter(function(q){return q.module===m});
 var h='<div class="card"><div class="kick">Módulo '+m+" · "+esc(MODS[m])+'</div><h2>'+esc(a.titulo)+'</h2>';
 var vd=VIDEOS[m];h+=vd?'<video controls preload="none" style="width:100%;border-radius:8px;margin:8px 0" src="'+esc(vd)+'"></video>':'<div class="video">Vídeo da aula em gravação. Enquanto isso, acompanhe o roteiro em texto e o guia deste módulo.</div>';
 h+='<details class="ajuda"><summary>Roteiro da aula (texto)</summary>'+a.paragrafos.map(function(p){return"<p>"+esc(p)+"</p>"}).join("")+"</details>";
 h+='<p><a class="btn ghost" href="guia-'+m+'.pdf" target="_blank" rel="noopener">Abrir o guia do módulo (PDF)</a></p>';
 h+='<details class="ajuda"><summary>Para que serve · o que ter em mãos</summary><p>'+esc(g.abertura.para_que_serve)+"</p><ul>"+g.abertura.tenha_em_maos.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul><p>"+esc(g.abertura.como_trabalhar)+"</p></details></div>";
 h+='<div class="card"><div class="kick">Formulário do módulo '+m+"</div><h3>Responda com evidências</h3><p>Escolha a situação real. Se não souber, marque <b>Não sei</b>: isso não conta como zero.</p>";
 qs.forEach(function(q,i){var r=P.respostas[q.id],gq=g.perguntas[i],mt=META[q.id];
  h+='<div style="border-top:1px solid #eee;padding-top:10px;margin-top:10px"><div class="kick">'+q.topic+(mt.critico?' · <span style="color:var(--er)">segurança/legalidade</span>':"")+'</div><div class="pergunta">'+esc(q.question)+'</div><div style="font-size:14.5px"><b>Como fazer:</b> '+esc(q.procedure)+" <b>Evidência:</b> "+esc(q.evidence)+".</div>";
  h+='<details class="ajuda"><summary>Passo a passo, exemplo e como pontuar</summary><p>'+esc(gq.por_que_importa)+"</p><ol>"+gq.como_coletar.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ol><p><b>'+esc(gq.exemplo.titulo)+".</b> "+esc(gq.exemplo.texto)+"</p><p><b>Erro comum:</b> "+esc(gq.erro_comum)+"</p><p><b>Ausente:</b> "+esc(gq.como_ler.ausente)+"<br><b>Parcial:</b> "+esc(gq.como_ler.parcial)+"<br><b>Comprovado:</b> "+esc(gq.como_ler.comprovado)+"</p><p><b>Como verificar:</b> "+esc(gq.verificacao)+"</p></details>";
  h+='<div class="opts" data-q="'+q.id+'">'+OPC.map(function(o){return'<label class="'+(String(r)===o[0]?"sel":"")+'"><input type="radio" name="'+q.id+'" value="'+o[0]+'"'+(String(r)===o[0]?" checked":"")+">"+o[1]+"</label>"}).join("")+"</div>";
  h+='<label class="f"><span class="l">Evidência ou observação (opcional)</span><textarea data-n="'+q.id+'" maxlength="400">'+esc(P.notas[q.id]||"")+"</textarea></label></div>"});
 h+='<div id="fbMod"></div></div><div class="card"><div class="kick">Calculadora do módulo '+m+"</div><h2>"+esc(RX.CALC_NOMES["C"+m])+'</h2><div id="calcBox"></div><div id="calcRes"></div></div>';
 h+='<p class="noprint">'+(m>1?'<button class="btn ghost" data-ir="aula'+(m-1)+'">← Módulo anterior</button>':"")+(m<7?'<button class="btn ouro" data-ir="aula'+(m+1)+'">Próximo módulo →</button>':'<button class="btn ouro" data-ir="diag">Ver meu diagnóstico →</button>')+"</p>";
 $("#v").innerHTML=h;ligaIr();
 document.querySelectorAll(".opts input").forEach(function(e){e.onchange=function(){P.respostas[e.name]=e.value;salvar();e.closest(".opts").querySelectorAll("label").forEach(function(l){l.classList.toggle("sel",l.firstChild.checked)});feedbackModulo(m);atualizaTopo()}});
 document.querySelectorAll("[data-n]").forEach(function(e){e.oninput=function(){P.notas[e.dataset.n]=e.value;salvar()}});
 feedbackModulo(m);montaCalc(m)}
function feedbackModulo(m){var d=dx().pilares[m-1],box=$("#fbMod");if(!box)return;
 if(d.score===null){box.innerHTML='<div class="aviso">Responda ao menos uma pergunta com dados (implementado, parcial ou ausente) para ver o resultado do módulo. Respostas "não sei" não pontuam.</div>';return}

 function H(s){esp(14);y+=3;T(s,14,true,[27,33,23]);doc.setDrawColor(201,179,126);doc.line(17,y-1.2,193,y-1.2);y+=3.6}
 cab();T("Dossiê do Raio-X da Hospedagem",20,true,[27,33,23]);T("Gerado em "+d.geradoEm+" · Mini Mentoria de Performance Hoteleira",10);
 H("1. Identificação");var id=d.identificacao;[["Empreendimento",id.nome],["Tipo",id.tipo],["Município",id.municipio],["Estágio",id.estagio],["Objetivo",id.objetivo],["Unidades",id.unidades],["Período dos dados",id.periodo],["Fonte dos dados",id.fonte]].forEach(function(x){T(x[0]+": "+(x[1]||"não informado"),10)});
 H("2. Resultado e cobertura");var g=d.diagnostico.geral;T("Pontuação geral: "+(g.score===null?"sem dados":fmt(g.score,"%",1))+" · cobertura "+(g.cobertura===null?"—":fmt(g.cobertura,"%",1))+" ("+g.validos+" de "+g.aplicaveis+" perguntas aplicáveis com dados).",11,true);
 d.diagnostico.pilares.forEach(function(p){T(p.modulo+" · "+MODS[p.modulo]+": nota "+(p.score===null?"sem dados":fmt(p.score,"%",1))+" ("+nivelTxt(p.nivel)+"), cobertura "+(p.cobertura===null?"—":fmt(p.cobertura,"%",1))+", "+p.desconhecidos+' "não sei", '+p.naoAplica+" não se aplica, "+p.pendentes+" sem resposta.",10)});
 function nomes(ids){return ids.map(function(i){var q=Q.filter(function(x){return x.id===i})[0];return"• "+q.module+" · "+q.topic+": "+q.question})}
 H("3. Pontos fortes");(d.diagnostico.pontosFortes.length?nomes(d.diagnostico.pontosFortes):["Nenhum ponto marcado como implementado e comprovado."]).forEach(function(s){T(s,10)});

function resumoCalc(k,r){var o=[];function a(l,v){o.push(l+": "+v)}
 if(k==="C1"){if(r.distribuicao)r.distribuicao.forEach(function(x){a(x.motivo,x.qtd+" ("+fmt(x.pct,"%",1)+")")});a("Preço mediano dos comparáveis",brl(r.precoMediano));a("Seu preço ÷ mediana",fmt(r.indicePreco,"",2));a("Conversão",fmt(r.conversaoPct,"%",2))}
 if(k==="C2"){a("Ocupação anual",fmt(r.ocupacaoAnualPct,"%",1)+" ("+r.mesesValidos+" de 12 meses)");r.canais.forEach(function(x){a(x.nome+" · receita líquida",brl(x.liquida))});a("Janela de compra (mediana)",r.janelaMediana===null?"—":fmt(r.janelaMediana," dias",1))}
 if(k==="C3"){a("ADR",brl(r.adr));a("RevPAR",brl(r.revpar));a("Ocupação",fmt(r.ocupacaoPct,"%",1));r.extras.forEach(function(x){a(x.nome+" · margem",x.margemUnit===null?"—":brl(x.margemUnit)+(x.alerta?" ("+x.alerta+")":""))})}
 if(k==="C4"){a("ADR",brl(r.adr));a("Contribuição por noite",brl(r.contribuicaoNoite));a("Ocupação de equilíbrio",fmt(r.equilibrioPct,"%",1));if(r.equilibrioMsg)a("Leitura",r.equilibrioMsg);a("Resultado do período",brl(r.resultado));if(r.adverso)a("Cenário adverso",brl(r.adverso.resultado));a("Provisão de reposição/mês",brl(r.provisaoReposicaoMensal))}
 if(k==="C5"){a("Carga de trabalho",fmt(r.cargaPct,"%",1));a("Reservas divergentes",r.conciliacao.divergentes+" de "+r.conciliacao.comparadas);r.estoque.forEach(function(x){a(x.nome,"mínimo "+fmt(x.estoqueMinimo)+", ponto de pedido "+fmt(x.pontoPedido))})}
 if(k==="C6"){a("Custo total instalado",brl(r.custoTotalInstalado));["pessimista","base","otimista"].forEach(function(n){var x=r[n];if(x)a("Cenário "+n,"resultado anual "+brl(x.resultadoAnual)+", payback "+(x.paybackAnos===null?"não se paga":fmt(x.paybackAnos," anos",1)))})}
 if(k==="C7"){a("Total com contingência e giro",brl(r.totalComContingencia));a("Necessidade de capital",brl(r.necessidadeCapital))}
 return o}
