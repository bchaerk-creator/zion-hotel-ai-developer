<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Raio-X Zion</title><style>body{font:16px system-ui;background:#f8f5ed;color:#20352a;max-width:850px;margin:auto;padding:24px}section{background:white;padding:20px;margin:16px 0;border-radius:12px}label{display:block;margin:12px 0}select,input,button{font:inherit;padding:8px;max-width:100%}button{background:#20352a;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap}small{display:block}</style><h1>Raio-X da Hospedagem</h1><p>Protótipo local. Dados não são enviados à Zion. Não é auditoria.</p><div id="form"></div><button onclick="report()">Gerar diagnóstico</button><button onclick="window.print()">Imprimir / PDF</button><pre id="result"></pre><h2>Calculadoras</h2><div id="calc"></div><script>const qs=[{"id": "m1q1", "module": 1, "topic": "Público prioritário", "question": "Você conhece o motivo da viagem do hóspede?", "evidence": "Distribuição por motivo", "action": "Escolha um segmento para testar uma oferta.", "procedure": "Classifique as últimas 20 reservas por motivo declarado, sem presumir perfil."}, {"id": "m1q2", "module": 1, "topic": "Concorrência", "question": "Você compara ofertas equivalentes?", "evidence": "Tabela com preço total e serviços", "action": "Identifique uma lacuna de oferta.", "procedure": "Selecione cinco hospedagens da mesma região, capacidade e padrão; compare datas iguais."}, {"id": "m1q3", "module": 1, "topic": "Proposta de valor", "question": "Sua promessa é específica?", "evidence": "Frase publicada", "action": "Teste duas versões do título.", "procedure": "Escreva uma frase com público, experiência e diferencial verificável."}, {"id": "m1q4", "module": 1, "topic": "Fotografia", "question": "As imagens mostram os diferenciais reais?", "evidence": "Sequência revisada", "action": "Fotografe os três atributos mais relevantes.", "procedure": "Ordene fotos por impacto, ambiente, conforto e detalhes; elimine imagens enganosas."}, {"id": "m1q5", "module": 1, "topic": "Descrição", "question": "O anúncio responde às dúvidas essenciais?", "evidence": "Descrição revisada", "action": "Corrija as cinco dúvidas mais frequentes.", "procedure": "Liste acesso, capacidade, regras, privacidade e itens incluídos."}, {"id": "m1q6", "module": 1, "topic": "Marca", "question": "A comunicação é consistente?", "evidence": "Inventário de canais", "action": "Padronize informações divergentes.", "procedure": "Compare site, redes e anúncios quanto a nome, tom e promessa."}, {"id": "m1q7", "module": 1, "topic": "Reputação", "question": "Você conhece os elogios e críticas recorrentes?", "evidence": "Mapa de avaliações", "action": "Priorize a crítica recorrente mais controlável.", "procedure": "Agrupe avaliações recentes por tema e frequência."}, {"id": "m1q8", "module": 1, "topic": "Oferta", "question": "Seu pacote é claro?", "evidence": "Ficha da oferta", "action": "Teste um pacote sem desconto indiscriminado.", "procedure": "Separe itens inclusos, extras e condições de cancelamento."}, {"id": "m1q9", "module": 1, "topic": "Conversão", "question": "Você mede a resposta à oferta?", "evidence": "Taxa de conversão", "action": "Altere uma variável por teste.", "procedure": "Registre visitas e reservas atribuíveis ao mesmo canal e período."}, {"id": "m1q10", "module": 1, "topic": "Validação", "question": "Você registra aprendizados?", "evidence": "Diário de testes", "action": "Mantenha apenas mudanças sustentadas por evidências.", "procedure": "Compare períodos equivalentes e anote eventos externos."}, {"id": "m2q1", "module": 2, "topic": "Inventário", "question": "Você registra noites disponíveis?", "evidence": "Inventário mensal", "action": "Corrija bloqueios indevidos.", "procedure": "Some unidades-noite abertas à venda e registre bloqueios separadamente."}, {"id": "m2q2", "module": 2, "topic": "Ocupação", "question": "Você acompanha noites vendidas?", "evidence": "Ocupação mensal", "action": "Separe dias ú ede resultado comercial?", "evidence": "Relatório de teste", "action": "Interrompa mudanças que reduzem contribuição.", "procedure": "Compare receita por unidade disponível antes e depois, controlando sazonalidade."}, {"id": "m3q1", "module": 3, "topic": "Jornada", "question": "Você mapeia a experiência completa?", "evidence": "Mapa da jornada", "action": "Corrija o ponto de maior atrito.", "procedure": "Descreva etapas da descoberta ao pós-estadia."}, {"id": "m3q2", "module": 3, "topic": "Chegada", "question": "O acesso é bem explicado?", "evidence": "Instruções testadas", "action": "Envie orientação antes da viagem.", "procedure": "Simule a chegada de um visitante sem conhecimento local."}, {"id": "m3q3", "module": 3, "topic": "Conforto", "question": "Você verifica conforto e funcionalidade?", "evidence": "Checklist de inspeção", "action": "Corrija falhas essenciais antes de adicionar luxo.", "procedure": "Inspecione cama, temperatura, ruído, iluminação e banho."}, {"id": "m3q4", "module": 3, "topic": "Privacidade", "question": "A privacidade anunciada é real?", "evidence": "Mapa de exposição", "action": "Ajuste comunicação e barreiras permitidas.", "procedure": "Verifique linhas de visão, circulação e ruídos."}, {"id": "m3q5", "module": 3, "topic": "Experiências", "question": "Você oferece atividades relevantes?", "evidence": "Catálogo de experiências", "action": "Teste uma experiência de baixo custo.", "procedure": "Identifique desejos reais e fornecedores habilitados."}, {"id": "m3q6", "module": 3, "topic": "Gastronomia", "question": "Você controla qualidade e custo dos alimentos?", "evidence": "Ficha de custo", "action": "Padronize uma oferta segura.", "procedure": "Registre ingredientes, perdas e requisitos sanitários."}, {"id": "m3q7", "module": 3, "topic": "Preço percebido", "question": "Você conhece o valor dos extras?", "evidence": "Margem por extra", "action": "Retire extras sem demanda ou margem.", "procedure": "Compare disposição a pagar observada e custo incremental."}, {"id": "m3q8", "module": 3, "topic": "Avaliações", "question": "Você responde e aprende com avaliações?", "evidence": "Histórico de melhorias", "action": "Responda com fatos e respeito.", "procedure": "Classifique comentários e registre correções."}, {"id": "m3q9", "module": 3, "topic": "ADR", "question": "Você calcula diária realizada?", "evidence": "ADR mensal", "action": "Compare com ocupação e RevPAR.", "procedure": "Divida receita de hospedagem por noites vendidas."}, {"id": "m3q10", "module": 3, "topic": "RevPAR", "question": "Você avalia preço e ocupação juntos?", "evidence": "RevPAR mensal", "action": "Teste preço sem presumir demanda constante.", "procedure": "Divida receita de hospedagem por unidades-noite disponíveis."}, {"id": "m4q1", "module": 4, "topic": "Receita", "question": "Você separa hospedagem de extras?", "evidence": "Demonstrativo mensal", "action": "Separe adiantamentos de receita realizada.", "procedure": "Classifique receitas por competência e concilie recebimentos."}, {"id": "m4q2", "module": 4, "topic": "Custos fixos", "question": "Você conhece despesas recorrentes?", "evidence": "Total fixo mensal", "action": "Revise contratos sem comprometer qualidade.", "procedure": "Liste aluguel, salários, sistemas e contratos."}, {"id": "m4q3", "module": 4, "topic": "Custos variáveis", "question": "Você conhece custo por estadia?", "evidence": "Custo por noite ou reserva", "action": "Padronize unidades de cálculo.", "procedure": "Some limpeza, insumos, comissões e outros custos incrementais."}, {"id": "m4q4", "module": 4, "topic": "Margem", "question": "Você calcula contribuição?", "evidence": "Margem de contribuição", "action": "Priorize ofertas com contribuição positiva.", "procedure": "Subtraia custos variáveis da receita."}, {"id": "m4q5", "module": 4, "topic": "Equilíbrio", "question": "Você conhece ocupação mínima?", "evidence": "Ocupação de equilíbrio", "action": "Revise preço e custos se superar capacidade.", "procedure": "Divida custo fixo pela contribuição por noite e capacidade."}, {"id": "m4q6", "module": 4, "topic": "Caixa", "question": "Você projeta entradas e saídas?", "evidence": "Saldo projetado", "action": "Planeje reserva para períodos deficitários.", "procedure": "Monte fluxo semanal incluindo dívidas e impostos."}, {"id": "m4q7", "module": 4, "topic": "Dívidas", "question": "Você conhece compromissos financeiros?", "evidence": "Agenda de pagamentos", "action": "Negocie com orientação especializada quando necessário.", "procedure": "Liste parcelas, vencimentos e encargos."}, {"id": "m4q8", "module": 4, "topic": "Manutenção", "question": "Você reserva recursos para reposição?", "evidence": "Plano de reposição", "action": "Inclua provisão no planejamento.", "procedure": "Estime vida útil e custo de reposição dos ativos."}, {"id": "m4q9", "module": 4, "topic": "Resultado", "question": "Você distingue resultado operacional de caixa?", "evidence": "Conciliação de resultado e caixa", "action": "Revise com contador.", "procedure": "Separe despesas operacionais, investimentos e financiamento."}, {"id": "m4q10", "module": 4, "topic": "Cenários", "question": "Você testa hipóteses adversas?", "evidence": "Três cenários", "action": "Defina gatilhos de contenção.", "procedure": "Simule queda de ocupação, preço e aumento de custos."}, {"id": "m5q1", "module": 5, "topic": "Responsabilidades", "question": "Cada tarefa tem responsável?", "evidence": "Matriz de responsabilidades", "action": "Defina responsável e prazo.", "procedure": "Liste atividades diárias e substitutos."}, {"id": "m5q2", "module": 5, "topic": "Limpeza", "question": "Existe padrão verificável de limpeza?", "evidence": "Checklist assinado", "action": "Treine e audite amostras.", "procedure": "Crie sequência por ambiente e inspeção final."}, {"id": "m5q3", "module": 5, "topic": "Check-in", "question": "O processo de entrada é previsível?", "evidence": "Fluxo documentado", "action": "Elimine etapas redundantes.", "procedure": "Simule reserva, instruções, identificação e acesso."}, {"id": "m5q4", "module": 5, "topic": "Manutenção", "question": "Existe manutenção preventiva?", "evidence": "Agenda de manutenção", "action": "Priorize itens críticos de segurança.", "procedure": "Inventarie equipamentos e siga recomendações do fabricante."}, {"id": "m5q5", "module": 5, "topic": "Estoque", "question": "Você controla consumo e reposição?", "evidence": "Estoque mínimo", "action": "Ajuste compras à demanda.", "procedure": "Registre saldo, consumo e prazo de fornecedor."}, {"id": "m5q6", "module": 5, "topic": "Atendimento", "question": "Há padrão para resolver problemas?", "evidence": "Procedimento de incidentes", "action": "Treine respostas e contatos de emergência.", "procedure": "Classifique urgências e defina escalonamento."}, {"id": "m5q7", "module": 5, "topic": "Equipe", "question": "Você acompanha carga de trabalho?", "evidence": "Mapa de capacidade", "action": "Redistribua tarefas sem violar direitos trabalhistas.", "procedure": "Registre horas e volume de tarefas por turno."}, {"id": "m5q8", "module": 5, "topic": "Sistemas", "question": "Reservas e pagamentos são conciliados?", "evidence": "Relatório de divergências", "action": "Corrija duplicidades e acessos.", "procedure": "Compare PMS, canais e extratos."}, {"id": "m5q9", "module": 5, "topic": "Segurança", "question": "Você verifica requisitos de segurança?", "evidence": "Registro de pendências", "action": "Suspenda atividades inseguras.", "procedure": "Liste licenças, inspeções e riscos com profissionais habilitados."}, {"id": "m5q10", "module": 5, "topic": "Melhoria", "question": "Você revisa falhas recorrentes?", "evidence": "Histórico de incidentes", "action": "Teste a eficácia das correções.", "procedure": "Registre causa, correção, responsável e verificação."}, {"id": "m6q1", "module": 6, "topic": "Ativos", "question": "Você conhece a infraestrutura disponível?", "evidence": "Mapa de ativos", "action": "Identifique capacidade alcula retorno em cenários?", "evidence": "Cenários financeiros", "action": "Não confunda projeção com garantia.", "procedure": "Divida resultado anual incremental pelo investimento e estime payback simples."}, {"id": "m6q10", "module": 6, "topic": "Decisão", "question": "Você possui critérios de avanço?", "evidence": "Lista de condições", "action": "Avance apenas após verificações.", "procedure": "Defina condições técnicas, legais, comerciais e financeiras."}, {"id": "m7q1", "module": 7, "topic": "Objetivo", "question": "Você definiu o que busca em um parceiro?", "evidence": "Objetivo escrito", "action": "Escolha a necessidade prioritária.", "procedure": "Separe capital, operação, conhecimento e distribuição."}, {"id": "m7q2", "module": 7, "topic": "Ativos", "question": "Você documenta o que oferece?", "evidence": "Inventário documentado", "action": "Não atribua valor sem avaliação.", "procedure": "Liste propriedade, equipamentos, marca e operação com evidências."}, {"id": "m7q3", "module": 7, "topic": "Histórico", "question": "Você possui números verificáveis?", "evidence": "Histórico financeiro", "action": "Identifique lacunas antes de apresentar.", "procedure": "Organize receitas, ocupação e custos de períodos comparáveis."}, {"id": "m7q4", "module": 7, "topic": "Capital", "question": "Você conhece o aporte necessário?", "evidence": "Necessidade de capital", "action": "Inclua contingência e capital de giro.", "procedure": "Calcule investimento total menos recursos próprios disponíveis."}, {"id": "m7q5", "module": 7, "topic": "Modelos", "question": "Você conhece alternativas de parceria?", "evidence": "Quadro de alternativas", "action": "Avalie riscos e obrigações.", "procedure": "Compare locação, sociedade e prestação de serviços com assessoria."}, {"id": "m7q6", "module": 7, "topic": "Governança", "question": "Você definiu responsabilidades?", "evidence": "Minuta de pontos negociais", "action": "Procure revisão jurídica independente.", "procedure": "Liste decisões, aportes, prestação de contas e saída."}, {"id": "m7q7", "module": 7, "topic": "Documentação", "question": "Você tem documentação organizada?", "evidence": "Índice documental", "action": "Use acesso restrito e consentimento.", "procedure": "Reúna documentos relevantes sem compartilhar dados desnecessários."}, {"id": "m7q8", "module": 7, "topic": "Apresentação", "question": "Seu projeto é compreensível?", "evidence": "Dossiê preliminar", "action": "Declare hipóteses e dados ausentes.", "procedure": "Resuma mercado, ativos, números, riscos e proposta."}, {"id": "m7q9", "module": 7, "topic": "Negociação", "question": "Você conhece seus limites?", "evidence": "Critérios de negociação", "action": "Evite compromissos sem diligência.", "procedure": "Defina condições aceitáveis e alternativas à parceria."}, {"id": "m7q10", "module": 7, "topic": "Próximos passos", "question": "Você está pronto para avaliação?", "evidence": "Checklist de prontidão", "action": "Autorize envio à Zion somente se desejar.", "procedure": "Revise pendências técnicas, financeiras e legais."}];const names=['Identidade','Vendas','Experiência','Finanças','Operação','Expansão','Parcerias'];const opts=[['','Selecione'],['2','Implementado e comprovado'],['1','Parcial'],['0','Ausente'],['unknown','Não sei'],['na','Não se aplica']];for(let i=1;i<=7;i++){let s=document.createElement('section');s.innerHTML='<h2>'+names[i-1]+'</h2>'+qs.filter(q=>q.module===i).map(q=>'<label>'+q.question+'<small>'+q.evidence+'</small><select id="'+q.id+'">'+opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select></label>').join('');form.append(s)}function report(){let out=[],actions=[];for(let i=1;i<=7;i++){let a=qs.filter(q=>q.module===i).map(q=>({...q,v:document.getElementById(q.id).value}));let known=a.filter(q=>['0','1','2'].includes(q.v));out.push(names[i-1]+': '+(known.length?Math.round(100*known.reduce((s,q)=>s+Number(q.v),0)/(2*known.length))+'% de maturidade declarada':'sem dados')+' | cobertur
