<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Trailer · Club Zion Collection</title>
<style>
@font-face{font-family:Cormorant;src:url(assets/cormorant.woff2) format("woff2");font-weight:300 700}
@font-face{font-family:Cormorant;src:url(assets/cormorant-italic.woff2) format("woff2");font-style:italic;font-weight:300 700}
@font-face{font-family:Aventa;src:url(assets/aventa.woff2) format("woff2");font-weight:300 700}
:root{--preto:#040605;--musgo:#1B2117;--creme:#FEF5F0;--areia:#DED6BF;--terra:#8B714E;--ouro:#C9B37E}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--preto);color:var(--creme);font-family:Aventa,Arial,sans-serif}
.cena{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:120px 88px 200px;animation:fade .6s ease both}
.cena.meio{justify-content:center;padding-bottom:160px}
.foto{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 14s ease-out both;transform-origin:center}
.veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,5,.25) 0%,rgba(4,6,5,.55) 45%,rgba(4,6,5,.92) 100%)}
.musgo .veu{background:var(--musgo)}
.k{position:relative;color:var(--ouro);letter-spacing:.22em;text-transform:uppercase;font-size:26px;font-weight:600;margin-bottom:28px;animation:up .7s .2s ease both}
h1{position:relative;font-family:Cormorant,Georgia,serif;font-weight:500;font-size:100px;line-height:1.04;margin:0 0 30px;animation:up .8s .35s ease both}
h1 i{font-style:italic;color:var(--ouro)}
p{position:relative;font-size:40px;line-height:1.35;color:var(--areia);margin:0;animation:up .8s .6s ease both;max-width:880px}
.bar{position:relative;width:140px;height:5px;background:var(--ouro);margin:40px 0 0;animation:up .8s .8s ease both}
.topo{position:absolute;top:70px;left:88px;right:88px;display:flex;justify-content:space-between;align-items:center;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--areia);opacity:.85}
.topo img{height:46px}
.rodape{position:absolute;bottom:70px;left:88px;right:88px;font-size:22px;color:var(--areia);opacity:.7;line-height:1.4}
ul{position:relative;list-style:none;padding:0;margin:20px 0 0}
li{font-size:38px;line-height:1.3;color:var(--creme);padding:22px 0;border-top:1px solid rgba(222,214,191,.25);display:flex;gap:22px;align-items:flex-start;animation:up .7s ease both}
li:nth-child(1){animation-delay:.5s}li:nth-child(2){animation-delay:.9s}li:nth-child(3){animation-delay:1.3s}li:nth-child(4){animation-delay:1.7s}li:nth-child(5){animation-delay:2.1s}
li b{color:var(--ouro);font-family:Cormorant,serif;font-size:52px;line-height:1;min-width:64px}
li small{display:block;font-size:28px;color:var(--areia);margin-top:6px}
.logo{position:relative;width:420px;margin:0 0 40px;animation:up .8s .2s ease both}
.cx{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin:0 0 50px}
.cx div{background:rgba(254,245,240,.08);border:1px solid rgba(201,179,126,.5);border-radius:14px;padding:30px 22px;font-size:27px;line-height:1.25;animation:up .7s ease both}
.cx div:nth-child(1){animation-delay:.5s}.cx div:nth-child(2){animation-delay:.8s}.cx div:nth-child(3){animation-delay:1.1s}
.cx b{display:block;font-family:Cormorant,serif;font-size:44px;color:var(--ouro);margin-bottom:8px;font-weight:500}
.cta{position:relative;display:inline-block;background:var(--ouro);color:var(--preto);font-weight:700;font-size:36px;padding:28px 44px;border-radius:999px;margin-top:36px;animation:up .8s .9s ease both}
/* telas */
.telas{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:0 0 44px}
.tela{height:300px;border-radius:14px;overflow:hidden;border:3px solid rgba(201,179,126,.6);box-shadow:0 30px 60px rgba(0,0,0,.5);background:#fff;animation:up .8s ease both}
.tela:nth-child(2){animation-delay:.4s}.tela:nth-child(3){animation-delay:.7s}.tela:nth-child(4){animation-delay:1s}
.tela img{width:100%;height:100%;object-fit:cover;object-position:top left;transform:scale(1.3);transform-origin:top left;animation:pan 10s linear both}
/* planos */
.planos{position:relative;display:flex;flex-direction:column;gap:20px;margin:0 0 40px}
.plano{display:flex;justify-content:space-between;align-items:center;background:rgba(254,245,240,.07);border:1px solid rgba(201,179,126,.45);border-radius:16px;padding:30px 34px;animation:up .7s ease both}
.plano:nth-child(1){animation-delay:.4s}.plano:nth-child(2){animation-delay:.8s}.plano:nth-child(3){animation-delay:1.2s}
.plano.d{border-color:var(--ouro);background:rgba(201,179,126,.14)}
.plano .n{font-family:Cormorant,serif;font-size:56px;color:var(--ouro);line-height:1}
.plano .q{font-size:26px;color:var(--areia);margin-top:8px;max-width:520px;line-height:1.25}
.plano .v{text-align:right}.plano .v b{display:block;font-size:44px;font-weight:600}.plano .v span{font-size:24px;color:var(--areia)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1.0)}}
@keyframes pan{from{transform:scale(1.3) translate(0,0)}to{transform:scale(1.3) translate(-10%,-20%)}}
</style></head><body>
<script>const D=new URLSearchParams(location.search).get("d")||"club";document.write(`<script src="scenes-${D}.js"><\/script>`);</script>
<script>
const S=window.S;
const i=+(new URLSearchParams(location.search).get("s")||0); const c=S[i];
let h=`<div class="cena ${c.musgo?"musgo":""} ${c.meio?"meio":""}">`;
if(c.foto) h+=`<div class="foto" style="background-image:url(assets/${c.foto})"></div>`;
h+=`<div class="veu"></div><div class="topo"><img src="assets/zion-logo-claro.png" alt="Zion"><span>${window.TOPO||"Zion Hotel Group"}</span></div>`;
if(c.logo) h+=`<img class="logo" src="assets/zion-logo-claro.png" alt="Zion">`;
h+=`<div class="k">${c.k}</div>`;
if(c.h) h+=`<h1>${c.h}</h1>`;
if(c.telas) h+=`<div class="telas">`+c.telas.map(t=>`<div class="tela"><img src="assets/${t}"></div>`).join("")+`</div>`;
if(c.cx) h+=`<div class="cx">`+c.cx.map(x=>`<div><b>${x[0]}</b>${x[1]}</div>`).join("")+`</div>`;
if(c.planos) h+=`<div class="planos">`+c.planos.map((x,j)=>`<div class="plano ${j==0?"d":""}"><div><div class="n">${x[0]}</div><div class="q">${x[1]}</div></div><div class="v"><b>${x[2]}</b><span>${x[3]}</span></div></div>`).join("")+`</div>`;
if(c.lista) h+=`<ul>`+c.lista.map(x=>`<li><b>${x[0]}</b><span>${x[1]}${x[2]?`<small>${x[2]}</small>`:""}</span></li>`).join("")+`</ul>`;
if(c.p) h+=`<p>${c.p}</p>`;
if(c.cta) h+=`<div class="cta">${c.cta} →</div>`;
h+=`<div class="bar"></div>`;
h+=`<div class="rodape">${c.rodape||"zionhotelgroup.com · @zionbubble"}</div></div>`;
document.body.innerHTML=h;
</script></body></html>
