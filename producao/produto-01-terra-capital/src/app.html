<style>

.card{background:#fff;border:1px solid var(--areia);border-radius:10px;padding:16px;margin:0 0 14px}

.kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}

.pilar{border-left:4px solid var(--ouro)}.pilar summary{cursor:pointer;font-family:Cormorant,serif;font-size:22px;color:var(--musgo);list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:44px}

.aula{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eee;cursor:pointer;min-height:48px}

.aula.done .dot{background:var(--ok);border-color:var(--ok)}
.aula small{display:block;color:#666}
.pergunta{font-family:Cormorant,serif;font-style:italic;font-size:28px;color:var(--musgo);line-height:1.15;margin:6px 0 14px}
.video{background:var(--musgo);color:var(--areia);border-radius:8px;padding:26px 16px;text-align:center;font-size:14px;margin:0 0 14px}
.passo{display:flex;gap:12px;margin:0 0 10px}.passo b{font-family:Cormorant,serif;font-size:26px;color:var(--ouro);line-height:1}
.fazer{background:#fbf6ea;border-left:4px solid var(--ouro)}
label.f{display:block;margin:10px 0}label.f span.l{display:block;font-size:14px;color:#444;margin-bottom:3px}
input[type=number],input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #c9bfa5;border-radius:6px;background:var(--amarelo)}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:0 14px}@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.res{background:var(--verde);border-radius:8px;padding:12px 14px;margin:12px 0}
.res .linha{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted #9bb89b}.res .linha b{font-variant-numeric:tabular-nums}
.res .destaque{font-family:Cormorant,serif;font-size:30px;color:var(--musgo)}
.fb{border:1px solid var(--areia);border-radius:8px;margin:10px 0;overflow:hidden}.fb div{padding:8px 12px;border-top:1px solid #eee;font-size:14.5px}.fb div:first-child{border:0}.fb div b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.aviso{font-size:13px;color:#555;background:#f3eee0;border-radius:6px;padding:8px 10px;margin:10px 0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--areia);color:var(--musgo)}
.tag.ok{background:var(--verde)}.tag.al{background:#fde6c2}.tag.er{background:#f6d0d0}
.chk{display:grid;grid-template-columns:28px 1fr;gap:6px 10px;padding:10px 0;border-top:1px solid #eee}
.chk input[type=checkbox]{width:24px;height:24px;margin-top:2px}
.chk .ex{grid-column:2;display:grid;grid-template-columns:1fr;gap:6px}@media(min-width:620px){.chk .ex{grid-template-columns:2fr 1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid #e6dfcc;text-align:left}th{background:var(--musgo);color:var(--creme);font-weight:400}
.tools{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:620px){.tools{grid-template-columns:1fr 1fr}}
.tools button{text-align:left;background:#fff;border:1px solid var(--areia);border-radius:10px;padding:14px;font:inherit;cursor:pointer;min-height:64px}
.tools button b{display:block;font-family:Cormorant,serif;font-size:21px;color:var(--musgo)}
svg text{font-family:Aventa,sans-serif}
.rodape{font-size:12px;color:#666;text-align:center;margin-top:20px}
@media print{div.stk,.noprint{display:none!important}main{padding:0}.card{border:0}body{background:#fff}}
</style>

function bind(){var v=$("#v");
 [].forEach.call(v.querySelectorAll("[data-aula]"),function(e){e.onclick=function(){AULA=+e.dataset.aula;TAB="jornada";draw();window.scrollTo(0,0);track("aula_iniciada",{aula:AULA})};e.onkeydown=function(ev){if(ev.key==="Enter")e.click()}});
 [].forEach.call(v.querySelectorAll("[data-tool]"),function(e){e.onclick=function(){TOOL=e.dataset.tool;AULA=null;TAB="ferramentas";draw();window.scrollTo(0,0);track("ferramenta_aberta",{ferramenta:TOOL})}});
 [].forEach.call(v.querySelectorAll("[data-tab]"),function(e){e.onclick=function(){TAB=e.dataset.tab;AULA=null;TOOL=TAB==="dossie"?"dossie":null;draw()}});
 var b=$("#back");if(b)b.onclick=function(){TOOL=null;draw()};
 var c=$("#conc");if(c)c.onclick=function(){S.aulas[AULA]=!S.aulas[AULA];save();if(S.aulas[AULA])track("aula_concluida",{aula:AULA});draw()};
 [].forEach.call(v.querySelectorAll("[data-f]"),function(e){e.oninput=function(){S.f[e.dataset.f]=e.value;save();if(e.dataset.f.indexOf("pil_")===0){}if(e.tagName==="SELECT"&&e.dataset.f.indexOf("pil_")===0){var n=+e.dataset.f.slice(4);if(e.value==="auto")delete S.pilar[n];else S.pilar[n]=e.value;save()}liveRedraw(e)}});
 [].forEach.call(v.querySelectorAll("[data-c]"),function(e){e.onchange=function(){var i=e.dataset.c;S.check[i]=S.check[i]||{};S.check[i].d=e.checked;save();draw()}});
 [].forEach.call(v.querySelectorAll("[data-ce]"),function(e){e.oninput=function(){var i=e.dataset.ce;S.check[i]=S.check[i]||{};S.check[i].e=e.value;save()}});
 [].forEach.call(v.querySelectorAll("[data-cr]"),function(e){e.oninput=function(){var i=e.dataset.cr;S.check[i]=S.check[i]||{};S.check[i].r=e.value;save()}});
 [].forEach.call(v.querySelectorAll("[data-pl]"),function(e){e.oninput=function(){var k=e.dataset.pl.split(".");S.plano[k[0]]=S.plano[k[0]]||{};S.plano[k[0]][k[1]]=e.value;save()}});
 var pa=$("#pAdd");if(pa)pa.onclick=function(){var n=$("#pn").value.trim();if(!n)return;S.prio.push({nome:n,impacto:+$("#pi").value,urgencia:+$("#pu").value,destrava:+$("#pd").value});save();draw()};
 [].forEach.call(v.querySelectorAll("[data-pdel]"),function(e){e.onclick=function(){S.prio=S.prio.filter(function(a){return a.nome!==e.dataset.pdel});save();draw()}});
 var ps=$("#plSug");if(ps)ps.onclick=function(){prioRes().ordenadas.slice(0,3).forEach(function(a,i){S.plano[i]=Object.assign({},S.plano[i],{a:a.nome})});save();draw()};
 var es=$("#est");if(es)es.onchange=function(){S.estagio=+es.value;save();draw()};
 var pf=$("#pdf");if(pf)pf.onclick=gerarPdf;var pr=$("#prt");if(pr)pr.onclick=function(){window.print()};
 [].forEach.call(v.querySelectorAll("#bk"),function(e){e.onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="backup-zion-terra-capital.json";a.click()}});
 var rs=$("#rs");if(rs)rs.onchange=function(){var f=rs.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=="object"||!o.aulas||!o.f)throw 0;S=o;save();draw()}catch(e){alert("Arquivo de backup inválido.")}};r.readAsText(f)}}
function liveRedraw(el){ /* recalcula resultados sem perder o foco */
 var id=el.dataset.f,pos=el.selectionStart;var sc=window.scrollY;draw(true);var n=document.querySelector('[data-f="'+id+'"]');if(n&&n.tagName!=="SELECT"){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}window.scrollTo(0,sc)}
function draw(keep){nav();$("#v").innerHTML=view();bind();header()}

(function(){var h=(location.hash||"").slice(1),m;
 if(m=h.match(/^aula-(\d+)$/)){var n=+m[1];if(n>=1&&n<=20){AULA=n;TAB="jornada"}}
 else if(m=h.match(/^ferramenta-(\w+)$/)){if(T[m[1]]){TOOL=m[1];TAB=m[1]==="dossie"?"dossie":"ferramentas"}}
 else if(h==="materiais"||h==="jornada"||h==="ferramentas"||h==="dossie"){TAB=h;if(h==="dossie")TOOL="dossie"}})();
draw();
