<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aula 1 · Marco Zero · experiência</title>
<!--
  Um vídeo da Aula 1 como experiência. experiencia.py grava quadro a quadro com window.seek(t).
  Dados: trabalho/exp/VNN.json (páginas, trechos falados com tempo e a caixa do item em foco).
-->
<style>
  @font-face { font-family: Inter; src: local('Inter SemiBold'), local('Inter'); }
  :root { --verde: #16261C; --verde2: #0F1C14; --ouro: #E0BE5E; --creme: #F5F1E8; }
  html, body { margin: 0; background: #000; }
  #cena { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--verde2);
          font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
  .camada { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform, opacity; }
  .camada img { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .luz { position: absolute; border-radius: 16px; border: 4px solid var(--ouro);
         box-shadow: 0 0 0 4000px rgba(8, 16, 11, .46), 0 0 40px rgba(224, 190, 94, .55); opacity: 0; }

  #legenda { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1500px;
             padding: 16px 30px; border-radius: 14px; background: rgba(15, 28, 20, .86); color: var(--creme);
             font-size: 38px; line-height: 1.32; text-align: center; letter-spacing: .1px; opacity: 0; }
  #legenda b { color: var(--ouro); font-weight: 600; }
  #legenda i { font-style: normal; opacity: .38; }

  #pergunta { position: absolute; right: 64px; top: 50%; width: 560px; padding: 34px 38px 38px;
              border-radius: 22px; background: var(--verde); color: var(--creme); opacity: 0;
              box-shadow: 0 24px 80px rgba(0, 0, 0, .45); border: 2px solid rgba(224, 190, 94, .5); }
  #pergunta small { display: block; color: var(--ouro); font-size: 22px; letter-spacing: 4px; font-weight: 600;
                    margin-bottom: 16px; }
  #pergunta p { margin: 0; font-size: 40px; line-height: 1.25; }
  #pergunta .mao { margin-top: 22px; font-size: 24px; color: rgba(245, 241, 232, .7); }

  #suavez { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0;
            background: radial-gradient(circle at 50% 50%, rgba(15, 28, 20, .82), rgba(8, 16, 11, .94)); }
  #suavez .caixa { display: flex; align-items: center; gap: 64px; color: var(--creme); max-width: 1500px; }
  #suavez svg { flex: none; }
  #suavez small { display: block; color: var(--ouro); font-size: 26px; letter-spacing: 6px; font-weight: 600; }
  #suavez h2 { margin: 14px 0 18px; font-size: 76px; line-height: 1.05; font-weight: 600; }
  #suavez p { margin: 0; font-size: 36px; line-height: 1.3; color: rgba(245, 241, 232, .85); max-width: 900px; }
  #numero { font-size: 92px; font-weight: 600; fill: var(--creme); }

  #legenda, #pergunta, #suavez, #marcas, #barra, #selo, #proximo { z-index: 5; }
  #barra { position: absolute; left: 0; top: 0; height: 6px; background: var(--ouro); width: 0; }
  #marcas { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: rgba(255, 255, 255, .12); }
  #marcas span { position: absolute; top: 0; width: 2px; height: 6px; background: rgba(0, 0, 0, .45); }
  #selo { position: absolute; left: 56px; top: 44px; padding: 12px 20px; border-radius: 8px; font-size: 28px;
          color: var(--ouro); background: rgba(22, 38, 28, .8); font-weight: 600; }
  #proximo { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); padding: 18px 30px;
             border-radius: 12px; font-size: 40px; color: var(--creme); background: rgba(22, 38, 28, .9); opacity: 0;
             white-space: nowrap; }
  #proximo b { color: var(--ouro); }
</style>
</head>
<body>
<div id="cena">
  <div class="camada" id="c0"><img alt=""><div class="luz"></div></div>
  <div class="camada" id="c1"><img alt=""><div class="luz"></div></div>
  <div id="legenda"></div>
  <div id="pergunta"><small>PERGUNTA PARA VOCÊ</small><p></p><div class="mao">Responda em voz alta ou no papel.</div></div>
  <div id="suavez"><div class="caixa">
    <svg width="260" height="260" viewBox="0 0 260 260">
      <circle cx="130" cy="130" r="112" fill="none" stroke="rgba(245,241,232,.15)" stroke-width="14"/>
      <circle id="anel" cx="130" cy="130" r="112" fill="none" stroke="#E0BE5E" stroke-width="14" stroke-linecap="round"
              transform="rotate(-90 130 130)" stroke-dasharray="703.7" stroke-dashoffset="0"/>
      <text id="numero" x="130" y="162" text-anchor="middle">5</text>
    </svg>
    <div><small>SUA VEZ</small><h2>Pause o vídeo e anote.</h2><p></p></div>
  </div></div>
  <div id="marcas"></div><div id="barra"></div>
  <div id="selo"></div>
  <div id="proximo"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const FADE = 0.45, ENTRA = 0.8;
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
let D;

// câmera: aproxima do item em foco sem cortar o slide (zoom até 1,22)
function alvo(caixa) {
  if (!caixa) return { s: 1, x: 0, y: 0 };
  const [x0, y0, x1, y1] = caixa, w = x1 - x0, h = y1 - y0;
  const s = clamp(Math.min(1500 / w, 820 / h), 1, 1.22);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return { s, x: clamp(960 - cx * s, 1920 * (1 - s), 0), y: clamp(540 - cy * s, 1080 * (1 - s), 0) };
}
const mistura = (a, b, k) => ({ s: a.s + (b.s - a.s) * k, x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });

// para cada página: janelas de foco [a, b, caixa]; o foco segura até o próximo, no máximo 2,5 s depois da fala
function janelas(p) {
  const tr = p.trechos, j = [];
  tr.forEach((t, i) => {
    if (!t.foco) return;
    const prox = tr.slice(i + 1).find(x => x.foco);
    const fim = Math.min(prox ? prox.a : p.fala + 0.6, t.b + 2.5);
    const ult = j[j.length - 1];
    if (ult && ult.caixa.join() === t.foco.join() && t.a - ult.b < 0.6) ult.b = fim;
    else j.push({ a: t.a, b: fim, caixa: t.foco });
  });
  return j;
}

function camera(p, tl) {
  const base = { s: 1 + 0.025 * (tl / p.dur), x: 0, y: 0 };     // deriva lenta em toda página
  base.x = -960 * (base.s - 1); base.y = -540 * (base.s - 1);
  let cam = base, luz = null, la = 0;
  let antes = base;
  for (const w of p.janelas) {
    if (tl < w.a) break;
    const fim = Math.min(w.b, p.fala + 0.6);
    const ida = ease((tl - w.a) / ENTRA), volta = ease((tl - fim) / ENTRA);
    const em = mistura(antes, alvo(w.caixa), ida);
    cam = volta > 0 ? mistura(em, base, volta) : em;
    antes = volta >= 1 ? base : em;
    if (tl < fim + 0.35) { luz = w.caixa; la = Math.min(ease((tl - w.a) / 0.35), 1 - ease((tl - fim) / 0.35)); }
  }
  return { cam, luz, la };
}

function pinta(el, p, tl, op) {
  el.style.opacity = op;
  if (op <= 0) return;
  const img = el.querySelector('img');
  if (img.dataset.src !== p.img) { img.src = p.img; img.dataset.src = p.img; }
  const { cam, luz, la } = camera(p, tl);
  el.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
  const l = el.querySelector('.luz');
  if (luz && la > 0) {
    const m = 14;
    Object.assign(l.style, { left: luz[0] - m + 'px', top: luz[1] - m + 'px', width: luz[2] - luz[0] + 2 * m + 'px',
                             height: luz[3] - luz[1] + 2 * m + 'px', opacity: la });
  } else l.style.opacity = 0;
}

function legenda(p, tl) {
  const el = $('#legenda');
  const t = p.trechos.find(x => tl >= x.a - 0.05 && tl < x.b + 0.25);
  if (!t || t.texto.trim().endsWith('?') || p.pausa && tl > p.fala) { el.style.opacity = 0; return; }
  const pal = t.texto.split(/\s+/), peso = pal.map(w => w.replace(/\W/g, '').length + 2);
  const soma = peso.reduce((a, b) => a + b, 0), k = clamp((tl - t.a) / (t.b - t.a), 0, 1) * soma;
  let acc = 0;
  el.innerHTML = pal.map((w, i) => { const a = acc; acc += peso[i];
    return k >= acc ? w : k >= a ? `<b>${w}</b>` : `<i>${w}</i>`; }).join(' ');
  el.style.opacity = Math.min(1, (tl - t.a + 0.05) / 0.15);
}

function pergunta(p, tl) {
  const el = $('#pergunta');
  const t = p.trechos.find(x => x.texto.trim().endsWith('?') && tl >= x.a - 0.1 && tl < x.b + 2.8);
  if (!t || p.pausa && tl > p.fala) { el.style.opacity = 0; return; }
  el.querySelector('p').textContent = t.texto.trim();
  const k = Math.min(ease((tl - t.a + 0.1) / 0.4), 1 - ease((tl - t.b - 2.4) / 0.4));
  el.style.opacity = k;
  el.style.transform = `translate(${(1 - k) * 80}px, -50%)`;
}

function suavez(p, tl) {
  const el = $('#suavez');
  if (!p.pausa || tl < p.fala + 0.3) { el.style.opacity = 0; return; }
  const resta = p.dur - FADE - tl, total = p.dur - FADE - p.fala - 0.3;
  el.style.opacity = Math.min(ease((tl - p.fala - 0.3) / 0.4), ease((resta + 0.1) / 0.3));
  const ult = p.trechos[p.trechos.length - 1].texto;
  el.querySelector('p').textContent = ult;
  $('#anel').setAttribute('stroke-dashoffset', (703.7 * (1 - clamp(resta / total, 0, 1))).toFixed(1));
  $('#numero').textContent = Math.max(1, Math.ceil(resta));
}

window.seek = t => {
  const ps = D.paginas;
  let i = ps.findIndex((p, k) => t < p.ini + p.dur || k === ps.length - 1);
  const p = ps[i], tl = t - p.ini, nx = ps[i + 1];
  const cruza = nx && tl > p.dur - FADE ? ease((tl - (p.dur - FADE)) / FADE) : 0;
  const [a, b] = i % 2 ? ['#c1', '#c0'] : ['#c0', '#c1'];
  pinta($(a), p, tl, 1);
  if (cruza > 0) pinta($(b), nx, tl - p.dur, cruza); else $(b).style.opacity = 0;
  $(b).style.zIndex = 2; $(a).style.zIndex = 1;
  legenda(p, tl); pergunta(p, tl); suavez(p, tl);
  $('#barra').style.width = (100 * t / D.total).toFixed(3) + '%';
  $('#selo').style.opacity = t < 3.6 ? 1 : Math.max(0, (4 - t) / 0.4);
  const px = $('#proximo');
  px.style.opacity = D.proximo && t > D.total - 2 ? Math.min(1, (t - D.total + 2) / 0.3) : 0;
};

(async () => {
  const v = new URLSearchParams(location.search).get('v') || '01';
  D = await (await fetch(`trabalho/exp/V${v}.json?${Date.now()}`)).json();
  D.paginas.forEach(p => p.janelas = janelas(p));
  $('#selo').textContent = `Aula 1 · Marco Zero · ${D.n} de 7`;
  $('#proximo').innerHTML = `Próximo vídeo: <b>${D.proximo}</b>`;
  $('#marcas').innerHTML = D.paginas.slice(1).map(p => `<span style="left:${100 * p.ini / D.total}%"></span>`).join('');
  await Promise.all(D.paginas.map(p => new Promise(r => { const im = new Image(); im.onload = im.onerror = r;
    im.src = p.img; })));
  await document.fonts.ready;
  window.DURACAO = D.total;
  window.pronto = true;
})();
</script>
</body>
</html>
