<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cinco Perguntas</title>
<!--
  Prévia de 15 s · Marco Zero, vídeo 4, página 16: as cinco perguntas do investidor. 1080x1920.
  Cada pergunta entra no tempo da palavra "Um", "Dois"... (perguntas.json, gerado com a narração).
-->
<style>
@font-face{font-family:Aventa;src:url(../../zion-video-engine/assets/fonts/aventa.woff2) format('woff2');font-weight:100 900}
:root{--moss:#1B2117;--cream:#FEF5F0;--painel:#F4EEE6;--sand:#DED6BF;--earth:#8B714E;--gold:#C9A96E;--ouro:#E0BE5E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Aventa,sans-serif}
#palco{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}
#fundo{inset:0;background:radial-gradient(900px 1200px at 50% 35%,#fbf7f0,#efe8dc 70%,#e6dccb)}
#cena{left:0;top:0;width:1080px;height:1920px}
#rec{inset:0;background:radial-gradient(800px 1300px at 50% 40%,#2a2f2b,#0b0d0c 75%)}
#rec .canto{position:absolute;width:90px;height:90px;border-color:rgba(255,255,255,.85);border-style:solid}
#rec .rotulo{position:absolute;top:96px;font:700 30px Aventa;color:#fff;letter-spacing:3px}
#rec .ponto{display:inline-block;width:20px;height:20px;border-radius:50%;background:#e23b2e;margin-right:14px;vertical-align:-1px}
#pre{left:90px;top:860px;width:900px;font:700 54px/1.25 Aventa;color:rgba(255,255,255,.8)}
#gancho{left:90px;top:1040px;width:920px;font:900 112px/1.03 Aventa;color:#fff;text-transform:uppercase;letter-spacing:-1px}
#gancho .k{color:var(--ouro)}
#gancho .cursor{display:inline-block;width:8px;height:98px;background:#fff;vertical-align:-10px;margin-left:6px}
#assina{left:0;width:1080px;top:1660px;text-align:center;color:rgba(255,255,255,.75);font:700 24px Aventa;letter-spacing:6px}
#assina img{display:block;margin:22px auto 0;width:200px;opacity:.9}
#flash{inset:0;background:#fff}
#marca{left:56px;top:70px;width:170px}
#titulo{left:0;width:1080px;top:150px;text-align:center}
#titulo span{display:inline-block;padding:16px 34px;border-radius:999px;background:var(--moss);color:var(--cream);font:700 38px Aventa}
#titulo span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--ouro);margin-right:14px;vertical-align:4px}
#lista{left:90px;top:900px;width:900px;display:flex;flex-direction:column;gap:18px}
.card{display:flex;align-items:center;gap:26px;padding:22px 30px;border-radius:26px;background:#fff;box-shadow:0 14px 34px rgba(27,33,23,.12);font:700 38px Aventa;color:var(--moss)}
.card b{flex:none;width:66px;height:66px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font:900 36px Aventa;color:var(--moss)}
.card.agora{background:var(--moss);color:var(--cream)}
.card.agora b{background:var(--ouro)}
.card .q{margin-left:auto;font:900 40px Aventa;color:var(--gold)}
#fecho{left:0;top:0;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:50px;background:rgba(244,238,230,.96)}
#fecho h2{font:900 92px/1.05 Aventa;color:var(--moss);text-align:center;width:900px}
#fecho h2 i{font-style:normal;color:var(--earth)}
#bolas{display:flex;gap:26px}
#bolas span{width:110px;height:110px;border-radius:50%;border:5px solid var(--gold);display:grid;place-items:center;font:900 48px Aventa;color:var(--gold)}
#fecho p{font:700 36px Aventa;color:var(--earth);letter-spacing:4px;text-transform:uppercase}
#legenda{left:0;width:1080px;top:1660px;text-align:center}
#legenda span{display:inline-block;padding:14px 34px;border-radius:999px;background:rgba(4,6,5,.9);color:#fff;font:700 54px Aventa}
</style>
<script type="importmap">{"imports":{"three":"../../zion-video-engine/node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<div id="palco">
  <div id="fundo" class="abs"></div>
  <canvas id="cena" class="abs" width="1080" height="1920"></canvas>
  <img id="marca" class="abs" src="../../zion-video-engine/assets/logos/logo_green.png" alt="">
  <div id="titulo" class="abs"><span>As 5 perguntas do investidor</span></div>
  <div id="lista" class="abs"></div>
  <div id="legenda" class="abs"><span></span></div>
  <div id="fecho" class="abs"><h2>Quantas você responde <i>hoje?</i></h2><div id="bolas"></div><p>Anote de 0 a 5</p></div>
  <div id="rec" class="abs">
    <div class="canto" style="left:60px;top:60px;border-width:5px 0 0 5px"></div>
    <div class="canto" style="right:60px;top:60px;border-width:5px 5px 0 0"></div>
    <div class="canto" style="left:60px;bottom:60px;border-width:0 0 5px 5px"></div>
    <div class="canto" style="right:60px;bottom:60px;border-width:0 5px 5px 0"></div>
    <div class="rotulo" style="left:110px"><span class="ponto"></span>REC</div>
    <div class="rotulo" id="tc" style="right:110px"></div>
    <div id="pre" class="abs"></div>
    <div id="gancho" class="abs"></div>
    <div id="assina" class="abs">MARCO ZERO · 4 DE 14<img src="../../zion-video-engine/assets/logos/logo_cream.png" alt=""></div>
  </div>
  <div id="flash" class="abs"></div>
</div>
<script type="module">
import * as THREE from 'three';
const T = await (await fetch('perguntas.json')).json();
const F = T.frases, $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sai = x => 1 - Math.pow(1 - x, 3);
const mola = (t, t0) => { const x = Math.max(0, t - t0); return x === 0 ? 0 : 1 - Math.exp(-7 * x) * Math.cos(9 * x); };
const PERG = ['Qual é o melhor produto?', 'Quanto custa?', 'Quanto retorna?', 'Quanto de lucro dá?', 'Em quanto tempo?'];
const REC_FIM = F[0].b + .15, FECHO = F[5].b + .1;
const inicio = i => F[i + 1].a;  // "Um", "Dois"... abrem as frases 1 a 5

// legenda: grupos de até 4 palavras
const grupos = [];
F.forEach(f => { let g = []; f.palavras.forEach((p, j) => { g.push(p); const fim = j === f.palavras.length - 1;
  if (g.length === 4 || /[,.?!:]$/.test(p.p) || fim) { grupos.push({ a: g[0].t, b: fim ? f.b : f.palavras[j + 1].t, txt: g.map(x => x.p).join(' ') }); g = []; } }); });

// ---------- objetos 3D, um por pergunta ----------
const r3 = new THREE.WebGLRenderer({ canvas: $('cena'), antialias: true, alpha: true, preserveDrawingBuffer: true });
r3.setSize(1080, 1920, false); r3.setClearColor(0, 0);
const cena = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1080 / 1920, .1, 100);
cam.position.set(0, .6, 16); cam.lookAt(0, 0, 0);
cena.add(new THREE.HemisphereLight(0xFEF5F0, 0x8B714E, 1.15));
const sol = new THREE.DirectionalLight(0xffffff, 1.6); sol.position.set(4, 8, 6); cena.add(sol);
const mat = (c, r = .6, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const ouro = mat(0xD9BB78, .4, .15);
const objs = [];
{ // 1 · produto: bolha no deck
  const g = new THREE.Group();
  const deck = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, .18, 48), mat(0x8B714E)); g.add(deck);
  const d = new THREE.Mesh(new THREE.SphereGeometry(1.25, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .45, roughness: .05 }));
  d.position.y = .09; g.add(d);
  const aro = new THREE.Mesh(new THREE.TorusGeometry(1.25, .035, 10, 64), ouro); aro.rotation.x = Math.PI / 2; aro.position.y = .1; g.add(aro);
  const cama = new THREE.Mesh(new THREE.BoxGeometry(1, .26, .7), mat(0xFEF5F0)); cama.position.y = .3; g.add(cama);
  objs.push(g);
}
{ // 2 · custo: pilhas de moedas
  const g = new THREE.Group();
  [[-.9, 6], [0, 9], [.9, 4]].forEach(([x, n]) => { for (let i = 0; i < n; i++) { const c = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .12, 40), ouro); c.position.set(x, .06 + i * .13, 0); c.userData.i = i; g.add(c); } });
  objs.push(g);
}
{ // 3 · retorno: barras subindo com seta
  const g = new THREE.Group();
  [.6, 1.05, 1.6, 2.2].forEach((h, i) => { const b = new THREE.Mesh(new THREE.BoxGeometry(.5, h, .5), i === 3 ? ouro : mat(0x1B2117)); b.position.set(-1.05 + i * .7, h / 2, 0); b.userData.h = h; g.add(b); });
  objs.push(g);
}
{ // 4 · lucro: moeda grande girando
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, .22, 64), ouro); m.rotation.x = Math.PI / 2; m.position.y = 1.4; g.add(m);
  const aro = new THREE.Mesh(new THREE.TorusGeometry(1.05, .06, 10, 64), mat(0x8B714E, .4, .4)); aro.position.set(0, 1.4, .12); g.add(aro);
  objs.push(g);
}
{ // 5 · tempo: relógio
  const g = new THREE.Group();
  const face = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, .2, 64), mat(0xFEF5F0)); face.rotation.x = Math.PI / 2; face.position.y = 1.4; g.add(face);
  const aro = new THREE.Mesh(new THREE.TorusGeometry(1.3, .1, 12, 64), mat(0x1B2117)); aro.position.y = 1.4; g.add(aro);
  const pont = (l, w) => { const p = new THREE.Mesh(new THREE.BoxGeometry(w, l, .06), mat(0x1B2117)); p.geometry.translate(0, l / 2, 0); p.position.set(0, 1.4, .14); g.add(p); return p; };
  g.userData.h = pont(.65, .1); g.userData.m = pont(1, .06);
  objs.push(g);
}
objs.forEach(o => { o.position.y = .75; cena.add(o); });

function render3D(t) {
  objs.forEach((o, i) => {
    const a = inicio(i), b = i < 4 ? inicio(i + 1) : FECHO;
    const s = clamp(mola(t, a - .05), 0, 1.12) * (1 - ease(prog(t, b - .15, b + .1)));
    o.visible = s > .001; o.scale.setScalar(Math.max(.001, s * .85)); o.rotation.y = .5 + (t - a) * .7;
    if (i === 1) o.children.forEach(c => c.visible = t > a + c.userData.i * .05);
    if (i === 2) o.children.forEach((c, j) => { const k = sai(prog(t, a + j * .12, a + j * .12 + .4)); c.scale.y = Math.max(.01, k); c.position.y = c.userData.h * k / 2; });
    if (i === 3) o.rotation.y = (t - a) * 3;
    if (i === 4) { o.rotation.y = .25; o.userData.m.rotation.z = -(t - a) * 6; o.userData.h.rotation.z = -(t - a) * .5; }
  });
  r3.setScissorTest(false); r3.clear(); r3.render(cena, cam);
}

function gancho(t) {
  const vis = t < REC_FIM + .05; $('rec').style.display = vis ? 'block' : 'none'; if (!vis) return;
  $('tc').textContent = `00:00:${String(Math.floor(t)).padStart(2, '0')}:${String(Math.floor(t * 30) % 30).padStart(2, '0')}`;
  const pal = F[0].palavras, corte = pal.findIndex(p => /^saberia/i.test(p.p));
  $('pre').textContent = pal.slice(0, corte).filter(p => p.t <= t).map(p => p.p).join(' ');
  let html = '';
  pal.slice(corte).forEach((p, j, arr) => {
    const fim = j < arr.length - 1 ? arr[j + 1].t - .05 : F[0].b, n = Math.floor(p.p.length * prog(t, p.t - .05, fim));
    if (n > 0) html += (html ? ' ' : '') + `<span class="${/cinco|perguntas/i.test(p.p) ? 'k' : ''}">${p.p.slice(0, n)}</span>`;
  });
  $('gancho').innerHTML = html + (Math.floor(t * 3) % 2 === 0 ? '<span class="cursor"></span>' : '');
  $('rec').style.opacity = 1 - prog(t, REC_FIM - .12, REC_FIM + .05);
}

function lista(t) {
  $('lista').innerHTML = PERG.map((q, i) => {
    const a = inicio(i), ap = clamp(mola(t, a), 0, 1.1), agora = t >= a && (i === 4 || t < inicio(i + 1)) && t < FECHO;
    if (ap <= 0) return '';
    return `<div class="card ${agora ? 'agora' : ''}" style="opacity:${clamp(ap * 2)};transform:translateY(${(1 - clamp(ap)) * 60}px)"><b>${i + 1}</b>${q}<span class="q">?</span></div>`;
  }).join('');
}

function fecho(t) {
  const v = sai(prog(t, FECHO, FECHO + .35)); const el = $('fecho');
  el.style.display = v > 0 ? 'flex' : 'none'; el.style.opacity = v;
  $('bolas').innerHTML = [0, 1, 2, 3, 4].map(i => { const s = clamp(mola(t, FECHO + .2 + i * .1), 0, 1.15); return `<span style="transform:scale(${s})">${i + 1}</span>`; }).join('');
}

function legenda(t) {
  const g = grupos.find(x => t >= x.a && t < x.b), el = $('legenda'), vis = g && t > REC_FIM && t < FECHO;
  el.style.opacity = vis ? 1 : 0; if (vis) el.querySelector('span').textContent = g.txt;
}

window.seek = t => {
  render3D(t); gancho(t); lista(t); fecho(t); legenda(t);
  $('flash').style.opacity = Math.max(0, 1 - Math.abs(t - REC_FIM) / .18) * .95;
  $('titulo').style.opacity = sai(prog(t, REC_FIM, REC_FIM + .4)) * (1 - prog(t, FECHO, FECHO + .3));
};
window.DURACAO = T.total;
window.pronto = document.fonts.ready;
</script>
</body>
</html>
